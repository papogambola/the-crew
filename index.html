  logMsg(ev.h+" — "+lines[0],eff.set==="gone"||W.kill?"bad":"warn",true);
  ev.outcome=lines.join(" ");
  checkOver();
  save();
}

function weekTick(rng){
  S.week++;
  const rc=payroll().filter(c=>c.status==="crew");   // every crew's people are on the books
  let up=retainerCost();rc.forEach(c=>up+=c.upkeep);
  if(up>0){
    if(S.money>=up)S.money-=up;
    else{
      S.money=0;rc.forEach(c=>c.loyalty=clamp(c.loyalty-9,0,100));
      const dropped=RETAINERS.filter(r=>hasRetainer(r.k));
      if(dropped.length){dropped.forEach(r=>{S.retainers[r.k]=false;});logMsg("Couldn't make payroll ("+money(up)+"). Loyalty slipping, and "+dropped.map(r=>r.l.toLowerCase()).join(" and ")+" stopped answering.","bad",true);}
      else logMsg("Couldn't make payroll ("+money(up)+"). Loyalty slipping.","bad");
    }
  }
  // a mole on the books leaks a little heat every week, unexplained
  const moles=rc.filter(c=>c.mole).length;
  if(moles)S.heat=clamp(S.heat+3*moles,0,120);
  // the crew's standing drifts loyalty: nobody stays loyal to a nobody
  const rk=rankInfo(S.rep);
  if(rk.loyDrift)rc.forEach(c=>c.loyalty=clamp(c.loyalty+rk.loyDrift,0,100));
  // someone out there is buying your crew drinks
  if(S.poach&&S.poach.weeks>0){
    S.poach.weeks--;
    const low=recruits().filter(c=>c.status==="crew"&&!paidUp(c)).sort((a,b)=>a.loyalty-b.loyalty)[0];
    if(low&&low.loyalty<60&&chance(rng,0.35)){low.status="gone";low._touched=true;leaveCrew(low);looseAdd(low,"poach");logMsg(low.first+" left for "+S.poach.name+"'s crew.","bad",true);}
    if(S.poach.weeks<=0){S.poach=null;logMsg("The drinks have stopped. Whoever was going has gone.","");}
  }
  S.roster.forEach(c=>{
    if(c.status==="injured"&&S.week>=c.out){c.status="crew";logMsg(c.first+" is back on the job.","good");}
    if(c.status==="jailed"&&S.week>=c.out){c.status="available";c.jail+=1;logMsg(c.first+" walked. Back on the roster, a year older.","warn");}
  });
  S.heat=clamp(S.heat-heatDrop(),0,120);
  // a country you have worked lately is watching for you, and forgets slowly
  if(S.coHeat)for(const k in S.coHeat){S.coHeat[k]=Math.max(0,S.coHeat[k]-BAL.countryHeatDecay);if(!S.coHeat[k])delete S.coHeat[k];}
  // A name unused is a name forgotten. Weeks spent on a job are not unused weeks — the counter
  // is reset by finishing one — so a three-week operation never costs you for taking it.
  S.idle=(S.idle||0)+1;
  if(S.idle>=BAL.idleEvery){S.idle=0;if(S.rep>0)S.rep=Math.max(0,S.rep-BAL.idleDecay);}
  // somebody else is working the board, and somebody is keeping a file
  if(!S.rival&&S.rep>=20){S.rival=makeRival(rng);
    S.notices=(S.notices||[]).concat([{k:"The competition · week "+S.week,h:cap(S.rival.name),
      text:S.rival.boss+" runs "+S.rival.name+" out of the same online board as you. They take a posting most weeks — the best one left — and their standing rises when they do. When they are ahead of you, they start buying your crew drinks. The Log says where they stand.",go:"log",goText:"The record →"}]);
    logMsg(cap(S.rival.name)+" is working the same board. "+S.rival.boss+" runs it.","warn",true);}
  if(!S.det&&(S.heat>=30||S.rep>=40)){S.det=makeDetective(rng);
    logMsg(S.det.name+" has your alias in a folder.","warn",true);}
  rivalWorks(rng);detWatch(rng);looseTick(rng);grudgeTick(rng);
  if(S.heat>=raidAt()){
    const rc2=recruits().filter(c=>c.status==="crew");
    if(rc2.length){
      const n=Math.min(rc2.length,ri(rng,1,2));
      for(let i=0;i<n;i++){const c=rc2[i];c.status="jailed";c.out=S.week+ri(rng,4,7);leaveCrew(c);}
      logMsg("RAID"+(detective()?" — "+detective().name+" came with a squad":". The heat boiled over")+" — "+n+" of your crew taken.","bad",true);sfx("siren");
      if(detective())detective().file=Math.max(0,detective().file-25);

}

function checkOver(){
  if(S.over)return;
  if(payroll().length>0)return;
  const fees=S.roster.filter(c=>c.status==="available").map(c=>c.fee);
  const minFee=fees.length?Math.min.apply(null,fees):Infinity;
  if(S.money<minFee){S.over="lose";logMsg("No crew, no float. The name means nothing now.","bad",true);}
}

function logMsg(t,tone,big){S.log.unshift({t,tone:tone||"",big:!!big,wk:S.week});if(S.log.length>100)S.log.pop();}

function packState(){

      for(let i=0;i<n;i++){const x=pick(r,TRAITS);if(t.indexOf(x.k)<0)t.push(x.k);}
      S.player.traits=t;
    }
    if(S.player&&!S.player.face)S.player.face=randomFace(mulberry32(((S.player.avseed||1)*2654435761)>>>0),S.player.gender);
    // A file from before the long game: the last score used to be one job at ranking 100, and

    S.finalStage=S.finalStage||0;S.finalBack=S.finalBack||0;
    if(typeof S.seenFinal!=="number")S.seenFinal=S.seenFinal?0:-1;
    (S.jobs||[]).forEach(j=>{if(!j.final&&!j.weeks)j.weeks=BAL.jobWeeks[j.tier]||1;});
    S.jobs=(S.jobs||[]).filter(j=>!j.final);   // the old single final score is not this one
    if(S.finalDone)S.finalStage=FINAL_STAGES.length;
    // a job left mid-decision picks up exactly there: the report so far, then the six options
    const P=S.pendingJob;
    if(P&&P.twist&&Array.isArray(P.pre)){
      const narrative=P.pre.slice();narrative.push({t:"— —",x:"Then it goes wrong.",tone:"bad",twist:true});
      S.modal={type:"result",data:{id:P.jobId+"-w"+P.week,week:P.week,job:P.job,narrative,revealed:narrative.length,done:false,
        twist:{h:P.twist.h,s:P.twist.s,opts:P.twist.opts.map(o=>o.t)},awaiting:true,resolved:false,teamIds:P.teamIds,events:[],growth:[],rk:[],marks:{}}};
    } else if(P){S.pendingJob=null;}
    // a recruitment trip stopped at the meeting picks up exactly there, the same way
    const R=S.pendingTrip;
    if(R&&R.snag&&Array.isArray(R.pre)){
      const cc=byId(R.cid);
      const narrative=R.pre.slice();narrative.push({t:"— —",x:R.snag.h+".",tone:"bad",twist:true});
      S.modal={type:"trip",data:{cid:R.cid,name:cc?cc.n:"",first:cc?cc.first:"",city:R.city,country:R.country,week:R.week,fee:R.fee,
        narrative,revealed:narrative.length,done:false,awaiting:true,resolved:false,snag:R.snag,trouble:R.trouble,outcome:null}};
    } else if(R){S.pendingTrip=null;}
    return true;
  }catch(e){return false;}
}
// Recaps written before the report spoke to the player as "you" still name the player.
// Turn those lines to second person, verbs included, so old files read like new ones.
function migrateReports(d){
  const first=d.player&&d.player.first;if(!first||!d.reports||!d.reports.length)return;
  const V={does:"do",knows:"know",has:"have",is:"are",owns:"own",walks:"walk",papers:"paper",makes:"make",buys:"buy",measures:"measure",lifts:"lift",counts:"count",finds:"find",brings:"bring",points:"point",improvises:"improvise",stays:"stay",crosses:"cross",reads:"read",gets:"get",orders:"order",handles:"handle",learns:"learn",plays:"play",sleeps:"sleep",keeps:"keep",argues:"argue",wins:"win",listens:"listen",times:"time",ages:"age",needs:"need",stands:"stand",tests:"test",wants:"want",bumps:"bump",sits:"sit",spots:"spot",turns:"turn",books:"book",talks:"talk",takes:"take",runs:"run",watches:"watch",goes:"go"};
  const sp=v=>V[v]||(v.endsWith("ies")?v.slice(0,-3)+"y":(/(?:[sxz]|[sc]h)es$/.test(v)?v.slice(0,-2):v.endsWith("s")?v.slice(0,-1):v));
  const q=first.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const rePoss=new RegExp("(^|\\. )"+q+"['’]s ","g");
  const reOut=new RegExp("(^|\\. )"+q+" doesn['’]t come","g");
  const reHome=new RegExp("(^|\\. )"+q+" is home","g");
  const reTech=new RegExp("(^|\\. )"+q+" \\(([^)]+)\\) (\\w+)","g");
  const reVerb=new RegExp("(^|\\. )"+q+" (\\w+)","g");
  d.reports.forEach(r=>{
    (r.narrative||[]).forEach(l=>{
      if(typeof l.x!=="string"||l.x.indexOf(first)<0)return;
      l.x=l.x.replace(rePoss,"$1Your ").replace(reOut,"$1You can't get in").replace(reHome,"$1You're home")
        .replace(reTech,(m,p,t,v)=>p+"You ("+t+") "+sp(v))
        .replace(reVerb,(m,p,v)=>p+"You "+sp(v))
        .replace("You point and pays","You point and pay");
    });
    (r.growth||[]).forEach(g=>{if(g.first===first)g.first="You";});
  });
}
// A game lives in one browser's storage, which is one cleared cache away from gone.
// The file can be written out as text and read back in anywhere.
function exportCode(){
  try{
    const s=JSON.stringify(packState());
    const b=btoa(unescape(encodeURIComponent(s)));
    return "CREW1:"+b;
  }catch(e){return "";}
}
function readCode(code){
  try{
    let s=String(code||"").trim().replace(/\s+/g,"");
    if(s.indexOf("CREW1:")===0)s=s.slice(6);
    if(!s)return {err:"Nothing pasted."};
    const j=decodeURIComponent(escape(atob(s)));
    const d=JSON.parse(j);
    if(!d||d.v!==2||!d.seed||!d.player||!d.player.n)return {err:"That is not a Crew file."};
    return {d,n:d.player.n,week:d.week||1,rep:d.rep||0,money:d.money||0,crew:(d.crewIds||[]).length};
  }catch(e){return {err:"That code is damaged — a character is missing or an extra one crept in."};}
}
function importCode(code){
  const r=readCode(code);
  if(r.err){note(r.err);return false;}
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(r.d));}catch(e){note("This browser is refusing to keep saves.");return false;}
  if(!load()){note("The file would not open.");return false;}
  UI.panel=null;UI.office=false;UI.impInfo=null;UI.impRaw="";
  logMsg("File read in from a code — "+r.n+", week "+r.week+".","good",true);
  save();render();window.scrollTo(0,0);
  return true;
}

function money(n){n=Math.round(n);const neg=n<0;n=Math.abs(n);let s;
  if(n>=1e6)s="$"+(n/1e6).toFixed(n>=1e7?1:2).replace(/\.?0+$/,"")+"M";
  else if(n>=1e3)s="$"+Math.round(n/1000)+"K";
  else s="$"+n;
  return (neg?"−":"")+s;}
function moneyExact(n){n=Math.round(n);const neg=n<0;n=Math.abs(n);
  return (neg?"−":"")+"$"+String(n).replace(/\B(?=(\d{3})+(?!\d))/g,",");}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
function cap(s){s=String(s);return s.charAt(0).toUpperCase()+s.slice(1);}
function pips(n){let s='<span class="exp" title="'+EXP[n-1]+'">';for(let i=0;i<5;i++)s+='<i class="pip'+(i<n?" f":"")+'"></i>';return s+"</span>";}
function diffbar(d,hot){const filled=Math.round(d/100*8);let s='<span class="diffbar" aria-label="difficulty '+d+'">';for(let i=0;i<8;i++)s+='<i class="'+(i<filled?(hot?"h":"f"):"")+'"></i>';return s+"</span>";}
function yrs(n){return n===1?"1 yr":n+" yrs";}

function foundCrew(leadId,ids){
  if(!canFound())return;
  const lead=byId(leadId);if(!lead||lead.role!=="commander"||lead.status!=="crew"||!S.crewIds.includes(leadId))return;
  const picked=ids.map(byId).filter(c=>c&&c.status==="crew"&&S.crewIds.includes(c.id)&&c.id!==leadId);
  if(picked.length!==EXTRA_CREW_SIZE-1)return;
  S.crews=S.crews||[];
  S.crewSeq=(S.crewSeq||1)+1;
  const cr={id:S.crewSeq,name:lead.first+"'s crew",leadId,memberIds:[leadId].concat(picked.map(c=>c.id)),founded:S.week,jobWeek:0};
  cr.memberIds.forEach(mid=>{S.crewIds=S.crewIds.filter(x=>x!==mid);});
  S.crews.push(cr);
  logMsg(cr.name+" founded — "+lead.n+" commanding "+picked.map(c=>c.first).join(", ")+". Its jobs, its take and its heat are yours.","good",true);
  sfx("stamp");UI.found=null;S.modal=null;save();
}
function crewSend(id,crewId){
  const c=byId(id),cr=crewById(crewId);if(!c||!cr||!S.crewIds.includes(id)||c.status!=="crew")return;
  if(cr.memberIds.length>=EXTRA_CREW_SIZE){note(cr.name+" has no place free.");return;}
  S.crewIds=S.crewIds.filter(x=>x!==id);cr.memberIds.push(id);c._touched=true;
  logMsg(c.first+" sent to "+cr.name+".","");save();render();
}
function crewRecall(id){
  const c=byId(id),cr=crewOf(id);if(!c||!cr)return;
  if(recruits().length>=crewSeats()){note("No seat free in your crew.");return;}
  cr.memberIds=cr.memberIds.filter(x=>x!==id);S.crewIds.push(id);
  logMsg(c.first+" recalled from "+cr.name+".","");save();render();
}
function crewDissolve(crewId){
  const cr=crewById(crewId);if(!cr)return;
  let back=0,cut=0;
  crewMembers(cr).forEach(c=>{
    if(recruits().length<crewSeats()){S.crewIds.push(c.id);back++;}
    else{c.status="available";c.loyalty=clamp(c.loyalty-6,0,100);c._touched=true;cut++;}
  });
  S.crews=crews().filter(x=>x.id!==crewId);UI.confirmDissolve=null;
  logMsg(cr.name+" dissolved — "+back+" back to your crew, "+cut+" cut loose.","warn",true);
  checkOver();save();render();
}
function bonusCostFor(c){return Math.max(4000,Math.round(c.upkeep*3/1000)*1000);}

}

// Animate the map from where it was to where it should be, once the new page is in place.
function mapArm(){
  const g=document.getElementById("mapg");
  if(!g||!g.style)return;
  const target=mapTransform();
  const from=MAP.prev;
  MAP.prev=target;
  if(from&&from!==target&&typeof requestAnimationFrame==="function"){
    g.style.transition="none";g.style.transform=from;
    if(typeof g.getBoundingClientRect==="function")g.getBoundingClientRect();
    requestAnimationFrame(()=>{g.style.transition="";g.style.transform=target;});
  } else g.style.transform=target;
}

  const ban=bannedClients();

  const head='<div class="panel-h"><h2>Jobs · Postings</h2><span style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap"><span class="kicker" style="padding-bottom:8px">Week '+S.week+' · postings expire</span>'+sortSel+'<button class="btn ghost sm" data-act="laylow" style="margin-bottom:2px">Lay low a week</button></span></div>';
  const filt=S.jobCountry?'<div style="display:flex;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap"><span class="tag ok">Showing '+esc(S.jobCountry)+'</span><button class="btn ghost sm" data-act="map-clear">All countries</button></div>':'';
  let jobs=S.jobs;
  if(S.jobCountry)jobs=jobs.filter(j=>j.country===S.jobCountry);
  if(!jobs.length)return '<div class="panel">'+head+filt+'<div class="empty">'+(S.jobCountry?'No postings in '+esc(S.jobCountry)+' this week.':'The board is quiet. Lay low a week and check again.')+'</div></div>';
  const items=jobs.map(j=>({j,a:assessJob(j)}));
  const cmp={
    fit:(x,y)=>(y.j.final?1:0)-(x.j.final?1:0)||(y.a.canRun?1:0)-(x.a.canRun?1:0)||y.a.margin-x.a.margin,
    need:(x,y)=>x.j.need-y.j.need||y.a.margin-x.a.margin,
    tech:(x,y)=>TECH_BY_K[x.j.techs[0]].l.localeCompare(TECH_BY_K[y.j.techs[0]].l)||y.a.margin-x.a.margin,
    pay:(x,y)=>y.j.payout-x.j.payout,
    heat:(x,y)=>x.j.heat-y.j.heat||y.a.margin-x.a.margin,
    diff:(x,y)=>x.j.diff-y.j.diff,
    country:(x,y)=>x.j.country.localeCompare(y.j.country)||x.j.city.localeCompare(y.j.city),
    expires:(x,y)=>x.j.expires-y.j.expires||y.a.margin-x.a.margin,
  }[cur]||(()=>0);
  items.sort(cmp);
  const rows=items.map(({j,a})=>{
    const co=COUNTRY_BY_NAME[j.country];
    const fit=a.canRun?(a.margin>=10?'<span class="chip c-good">Good fit</span>':a.margin>=-4?'<span class="chip c-warn">Risky</span>':'<span class="chip c-bad">Long odds</span>'):'<span class="chip c-bad">'+a.team.length+' of '+j.need+' can go</span>';
    const techs=j.techs.map(t=>'<span class="tag spec tip '+(has(t)?"ok":"no")+'" tabindex="0" data-tip="'+esc(techBrief(t)+"\n"+(has(t)?"On your crew.":"Nobody on your crew has it."))+'">'+(has(t)?"✓ ":"✗ ")+TECH_BY_K[t].l+'</span>').join(" ");
    const kn=j.know.map(x=>'<span class="tag tip '+(knows(x)?"ok":"no")+'" tabindex="0" data-tip="'+esc(knowBrief(x)+"\n"+(knows(x)?"Someone on the crew knows it.":"Nobody on the crew knows it."))+'">'+(knows(x)?"✓ ":"✗ ")+'knows '+x+'</span>').join(" ");
    return '<div class="jobrow" data-act="open-job" data-id="'+j.id+'" data-country="'+esc(j.country)+'" role="button" tabindex="0">'
      +'<div class="code">'+(j.final?"—":"№"+j.id.slice(1).padStart(3,"0"))+'<br>'+diffbar(j.diff,j.heat>22)+'</div>'
      +'<div><div class="t">'+(j.final?'<span class="chip c-bad">Final score</span> ':'')+esc(j.title)+'</div>'
        +'<div class="loc">'+co.flag+' '+esc(j.city)+', '+esc(j.country)+' · crew of '+j.need+' · <span dir="ltr">'+(j.final?BAL.finalWeeks:(j.weeks||1))+' wk</span> · '+esc(co.langs[0])+' · from '+esc(j.client)+(j.final?'':' · expires wk '+j.expires)+(casedWeeks(j)?' · <span style="color:var(--good)">cased '+casedWeeks(j)+'</span>':'')+'</div>'
        +'<div class="meta"><span class="tag">'+CAT_BY_K[j.cat].l+'</span>'+techs+' '+kn+' '+fit+'</div></div>'
      +'<div class="pay num">'+money(j.payout)+'<div class="loc" style="text-align:right">+'+j.heat+' heat</div></div></div>';
  }).join("");
  return '<div class="panel">'+head+banLine+filt+rows+'</div>';
}
// The job file, in the left column beside the map.
function jobPanel(j){
  const co=COUNTRY_BY_NAME[j.country];
  const cat=CAT_BY_K[j.cat];
  const bench=benchSet(j);
  const a=assessJob(j,jobPool(j));
  const wtxt=Object.entries(cat.w).map(([k,v])=>ATTR_ABBR[k]+'×'+v).join("  ");
  const theJob='<div class="jobbrief"><div class="kicker">The job</div><p>'+esc(jobBrief(j))+'</p></div>';
  const brief='<div class="brief"><span class="client">Posted by '+esc(j.client)+'.</span> '
    +co.flag+' '+esc(j.city)+', '+esc(j.country)+' — '+esc(co.langs.join(" / "))+' spoken; pays in '+esc(co.cur)+'. '
    +esc(co.pol)+'; '+esc(co.rel.toLowerCase())+'. Terrain: '+co.terrain.join(", ")+'. '
    +(co.gate===2?'Strict border — weak passports and old convictions get turned back without papers. ':co.gate===1?'Visa border — limited passports need a forger aboard. ':'Open border. ')
    +(co.eco===1?'Money goes far here, but the fee is lower.':co.eco===3?'Rich ground; expect the client to pay well and the police to be well funded.':'')
    +'</div>';
  // every requirement, checked against the crew that can actually go: green tick or red cross
  const has=t=>a.team.some(c=>c.tech===t),knows=k=>a.team.some(c=>c.know.includes(k));
  const speaks=a.team.some(c=>c.langs.some(l=>co.langs.includes(l)));
  const blockedBy=tag=>crewAll().filter(c=>c.status==="crew"&&c.limits.some(k=>LIMIT_BY_K[k].tag===tag)).map(c=>c.first);
  const chip=(ok,text,title)=>'<span class="tag tip '+(ok?"ok":"no")+'" tabindex="0" data-tip="'+esc(title||"")+'">'+(ok?"✓ ":"✗ ")+text+'</span>';
  const chips='<div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0"><span class="tag">'+cat.l+'</span>'
    +chip(a.team.length>=j.need,'crew of '+j.need,a.team.length+' of '+j.need+' can go')
    +j.techs.map(t=>chip(has(t),'wants '+TECH_BY_K[t].l,techBrief(t)+"\n"+(has(t)?'On your crew, and going.':'Nobody going has it.'))).join("")
    +j.know.map(k=>chip(knows(k),'knows '+k,knowBrief(k)+"\n"+(knows(k)?'Someone going knows it.':'Nobody going knows it.'))).join("")
    +chip(speaks,'speaks '+co.langs[0],speaks?'someone going speaks it':'nobody going speaks it'+(cat.lang?' — and this job is all talk':''))
    +j.tags.map(t=>{const b=blockedBy(t);return chip(!b.length,TAG_LABEL[t],b.length?b.join(", ")+' won\'t — sits this one out':'nobody on the crew minds');}).join("")
    +(function(){const small=a.team.filter(c=>smallMoney(c,j));return chip(!small.length,'the money',small.length?small.map(c=>c.first+" ("+money(Math.round(j.payout*c.cut))+")").join(", ")+" call this small money — a cut under two weeks of their own upkeep. Three in a row and they grumble; five and they may walk.":"every cut on this one is worth the trip");})()+'</div>';
  // who can go — and, for those who can, whether you send them
  const benchCuts=bench.map(byId).filter(Boolean).reduce((s,c)=>s+Math.round(j.payout*c.cut),0);
  const allChecks=crewAll().map(c=>{const x=a.checks.find(y=>y.c.id===c.id);
    if(x)return Object.assign({},x,{sat:false});
    return Object.assign({sat:true,c},entry(c,j,a.team.some(y=>y.tech==="forger")));});
  const checks=allChecks.map(x=>{const c=x.c,sat=x.sat&&x.ok;
    return '<div class="check'+(x.ok?"":" out")+(sat?" sat":"")+'"><div class="av">'+avatar(c.avseed,c.gender,c.face)+'</div>'
      +'<div style="flex:1;min-width:0"><div class="mono" style="font-size:12.5px">'+(c.isPlayer?"You":esc(c.n))+' '+natOf(c).flag+' <span class="mono" style="color:var(--muted);font-size:10.5px">'+TECH_BY_K[c.tech].l+(c.role==="commander"&&!c.isPlayer?' · cmdr':'')+'</span></div>'
      +'<div class="why">'+(sat?'sitting this one out'+(c.isPlayer?' — a commander-type runs it':'')+(c.cut?' · keeps '+money(Math.round(j.payout*c.cut))+' in the split':''):esc(x.why))+'</div></div>'
      +(x.ok?'<button class="btn ghost sm" data-act="bench" data-id="'+c.id+'" title="'+(sat?"Send "+(c.isPlayer?"yourself":c.first)+" on this job":(c.isPlayer?"Stay behind":"Leave "+c.first+" behind")+" — no cut, no experience, and no way to get hurt")+'">'+(sat?"Send":"Bench")+'</button>':'<div class="mark">✗</div>')+'</div>';}).join("");
  const onCrew=crewAll().length, benched=bench.length;
  const barred=Math.max(0,onCrew-benched-a.team.length);
  const enough=a.team.length>=j.need;
  const goLine='<b style="font-family:var(--f-disp);font-size:13px;letter-spacing:.02em">This job needs '+j.need+' in the field'
    +(enough?'. '+(a.team.length===onCrew?'All '+onCrew+' of your crew can go.':a.team.length+' of your '+onCrew+' can go.')
            :' — only '+a.team.length+' of your '+onCrew+' can go.')+'</b> '
    +(barred?barred+(barred>1?' are':' is')+' kept out by the border, the job or their own limits. ':'')
    +(benched?benched+(benched>1?' are':' is')+' benched, by you. ':'')
    +'Bench anyone you would rather keep out of it.';
  const benchBar='<div class="sel-help" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span>'+goLine+'</span>'
    +(bench.length?'<span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="tag">'+bench.length+' benched · '+money(benchCuts)+' stays in the split</span><button class="btn ghost sm" data-act="bench-clear">Send everyone</button></span>':'')+'</div>';
  // The split, and what benching does to it. Two numbers move in opposite directions when
  // somebody sits out — your share of the fee goes up, the crew's reckoning goes down — so both
  // are shown, and then the one line that resolves them: what you actually come away with.
  const sp=jobSplit(j,a.team);
  const up=jobUpkeep(j);
  const spRow=(w,t,pct,amt,cls)=>'<div class="r'+(cls?" "+cls:"")+'"><span class="w">'+w+(t?' <span class="t">'+t+'</span>':'')+'</span>'
    +'<span class="p num" dir="ltr">'+(pct==null?'':(Math.round(pct*1000)/10)+'%')+'</span>'
    +'<span class="m num">'+moneyExact(amt)+'</span></div>';
  const benchedPeople=bench.map(byId).filter(Boolean);
  const splitRows=sp.rows.map(r=>spRow(esc(r.c.first),TECH_BY_K[r.c.tech].l,r.pct,r.amt)).join("")
    +(sp.rows.length?spRow('Crew of '+sp.rows.length,'take off the top',sp.crewPct,sp.crew,"sum"):spRow('Nobody takes a cut','',0,0,"sum"))
    +spRow('You keep of the fee','',sp.youPct,sp.you,"keep")
    +spRow('Wages','the '+up.weeks+' week'+(up.weeks>1?'s':'')+' on the ground, everyone on the books',null,-up.total,"cost")
    +spRow('On the table','if the night is a plain success',null,sp.you-up.total,"keep")
    +benchedPeople.filter(c=>c.cut>0).map(c=>spRow(esc(c.first),'benched — takes nothing',c.cut,Math.round(j.payout*c.cut),"off")).join("");
  const splitBlock=a.team.length?('<div class="kicker" style="margin-top:14px">The split</div>'
    +'<div class="sel-help">Everyone who goes takes their percentage off the fee and you keep the rest. The shares are fixed; the money they come off is not — a clean night pays '+moneyExact(Math.round(j.payout*1.08))+', a success '+moneyExact(j.payout)+', a messy one '+moneyExact(Math.round(j.payout*BAL.messyPay))+', and a botched one nothing at all.</div>'
    +'<div class="split">'+splitRows+'</div>'
    +(function(){
        if(!benchedPeople.length)return '';
        const full=assessJob(j,crewAll());
        const fsp=jobSplit(j,full.team);
        const keptMore=sp.you-fsp.you;
        const evNow=expectedKeep(j,a),evAll=full.team.length?expectedKeep(j,full):0;
        const dEff=a.eff-full.eff,dClean=a.pClean-full.pClean;
        return '<div class="benchdelta">'
          +'<b>'+benchedPeople.length+' benched.</b> You keep <b>'+moneyExact(sp.you)+'</b> of the fee instead of '+moneyExact(fsp.you)
          +(keptMore>0?' — <span class="up">'+moneyExact(keptMore)+' more</span>.':'.')
          +' Their wages are paid either way — '+moneyExact(up.total)+' goes out for the '+up.weeks+' week'+(up.weeks>1?'s':'')+' whether they go or sit.'
          +'<br>But the reckoning is <span class="'+(dEff<0?"dn":"up")+'">'+a.eff+'</span> against '+full.eff
          +' and a clean night <span class="'+(dClean<0?"dn":"up")+'">'+a.pClean+'%</span> against '+full.pClean+'%.'
          +'<br>On this job\'s cash alone, over a run of nights like it: '+outcome(evNow,true)+' against '+outcome(evAll,false)+' with everybody.'
          +'<br><span class="small">That figure counts the money and nothing else. It does not count who is in a bed or a cell on the worse odds — weeks you go on paying for — what the one who sat it out did not learn, or the heat, which lands the same either way.</span>'
          +'</div>';
      })()):'';
  const factors='<div class="factors">'+a.factors.map(f=>'<span class="k'+(f.tip?" tip":"")+'"'+(f.tip?' tabindex="0" data-tip="'+esc(f.tip)+'" data-wide="1"':'')+'>'+esc(f.k)+'</span><span><span class="'+(f.v>=0?"plus":"minus")+' num">'+(f.v>=0?"+":"")+f.v+'</span> · '+esc(f.note)+'</span>').join("")+'</div>';
  const odds=a.team.length?('<div class="odds" title="estimated outcome spread"><i class="o-good" style="width:'+a.pClean+'%"></i><i class="o-mid" style="width:'+a.pOk+'%"></i><i class="o-bad" style="width:'+(a.pFail+a.pDis)+'%"></i></div>'
    +'<div class="mono" style="font-size:11px;color:var(--muted);margin-top:5px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span style="color:var(--good)">Clean ~'+a.pClean+'%</span><span style="color:var(--warn)">Messy ~'+a.pOk+'%</span><span style="color:var(--stamp)">Blown ~'+(a.pFail+a.pDis)+'%</span></div>'
    +'<div class="mono" style="font-size:11px;color:var(--muted);margin-top:6px">Crew '+a.eff+' vs difficulty '+j.diff+'</div>'):'';
  const wks=j.final?BAL.finalWeeks:(j.weeks||1);
  const reqs='<div class="req"><div class="b"><div class="k">Fee</div><div class="v num">'+money(j.payout)+'</div></div>'
    +'<div class="b"><div class="k">Crew needed</div><div class="v num">'+j.need+'</div>'
      +'<div class="sub num" style="color:'+(a.team.length>=j.need?"var(--good)":"var(--stamp)")+'">'
      +(a.team.length>=j.need?a.team.length+" can go":"only "+a.team.length+" can go")+'</div></div>'
    +'<div class="b"><div class="k">On the ground</div><div class="v num" dir="ltr">'+wks+' week'+(wks>1?'s':'')+'</div></div>'
    +'<div class="b"><div class="k">Difficulty</div><div class="v">'+diffbar(j.diff,j.heat>22)+'</div></div>'
    +'<div class="b"><div class="k">Heat</div><div class="v num">+'+j.heat+'</div></div></div>';
  // Weeks spent watching a room before you walk into it. The board does not wait while you do.
  const cw=casedWeeks(j),cmax=caseMax(j);
  const localHeat=countryHeat(j.country);
  const caseBlock=cmax?'<hr class="rule"><div class="kicker">Casing it</div>'
    +'<div class="sel-help">A room you have watched is not the room the client described. Each week spent on it costs '+money(caseCost(j))+' and adds <b>+'+BAL.caseGain+'</b> to the reckoning — and it is a week the posting might not survive.</div>'
    +'<div class="mono" style="font-size:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px">'
    +'<span>'+(cw?'<b>'+cw+' of '+cmax+'</b> week'+(cmax>1?'s':'')+' cased — <span style="color:var(--good)">+'+(cw*BAL.caseGain)+' to the reckoning</span>':'Nobody has been near it. <span style="color:var(--muted)">'+cmax+' week'+(cmax>1?'s':'')+' available.</span>')+'</span>'
    +(cw<cmax?'<button class="btn ghost sm" data-act="case" data-id="'+j.id+'" '+(S.money>=caseCost(j)&&a.team.length?"":"disabled")+'>Case it a week · '+money(caseCost(j))+'</button>':'<span style="color:var(--muted)">There is nothing left to learn from the outside.</span>')
    +'</div>'
    +(localHeat>=20?'<div class="mono" style="font-size:11.5px;color:var(--stamp);margin-top:6px">'+esc(j.country)+' is watching for you — '+localHeat+' points of local heat, and every room here is harder for it. It cools a point a week.</div>':'')
    :'';
  const h='<div class="panel-h" style="align-items:center"><div><div class="kicker">'+esc(co.name)+' · '+cat.l+(j.final?' · Final score':'')+'</div>'
    +'<h2 style="font-size:20px;margin-top:4px;text-transform:none;letter-spacing:.02em">'+esc(j.title)+'</h2></div><button class="btn ghost sm" data-act="close-job">← All postings</button></div>';
  // a crew you founded can take it instead of you — its own reckoning, its own report
  const others=crews().map(cr=>{const ac=assessJob(j,crewMembers(cr),cr.leadId||null);const busy=cr.jobWeek===S.week;const lead=crewLeader(cr);
    const fit=ac.canRun?(ac.margin>=10?'<span class="chip c-good">Good fit</span>':ac.margin>=-4?'<span class="chip c-warn">Risky</span>':'<span class="chip c-bad">Long odds</span>'):'<span class="chip c-bad">'+ac.team.length+' of '+j.need+' can go</span>';
    return '<div class="jobrow" style="cursor:default"><div class="code">'+(lead?esc(lead.first):'—')+'</div><div><div class="t">'+esc(cr.name)+' '+fit+'</div>'
      +'<div class="loc">'+ac.team.length+' of '+crewMembers(cr).length+' can go · crew '+ac.eff+' vs difficulty '+j.diff+' · '+(lead?'led by '+esc(lead.first):'<span style="color:var(--stamp)">leaderless (−10)</span>')+(busy?' · <span style="color:var(--stamp)">worked this week</span>':'')+(j.final?' · the final score is yours alone':'')+'</div></div>'
      +'<div><button class="btn sm" data-act="execute-crew" data-id="'+j.id+'" data-crew="'+cr.id+'" '+(ac.canRun&&!busy&&!j.final?"":"disabled")+'>Send →</button></div></div>';}).join("");
  const othersBlock=crews().length?'<hr class="rule"><div class="kicker">Other crews</div><div class="sel-help">A crew you founded can take this instead of you: its own reckoning, its own report, and your week stays yours. One job per crew per week. No twists — you are not there to decide.</div>'+others:'';
  const b='<div class="panel-b">'+theJob+brief+'<div class="mono" style="font-size:12px;color:var(--muted)">The plan leans on '+wtxt+'.</div>'+chips+reqs
    +'<hr class="rule"><div class="kicker">Who goes</div>'+benchBar+checks+splitBlock+caseBlock
    +'<hr class="rule"><div class="kicker">The reckoning</div>'+factors+'<div style="margin-top:10px">'+odds+'</div>'+othersBlock
    +'<hr class="rule"><div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"><button class="btn ghost" data-act="close-job">Walk away</button>'
    +'<button class="btn stamp" data-act="execute" data-id="'+j.id+'" '+(a.canRun?"":"disabled")+'>'+(a.canRun?"Take the job →":"Needs "+j.need+" in the field")+'</button></div></div>';
  return '<div class="panel">'+h+b+'</div>';
}
// Your crew, compact, above the postings — so a job can be judged without leaving the board.
function crewStrip(){
  const hidden=!!S.stripHidden;
  const head='<div class="strip-h"><span class="kicker">Your crew · '+field().length+' ready · green tags below are trades and knowledge you have, red are missing</span>'
    +'<span style="display:flex;gap:6px"><button class="btn ghost sm" data-act="tab" data-k="crew">Open crew</button><button class="btn ghost sm" data-act="strip-toggle">'+(hidden?"Show crew":"Hide")+'</button></span></div>';
  if(hidden)return '<div class="strip">'+head+'</div>';
  const cards=crewAll().map(c=>{
    const nat=natOf(c);
    return '<div class="smc'+(c.status!=="crew"?" out":"")+'"><div class="sm-av">'+avatar(c.avseed,c.gender,c.face)+'</div><div class="sm-b">'
      +'<div class="sm-n">'+esc(c.first)+(c.isPlayer?' <span class="chip c-bad">you</span>':'')+(c.status==="injured"?' <span class="chip c-warn">hurt</span>':'')+'</div>'
      +'<div class="sm-l">'+nat.flag+' P'+nat.tier+' · <b>'+techTip(c.tech)+'</b> · '+EXP[c.exp-1]+(c.role==="commander"&&!c.isPlayer?' · cmdr':'')+'</div>'
      +'<div class="sm-a num">'+ATTRS.map(a=>ATTR_ABBR[a]+' '+c.attrs[a]).join(' · ')+'</div>'
      +'<div class="sm-l">'+c.langs.join(", ")+' · knows '+c.know.join(", ")+(c.limits.length?' · <span style="color:var(--stamp)">'+c.limits.map(k=>LIMIT_BY_K[k].l).join(", ")+'</span>':'')+'</div>'
      +'</div></div>';
  }).join("");
  return '<div class="strip">'+head+'<div class="strip-row">'+cards+'</div></div>';
}

/* ---- ROSTER ---- */
function tabRoster(){
  const f=S.filter;
  let list=S.roster.filter(c=>c.status==="available");
  if(f.q){const q=f.q.toLowerCase();list=list.filter(c=>c.n.toLowerCase().includes(q)||c.nat.toLowerCase().includes(q)||c.langs.some(l=>l.toLowerCase().includes(q))||c.know.some(k=>k.toLowerCase().includes(q)));}
  if(f.tech)list=list.filter(c=>c.tech===f.tech);
  if(f.role)list=list.filter(c=>c.role===f.role);
  if(f.nat)list=list.filter(c=>c.nat===f.nat);
  const sorters={fee:(a,b)=>a.fee-b.fee,feeD:(a,b)=>b.fee-a.fee,exp:(a,b)=>b.exp-a.exp||b.fee-a.fee,power:(a,b)=>avg(b.attrs)-avg(a.attrs),name:(a,b)=>a.n.localeCompare(b.n)};
  list.sort(sorters[f.sort]||sorters.fee);
  const total=list.length;
  const shown=list.slice(0,S.shown);
  const canHire=recruits().length<crewSeats();
  const opt=(v,l,cur)=>'<option value="'+esc(v)+'"'+(cur===v?" selected":"")+'>'+l+'</option>';
  const bar='<div class="rosterbar">'
    +'<div class="field"><label for="q">Search</label><input type="text" id="q" value="'+esc(f.q)+'" placeholder="name, country, language, knowledge" autocomplete="off" style="min-width:220px"></div>'
    +'<div class="field"><label for="ftech">Trade</label><select id="ftech">'+opt("","All",f.tech)+TECHS.map(t=>opt(t.k,t.l,f.tech)).join("")+'</select></div>'
    +'<div class="field"><label for="frole">Role</label><select id="frole">'+opt("","Any",f.role)+opt("commander","Commander",f.role)+opt("soldier","Soldier",f.role)+'</select></div>'
    +'<div class="field"><label for="fnat">Nationality</label><select id="fnat">'+opt("","All",f.nat)+COUNTRIES.map(c=>opt(c.name,c.flag+" "+c.name,f.nat)).join("")+'</select></div>'
    +'<div class="field"><label for="fsort">Sort</label><select id="fsort">'+opt("fee","Fee, low first",f.sort)+opt("feeD","Fee, high first",f.sort)+opt("exp","Experience",f.sort)+opt("power","Raw skill",f.sort)+opt("name","Name",f.sort)+'</select></div>'
    +'<span class="count num">'+total.toLocaleString()+' match · showing '+shown.length+'</span></div>';
  const cards=shown.map(c=>'<div class="id">'+vetStamp(c)+idCardTop(c)
    +'<div class="attrs">'+attrRow(c)+'</div>'+profLine(c)
    +'<div class="foot"><span class="fee num">'+money(c.fee)+(canSign(c)?'':'<span class="nosign" title="'+esc(signWhy(c))+'">won\'t sign · ranking '+repToSign(c.exp)+'</span>')+'</span>'
      +'<span style="display:flex;gap:6px"><button class="btn ghost sm" data-act="open-recruit" data-id="'+c.id+'">File</button>'
      +'<button class="btn sm" data-act="hire" data-id="'+c.id+'" title="'+esc(hireWhy(c)||("Fly to "+c.nat+" and put it to "+c.first+" — a week, and "+money(c.fee)+" if they say yes"))+'" '+(canApproach(c)?"":"disabled")+'>Go and ask</button></span></div></div>').join("");
  const more=total>shown.length?'<div style="text-align:center;margin-top:14px"><button class="btn ghost" data-act="more">Show 30 more</button></div>':'';
  return '<div class="panel-h" style="border:0;padding:0 0 6px"><h2>Roster</h2><span class="kicker num">'+S.roster.length.toLocaleString()+' operatives on file · '+(crewSeats()-recruits().length)+' places open</span></div>'
    +bar+(shown.length?'<div class="cards">'+cards+'</div>'+more:'<div class="empty">No one matches. Loosen the filters.</div>');
}

/* ---- LOG ---- */
function tabLog(){
  const rc=recruits();
  const status=[
    ["Places filled",(1+rc.length)+" / 5"],
    ["Ready to go",field().length],
    ["Injured",rc.filter(c=>c.status==="injured").length],
    ["Held by police",S.roster.filter(c=>c.status==="jailed").length],
    ["Weekly upkeep",money(payroll().filter(c=>c.status==="crew").reduce((s,c)=>s+c.upkeep,0)+retainerCost())],
    ["Postings open",S.jobs.length],
    ["Jobs on file",(S.reports||[]).length],
  ];
  const finalUp=S.jobs.some(j=>j.final);
  const rkNow=rankInfo(S.rep),rkNext=rankNext(S.rep);
  const wk=(!S.logWeek||S.logWeek==="all")?null:+S.logWeek;
  let opts='<option value="all"'+(wk===null?" selected":"")+'>All weeks</option>';
  for(let w=S.week;w>=1;w--)opts+='<option value="'+w+'"'+(wk===w?" selected":"")+'>Week '+w+(w===S.week?" · now":"")+'</option>';
  const wsel='<span class="field" style="gap:2px"><label for="logweek">Week</label><select id="logweek">'+opts+'</select></span>';
  const lines=S.log.filter(l=>wk===null||l.wk===wk);
  const reps=(S.reports||[]).filter(r=>wk===null||r.week===wk).slice().reverse();
  const VC={4:"c-good",3:"c-good",2:"c-warn",1:"c-bad",0:"c-bad"};
  const recaps='<div class="panel" style="margin-bottom:14px"><div class="panel-h"><h2>Job recaps</h2><span class="kicker">'+reps.length+(wk!==null?' in week '+wk:' on file')+' · open any for the full report</span></div>'
    +(reps.length?reps.map(r=>'<div class="jobrow" data-act="recap" data-id="'+esc(r.id)+'" role="button" tabindex="0"><div class="code">wk '+r.week+'</div>'
      +'<div><div class="t"><span class="chip '+VC[r.tier]+'">'+r.verdictName+'</span> '+esc(r.job.title)+(r.crew?' <span class="tag">'+esc(r.crew)+'</span>':'')+'</div>'
        +'<div class="loc">'+esc(r.job.city)+', '+esc(r.job.country)+' · '+CAT_BY_K[r.job.cat].l+' · '+r.teamIds.length+' in the field'+(r.events.length?' · '+r.events.length+' fallout':'')+'</div></div>'
      +'<div class="pay num">'+money(r.net)+'<div class="loc" style="text-align:right">ranking '+(r.repDelta>=0?"+":"")+r.repDelta+'</div></div></div>').join("")
      :'<div class="empty">No jobs '+(wk!==null?'in week '+wk:'on file yet')+'.</div>')+'</div>';
  const left='<div class="panel"><div class="panel-h"><h2>Case Log</h2>'+wsel+'</div><div class="panel-b"><div class="log">'
    +(lines.length?lines.map(l=>'<div class="logline '+l.tone+(l.big?" big":"")+'"><span class="wk">'+String(l.wk).padStart(2,"0")+'</span><span class="tx">'+esc(l.t)+'</span></div>').join(""):'<div class="empty">Nothing logged'+(wk!==null?' in week '+wk:' yet')+'.</div>')
    +'</div></div></div>';
  const right='<div class="panel"><div class="panel-h"><h2>The Operation</h2><span class="kicker">'+esc(S.player.n)+' · '+natOf(S.player).flag+'</span></div><div class="panel-b">'
    +'<div class="kv">'+status.map(r=>'<span class="k">'+r[0]+'</span><span class="num">'+r[1]+'</span>').join("")+'</div>'
    +'<hr class="rule"><div class="kicker">Ranking — what the name buys</div>'
    +'<div class="mono" style="font-size:13px;margin-top:6px"><b>'+esc(rkNow.name)+'</b> · '+S.rep+' points</div>'
    +'<div class="loy" style="height:9px;margin-top:6px"><i style="width:'+clamp(S.rep,0,100)+'%"></i></div>'
    +'<div class="mono" style="font-size:11.5px;line-height:1.6;margin-top:6px">'+esc(rkNow.note)+'</div>'
    +'<div class="mono" style="font-size:11px;color:var(--muted);margin-top:6px">'+(S.finalDone?"It's done.":finalUp?"Stage "+(finalStage()+1)+" of the last score is live: <b>"+esc(FINAL_STAGES[finalStage()].title)+"</b>.":rkNext?"Next: <b>"+esc(rkNext.name)+"</b> at "+rkNext.min+" — "+esc(rkNext.note):"Top of the board.")+'</div>'
    // what the last score is waiting for, ticked off as it arrives — so there is always a
    // next thing to be working towards, and it is never a mystery what it is
    +(S.finalDone?'':'<hr class="rule"><div class="kicker">The last score · '+(finalStage()?"stage "+(finalStage()+1)+" of "+FINAL_STAGES.length:FINAL_STAGES.length+" operations, in order")+'</div>'
      +'<div class="factors">'+finalGate().map(g=>'<span class="k">'+esc(g.k)+'</span><span class="'+(g.ok?"plus":"minus")+' num" dir="ltr">'+(g.ok?"✓ ":"")+esc(g.fmt(g.have))+(g.ok?"":" / "+esc(g.fmt(g.want)))+'</span>').join("")+'</div>'
      +(S.finalBack&&S.week<S.finalBack?'<div class="mono" style="font-size:11px;color:var(--stamp);margin-top:6px">The Committee has moved things. That door is worth trying again in week '+S.finalBack+'.</div>':''))
    +'<div class="mono" style="font-size:11px;color:var(--muted);margin-top:6px">Clean and successful work raises it; messy work, leaks, arrests and walkouts lower it; a week laid low costs a point.'+(S.poach?' <span style="color:var(--stamp)">'+esc(S.poach.name)+' is buying your crew drinks — '+S.poach.weeks+' more week'+(S.poach.weeks===1?'':'s')+'.</span>':'')+'</div>'
    +'<hr class="rule"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="tab" data-k="jobs">Jobs →</button><button class="btn ghost" data-act="laylow">Lay low a week</button></div>'
    +'</div></div>';
  // the record: what the crew has done, and what is worth doing next
  const st=stats(),done=goalsDone(),nDone=GOALS.filter(g=>done[g.k]).length;
  const VT=[["clean","Clean","c-good"],["success","Success","c-good"],["messy","Messy","c-warn"],["botched","Botched","c-bad"],["disaster","Disaster","c-bad"]];
  const record='<div class="panel" style="margin-top:14px"><div class="panel-h"><h2>The record</h2><span class="kicker">'+nDone+' of '+GOALS.length+' marks · week '+S.week+'</span></div><div class="panel-b">'
    +'<div class="num-grid" style="margin-bottom:12px">'
    +'<div class="b"><div class="k">Jobs run</div><div class="v num">'+st.jobs+'</div></div>'
    +'<div class="b"><div class="k">Earned</div><div class="v num">'+money(st.earned)+'</div></div>'
    +'<div class="b"><div class="k">Paid in cuts</div><div class="v num">'+money(st.cuts)+'</div></div>'
    +'<div class="b"><div class="k">Biggest score</div><div class="v num">'+money(st.biggest)+'</div></div>'
    +'<div class="b"><div class="k">Countries</div><div class="v num">'+statCountries()+'</div></div>'
    +'<div class="b"><div class="k">Clean run</div><div class="v num">'+st.streak+(st.bestStreak>st.streak?' <span style="font-size:11px;color:var(--muted)">best '+st.bestStreak+'</span>':'')+'</div></div></div>'
    +'<div class="factors" style="margin-bottom:10px">'+VT.map(v=>'<span class="k">'+v[1]+'</span><span class="num">'+(st[v[0]]||0)+'</span>').join("")
      +'<span class="k">Twists called right</span><span class="num">'+(st.twistRight||0)+' of '+((st.twistRight||0)+(st.twistWrong||0))+'</span>'
      +'<span class="k">Hurt · taken · lost</span><span class="num">'+(st.hurt||0)+' · '+(st.taken||0)+' · '+(st.lost||0)+'</span>'
      +(crews().length?'<span class="k">Run by other crews</span><span class="num">'+(st.crewJobs||0)+'</span>':'')+'</div>'
    +'<hr class="rule"><div class="kicker">Next</div><div style="margin-top:8px">'
    +(nextGoals(3).length?nextGoals(3).map(g=>'<div class="check sat" style="align-items:flex-start;border-style:solid"><div style="flex:1;min-width:0">'
        +'<div class="mono" style="font-size:12.5px">'+esc(g.l)+(g.show?' <span style="color:var(--muted)">· '+esc(g.show())+'</span>':'')+'</div>'
        +'<div class="why" style="font-style:normal">'+esc(g.d)+'</div></div>'
        +'<span class="mono" style="font-size:11px;color:var(--muted);white-space:nowrap">'+[g.rep?"rank +"+g.rep:"",g.money?money(g.money):""].filter(Boolean).join(" · ")+'</span></div>').join("")
      :'<div class="mono" style="font-size:12px">Every mark on the wall. There is only the final score now.</div>')+'</div>'
    +(nDone?'<hr class="rule"><div class="kicker">Done</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">'
      +GOALS.filter(g=>done[g.k]).map(g=>'<span class="tag ok" title="week '+done[g.k]+'">✓ '+esc(g.l)+'</span>').join("")+'</div>':'')
    +'</div></div>';
  // who else is out there
  const rv=rival(),dt=detective();
  const watch=(rv||dt)?'<div class="panel" style="margin-top:14px"><div class="panel-h"><h2>The competition and the law</h2><span class="kicker">'+(rv?cap(rv.name):"")+(rv&&dt?" · ":"")+(dt?dt.name:"")+'</span></div><div class="panel-b">'
    +(rv?'<div class="mono" style="font-size:12.5px;line-height:1.7"><b>'+esc(cap(rv.name))+'</b> — '+esc(rv.boss)+' runs it, working the same board since week '+rv.since+'. They have taken <b>'+rv.took+'</b> posting'+(rv.took===1?'':'s')+' off it.</div>'
      +'<div class="loy'+(rivalAhead()?" low":"")+'" style="height:9px;margin-top:6px"><i style="width:'+clamp(rv.standing,0,100)+'%"></i></div>'
      +'<div class="mono" style="font-size:11.5px;margin-top:5px">Their standing <b>'+rv.standing+'</b> against your <b>'+S.rep+'</b> — '+(rivalAhead()?'<span style="color:var(--stamp)">they are ahead, and they take the best posting most weeks and buy your crew drinks</span>':rv.standing===S.rep?'you are level with them':'you are ahead of them')+'.</div>'
      +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn ghost sm" data-act="rival-buy" '+(S.money>=Math.max(40000,rv.standing*3000)?"":"disabled")+'>Buy a name inside · '+money(Math.max(40000,rv.standing*3000))+'</button>'
      +'<button class="btn ghost sm" data-act="rival-enforce" '+(payroll().some(c=>c.status==="crew"&&c.tech==="enforcer")?"":'disabled title="Needs an Enforcer"')+'>Send the enforcer</button></div>':'')
    +(rv&&dt?'<hr class="rule">':'')
    +(dt?'<div class="mono" style="font-size:12.5px;line-height:1.7"><b>'+esc(dt.name)+'</b> ('+esc(dt.full)+') has been on your alias since week '+dt.since+'.</div>'
      +'<div class="loy'+(detFile()>=50?" low":"")+'" style="height:9px;margin-top:6px"><i style="width:'+clamp(detFile(),0,100)+'%"></i></div>'
      +'<div class="mono" style="font-size:11.5px;margin-top:5px">The file is <b>'+detFile()+' / 100</b>. It thickens while the heat is up and thins while it is down. '+(detFile()>=50?'<span style="color:var(--stamp)">A raid comes at heat '+raidAt()+' now, not 100.</span>':'A raid comes at heat '+raidAt()+'.')+' Paying a desk, laying low and a raid itself all thin it.</div>':'')
    +'</div></div>':'';
  // money with somewhere to go
  const lv=safehouseLevel(),nextHouse=lv<SAFEHOUSES.length?SAFEHOUSES[lv]:null;
  const arrange='<div class="panel" style="margin-top:14px"><div class="panel-h"><h2>Standing arrangements</h2><span class="kicker">'+money(retainerCost())+' a week on the books</span></div><div class="panel-b">'
    +'<div class="sel-help">A balance that only climbs is a balance doing nothing. These are paid every week out of the same payroll as the crew — miss it and they stop answering.</div>'
    +RETAINERS.map(r=>{const on=hasRetainer(r.k);
      return '<div class="check'+(on?"":" sat")+'" style="align-items:flex-start"><div style="flex:1;min-width:0">'
        +'<div class="mono" style="font-size:12.5px">'+esc(r.l)+' <span style="color:var(--muted)">· '+money(r.cost)+' a week</span>'+(on?' <span class="chip c-good">on the books</span>':'')+'</div>'
        +'<div class="why" style="font-style:normal">'+esc(r.d)+'</div></div>'
        +'<button class="btn '+(on?"ghost ":"")+'sm" data-act="retainer" data-k="'+r.k+'" '+(on||S.money>=r.cost?"":"disabled")+'>'+(on?"Let go":"Put on")+'</button></div>';}).join("")
    +'<hr class="rule"><div class="kicker">The safe house</div>'
    +'<div class="mono" style="font-size:12px;line-height:1.7;margin:6px 0">'+(lv?'<b>'+esc(SAFEHOUSES[lv-1].l)+'</b> — heat falls '+heatDrop()+' a week'+(lv>=3?', and a raid takes 15% of the float instead of 30%':'')+'.':'No safe house. Heat falls 5 a week, and everything you own is where you sleep.')+'</div>'
    +(nextHouse?'<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span class="mono" style="font-size:12px">Next: '+esc(nextHouse.l)+' — '+esc(nextHouse.d)+'</span>'
      +'<button class="btn sm" data-act="safehouse" '+(S.money>=nextHouse.cost?"":"disabled")+'>Move · '+money(nextHouse.cost)+'</button></div>':'<div class="mono" style="font-size:11px;color:var(--muted)">Nowhere better to go.</div>')
    +'<hr class="rule"><div class="kicker">A desk that forgets</div>'
    +'<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span class="mono" style="font-size:12px">'+(S.heat>=20?'A file can be lost for '+money(bribeCost())+' — it costs what the heat is worth. Heat −20.':'Nothing to buy off at heat '+Math.round(S.heat)+'.')+'</span>'
    +'<button class="btn ghost sm" data-act="bribe" '+(S.heat>=20&&S.money>=bribeCost()?"":"disabled")+'>Pay the desk</button></div>'
    +'</div></div>';
  return recaps+'<div class="grid g-hq">'+left+right+'</div>'+record+watch+arrange;
}

/* ------------------------------ MODALS -------------------------------- */
function renderModal(){
  const m=S.modal;
  if(m.type==="recruit")return modalRecruit(m.id);
  if(m.type==="result")return modalResult(m.data);
  if(m.type==="trip")return modalTrip(m.data);
  if(m.type==="event")return modalEvent();
  if(m.type==="found")return modalFound();
  if(m.type==="notice")return modalNotice();
  if(m.type==="loose")return modalLoose();
  if(m.type==="revenge")return modalRevenge();
  return "";
}
// Both the job report and the recruitment trip play out line by line in the same ticker.
function isFeed(t){return t==="result"||t==="trip";}
function feedData(){return S&&S.modal&&isFeed(S.modal.type)?S.modal.data:null;}
function modalWrap(inner){return '<div class="scrim" data-act="scrim"><div class="modal" role="dialog" aria-modal="true">'+inner+'</div></div>';}

function modalRecruit(id){
  const c=byId(id);if(!c)return "";
  const nat=natOf(c);
  const t=TECH_BY_K[c.tech];
  const canHire=recruits().length<crewSeats()&&c.status==="available"&&S.money>=c.fee&&canSign(c);
  const vetLine=c.isPlayer?"":c.vetted
    ?(c.vetFlag?'<div class="warnbox">Vetting flagged ties to an informant network. Hire this one and the heat walks in with the luggage.</div>'
               :'<div class="mono" style="font-size:12px;color:var(--good)">✓ Vetted clean. No known ties — as far as money can tell.</div>')
    :'<div class="mono" style="font-size:12px;color:var(--muted)">Not vetted. A stranger\'s loyalty is a guess. Vetting ('+money(VET_COST)+') reads this file against your crew\'s instincts — a sharper crew catches more.</div>';
  const h='<div class="modal-h"><div><div class="kicker">'+(c.isPlayer?"Your file":"Personnel file · "+c.id)+'</div><h2 style="font-size:22px;margin-top:4px">'+esc(c.n)+'</h2></div><button class="x" data-act="scrim" aria-label="Close">✕</button></div>';
  const b='<div class="modal-b"><div style="display:flex;gap:16px;flex-wrap:wrap">'
    +'<div style="width:130px;flex:none"><div style="border:1px solid var(--ink);background:#fff;aspect-ratio:100/120;max-width:100%">'+avatar(c.avseed,c.gender,c.face)+'</div>'
      +'<div class="mono" style="font-size:10px;color:var(--muted);text-align:center;margin-top:4px">'+nat.flag+' '+esc(nat.name)+'</div></div>'
    +'<div style="flex:1;min-width:220px">'
      +'<div class="kv"><span class="k">Role</span><span>'+(c.isPlayer?"Commander — it's your crew (+"+c.cmd+")":c.role==="commander"?"Commander by nature — takes orders badly, can lead if you can't get in (+"+c.cmd+")":"Soldier — does the work")+'</span>'
        +'<span class="k">Trade</span><span>'+t.l+' — '+t.d+'</span>'
        +'<span class="k">Experience</span><span>'+EXP[c.exp-1]+' '+pips(c.exp)+'</span>'
        +'<span class="k">Education</span><span>'+EDU[c.edu]+'</span>'
        +'<span class="k">Knowledge</span><span>'+c.know.join(", ")+'</span>'
        +'<span class="k">Languages</span><span>'+c.langs.join(", ")+'</span>'
        +'<span class="k">Time in jail</span><span class="num">'+yrs(c.jail)+'</span>'
        +'<span class="k">Time on the streets</span><span class="num">'+yrs(c.streets)+'</span>'
        +'<span class="k">Passport</span><span>'+esc(nat.name)+' · tier '+nat.tier+' ('+TIER_WORD[nat.tier]+')</span>'
        +'<span class="k">Sex</span><span>'+(c.gender==="M"?"Male":"Female")+'</span>'
        +'<span class="k">Temperament</span><span>'+(traits(c).length?traits(c).map(k=>TRAIT_BY_K[k]?'<b>'+TRAIT_BY_K[k].l+'</b> — '+TRAIT_BY_K[k].d:"").filter(Boolean).join('<br>'):"— nothing anybody mentions")+'</span>'
        +(bondsFor(c).length?'<span class="k">On the crew</span><span>'+bondsFor(c).map(x=>'<span class="tip" tabindex="0" data-wide="1" data-tip="'+esc(bondStory(c.id,x.c.id))+'">'
          +(c.isPlayer?"You "+youWord(bondWord(x.b)):cap(bondWord(x.b)))+" "+esc(x.c.isPlayer?"you":x.c.first)+'</span>').join("<br>")+'</span>':'')
        +'<span class="k">Cannot</span><span>'+(c.limits.length?c.limits.map(k=>'<span style="color:var(--stamp)">'+LIMIT_BY_K[k].l+'</span>').join(", "):"— no known limits")+'</span>'
        +(c.isPlayer?'':'<span class="k">Fee</span><span class="num">'+money(c.fee)+' one-off</span>'
        +'<span class="k">Cut</span><span class="num">'+Math.round(c.cut*100)+'% of each score</span>'
        +'<span class="k">Upkeep</span><span class="num">'+money(c.upkeep)+' a week</span>')+'</div>'
      +'<div class="attrs" style="padding:10px 0 0;grid-template-columns:1fr 1fr">'+attrRow(c)+'</div>'
    +'</div></div>'
    +(vetLine?'<hr class="rule">'+vetLine:'')
    +(c.status==="available"&&!canSign(c)?'<div class="warnbox" style="margin-top:12px">'+esc(signWhy(c))+'</div>':'')
    +'<hr class="rule"><div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">'
      +'<button class="btn ghost" data-act="scrim">Close</button>'
      +(c.vetted?'':'<button class="btn ghost" data-act="vet" data-id="'+c.id+'" '+(S.money>=VET_COST?"":"disabled")+'>Vet · '+money(VET_COST)+'</button>')
      +(c.status==="available"?'<button class="btn" data-act="hire" data-id="'+c.id+'" title="'+esc(hireWhy(c)||("Fly to "+c.nat+" and put it to "+c.first+" — a week, and "+money(c.fee)+" if they say yes"))+'" '+(canApproach(c)?"":"disabled")+'>Go and ask · '+money(c.fee)+'</button>':'')+'</div></div>';
  return modalWrap(h+b);
}

// The job on the world, zoomed to where it is: the same ink, the same projection and the same
// coastlines as the board's map, framed on the country the job is in. The crew stand around the
// city as marks of what they are doing — an eye watching, a key at the door, a wheel at the car —
// and the mark changes as the feed says what they are doing now.
//
// The map data is twenty-two coarse polygons for the whole world, so there is no street to zoom
// to; the frame is the country in its region, which is as close as the ink goes.
const FM_GLYPH={
  walk:'<path d="M0 -2.6 a1 1 0 1 0 .01 0"/><path d="M0 -1.6 V.6 M0 .6 L-1.3 2.6 M0 .6 L1.3 2.6 M-1.5 -.4 H1.5"/>',
  watch:'<path d="M-3 0 Q0 -2.4 3 0 Q0 2.4 -3 0 Z"/><circle r=".9"/>',
  talk:'<path d="M-2.8 -2 H2.8 V1 H-.6 L-1.8 2.6 V1 H-2.8 Z"/>',
  open:'<circle cy="-1.6" r="1.2"/><path d="M0 -.4 V2.6 M0 1.4 H1.4 M0 2.2 H1.1"/>',
  work:'<circle r="2.2"/><path d="M0 -2.2 V-1.2 M0 2.2 V1.2 M-2.2 0 H-1.2 M2.2 0 H1.2"/>',
  drive:'<circle r="2.5"/><circle r=".7"/><path d="M-2.5 0 H-.7 M2.5 0 H.7 M0 .7 V2.5"/>',
  down:'<path d="M-2.4 -2.4 L2.4 2.4 M2.4 -2.4 L-2.4 2.4"/>',
  wire:'<path d="M-2.8 -2 H2.8 V1.2 H-2.8 Z M-1.2 1.2 V2.6 M1.2 1.2 V2.6 M-2 2.6 H2"/>',

const FM_SITE_GLYPH={road:"walk",watch:"watch",door:"open",inside:"work",exit:"drive"};
const FM_TECH_GLYPH={
  wheelman:"drive", smuggler:"crate", cleaner:"work",
  lookout:"watch", overwatch:"watch", hacker:"wire", launderer:"cash", fixer:"phone",
  forger:"paper", grifter:"talk", face:"talk", infiltrator:"walk", pickpocket:"work",

function fmGlyphFor(line,c){
  if(line&&line.act&&FM_GLYPH[line.act])return line.act;
  if(c&&FM_TECH_GLYPH[c.tech]&&line&&line.at&&line.at===techSite(c.tech))return FM_TECH_GLYPH[c.tech];
  return (line&&(FM_SITE_GLYPH[line.at]||TRIP_SITE_GLYPH[line.at]))||"walk";

// How much of the world to show. The board's own map picks a zoom off the country's size; this

function fmFrame(country){
  const g=GEO[country];
  if(!g)return {x:0,y:20,w:1000,h:400,cx:500,cy:220};
  const p=proj(g[0],g[1]);
  const w=g[2]===3?230:g[2]===2?150:100, h=w*0.44;
  return {x:p[0]-w/2,y:p[1]-h/2,w,h,cx:p[0],cy:p[1]};
}
// The five places sit around the city, at a spread that follows the frame — close enough to read
// as one place, far enough apart to tell who is where.
function fmSitePos(k,F){
  const u=F.w/100;
  const j={road:[-17,10],watch:[-15,-10],door:[0,-1],inside:[16,-10],exit:[18,10]}[k];
  const t=TRIP_SITE_BY_K[k];
  const off=j||(t?[t.x,t.y]:[0,0]);

}
function feedMap(d){

  const land=LAND.map(p=>'<polygon class="fm-land" points="'+pts(p)+'"/>').join("");
  const water=WATER.map(p=>'<polygon class="fm-water" points="'+pts(p)+'"/>').join("");
  let grid="";
  for(let lon=-180;lon<=180;lon+=10){const x=(lon+180)/360*1000;grid+='<line class="fm-grid" x1="'+x+'" y1="0" x2="'+x+'" y2="500"/>';}
  for(let lat=-80;lat<=80;lat+=10){const y=(90-lat)/180*500;grid+='<line class="fm-grid" x1="0" y1="'+y+'" x2="1000" y2="'+y+'"/>';}
  const site=k=>{const p=fmSitePos(k,F),S2=feedSiteBy(d,k);
    return '<g class="fm-site" data-site="'+k+'" transform="translate('+p.x.toFixed(1)+','+p.y.toFixed(1)+')">'
      +'<circle r="'+(1.5*u).toFixed(2)+'"/>'

  const home=fmSitePos(sites[0].k,F);

      +'<clipPath id="'+cid+'"><circle r="4.4"/></clipPath>'

    +'<rect x="'+F.x.toFixed(1)+'" y="'+F.y.toFixed(1)+'" width="'+F.w+'" height="'+F.h+'" fill="var(--card)"/>'

function fmShort(c){
  if(c.isPlayer)return "YOU";
  const n=String(c.first||"");
  return n.length>6?n.slice(0,5)+"·":n;
}
// Several people stand in the same place, so they are spread evenly round it — the ring grows
// with the number standing there, and one person stands on the spot rather than beside it.
const FM_DROP=4.6;   // how far below the marker the crew stand, so the place keeps its name
const FM_COLS=4, FM_GAPX=7.4, FM_GAPY=6.6;   // wide enough for a six-letter name under each face
function fmSpot(i,n,u){
  u=u||1;
  const cols=Math.min(n||1,FM_COLS);
  const col=i%cols, row=Math.floor(i/cols);
  return {dx:(col-(cols-1)/2)*FM_GAPX*u, dy:(FM_DROP+row*FM_GAPY)*u};
}
function fmLayout(root,F,sites){
  const u=F.w/100;
  let tether="";
  (sites||SITES).forEach(p=>{
    const at=fmSitePos(p.k,F);
    const here=[...root.querySelectorAll('.fm-op[data-site="'+p.k+'"]')];
    here.forEach((el,i)=>{const o=fmSpot(i,here.length,u);
      const x=at.x+o.dx, y=at.y+o.dy;
      el.setAttribute("transform","translate("+x.toFixed(1)+","+y.toFixed(1)+") scale("+(0.62*u).toFixed(3)+")");
      tether+='<line x1="'+at.x.toFixed(1)+'" y1="'+at.y.toFixed(1)+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'"/>';});
  });
  const t=root.querySelector(".fm-tether");if(t)t.innerHTML=tether;
}
// One revealed line moves the map: the clock to its time, whoever it names to where it happens
// and to the mark of what they are doing, and the place itself lit. "*" is the whole crew.
function feedMapStep(d,line){
  if(!line)return;
  const cl=document.getElementById("fm-clock");
  if(cl&&line.t)cl.textContent=line.t;
  const root=document.querySelector(".feedmap");
  if(!root)return;
  root.querySelectorAll(".fm-site.on").forEach(e=>e.classList.remove("on"));
  if(!line.at)return;
  if(!feedSiteBy(d,line.at))return;
  const here=root.querySelector('.fm-site[data-site="'+line.at+'"]');if(here)here.classList.add("on");
  const ops=[...root.querySelectorAll(".fm-op")];
  const move=els=>els.forEach(el=>{
    el.setAttribute("data-site",line.at);
    const c=byId(el.getAttribute("data-id"));
    const k=fmGlyphFor(line,c);
    if(el.getAttribute("data-glyph")!==k){
      el.setAttribute("data-glyph",k);
      const g=el.querySelector(".fm-op-badge .fm-op-g");if(g)g.innerHTML=FM_GLYPH[k]||FM_GLYPH.walk;
    }
  });
  if(line.who==="*")move(ops);
  else if(line.who)move(ops.filter(el=>el.getAttribute("data-id")===String(line.who)));
  fmLayout(root,fmFrame(d.cid?d.country:d.job.country),feedSites(d));
}

function wentWrong(d){
  const W=d.why;if(!W)return null;
  const out=[];
  const hurt=(W.factors||[]).filter(x=>x.v<0).sort((p,q)=>p.v-q.v);
  hurt.forEach(x=>{
    const k=x.k,v=x.v,note=x.note||"";
    let fix="";
    if(k==="Crew short")fix="The job wanted "+W.need+" in the field and "+W.went+" went. Nobody covers a gap that size.";
    else if(k.indexOf("No ")===0&&W.lang&&k==="No "+W.lang)fix="Somebody who speaks "+W.lang+" — a local, or anybody on the roster with it in their languages.";
    else if(k.indexOf("Nobody knows ")===0)fix="Somebody who knows "+k.slice(13)+". Schooled in it is worth double street knowledge.";
    else if(k==="Heat")fix="You were carrying "+W.heat+" heat. A quiet week, or a safe house, before a room like this.";
    else if(k==="Bad blood")fix="These two have lost together before and it is still costing you. Split them up, or send one of them.";
    else if(k==="Leaderless")fix="Nobody in the field could lead it. Take it yourself, or send a commander-type.";
    else if(k==="Commanders under you")fix="A commander takes your orders badly. One is a cost; two is a committee.";
    else if(k==="Restless")fix="They are working for a cut that is not worth their week. A bonus, or a bigger score, settles it.";
    else if(k==="Temperament")fix="Who they are cost you this one. Temperament is on every file, before you send them.";
    else fix=note;
    out.push({k,v,note,fix});
  });
  // the trades the room wanted and nobody brought — the reckoning only counts the ones you had
  const miss=(W.techs||[]).filter(t=>!(d.teamIds||[]).some(id=>{const c=byId(id);return c&&c.tech===t;}));
  miss.forEach(t=>out.push({k:"No "+TECH_BY_K[t].l,v:null,note:"the job asked for one",
    fix:"A "+TECH_BY_K[t].l+" on the crew. "+TECH_BY_K[t].d+" Somebody stood in for it and learned a little; that is not the same thing."}));
  // and the two that are not on the reckoning at all
  if(W.leaked)out.push({k:"Somebody talked",v:null,note:"the police were waiting",
    fix:"A mole was on the job. Vetting reads a file against your crew's instincts before you sign them — a sharper crew catches more."});
  if(W.twLose>0&&d.twist)out.push({k:"The wrong call",v:null,note:"when it went wrong you chose "+d.twist.chosen,
    fix:"What would have set you free: "+d.twist.correct+(d.twist.why?" — because "+d.twist.why+".":".")});
  return {gap:W.eff-W.diff,eff:W.eff,diff:W.diff,roll:W.roll,items:out};
}
function tickLine(l){return '<div class="tk '+(l.tone||"")+(l.twist?" tk-twist":"")+'"><span class="tk-t">'+esc(l.t)+'</span><span class="tk-x">'+esc(l.x)+'</span></div>';}
let TICK=null;
function tickerArm(){
  if(TICK){clearInterval(TICK);TICK=null;}
  if(!S||!S.modal||!isFeed(S.modal.type))return;
  const d=S.modal.data;
  // a re-render shows the latest line, not the first: the marker sits right above the decision
  if(!d.done){const el0=document.getElementById("ticker");if(el0)el0.scrollTop=el0.scrollHeight;
    for(let i=0;i<d.revealed;i++)feedMapStep(d,d.narrative[i]);}
  if(d.done||d.awaiting)return;
  let reduced=false;
  try{reduced=!!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);}catch(e){}
  if(reduced){tickerFinish();return;}
  TICK=setInterval(()=>{
    if(!S||!S.modal||!isFeed(S.modal.type)||S.modal.data!==d){clearInterval(TICK);TICK=null;return;}
    d.revealed++;
    const line=d.narrative[d.revealed-1];
    const el=document.getElementById("ticker");
    if(el&&line){el.insertAdjacentHTML("beforeend",tickLine(line));el.scrollTop=el.scrollHeight;}
    feedMapStep(d,line);
    sfx("tick");
    if(line&&line.twist&&!d.resolved){clearInterval(TICK);TICK=null;d.awaiting=true;sfx("bad");render();return;}
    // The end of a trip that nobody had to decide anything about: settle it here, where the
    // player is watching, and let the feed carry straight on into what was decided.
    if(S.modal.type==="trip"&&!d.resolved&&!d.snag&&S.pendingTrip&&d.revealed>=d.narrative.length)finishTrip(S.pendingTrip,null,d);
    if(S.modal.type==="trip"&&d.resolved&&d.revealed>=d.narrative.length){clearInterval(TICK);TICK=null;tickerFinish();return;}
    if(d.revealed>=d.narrative.length){clearInterval(TICK);TICK=null;tickerFinish();}
  },SPEEDS[speedIdx()][0]);
}
function tickerFinish(){
  if(TICK){clearInterval(TICK);TICK=null;}
  const d=feedData();if(!d)return;
  // Skip stops at whatever is waiting for a decision — a job's twist or a trip's meeting.
  // Checking only d.twist let Skip jump a recruitment trip straight past its meeting, which
  // left the trip unresolved and the week unspent.
  if((d.twist||d.snag)&&!d.resolved){
    const i=d.narrative.findIndex(l=>l.twist);
    d.revealed=i>=0?i+1:d.narrative.length;d.awaiting=true;render();return;
  }
  if(S.modal.type==="trip"&&!d.resolved&&S.pendingTrip)finishTrip(S.pendingTrip,null,d);
  d.revealed=d.narrative.length;d.done=true;d.awaiting=false;
  if(S.modal.type==="trip"){sfx(d.outcome==="signed"?"coin":"bad");render();return;}
  sfx(d.tier>=3?"good":d.tier===2?"stamp":"bad");
  const vt=verdictTrack(d.tier);musicPlay(vt[0],vt[1],true);
  render();
}

  const dim=hex=>{const n=parseInt(hex.slice(1),16);return "#"+[(n>>16)&255,(n>>8)&255,n&255].map(v=>Math.round(v*b).toString(16).padStart(2,"0")).join("");};

}

/* ------------------------------ SOUND --------------------------------- */
// A handful of synthesised sounds; no files. Nothing plays until the first click.
let AC=null;
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
  if(AC&&AC.state==="suspended")AC.resume();
  return AC;
}
function tone(freq,dur,type,gain,when,slide){
  const c=ac();if(!c)return;
  const t0=c.currentTime+(when||0);
  const o=c.createOscillator(),g=c.createGain();
  o.type=type||"sine";o.frequency.setValueAtTime(freq,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,gain*SET.volume),t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+dur+0.05);
}
function sfx(name){
  if(!SET.sound||SET.volume<=0)return;
  try{
    switch(name){
      case "click": tone(1200,0.03,"square",0.05,0); break;
      case "tick": tone(900,0.02,"square",0.018,0); break;
      case "open": tone(440,0.08,"triangle",0.08,0); tone(660,0.08,"triangle",0.06,0.06); break;
      case "coin": tone(880,0.07,"sine",0.12,0); tone(1320,0.12,"sine",0.12,0.07); break;
      case "stamp": tone(140,0.12,"sine",0.5,0,60); tone(90,0.2,"triangle",0.3,0.02,40); break;
      case "good": sfx("stamp"); tone(660,0.1,"sine",0.1,0.15); tone(990,0.18,"sine",0.1,0.25); break;
      case "bad": sfx("stamp"); tone(220,0.25,"sawtooth",0.08,0.15,110); break;
      case "siren": for(let i=0;i<3;i++){tone(700,0.18,"square",0.06,i*0.36);tone(500,0.18,"square",0.06,i*0.36+0.18);} break;
    }
  }catch(e){}
}

// Fourteen tracks from the creator's compilation: eleven rotate under the live job report,
// three score the verdict. Quiet between jobs. Browsers allow audio only after the first
// click, and the radio in the office reports its state.
const TRACKS={
  report:["music/report-01.mp3","music/report-02.mp3","music/report-03.mp3","music/report-04.mp3","music/report-05.mp3","music/report-06.mp3","music/report-07.mp3","music/report-08.mp3","music/report-09.mp3","music/report-10.mp3","music/report-11.mp3"],
  result:{good:"music/result-success.mp3",messy:"music/result-messy.mp3",bad:"music/result-disaster.mp3"},
  ambient:"music/ambient.mp3",   // the hour of suspense under everything that is not a job report or a verdict, on a loop
};
function musicAmbient(){if(musicWant&&musicWant.src===TRACKS.ambient){musicSync();return;}musicPlay(TRACKS.ambient,"Suspense — the hour under the office, on a loop",true);}
// The report and the verdict bring their own track; every other screen runs under the loop.
function musicRoute(){if(!feedData())musicAmbient();}
const SPEEDS=[[4500,"Slowest"],[3000,"Slow"],[2000,"Normal"],[1300,"Fast"],[800,"Fastest"]];
function speedIdx(){return clamp(Math.round(SET.speed==null?2:SET.speed),0,SPEEDS.length-1);}
let MUSIC=null,userGestured=false,musicState="idle",musicNote="",musicWant=null,musicSrc=null;
const musicBlobTried={};
function musicEl(){
  if(!MUSIC){
    try{
      MUSIC=new Audio();MUSIC.preload="auto";
      MUSIC.addEventListener("playing",()=>{musicState="playing";musicNote="";refreshRadio();});
      MUSIC.addEventListener("pause",()=>{if(musicState==="playing"){musicState="stopped";refreshRadio();}});
      MUSIC.addEventListener("ended",()=>{if(musicWant&&!musicWant.loop){musicState="stopped";refreshRadio();}});
      MUSIC.addEventListener("error",()=>{musicLoadFallback();});
    }catch(e){MUSIC=null;musicState="blocked";musicNote="this browser has no audio";}
  }
  return MUSIC;
}
// If a track won't load as a plain source, fetch it and play it from memory.
function musicLoadFallback(){
  const src=musicSrc;if(!src)return;
  const fail=why=>{musicState="blocked";musicNote="the track could not be loaded here ("+why+")";refreshRadio();};
  if(musicBlobTried[src]){fail("media blocked");return;}
  musicBlobTried[src]=true;
  try{
    fetch(src).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.blob();})
      .then(b=>{if(musicSrc!==src)return;MUSIC.src=URL.createObjectURL(b);musicSync();})
      .catch(e=>fail(e&&e.message?e.message:"fetch failed"));
  }catch(e){fail("fetch unavailable");}
}
function musicPlay(src,label,loop){musicWant={src,label,loop:!!loop};musicSync();}
function musicStop(){musicWant=null;musicSync();}
function verdictTrack(tier){return tier>=3?[TRACKS.result.good,"the verdict — success"]:tier===2?[TRACKS.result.messy,"the verdict — messy"]:[TRACKS.result.bad,"the verdict — disaster"];}
function musicSync(){
  const m=musicEl();if(!m)return;
  try{
    m.volume=clamp(SET.volume*0.5,0,1);
    const allowed=SET.sound&&SET.music&&SET.volume>0&&userGestured&&!document.hidden;
    if(musicWant&&allowed){
      if(musicSrc!==musicWant.src){musicSrc=musicWant.src;m.src=musicWant.src;musicState="idle";}
      m.loop=musicWant.loop;
      if(m.paused){
        const p=m.play();
        if(p&&p.catch)p.catch(err=>{
          const n=err&&err.name||"error";
          musicState="blocked";
          musicNote=n==="NotAllowedError"?"the browser wants a click first — press Start the radio":n==="NotSupportedError"?"the track could not be loaded here":"could not play ("+n+")";
          refreshRadio();
        });
      }
    } else if(!m.paused)m.pause();
  }catch(e){}
}
function refreshRadio(){if(UI.office)render();}
function musicStatusText(){
  if(!SET.sound)return "Radio off — sound is off";
  if(!SET.music)return "Radio off";
  if(SET.volume<=0)return "Radio on, volume at zero";
  if(!musicWant)return "Radio quiet — the loop plays under the office and the boards, a track under each job report, another under the verdict";
  if(musicState==="playing")return "♪ Now playing — "+musicWant.label;
  if(musicState==="blocked")return "Radio silent: "+musicNote;
  return "Radio ready — "+musicWant.label+" · press Start the radio, or click anywhere";
}
function radioLabel(){
  if(!SET.sound||!SET.music)return "RADIO OFF";
  if(!musicWant)return "STANDBY";
  if(musicState==="playing")return "♪ ON AIR";
  if(musicState==="blocked")return "NO SIGNAL";
  return "TUNING";
}

// The i button: what is on this screen, in plain words.

  if(!S)return draft?"create":"title";
  if(S.over)return "over";
