<title>The Crew</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600;700&family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --paper:#f6f4ee;
    --paper-2:#efece3;
    --card:#fbfaf6;
    --ink:#111010;
    --ink-2:#4a463e;
    --muted:#726c60;
    --line:#d9d5c8;
    --line-2:#c4bfae;
    --stamp:#9a2b1e;
    --good:#2f6b34;
    --warn:#8a6212;
    --bad:#9a2b1e;
    --shadow:0 1px 0 rgba(17,16,16,.04), 0 8px 24px -18px rgba(17,16,16,.5);
    color-scheme:light;
    --f-logo:"Anton","Impact","Oswald","Arial Narrow",sans-serif;
    --f-disp:"Oswald","Arial Narrow",system-ui,sans-serif;
    --f-body:"Spectral","Iowan Old Style",Georgia,serif;
    --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--f-body);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    background-image:
      repeating-linear-gradient(0deg,transparent,transparent 27px,rgba(17,16,16,.02) 27px,rgba(17,16,16,.02) 28px);
  }
  .wrap{max-width:1060px;margin:0 auto;padding:0 16px 64px}
  .mono{font-family:var(--f-mono)}
  .num{font-variant-numeric:tabular-nums}
  h1,h2,h3{font-family:var(--f-disp);font-weight:600;margin:0;letter-spacing:.02em;text-wrap:balance;line-height:1.05}
  button{font-family:inherit;color:inherit;cursor:pointer}
  a{color:inherit}
  .kicker{font-family:var(--f-mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}

  /* ---- Top bar ---- */
  .topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--paper);border-bottom:2px solid var(--ink)}
  .topbar-in{max-width:1060px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{font-family:var(--f-logo);font-weight:400;font-size:24px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;line-height:1}
  .brand b{font-weight:400}
  .stat{display:flex;flex-direction:column;line-height:1;gap:3px;min-width:72px}
  .stat .l{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .stat .v{font-family:var(--f-mono);font-size:15px;font-weight:500}
  .heatwrap{min-width:132px;flex:1 1 132px;max-width:220px}
  .heatbar{height:9px;border:1px solid var(--ink);background:
    repeating-linear-gradient(45deg,var(--paper-2),var(--paper-2) 5px,transparent 5px,transparent 10px);position:relative;overflow:hidden}
  .heatbar>i{position:absolute;inset:0;width:0;background:var(--ink);transition:width .5s ease}
  .heatbar.hot>i{background:var(--stamp)}
  .spacer{flex:1 1 auto}

  /* ---- Tabs ---- */
  .tabs{display:flex;gap:0;border-bottom:2px solid var(--ink);margin:0 0 18px;flex-wrap:wrap}
  .tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;
    padding:12px 16px 10px;font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.12em;font-size:14px;color:var(--muted)}
  .tab.on{color:var(--ink);border-color:var(--stamp)}
  .tab .b{font-family:var(--f-mono);font-size:10px;color:var(--muted);margin-left:6px}

  /* ---- Panels & cards ---- */
  .panel{background:var(--card);border:1px solid var(--line-2);box-shadow:var(--shadow)}
  .panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .panel-h h2{font-size:16px;letter-spacing:.08em;text-transform:uppercase}
  .panel-b{padding:16px}
  .grid{display:grid;gap:14px}
  .g-hq{grid-template-columns:1.3fr 1fr}
  @media(max-width:720px){.g-hq{grid-template-columns:1fr}}

  .rule{height:1px;background:var(--line);border:0;margin:12px 0}
  .btn{appearance:none;border:1px solid var(--ink);background:var(--ink);color:var(--paper);
    font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.1em;font-size:13px;padding:9px 16px;transition:.12s}
  .btn:hover{background:#000}
  .btn:disabled{opacity:.32;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--ink)}
  .btn.ghost:hover{background:var(--paper-2)}
  .btn.sm{font-size:11px;padding:6px 11px;letter-spacing:.08em}
  .btn.stamp{border-color:var(--stamp);background:var(--stamp)}
  .btn.stamp:hover{background:#7f2116}

  .tag{display:inline-block;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    border:1px solid var(--line-2);padding:2px 6px;color:var(--ink-2);background:var(--paper)}
  .tag.spec{border-color:var(--ink);color:var(--ink)}
  .tag.pass{border-style:dashed}
  .chip{font-family:var(--f-mono);font-size:10px;padding:1px 6px;border:1px solid;letter-spacing:.05em;text-transform:uppercase}
  .c-good{color:var(--good);border-color:var(--good)}
  .c-warn{color:var(--warn);border-color:var(--warn)}
  .c-bad{color:var(--bad);border-color:var(--bad)}

  /* ---- Roster / ID cards ---- */
  .rosterbar{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
  .field{display:flex;flex-direction:column;gap:3px}
  .field label{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  input[type=text],select{font-family:var(--f-mono);font-size:13px;padding:7px 9px;border:1px solid var(--line-2);background:var(--paper);color:var(--ink);max-width:100%}
  input[type=text]:focus,select:focus,.tab:focus-visible,.btn:focus-visible,button:focus-visible,.jobrow:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
  .count{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-left:auto;padding-bottom:8px}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:12px}
  .id{border:1px solid var(--line-2);background:var(--card);display:flex;flex-direction:column;position:relative}
  .id .top{display:flex;gap:10px;padding:11px 11px 8px}
  .id .av{width:60px;height:72px;flex:none;border:1px solid var(--ink);background:#fff}
  .id .who{min-width:0;flex:1}
  .id .nm{font-family:var(--f-disp);font-size:16px;line-height:1.05;letter-spacing:.02em}
  .id .sub{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-top:3px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
  .id .spec{font-family:var(--f-mono);font-size:11px;margin-top:6px;letter-spacing:.04em}
  .exp{display:inline-flex;gap:2px;margin-top:6px;vertical-align:middle}
  .pip{width:9px;height:9px;border:1px solid var(--ink);display:inline-block;flex:none}
  .pip.f{background:var(--ink)}
  .attrs{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;padding:2px 11px 10px}
  .attr{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10px;color:var(--ink-2)}
  .attr .k{width:34px;color:var(--muted);letter-spacing:.05em}
  .attr .bar{flex:1;height:5px;background:var(--paper-2);border:1px solid var(--line)}
  .attr .bar>i{display:block;height:100%;background:var(--ink)}
  .attr .n{width:20px;text-align:right}
  .id .foot{margin-top:auto;border-top:1px dashed var(--line-2);padding:8px 11px;display:flex;align-items:center;gap:8px;justify-content:space-between}
  .fee{font-family:var(--f-mono);font-size:13px;font-weight:500}
  .stampmark{position:absolute;top:8px;right:8px;font-family:var(--f-disp);font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--stamp);border:2px solid var(--stamp);padding:1px 5px;transform:rotate(-8deg);opacity:.9;background:rgba(251,250,246,.85)}
  .stampmark.ink{color:var(--ink-2);border-color:var(--ink-2)}

  /* ---- job ledger ---- */
  .jobrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;transition:.1s}
  .jobrow:hover{background:var(--paper-2)}
  .jobrow:last-child{border-bottom:0}
  .jobrow .code{font-family:var(--f-mono);font-size:11px;color:var(--muted);width:52px}
  .jobrow .t{font-family:var(--f-disp);font-size:17px;letter-spacing:.02em}
  .jobrow .loc{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:2px}
  .jobrow .pay{font-family:var(--f-mono);font-size:15px;text-align:right;font-weight:500}
  .jobrow .meta{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
  @media(max-width:520px){.jobrow{grid-template-columns:1fr auto}.jobrow .code{display:none}}
  .diffbar{display:inline-flex;gap:2px;vertical-align:middle}
  .diffbar i{width:6px;height:11px;background:var(--paper-2);border:1px solid var(--line-2)}
  .diffbar i.f{background:var(--ink);border-color:var(--ink)}
  .diffbar i.h{background:var(--stamp);border-color:var(--stamp)}

  /* ---- modal ---- */
  .scrim{position:fixed;inset:0;background:rgba(17,16,16,.44);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:26px 14px;overflow:auto}
  .modal{background:var(--paper);border:2px solid var(--ink);max-width:640px;width:100%;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
  .modal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:14px 16px;border-bottom:2px solid var(--ink);background:var(--paper-2)}
  .modal-b{padding:16px}
  .x{appearance:none;border:1px solid var(--ink);background:var(--paper);width:30px;height:30px;font-size:16px;line-height:1;flex:none}

  .assignline{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line-2);margin-bottom:7px;background:var(--card);cursor:pointer}
  .assignline.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
  .assignline .av{width:38px;height:46px;border:1px solid var(--ink);background:#fff;flex:none}

  .req{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .req .b{border:1px solid var(--line-2);padding:6px 9px;background:var(--card);min-width:78px;flex:1 1 78px}
  .req .b .k{font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .req .b .v{font-family:var(--f-disp);font-size:16px}

  .odds{height:12px;border:1px solid var(--ink);display:flex;overflow:hidden;font-size:0}
  .odds i{height:100%;display:block}
  .odds .o-good{background:var(--good)}
  .odds .o-mid{background:var(--warn)}
  .odds .o-bad{background:var(--stamp)}

  /* ---- title screen ---- */
  .hero{padding:56px 0 30px;text-align:center;border-bottom:2px solid var(--ink);margin-bottom:26px;position:relative}
  .hero .eyebrow{font-family:var(--f-mono);letter-spacing:.4em;text-transform:uppercase;font-size:12px;color:var(--muted)}
  .hero h1{font-family:var(--f-logo);font-size:clamp(60px,17vw,150px);letter-spacing:.01em;line-height:.9;margin:10px 0 6px;text-transform:uppercase;font-weight:400}
  .hero h1 b{font-weight:400}
  .hero .tagline{font-family:var(--f-body);font-style:italic;font-size:clamp(15px,2.4vw,19px);color:var(--ink-2);max-width:44ch;margin:8px auto 0}
  .filecard{max-width:720px;margin:0 auto}
  .redacted{background:var(--ink);color:var(--ink);user-select:none}

  .create-grid{display:grid;grid-template-columns:200px 1fr;gap:22px}
  @media(max-width:640px){.create-grid{grid-template-columns:1fr}}
  .bigav{width:200px;height:240px;border:2px solid var(--ink);background:#fff;margin:0 auto}
  .swatchrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
  .genbtn{border:1px solid var(--ink);background:var(--paper);padding:8px 14px;font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.1em;font-size:13px}
  .genbtn.on{background:var(--ink);color:var(--paper)}

  .log{display:flex;flex-direction:column;max-height:340px;overflow:auto}
  .logline{font-family:var(--f-mono);font-size:12px;padding:7px 0;border-bottom:1px dotted var(--line);display:flex;gap:9px}
  .logline .wk{color:var(--muted);flex:none;width:30px}
  .logline.good .tx{color:var(--good)}
  .logline.bad .tx{color:var(--bad)}
  .logline.warn .tx{color:var(--warn)}
  .logline.big .tx{font-weight:600}

  .empty{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding:22px;text-align:center}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-family:var(--f-mono);font-size:12px}
  .kv .k{color:var(--muted)}
  .foot-note{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;margin-top:26px;line-height:1.6}
  .loy{height:6px;border:1px solid var(--ink);background:var(--paper-2);width:100%;position:relative}
  .loy>i{display:block;height:100%;background:var(--ink)}
  .loy.low>i{background:var(--stamp)}
  .result-verdict{font-family:var(--f-logo);font-size:clamp(30px,7vw,46px);text-transform:uppercase;letter-spacing:.03em;line-height:1}
  @keyframes stampin{0%{transform:scale(2.4) rotate(-14deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-6deg);opacity:1}}
  .verdict-stamp{display:inline-block;border:3px solid;padding:4px 14px;transform:rotate(-6deg);animation:stampin .3s ease-out}
  @media(prefers-reduced-motion:reduce){.verdict-stamp{animation:none}.heatbar>i{transition:none}}
  .num-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;margin-top:12px}
  .num-grid .b{border:1px solid var(--line-2);padding:8px 10px;background:var(--card)}
  .num-grid .b .k{font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .num-grid .b .v{font-family:var(--f-mono);font-size:18px}
  .warnbox{border:1px solid var(--stamp);background:var(--paper);padding:10px 12px;font-family:var(--f-mono);font-size:12px;color:var(--stamp);margin-bottom:12px}
  .sel-help{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin:6px 0 12px}
</style>

<div id="root"></div>

function ri(rng,a,b){return Math.floor(rng()*(b-a+1))+a;}
function pick(rng,arr){return arr[Math.floor(rng()*arr.length)];}
function chance(rng,p){return rng()<p;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

/* --------------------------- CHARACTER GEN ---------------------------- */
function genChar(rng,idNum){
  const nat=pick(rng,NATS);
  const gender=chance(rng,0.5)?"M":"F";
  const pool=NAMES[nat.region];
  const first=pick(rng,gender==="M"?pool.m:pool.f);
  const last=pick(rng,pool.s);
  const spec=pick(rng,SPECS);
  const r=rng();
  const exp=r<0.40?1:r<0.70?2:r<0.87?3:r<0.97?4:5;
  const base=24+(exp-1)*11;
  const attrs={};
  ATTRS.forEach(a=>{attrs[a]=clamp(Math.round(base+ri(rng,-8,18)+(a===spec.a?ri(rng,10,26):0)),12,98);});
  const feeBase=(exp*7000)+(avg(attrs)*260)+(spec.k==="hacker"||spec.k==="safecracker"?4000:0);
  const fee=Math.round(feeBase*(1+rng()*0.35)/500)*500;
  return {
    id:"C"+idNum,
    n:first+" "+last, first,last,gender,
    nat,
    spec:spec.k,
    exp,
    attrs,
    fee,
    cut:Math.round((0.05+(exp-1)*0.02+rng()*0.05)*100)/100,
    upkeep:Math.round((exp*1200+rng()*800)/100)*100,
    loyalty:ri(rng,42,68),
    greed:ri(rng,15,90),
    mole:chance(rng,0.07),
    vetted:false,
    vetFlag:false,
    status:"available", // available | crew | injured | jailed | gone
    out:0,
    avseed:ri(rng,1,1e9),
  };
}
function avg(o){let s=0,n=0;for(const k in o){s+=o[k];n++;}return s/n;}

function buildRoster(seed){
  const rng=mulberry32(seed);
  const n=ri(rng,420,460);
  const arr=[];
  for(let i=0;i<n;i++)arr.push(genChar(rng,1000+i));
  return arr;
}

// Bold ink bust, matched to the reference sheet: solid black shirt, hair and
// brows, white face, heavy outline, almond eyes. viewBox 0 0 100 120.
function avatar(seed,gender){
  const rng=mulberry32(seed>>>0);
  const K="#111010",W="#ffffff";
  const f=v=>Math.round(v*10)/10;
  const M=gender==="M";
  const hw=M?ri(rng,20,22):ri(rng,18,20);
  const jaw=M?0.58+rng()*0.2:0.36+rng()*0.16;
  const nw=M?9:7;
  const cx=50,top=20,chin=78,mid=50,L=cx-hw,R=cx+hw,ey=50,ex=9;
  const st=w=>' stroke="'+K+'" stroke-width="'+(w||2.6)+'" stroke-linejoin="round" stroke-linecap="round"';
  const P=(d,fill,w)=>'<path d="'+d+'" fill="'+fill+'"'+st(w)+'/>';
  const ink=(d,w)=>P(d,K,w);
  const white=(d,w)=>P(d,W,w);
  const line=(d,w)=>'<path d="'+d+'" fill="none"'+st(w)+'/>';
  const wline=(d,w)=>'<path d="'+d+'" fill="none" stroke="'+W+'" stroke-width="'+w+'" stroke-linecap="round"/>';
  const dot=(x,y,r,c)=>'<circle cx="'+f(x)+'" cy="'+f(y)+'" r="'+r+'" fill="'+c+'"/>';
  // a scalloped arc of an ellipse — curls, pixie texture
  function scallop(sx,sy,rx,ry,a0,a1,n,bump){
    const pt=i=>{const a=(a0+(a1-a0)*i/n)*Math.PI/180;return [sx+rx*Math.cos(a),sy+ry*Math.sin(a)];};
    let d='M'+f(pt(0)[0])+' '+f(pt(0)[1]);
    for(let i=1;i<=n;i++){
      const p0=pt(i-1),p1=pt(i);
      const a=(a0+(a1-a0)*(i-0.5)/n)*Math.PI/180;
      d+=' Q'+f((p0[0]+p1[0])/2+bump*1.6*Math.cos(a))+' '+f((p0[1]+p1[1])/2+bump*1.6*Math.sin(a))+' '+f(p1[0])+' '+f(p1[1]);
    }
    return d;
  }
  const capTop='M'+L+' '+mid+' C'+L+' 36 '+f(cx-hw*0.95)+' '+top+' '+cx+' '+top+' C'+f(cx+hw*0.95)+' '+top+' '+R+' 36 '+R+' '+mid;
  const hairline=' L'+R+' 44 C'+f(cx+hw*0.7)+' 34 '+f(cx+hw*0.35)+' 31 '+cx+' 31 C'+f(cx-hw*0.35)+' 31 '+f(cx-hw*0.7)+' 34 '+L+' 44 Z';
  const hairline2=' L'+R+' 46 C'+f(cx+hw*0.7)+' 35 '+f(cx+hw*0.35)+' 32 '+cx+' 32 C'+f(cx-hw*0.35)+' 32 '+f(cx-hw*0.7)+' 35 '+L+' 46 Z';
  const headD='M'+cx+' '+top+' C'+f(cx-hw*0.95)+' '+top+' '+L+' 36 '+L+' '+mid+' C'+L+' 63 '+f(cx-hw*jaw)+' '+chin+' '+cx+' '+chin+' C'+f(cx+hw*jaw)+' '+chin+' '+R+' 63 '+R+' '+mid+' C'+R+' 36 '+f(cx+hw*0.95)+' '+top+' '+cx+' '+top+' Z';
  const style=M?pick(rng,["buzz","slick","curly","bald","spiky","beanie"])
               :pick(rng,["long-center","long-sweep","long-bangs","bob-bangs","bob-sweep","ponytail","curly","pixie","beanie"]);
  const glasses=chance(rng,0.24);
  const fh=M?pick(rng,["none","none","none","stubble","beard","mustache","goatee"]):"none";
  const browAng=M?ri(rng,0,2)*1.3:ri(rng,0,1)*0.6;
  const browThick=M?2.6+rng()*0.7:1.5+rng()*0.5;
  const earrings=!M&&chance(rng,0.4);
  const scar=chance(rng,0.08);
  let s='<rect x="0" y="0" width="100" height="120" fill="'+W+'"/>';
  // hair that sits behind the head
  if(style.indexOf("long")===0)s+=ink('M'+f(L-5)+' 40 C'+f(L-5)+' 14 '+f(R+5)+' 14 '+f(R+5)+' 40 L'+f(R+5)+' 96 Q'+f(R+5)+' 101 '+R+' 101 L'+L+' 101 Q'+f(L-5)+' 101 '+f(L-5)+' 96 Z',2.4);
  else if(style.indexOf("bob")===0)s+=ink('M'+f(L-6)+' 40 C'+f(L-6)+' 14 '+f(R+6)+' 14 '+f(R+6)+' 40 L'+f(R+6)+' 70 Q'+f(R+6)+' 78 '+f(R-2)+' 78 L'+f(L+2)+' 78 Q'+f(L-6)+' 78 '+f(L-6)+' 70 Z',2.4);
  else if(!M&&style==="curly")s+=ink(scallop(cx,48,hw+9,36,150,390,16,5)+' L'+f(R+6)+' 84 L'+f(L-6)+' 84 Z',2.2);
  else if(style==="ponytail")s+=ink('M'+f(R-2)+' 34 C'+f(R+13)+' 40 '+f(R+11)+' 66 '+f(R+3)+' 88 C'+f(R+1)+' 70 '+f(R+4)+' 52 '+f(R-4)+' 42 Z',2.2);
  // neck, shirt, collar
  s+=white('M'+(cx-nw)+' 66 L'+(cx-nw)+' 100 L'+(cx+nw)+' 100 L'+(cx+nw)+' 66 Z',2.6);
  s+='<path d="M0 120 L0 104 C12 97 26 93 36 92 Q50 106 64 92 C74 93 88 97 100 104 L100 120 Z" fill="'+K+'"/>';
  s+=line('M35 89 Q50 103 65 89',3);
  // ears, then the head over them
  s+=white('M'+f(L+1)+' 46 C'+f(L-5)+' 44 '+f(L-6)+' 58 '+f(L+1)+' 60 Z',2.4);
  s+=white('M'+f(R-1)+' 46 C'+f(R+5)+' 44 '+f(R+6)+' 58 '+f(R-1)+' 60 Z',2.4);
  s+=white(headD,2.8);
  // brows: solid, tapered; the inner end drops for a stern look
  const brow=(ec,dir)=>{const ox=ec-dir*7.5,ix=ec+dir*7;
    return 'M'+f(ox)+' '+f(ey-7.5)+' Q'+ec+' '+f(ey-11.5)+' '+f(ix)+' '+f(ey-8.5+browAng)+' L'+f(ix)+' '+f(ey-8.5+browAng+browThick)+' Q'+ec+' '+f(ey-11.5+browThick)+' '+f(ox)+' '+f(ey-7.5+browThick)+' Z';};
  s+=ink(brow(cx-ex,1),1.2)+ink(brow(cx+ex,-1),1.2);
  // eyes
  [cx-ex,cx+ex].forEach((ec,i)=>{
    s+=white('M'+f(ec-6)+' '+ey+' Q'+ec+' '+f(ey-4.5)+' '+f(ec+6)+' '+ey+' Q'+ec+' '+f(ey+4.2)+' '+f(ec-6)+' '+ey+' Z',2.2);
    s+=dot(ec,ey+0.4,2.6,K);
    if(!M){const ox=i===0?ec-6:ec+6,dx=i===0?-2.2:2.2;s+=line('M'+f(ox)+' '+f(ey-0.5)+' l'+dx+' -2.2',1.8);}
  });
  // nose, mouth
  s+=line('M'+f(cx-1)+' 55 L'+f(cx-3.5)+' 63 Q'+cx+' 66.5 '+f(cx+4)+' 63',2.4);
  s+=line('M'+f(cx-7)+' 69.5 Q'+f(cx-3.5)+' 67.3 '+cx+' 69.2 Q'+f(cx+3.5)+' 67.3 '+f(cx+7)+' 69.5',2.2);
  s+=line('M'+f(cx-5)+' 73 Q'+cx+' 75.6 '+f(cx+5)+' 73',M?2:2.6);
  // facial hair
  const mustache='M'+f(cx-7.5)+' 65.5 Q'+cx+' 60.5 '+f(cx+7.5)+' 65.5 Q'+cx+' 67.8 '+f(cx-7.5)+' 65.5 Z';
  if(fh==="stubble"){
    for(let i=0;i<70;i++){const x=cx+(rng()*2-1)*hw*0.88,y=60+rng()*(chin-58);
      const nx=(x-cx)/(hw*0.93),ny=(y-50)/(chin-50+1.5);
      if(nx*nx+ny*ny>1||(Math.abs(x-cx)<8.5&&y<75)||(y<64&&Math.abs(x-cx)<11))continue;
      s+=dot(x,y,0.85,K);}
  } else if(fh==="beard"){
    s+=ink('M'+f(L+1)+' 56 C'+f(L+1)+' 70 '+f(cx-hw*jaw)+' '+(chin+7)+' '+cx+' '+(chin+7)+' C'+f(cx+hw*jaw)+' '+(chin+7)+' '+f(R-1)+' 70 '+f(R-1)+' 56 L'+f(R-1)+' 60 C'+f(R-3)+' 73 '+f(cx+9)+' 77.5 '+cx+' 77.5 C'+f(cx-9)+' 77.5 '+f(L+3)+' 73 '+f(L+1)+' 60 Z',2);
    s+=ink(mustache,1.2);
    for(let i=0;i<12;i++)s+=dot(cx+(rng()*2-1)*hw*0.7,72+rng()*9,0.6,W);
  } else if(fh==="mustache"){
    s+=ink(mustache,1.2);
  } else if(fh==="goatee"){
    s+=ink('M'+f(cx-6)+' 74 Q'+cx+' 84 '+f(cx+6)+' 74 Q'+cx+' 77 '+f(cx-6)+' 74 Z',1.2);
  }
  // hair in front of the head
  const front={
    center:capTop+' L'+R+' 46 C'+R+' 34 '+f(cx+hw*0.6)+' 27 '+f(cx+2)+' 25 L'+cx+' 31 L'+f(cx-2)+' 25 C'+f(cx-hw*0.6)+' 27 '+L+' 34 '+L+' 46 Z',
    sweep:capTop+' L'+R+' 44 C'+f(cx+hw*0.6)+' 36 '+f(cx+hw*0.2)+' 33 '+f(cx-hw*0.3)+' 40 C'+f(cx-hw*0.6)+' 44 '+L+' 46 '+L+' '+mid+' Z',
    bangs:capTop+' L'+R+' 44 L'+f(R-2)+' 39 L'+f(L+2)+' 39 L'+L+' 44 Z',
  };
  if(style==="buzz"){s+=ink(capTop+hairline,2.4);for(let i=0;i<16;i++)s+=dot(cx+(rng()*2-1)*hw*0.62,24.5+rng()*5.5,0.6,W);}
  else if(style==="slick"){
    s+=ink('M'+L+' '+mid+' C'+L+' 34 '+f(cx-hw*0.9)+' 17 '+f(cx+2)+' 16 C'+f(cx+hw*0.95)+' 15 '+f(R+1)+' 30 '+R+' '+mid+' L'+R+' 44 C'+f(cx+hw*0.7)+' 34 '+f(cx+hw*0.3)+' 31 '+f(cx-3)+' 32 C'+f(cx-hw*0.45)+' 33.5 '+f(cx-hw*0.72)+' 36.5 '+L+' 44 Z',2.4);
    s+=wline('M'+f(cx-hw*0.55)+' 27 C'+f(cx-hw*0.2)+' 20.5 '+f(cx+hw*0.3)+' 19 '+f(cx+hw*0.65)+' 22.5',1.6);
  }
  else if(style==="curly"&&M){
    s+=ink(scallop(cx,40,hw+3,24,190,350,9,4)+hairline2,2.2);
    for(let i=0;i<6;i++){const a=(205+rng()*130)*Math.PI/180,x=cx+(hw-3)*Math.cos(a),y=39+15*Math.sin(a);s+=wline('M'+f(x)+' '+f(y)+' q3 -3 6 0',1.4);}
  }
  else if(style==="spiky"){
    const pts=[[L,mid],[L,40],[L+2,30],[L+6,33],[cx-9,21],[cx-4,29],[cx,17],[cx+4,28],[cx+9,20],[cx+12,30],[R-3,26],[R,40],[R,mid]];
    s+=ink('M'+pts.map(p=>f(p[0])+' '+f(p[1])).join(' L')+hairline,2.2);
  }
  else if(style==="long-center"||(style==="curly"&&!M&&chance(rng,0.5)))s+=ink(front.center,2.4);
  else if(style==="long-sweep"||style==="bob-sweep")s+=ink(front.sweep,2.4);
  else if(style==="long-bangs"||style==="bob-bangs"||(style==="curly"&&!M))s+=ink(front.bangs,2.4);
  else if(style==="ponytail")s+=ink(capTop+hairline2,2.4);
  else if(style==="pixie")s+=ink(scallop(cx,36,hw+1,18,185,355,10,3)+hairline2,2.2);
  if(style==="beanie"){
    s+=ink('M'+f(L-3)+' 44 C'+f(L-3)+' 24 '+f(cx-hw*0.9)+' 12 '+cx+' 12 C'+f(cx+hw*0.9)+' 12 '+f(R+3)+' 24 '+f(R+3)+' 44 Z',2.4);
    for(let x=L+2;x<=R-2;x+=4.5)s+=wline('M'+f(x)+' 18 L'+f(x)+' 40',1);
    s+='<rect x="'+f(L-5)+'" y="36" width="'+f(2*hw+10)+'" height="10" rx="2" fill="'+K+'"'+st(2)+'/>';
    for(let x=L-2;x<=R+2;x+=3.5)s+=wline('M'+f(x)+' 38.5 L'+f(x)+' 43.5',1);
  }
  if(glasses){
    s+='<rect x="'+f(cx-ex-8)+'" y="44.5" width="15" height="10.5" rx="2" fill="none"'+st(2.6)+'/>';
    s+='<rect x="'+f(cx+ex-7)+'" y="44.5" width="15" height="10.5" rx="2" fill="none"'+st(2.6)+'/>';
    s+=line('M'+f(cx-2)+' 49 L'+f(cx+2)+' 49',2.4)+line('M'+f(cx-ex-8)+' 49 L'+f(L-1)+' 48',2.2)+line('M'+f(cx+ex+8)+' 49 L'+f(R+1)+' 48',2.2);
  }
  if(earrings)s+=dot(L-3,61.5,1.7,K)+dot(R+3,61.5,1.7,K);
  if(scar)s+=line('M'+f(R-7)+' 55 l1.5 7',1.6);
  return '<svg viewBox="0 0 100 120" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" aria-hidden="true" style="display:block">'+s+'</svg>';
}

let S=null;
const SAVE_KEY="thecrew_save_v1";

function newGame(player){
  const seed=(Date.now()^Math.floor(Math.random()*1e9))>>>0;
  const roster=buildRoster(seed);
  S={
    seed, player, roster,
    crewIds:[], money:50000, heat:0, week:1, rep:0, jobSeq:0,
    tab:"hq", modal:null, filter:{spec:"",sort:"fee",q:""},
    jobs:[], log:[], finalDone:false, over:null, seenFinal:false,
    assign:[],
  };
  refreshJobs(true);
  logMsg("Dossier opened. You are "+player.n+", "+player.nat.name+" passport. Build a crew.","big");
  logMsg("Starting float: "+money(50000)+". Keep the heat down and everyone honest.","");
  save();
}

function crew(){return S.crewIds.map(byId).filter(Boolean);}
function byId(id){return S.roster.find(c=>c.id===id);}
function activeCrew(){return crew().filter(c=>c.status==="crew");}

/* ------------------------------ JOBS ---------------------------------- */
function makeJob(rng,tierBias){
  const type=pick(rng,JOBTYPES);
  const city=pick(rng,CITIES);
  const r=rng();
  const tier=clamp((tierBias||0)+(r<0.34?1:r<0.64?2:r<0.87?3:4),1,4);
  const need=clamp(1+tier+(chance(rng,0.4)?1:0)+(type.k==="break"||type.k==="extract"?1:0),1,6);
  const diff=clamp(34+tier*10+ri(rng,-6,6)+Math.floor(S.rep/14),34,96);
  const payBase=[0,42000,120000,300000,720000][tier];
  const payout=Math.round(payBase*(0.7+rng()*0.8)/1000)*1000;
  const heat=Math.round(type.heat*(0.8+tier*0.12));
  const specs=[];
  const pool=type.specs.slice();
  const nspec=clamp(1+Math.floor(tier/2),1,3);
  for(let i=0;i<nspec&&pool.length;i++){specs.push(pool.splice(Math.floor(rng()*pool.length),1)[0]);}
  const sealed=!!type.pass||(tier>=3&&chance(rng,0.5));
  const title=cap(pick(rng,type.verbs))+" "+pick(rng,type.nouns);
  S.jobSeq++;
  return {
    id:"J"+S.jobSeq,
    type:type.k, tier, city:city[0], country:city[1], region:city[2],
    need, diff, payout, heat, specs, sealed, title,
    expires:S.week+ri(rng,2,4),
  };
}
function refreshJobs(fill){
  const rng=mulberry32((S.seed^(S.week*2654435761))>>>0);
  S.jobs=S.jobs.filter(j=>j.final||j.expires>=S.week);
  let guard=0;
  while(S.jobs.filter(j=>!j.final).length<6&&guard++<30){S.jobs.push(makeJob(rng,0));}
  if(!S.jobs.some(j=>j.tier>=3)&&(fill||chance(rng,0.5))){S.jobs.push(makeJob(rng,2));}
  maybeUnlockFinal();
}
function maybeUnlockFinal(){
  if(S.rep>=100&&!S.finalDone&&!S.jobs.some(j=>j.final)){
    S.jobs.unshift({
      id:"JFINAL",final:true,type:"vault",tier:5,city:"Everywhere",country:"7 cities, one night",region:"Anglo",
      need:6,diff:94,payout:6000000,heat:60,specs:["safecracker","hacker","wheelman"],sealed:true,
      title:"The one that ends it",expires:9999,
    });
    if(!S.seenFinal){S.seenFinal=true;logMsg("A name has reached the right ears. The final score is on the board.","big",true);}
  }
}

/* --------------------------- JOB RESOLUTION --------------------------- */
function jobW(job){return JOBTYPE_BY_K[job.type].w;}
function passportOK(job,team){
  const local=team.some(c=>c.nat.region===job.region);
  if(!job.sealed)return {ok:true,local,bonus:local?6:0};
  const strong=team.some(c=>c.nat.tier<=2);
  const ok=local||strong;
  return {ok,local,bonus:(local?12:0)+(strong?4:0)-(ok?0:34)};
}
function memberEff(c,job){
  const w=jobW(job);
  let ws=0,tw=0;
  for(const a in w){ws+=w[a]*c.attrs[a];tw+=w[a];}
  let e=ws/tw;
  e*=(1+(c.exp-1)*0.11);
  if(job.specs.includes(c.spec))e+=14;
  return e;
}
function assessJob(job,team){
  const pp=passportOK(job,team);
  let power=0;
  if(team.length){team.forEach(c=>power+=memberEff(c,job));power/=team.length;}
  let sizeAdj=team.length>=job.need?6+Math.min(12,(team.length-job.need)*4):-22*(job.need-team.length);
  const heatPen=S.heat*0.24;
  const specHit=job.specs.filter(s=>team.some(c=>c.spec===s)).length;
  const eff=power+sizeAdj+pp.bonus+specHit*4-heatPen;
  const margin=eff-job.diff;
  const lo=margin-18,hi=margin+18;
  const pAbove=t=>clamp((hi-t)/(hi-lo),0,1);
  const pGood=pAbove(22),pFailish=pAbove(-4),pDis=pAbove(-22);
  return {
    power:Math.round(power),eff:Math.round(eff),margin:Math.round(margin),pp,specHit,
    pClean:Math.round(pGood*100),
    pOk:Math.round((pFailish-pGood)*100),
    pFail:Math.round((pDis-pFailish)*100),
    pDis:Math.round((1-pDis)*100),
  };
}
function executeJob(job,team){
  const rng=freshRng();
  const a=assessJob(job,team);
  let roll=ri(rng,-18,18);
  const hasMole=team.some(c=>c.mole);
  let leaked=false;
  if(hasMole&&chance(rng,0.55)){roll-=16;leaked=true;}
  const m=a.margin+roll;
  let tier; // 4 clean, 3 success, 2 messy, 1 botched, 0 disaster
  if(m>22)tier=4;else if(m>10)tier=3;else if(m>-4)tier=2;else if(m>-22)tier=1;else tier=0;
  const tierRep=job.final?100:[0,6,12,22,36][job.tier];
  let take=0,repGain=0,loyD=0,heatMul=0;
  const events=[];
  if(tier===4){take=Math.round(job.payout*1.08);repGain=tierRep;loyD=6;heatMul=0.5;}
  else if(tier===3){take=job.payout;repGain=Math.round(tierRep*0.85);loyD=3;heatMul=0.85;}
  else if(tier===2){take=Math.round(job.payout*0.55);repGain=Math.round(tierRep*0.4);loyD=-3;heatMul=1.25;}
  else if(tier===1){loyD=-7;heatMul=1.5;}
  else{loyD=-13;heatMul=1.9;}
  let cuts=0;
  team.forEach(c=>{cuts+=Math.round(take*c.cut);});
  const net=Math.max(0,take-cuts);
  S.money+=net;
  S.rep=clamp(S.rep+repGain,0,999);
  const heatGain=Math.round(job.heat*heatMul)+(leaked?12:0);
  S.heat=clamp(S.heat+heatGain,0,120);
  team.forEach(c=>{c.loyalty=clamp(c.loyalty+loyD+(tier>=3?2:0),0,100);});
  const verdictName=["DISASTER","BOTCHED","MESSY","SUCCESS","CLEAN"][tier];
  if(tier<=1){
    const nHit=tier===0?ri(rng,2,3):1;
    const shuffled=team.slice().sort(()=>rng()-0.5);
    for(let i=0;i<nHit&&i<shuffled.length;i++){
      const c=shuffled[i];
      if(tier===0&&chance(rng,0.5)){
        c.status="jailed";c.out=S.week+ri(rng,4,8);
        S.crewIds=S.crewIds.filter(id=>id!==c.id);
        events.push(c.first+" was taken at the scene. Held on remand until week "+c.out+".");
      } else {c.status="injured";c.out=S.week+2;events.push(c.first+" is hurt — out for two weeks.");}
    }
  }
  if(leaked)events.push("The job leaked before you moved. Someone at the table talked.");
  if(net>60000){
    team.forEach(c=>{
      if(c.status!=="crew")return;
      const risk=((100-c.loyalty)/100)*0.5+(c.greed/100)*0.25+(c.mole?0.3:0);
      if(chance(rng,risk*0.6)){
        const stolen=Math.round(net*(0.15+rng()*0.2));
        S.money=Math.max(0,S.money-stolen);
        c.status="gone";
        S.crewIds=S.crewIds.filter(id=>id!==c.id);
        events.push(c.first+" skimmed "+money(stolen)+" from the split and vanished.");
        S.heat=clamp(S.heat+6,0,120);
      }
    });
  }
  S.jobs=S.jobs.filter(j=>j!==job);
  const tone=tier>=3?"good":tier===2?"warn":"bad";
  logMsg(verdictName+" — "+job.title+" ("+job.city+"). "+(net>0?"Net "+money(net)+".":"No pay."),tone,true);
  if(job.final&&tier>=3){S.finalDone=true;S.over="win";}
  weekTick(rng);
  refreshJobs(false);
  save();
  return {tier,verdictName,take,cuts,net,heatGain,repGain,events,leaked,job,teamIds:team.map(t=>t.id)};
}

function weekTick(rng){
  S.week++;
  const ac=activeCrew();
  let up=0;ac.forEach(c=>up+=c.upkeep);
  if(up>0){
    if(S.money>=up)S.money-=up;
    else{S.money=0;ac.forEach(c=>c.loyalty=clamp(c.loyalty-9,0,100));logMsg("Couldn't make payroll ("+money(up)+"). Loyalty slipping.","bad");}
  }
  // a mole on the books leaks a little heat every week, unexplained
  const moles=ac.filter(c=>c.mole).length;
  if(moles)S.heat=clamp(S.heat+3*moles,0,120);
  S.roster.forEach(c=>{
    if(c.status==="injured"&&S.week>=c.out){c.status="crew";logMsg(c.first+" is back on the job.","good");}
    if(c.status==="jailed"&&S.week>=c.out){c.status="available";logMsg(c.first+" walked. Back on the market.","warn");}
  });
  S.heat=clamp(S.heat-5,0,120);
  if(S.heat>=100){
    const ac2=activeCrew();
    if(ac2.length){
      const n=Math.min(ac2.length,ri(rng,1,2));
      for(let i=0;i<n;i++){const c=ac2[i];c.status="jailed";c.out=S.week+ri(rng,4,7);S.crewIds=S.crewIds.filter(id=>id!==c.id);}
      logMsg("RAID. The heat boiled over — "+n+" of your crew taken.","bad",true);
    }
    S.money=Math.round(S.money*0.7);
    S.heat=58;
  }
  checkOver();
}
function checkOver(){
  if(S.over)return;
  if(crew().length>0)return;
  const fees=S.roster.filter(c=>c.status==="available").map(c=>c.fee);
  const minFee=fees.length?Math.min.apply(null,fees):Infinity;
  if(S.money<minFee){S.over="lose";logMsg("No crew, no float. The name means nothing now.","bad",true);}
}

/* ------------------------------- LOG ---------------------------------- */
function logMsg(t,tone,big){S.log.unshift({t,tone:tone||"",big:!!big,wk:S.week});if(S.log.length>80)S.log.pop();}

/* ------------------------------ SAVE ---------------------------------- */
function stripState(){const c=Object.assign({},S);delete c.modal;delete c.assign;return c;}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(stripState()));}catch(e){}}
function load(){try{const r=localStorage.getItem(SAVE_KEY);if(!r)return false;const d=JSON.parse(r);if(!d||!d.roster)return false;d.modal=null;d.assign=[];S=d;return true;}catch(e){return false;}}
function wipe(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}
function hasSave(){try{return !!localStorage.getItem(SAVE_KEY);}catch(e){return false;}}

/* ------------------------------ FORMAT -------------------------------- */
function money(n){n=Math.round(n);const neg=n<0;n=Math.abs(n);let s;
  if(n>=1e6)s="$"+(n/1e6).toFixed(n>=1e7?1:2).replace(/\.?0+$/,"")+"M";
  else if(n>=1e3)s="$"+Math.round(n/1000)+"K";
  else s="$"+n;
  return (neg?"−":"")+s;}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
function pips(n){let s='<span class="exp" title="'+EXP[n-1]+'">';for(let i=0;i<5;i++)s+='<i class="pip'+(i<n?" f":"")+'"></i>';return s+"</span>";}
function diffbar(d,hot){const filled=Math.round(d/100*8);let s='<span class="diffbar" aria-label="difficulty '+d+'">';for(let i=0;i<8;i++)s+='<i class="'+(i<filled?(hot?"h":"f"):"")+'"></i>';return s+"</span>";}

/* ------------------------------ RENDER -------------------------------- */
const root=document.getElementById("root");
let draft=null;
function render(){
  if(!S){root.innerHTML=screenTitle();bind();return;}
  if(S.over){root.innerHTML=screenOver();bind();return;}
  let body="";
  if(S.tab==="hq")body=tabHQ();
  else if(S.tab==="recruit")body=tabRecruit();
  else if(S.tab==="jobs")body=tabJobs();
  else if(S.tab==="crew")body=tabCrew();
  root.innerHTML=topbar()+'<div class="wrap">'+tabsBar()+body+footNote()+"</div>"+(S.modal?renderModal():"");
  bind();
}

function topbar(){
  const heatPct=clamp(S.heat,0,100);
  const hot=S.heat>=70;
  return '<div class="topbar"><div class="topbar-in">'
    +'<div class="brand">THE&nbsp;<b>CREW</b></div>'
    +'<div class="stat"><span class="l">Balance</span><span class="v num">'+money(S.money)+'</span></div>'
    +'<div class="stat"><span class="l">Week</span><span class="v num">'+String(S.week).padStart(2,"0")+'</span></div>'
    +'<div class="stat"><span class="l">Notoriety</span><span class="v num">'+S.rep+'</span></div>'
    +'<div class="heatwrap"><div class="stat" style="min-width:0"><span class="l">Heat '+Math.round(S.heat)+(S.heat>=100?" ⚠":"")+'</span>'
      +'<div class="heatbar'+(hot?" hot":"")+'"><i style="width:'+heatPct+'%"></i></div></div></div>'
    +'<div class="spacer"></div>'
    +'<button class="btn ghost sm" data-act="menu">Menu</button>'
    +'</div></div>';
}
function tabsBar(){
  const t=(k,l,b)=>'<button class="tab'+(S.tab===k?" on":"")+'" data-act="tab" data-k="'+k+'" role="tab">'+l+(b!=null?'<span class="b num">'+b+'</span>':"")+'</button>';
  return '<div class="tabs" role="tablist">'+t("hq","HQ")+t("recruit","Recruit")+t("jobs","Jobs",S.jobs.length)+t("crew","Crew",crew().length+"/"+CREW_CAP)+'</div>';
}

/* ---- HQ ---- */
function tabHQ(){
  const ac=activeCrew();
  const finalUp=S.jobs.some(j=>j.final);
  const repPct=clamp(S.rep,0,100);
  const status=[
    ["On the books",crew().length+" / "+CREW_CAP],
    ["Ready to work",ac.length],
    ["Injured",crew().filter(c=>c.status==="injured").length],
    ["Held by police",S.roster.filter(c=>c.status==="jailed").length],
    ["Open jobs",S.jobs.length],
    ["Weekly upkeep",money(ac.reduce((s,c)=>s+c.upkeep,0))],
  ];
  const left='<div class="panel"><div class="panel-h"><h2>Case Log</h2><span class="kicker">Week '+S.week+'</span></div>'
    +'<div class="panel-b"><div class="log">'+(S.log.length?S.log.map(l=>
      '<div class="logline '+l.tone+(l.big?" big":"")+'"><span class="wk">'+String(l.wk).padStart(2,"0")+'</span><span class="tx">'+esc(l.t)+'</span></div>'
    ).join(""):'<div class="empty">Nothing logged yet.</div>')+'</div></div></div>';
  const right='<div class="panel"><div class="panel-h"><h2>The Operation</h2><span class="kicker">'+esc(S.player.n)+' · '+S.player.nat.flag+'</span></div><div class="panel-b">'
    +'<div class="kv">'+status.map(r=>'<span class="k">'+r[0]+'</span><span class="num">'+r[1]+'</span>').join("")+'</div>'
    +'<hr class="rule">'
    +'<div class="kicker">Notoriety to the final score</div>'
    +'<div class="loy" style="height:9px;margin-top:6px"><i style="width:'+repPct+'%"></i></div>'
    +'<div class="mono" style="font-size:11px;color:var(--muted);margin-top:5px">'+(S.finalDone?"It's done. You are The Crew.":finalUp?"The final score is live on the Jobs board.":S.rep+" / 100 — pull bigger jobs to be noticed.")+'</div>'
    +'<hr class="rule">'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap">'
      +'<button class="btn" data-act="tab" data-k="jobs">Jobs board →</button>'
      +'<button class="btn ghost" data-act="tab" data-k="recruit">Recruit →</button>'
      +'<button class="btn ghost" data-act="laylow" title="Skip a week: −15 heat, upkeep still due">Lay low a week</button>'
    +'</div></div></div>';
  let alert="";
  if(S.heat>=80)alert='<div class="warnbox">HEAT CRITICAL ('+Math.round(S.heat)+'/100). At 100 there is a raid. Lay low, or take only clean, low-heat work.</div>';
  else if(ac.length===0)alert='<div class="warnbox">Nobody is ready to work. Recruit a crew before taking a job.</div>';
  return alert+'<div class="grid g-hq">'+left+right+'</div>';
}

/* ---- RECRUIT ---- */
function tabRecruit(){
  const f=S.filter;
  let list=S.roster.filter(c=>c.status==="available");
  if(f.q){const q=f.q.toLowerCase();list=list.filter(c=>c.n.toLowerCase().includes(q)||c.nat.name.toLowerCase().includes(q));}
  if(f.spec)list=list.filter(c=>c.spec===f.spec);
  const sorters={fee:(a,b)=>a.fee-b.fee,feeD:(a,b)=>b.fee-a.fee,exp:(a,b)=>b.exp-a.exp,
    power:(a,b)=>avg(b.attrs)-avg(a.attrs),name:(a,b)=>a.n.localeCompare(b.n)};
  list.sort(sorters[f.sort]||sorters.fee);
  const total=list.length;
  const shown=list.slice(0,30);
  const canHire=crew().length<CREW_CAP;
  const specOpts='<option value="">All specialties</option>'+SPECS.map(s=>'<option value="'+s.k+'"'+(f.spec===s.k?" selected":"")+'>'+s.l+'</option>').join("");
  const sortOpts=[["fee","Fee, low first"],["feeD","Fee, high first"],["exp","Experience"],["power","Raw skill"],["name","Name"]]
    .map(o=>'<option value="'+o[0]+'"'+(f.sort===o[0]?" selected":"")+'>'+o[1]+'</option>').join("");
  const bar='<div class="rosterbar">'
    +'<div class="field"><label for="q">Search</label><input type="text" id="q" value="'+esc(f.q)+'" placeholder="name or nationality" autocomplete="off"></div>'
    +'<div class="field"><label for="fspec">Specialty</label><select id="fspec">'+specOpts+'</select></div>'
    +'<div class="field"><label for="fsort">Sort</label><select id="fsort">'+sortOpts+'</select></div>'
    +'<span class="count">'+total+' on file · showing '+shown.length+'</span></div>';
  const cards=shown.map(c=>idCard(c,canHire)).join("");
  return '<div class="panel-h" style="border:0;padding:0 0 6px"><h2>The Rolodex</h2><span class="kicker">'+S.roster.length+' operatives · independent · worldwide</span></div>'
    +bar+(shown.length?'<div class="cards">'+cards+'</div>':'<div class="empty">No one matches. Loosen the filters.</div>');
}
function attrRow(c){
  return ATTRS.map(a=>'<div class="attr"><span class="k">'+ATTR_ABBR[a]+'</span><span class="bar"><i style="width:'+c.attrs[a]+'%"></i></span><span class="n num">'+c.attrs[a]+'</span></div>').join("");
}
function vetStamp(c){
  if(!c.vetted)return "";
  return c.vetFlag?'<span class="stampmark">Informant</span>':'<span class="stampmark ink">Vetted</span>';
}
function idCard(c,canHire){
  const sp=SPEC_BY_K[c.spec];
  return '<div class="id">'+vetStamp(c)
    +'<div class="top"><div class="av">'+avatar(c.avseed,c.gender)+'</div>'
    +'<div class="who"><div class="nm">'+esc(c.n)+'</div>'
      +'<div class="sub">'+c.nat.flag+' '+esc(c.nat.name)+' · '+(c.gender==="M"?"Male":"Female")+' <span class="tag pass" title="Passport tier '+c.nat.tier+' — '+TIER_WORD[c.nat.tier]+'">P'+c.nat.tier+'</span></div>'
      +'<div class="spec">'+sp.l+'</div>'
      +pips(c.exp)+'</div></div>'
    +'<div class="attrs">'+attrRow(c)+'</div>'
    +'<div class="foot"><span class="fee num">'+money(c.fee)+'</span>'
      +'<span style="display:flex;gap:6px"><button class="btn ghost sm" data-act="open-recruit" data-id="'+c.id+'">File</button>'
      +'<button class="btn sm" data-act="hire" data-id="'+c.id+'" '+(canHire&&S.money>=c.fee?"":"disabled")+'>Hire</button></span></div></div>';
}

/* ---- JOBS ---- */
function tabJobs(){
  const head='<div class="panel-h"><h2>Jobs Board</h2><span style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="kicker">Offers expire · Week '+S.week+'</span><button class="btn ghost sm" data-act="laylow">Lay low a week</button></span></div>';
  if(!S.jobs.length)return '<div class="panel">'+head+'<div class="empty">The board is quiet. Lay low a week and check again.</div></div>';
  const rows=S.jobs.slice().sort((a,b)=>(b.final?1:0)-(a.final?1:0)||a.tier-b.tier).map(j=>{
    const jt=JOBTYPE_BY_K[j.type];
    const specTags=j.specs.map(s=>'<span class="tag spec">'+SPEC_BY_K[s].l+'</span>').join(" ");
    const sealed=j.sealed?'<span class="tag pass">Sealed border · needs a passport</span>':"";
    const finalTag=j.final?'<span class="chip c-bad">Final score</span> ':"";
    const exp=j.final?"":" · expires wk "+j.expires;
    return '<div class="jobrow" data-act="open-job" data-id="'+j.id+'" role="button" tabindex="0">'
      +'<div class="code">'+(j.final?"—":"№"+j.id.slice(1).padStart(3,"0"))+'<br>'+diffbar(j.diff,j.heat>28)+'</div>'
      +'<div><div class="t">'+finalTag+esc(j.title)+'</div>'
        +'<div class="loc">'+esc(j.city)+' · '+esc(j.country)+' · crew of '+j.need+exp+'</div>'
        +'<div class="meta"><span class="tag">'+jt.l+'</span>'+specTags+' '+sealed+'</div></div>'
      +'<div class="pay num">'+money(j.payout)+'<div class="loc" style="text-align:right">+'+j.heat+' heat</div></div></div>';
  }).join("");
  return '<div class="panel">'+head+rows+'</div>';
}

/* ---- CREW ---- */
function tabCrew(){
  const cw=crew();
  if(!cw.length)return '<div class="empty">No crew yet. Head to Recruit and build one.</div>';
  const cards=cw.map(c=>{
    const sp=SPEC_BY_K[c.spec];

/* ------------------------------ ACTIONS ------------------------------- */
function bind(){
  const q=document.getElementById("q");
  if(q){q.oninput=()=>{S.filter.q=q.value;rerenderKeepingSearch();};}
  const fs=document.getElementById("fspec");if(fs)fs.onchange=()=>{S.filter.spec=fs.value;render();};
  const so=document.getElementById("fsort");if(so)so.onchange=()=>{S.filter.sort=so.value;render();};
  const pn=document.getElementById("pname");if(pn)pn.oninput=()=>{draft.name=pn.value;const btn=document.querySelector('[data-act=confirm-create]');if(btn)btn.disabled=!draft.name.trim();};
  const pnat=document.getElementById("pnat");if(pnat)pnat.onchange=()=>{draft.nat=NATS.find(n=>n.name===pnat.value)||draft.nat;};
}
function rerenderKeepingSearch(){
  const val=S.filter.q;render();
  const q=document.getElementById("q");if(q){q.focus();q.value=val;q.setSelectionRange(val.length,val.length);}
}
function showCreate(){root.innerHTML=screenCreate();bind();const pn=document.getElementById("pname");if(pn&&!draft.name)pn.focus();}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;
  const act=t.getAttribute("data-act"),id=t.getAttribute("data-id"),k=t.getAttribute("data-k"),v=t.getAttribute("data-v");
  switch(act){
    case "begin": draft=null; showCreate(); break;
    case "to-title": draft=null; render(); break;
    case "continue": if(load())render(); break;
    case "draft-gender": draft.gender=v; showCreate(); break;
    case "reroll-av": draft.avseed=ri(freshRng(),1,1e9); showCreate(); break;
    case "confirm-create": {
      const nm=(draft.name||"").trim(); if(!nm)break;
      newGame({n:nm,gender:draft.gender,nat:draft.nat,avseed:draft.avseed});
      draft=null; render(); break;
    }
    case "tab": S.tab=k; S.modal=null; render(); window.scrollTo(0,0); break;
    case "menu": S.modal={type:"menu"}; render(); break;
    case "scrim":
      if(e.target===t||t.classList.contains("x")||t.classList.contains("btn")){S.modal=null;S.assign=[];render();}
      break;
    case "open-recruit": S.modal={type:"recruit",id}; render(); break;
    case "open-job": S.assign=[]; S.modal={type:"job",id}; render(); break;
    case "assign":
      if(S.assign.includes(id))S.assign=S.assign.filter(x=>x!==id);else S.assign.push(id);
      render(); break;
    case "hire": hire(id); break;
    case "vet": vet(id); break;
    case "bonus": bonus(id); break;
    case "drop": drop(id); break;
    case "execute": doExecute(id); break;
    case "laylow": layLow(); break;
    case "newgame": wipe(); S=null; draft=null; render(); window.scrollTo(0,0); break;
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&S&&S.modal){S.modal=null;S.assign=[];render();return;}
  if(e.key==="Enter"||e.key===" "){
    const el=document.activeElement;
    if(!el||!el.closest)return;
    const row=el.closest(".jobrow,.assignline");
    if(row){e.preventDefault();row.click();}
  }
});

function hire(id){
  const c=byId(id);if(!c||c.status!=="available")return;
  if(crew().length>=CREW_CAP){note("Crew is full ("+CREW_CAP+"). Cut someone loose first.");return;}
  if(S.money<c.fee){note("Not enough for the fee.");return;}
  S.money-=c.fee;c.status="crew";S.crewIds.push(c.id);
  logMsg("Hired "+c.n+" — "+SPEC_BY_K[c.spec].l+", "+c.nat.name+" ("+money(c.fee)+").","");
  if(S.modal&&S.modal.type==="recruit")S.modal=null;
  save();render();
}
function vet(id){
  const c=byId(id);if(!c||c.vetted||S.money<VET_COST)return;
  S.money-=VET_COST;
  const sharpest=activeCrew().reduce((s,x)=>Math.max(s,x.attrs.brains),40);
  let flagged=c.mole;
  if(c.mole&&sharpest<55&&chance(freshRng(),0.35))flagged=false; // a dull crew misses one in three
  c.vetted=true;c.vetFlag=flagged;
  logMsg("Vetted "+c.n+" ("+money(VET_COST)+"). "+(flagged?"Flag raised — informant ties.":"Came back clean."),flagged?"warn":"");
  save();render();
}
function bonus(id){
  const c=byId(id);if(!c)return;const cost=bonusCostFor(c);
  if(S.money<cost){note("Can't cover the bonus.");return;}
  S.money-=cost;c.loyalty=clamp(c.loyalty+14,0,100);
  logMsg("Paid "+c.first+" a "+money(cost)+" bonus. Loyalty up.","good");save();render();
}
function drop(id){
  const c=byId(id);if(!c)return;
  c.status="available";c.loyalty=clamp(c.loyalty-6,0,100);
  S.crewIds=S.crewIds.filter(x=>x!==id);
  logMsg("Cut "+c.first+" loose.","");checkOver();save();render();
}
function doExecute(id){
  const j=S.jobs.find(x=>x.id===id);if(!j)return;
  const team=S.assign.map(byId).filter(c=>c&&c.status==="crew");
  if(!team.length)return;
  const res=executeJob(j,team);
  S.assign=[];
  S.modal={type:"result",data:res};
  render();
}
function layLow(){
  S.heat=clamp(S.heat-15,0,120);
  logMsg("Laid low for a week. Heat cooling.","");
  weekTick(freshRng());
  refreshJobs(false);
  S.modal=null;
  save();render();
}
function note(msg){logMsg(msg,"warn");render();}

/* ------------------------------ BOOT ---------------------------------- */
function start(){
  if(!S&&hasSave()){/* keep the title screen; the Continue button is there */}
  render();
}
(function boot(){
  try{
    const hot=window.claude&&window.claude.hot;
    if(hot&&typeof hot.snapshot==="function")hot.snapshot(()=>S?stripState():null);
    if(hot&&typeof hot.ready==="function"){hot.ready(function(data){if(data&&data.roster){S=data;S.modal=null;S.assign=[];}start();});return;}
    const data=hot&&hot.data;if(data&&data.roster){S=data;S.modal=null;S.assign=[];}
  }catch(e){}
  start();
})();
</script>
