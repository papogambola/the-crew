const INFO={
  title:{h:"The Crew",t:[
    "A game of global crime. <b>You are the criminals.</b> You command a crew of five — you and four places to fill from 5,000 files — and take the jobs clients post online, country by country.",
    "<b>New game</b> opens a dossier for you. <b>Continue</b> picks up the last game saved in this browser. Progress saves itself after every move.",
    "<b>Esc</b> or the three-line button opens the office: pause, sound, music, brightness, controls, and the door out. This <b>i</b> button explains whatever is on screen.",
    "The first time anyone plays, a tutorial walks through every screen. The second sitting opens with a short reminder. After that, both wait behind this button and in the controls book."]},
  create:{h:"Who are you",t:[
    "<b>Alias</b> — any name. <b>Sex</b> — male or female. <b>Nationality</b> — your passport, and the languages you speak. A strong passport (P1–P2) walks into more countries; a weak one needs a visa, or a forger on the crew.",
    "<b>Trade</b> — the thing you actually do. A job that wants it pays +14 on the reckoning, and a job that wants one nobody has costs somebody a week of learning it.",
    "<b>Your appearance</b> — under the picture, a slider for each part of the face: hair or hat, face shape, eyebrows, eyes, nose, mouth, ears, glasses, and facial hair or earrings, plus a scar. The picture redraws as you move them. <b>↻ Random</b> rolls every part at once. Three million faces for a man, four and a half million for a woman.",
    "<b>Your file</b> — five attributes, education, time in jail, time on the streets, knowledge, languages, anything you will not do, and a temperament — is rolled. <b>Another life</b> rolls it again. You are always the commander."]},
  crew:{h:"The Crew",t:[
    "Five places. You are the first. Each card: flag and passport tier, trade and rank (the pips), the five attributes — Muscle, Brains, Tech, Charm, Nerve — then education, jail, streets, knowledge, languages, and in red what this one will <b>not</b> do.",
    "<b>Loyalty</b> rises with success and bonuses, falls with failure and missed payroll. Under 35, after a big score, a member may skim the split and vanish. <b>Upkeep</b> is charged every week. <b>Cut loose</b> frees the place.",
    "Everyone on the crew goes on every job — if the border lets them in and the job doesn't trip one of their limits. A commander-type recruit takes your orders badly (−3 on a job you lead) but can run the crew on a job you can't get into.",
    "Loyalty also follows the name: a Nobody's crew loses a point a week, a Respected crew gains one. Every few weeks something happens between jobs — a death, a disappearance, a resignation, a rival crew buying drinks, an old face, a detective — and the least loyal member is usually the one it happens to. An <b>Enforcer</b> on the crew opens the hard answers.",
    "<b>They become a crew.</b> Everyone who goes on a job together builds a bond: +1 for a success or better, −1 for a botched or disastrous one, from −3 to +3. The reckoning counts it — up to ±6 — as <i>They have worked together</i> or <i>Bad blood</i>, and the cards say who gets on with whom. Keeping a team together is worth something; so is breaking one up after a bad run.",
    "<b>Bonus</b> (three weeks' upkeep, $4K at least) buys +14 loyalty and three weeks <b>paid up</b>: +2 on every reckoning that member goes on, deaf to another crew's drinks, never the one who skims the split, and not the one trouble picks on. One at a time; the card says until when. It also settles any grumbling about small jobs.",
    "<b>Small money.</b> Every member has a price: a cut under two weeks of their own upkeep is a job done for you, not for them. The job file says who calls a posting small money before you take it. Three small jobs in a row and they <b>grumble</b> (−5 loyalty a job, −2 on the reckoning, a chip on the card); five, and they may walk out at the split — back on the roster, wanting more. A proper score, or a bonus, resets the count.",
    "<b>Places.</b> Four to start. A <b>Respected</b> name opens places six and seven. <b>Other crews.</b> From week 104 (two years), Feared, with seven on your crew, you can found a second crew — a commander-type and four soldiers out of your seven, named after its commander — that takes a job of its own each week without you, from the same board, with its own reckoning and report; its take, heat and ranking are yours, and so is its payroll. A third crew at three years, a fourth at four, no more. Send and recall people between crews from their cards; dissolve a crew and its people come back as far as your places allow."]},
  notice:{h:"A milestone",t:[
    "Announced once, in the middle of the screen, when the game reaches it: the two places a Respected name opens; each year mark (weeks 104, 156, 208) when another crew is within reach, with what is still missing; and the moment a second, third or fourth crew can actually be founded, with a button straight into founding it.",
    "<b>Later</b> closes it; nothing is lost — the Crew tab keeps the places and the founding panel, and the case log keeps the record."]},
  found:{h:"Founding a crew",t:[
    "Pick the commander — a commander by nature, whose own command score runs the job — and four soldiers from your ready crew. They leave your places; fill them again from the roster.",
    "The new crew is named after its commander, takes one job a week from the same board, and never faces a twist: you are not there to decide, so its report runs straight through."]},
  trip:{h:"A recruitment trip",t:[
    "You are in their country, in a room with them, and they have not said yes. This plays out the way a job does — line by line, at whatever speed the − and + set — and it takes <b>a week</b> off the calendar whatever happens at the end of it.",
    "<b>The fee is only paid if they sign.</b> Turn back, or get turned down, and the money stays with you. The week does not.",
    "<b>If the meeting stops, it is not a money problem.</b> Four or five answers, and the one that works is the one you brought the means for: an <b>enforcer</b> in the room, a <b>face</b> to do the talking, a <b>forger</b> for papers, a <b>fixer</b> to find out who moved them, the local <b>language</b>, your own <b>Charm</b> or <b>Nerve</b>, or a <b>record</b> long enough to answer with. Walking out is always there, costs nothing but the week, and they will not take another meeting for a couple of months.",
    "The last screen says <b>how hard that file was</b>, as a percentage. Greed, years inside, a temperament, a hard border and low numbers in the things that matter all push it up — and so does being a <b>Legend</b>, who is difficult for the opposite reason."]},
  revenge:{h:"An unhappy client",t:[
    "A client who lost money on a job that went wrong does not simply post again next week. Some of them take it personally, and there are two ways to take it personally. The first is to <b>tell everybody</b>: that client stops posting to you for twenty or thirty weeks and takes one or two of the people they drink with, the postings they already had come off the board, and the Jobs board says who and until when. The second is to <b>come and find you</b>, which is this.",
    "<b>Every answer carries the odds it goes your way</b>, and what you have decides which are open: an <b>enforcer</b> to meet them at the door or collect what was taken, a <b>fixer</b> to find out who carried it or what was said to the police, a <b>safe house</b> to leave behind, or the money to pay back what they lost. Paying is the only answer that is certain, and it is the only one that also lifts the ban.",
    "Four ways it comes: three cars outside the safe house at four in the morning; the count short because somebody walked into the flat in daylight; a detective outside the wrong café two days running; or somebody buying drinks for your least loyal member. Which one depends on what you have and who you have.",
    "It is the bill for a job that went wrong, and it is paid whichever answer you give."]},
  loose:{h:"Somebody outside the crew",t:[
    "Anybody who leaves alive is carrying you around with them: which countries, which clients, which nights. The box says how many jobs they worked with you and <b>the odds they eventually talk</b> — and a talker is not an event, it is a slow leak. Every few weeks they put something else in the detective's file and a little more heat on the board, for as long as they are alive.",
    "<b>Every answer has its number on it.</b> Let them go, and the percentage stands. Buy the silence, and it drops — and it will be asked for again. A word from your <b>enforcer</b> costs nothing but a little heat and some of the crew's good opinion. Your <b>fixer</b> can put them four borders away with a job and a flat, which is the cleanest thing on the list that leaves them breathing.",
    "<b>The rest end them</b>, and each says how likely it is to go cleanly and what happens when it does not. A <b>cleaner</b> makes it an accident — the most expensive and the quietest. A stranger you never meet is cheaper and worse. Your enforcer tonight is cheapest, loudest, and half the time somebody sees; when it goes wrong it is your enforcer the police take.",
    "It works. A body does not talk, and the board notices what happens to people who leave your crew — <b>ranking +2</b> when it is clean. It also costs: <b>heat</b>, the detective's file, and <b>loyalty across everybody still with you</b>, because they can all count. Nobody is safe working for somebody who does that, and they know it."]},
  roster:{h:"The Roster",t:[
    "5,000 files. <b>Search</b> by name, country, language or knowledge. Filter by <b>trade</b>, <b>role</b> and <b>nationality</b>; sort by fee, experience, raw skill or name. Show 30 more at the bottom.",
    "<b>Hover a trade</b> (or MUS, BRN, TCH, CHM, NRV) for a brief: what it is, what it leans on, what it comes with, and which jobs want it. On a phone, tap it.",
    "<b>Temperament.</b> Two files in three carry a trait, and a trait is a fact about working with them, not a number on a bar. <b>Steady</b> never loses faith after a bad night. <b>Hothead</b> is worth +3 and costs +4 heat. <b>Careful</b> takes 4 heat off any job they work. <b>Quick study</b> learns at double speed; a <b>Mentor</b> is +2 and teaches everyone else half again as fast. <b>Mercenary</b> is +2 and takes 3% more. <b>Lucky</b> adds 4 to the night's roll, <b>Jinx</b> takes 3 off it and pulls twists towards the crew. A <b>Ghost</b> is never the one the police get their hands on.",
    "<b>Fee</b> is paid once, and only if they say yes. <b>Cut</b> is their share of every score. <b>Upkeep</b> is weekly. <b>File</b> opens the whole profile; <b>Go and ask</b> needs an open place, the fee — and a name they will sign with. Rookies, Operators and Professionals sign with anyone; a <b>Veteran</b> wants a Known crew, a <b>Legend</b> a Respected one. A file that won't sign yet says so under the fee.",
    "<b>Nobody joins a crew because a fee was paid.</b> Go and ask and you fly to wherever they live and put it to them in person: a week on the calendar, a live feed like a job, and their answer at the end of it. The trip is where the fee is spent — turn back, or get turned down, and the money stays in your pocket while the week does not.",
    "<b>Most of them are difficult, and the cheap ones are the worst.</b> How hard a file is to recruit is on the trip's last screen as a percentage. It goes up for greed, for a name nobody has heard of, for years inside, for a temperament, for a country with a hard border — and for low numbers in the things that matter, because desperate people make a mess of a meeting. A <b>Legend</b> is difficult for the opposite reason: they test you.",
    "<b>When a meeting goes wrong it is not about money.</b> They don't show; the number moves; they bring somebody; a car sits outside for forty minutes; they want to know what happened to the last person in the job; three men and a shut door. What answers it is what you brought — an <b>enforcer</b> in the room, a <b>face</b> to do the talking, a <b>forger</b> for papers, a <b>fixer</b> to find out who moved them, the <b>language</b>, your own <b>Charm</b> or <b>Nerve</b>, and the record of what your crew has actually done. Walking out is always on the list. Somebody who turns you down will not take another meeting for a couple of months.",
    "About one file in fourteen is a <b>police informant</b>: they leak jobs and leak heat. <b>Vet</b> a file for $6K — a dull crew misses one in three, so a clean stamp is a guess with money behind it."]},
  jobs:{h:"Jobs",t:[
    "Postings from clients, by country. Each row: category, the trades and knowledge it wants — <b>green</b> if someone on your crew has it, <b>red</b> if nobody does — city, country and language, crew needed, fee, heat, when it expires, and a chip: <b>Good fit</b>, <b>Risky</b>, <b>Long odds</b>, or how many of your crew can even go.",
    "<b>Clients remember.</b> Botch a job badly enough and the client may stop posting to you for twenty or thirty weeks, take one or two other clients with them, and pull the postings they already had. The board says who will not deal with you and until when — and whether one of them is not finished with you.",
    "<b>Sort</b> the board by best fit, crew needed, trade wanted, fee, heat, difficulty, country or expiry. <b>Your crew</b> sits above the board — passport, trade, attributes, languages, knowledge, limits — so a posting can be judged without leaving; hide it if you know them by heart. Keys <b>1–4</b> jump between the tabs.",
    "The bars are difficulty; red means high heat. Open a posting to see the reckoning before you commit.",
    "<b>Lay low a week</b>: −15 heat, upkeep still due, postings refresh, ranking −1. Clients post to a name: a Nobody or Small time crew sees tier 1–2 postings, a Known crew tier 3, Respected and up tier 4 — and the fee is scaled to the name, from −20% to +50%. A job is <b>weeks</b>, not a week: a tier-1 errand is gone by Friday, a tier-4 room holds the crew for three. Before you take one you can <b>case</b> it — a week and a fee, for a real gain on the reckoning and the risk that the posting is gone when you look up.",
    "On some jobs the live report stops mid-way: something has gone wrong and six options wait for your call. One sets the crew free — the one the crew you brought can actually do — so read the file before you take the job.",
    "Once you have founded other crews, every job file lists them under <b>Other crews</b> with their own reckoning and a <b>Send</b> button: a crew's job does not spend your week, one job per crew per week, and their reports are filed on the Log like yours."]},
  log:{h:"The Log",t:[
    "<b>Job recaps</b>: every job you have run stays on file. Open one for the full report — the minute-by-minute, the verdict, the split, why the ranking moved, what they learned, who came back.",
    "<b>The case log</b>, week by week — every hire, job, injury, arrest, leak and betrayal. The <b>Week</b> dropdown narrows both the recaps and the log to one week; \"All weeks\" shows everything.",
    "The operation panel counts places, who is ready, who is hurt or held, weekly upkeep and open postings. Lay low from here too.",
    "<b>The competition and the law</b> name the two things that used to be numbers. Once you are Small time, a rival outfit appears, run by somebody with a name: they work the same board, take the best posting left most weeks, and their standing climbs when they do. When their standing passes your ranking they start buying your crew drinks. You can buy a name inside their operation, or send your enforcer — which works about two times in three, and is loud when it doesn't. A <b>detective</b> opens a file once the heat has been up or your name has grown; the file thickens with heat and thins when you lie low, pay a desk, or get raided — and past 50 the raid comes at heat 90 instead of 100, past 75 at 80.",
    "<b>The record</b> counts everything the crew has done — jobs, verdicts, money earned and paid out, the biggest score, countries worked, twists called right, who was hurt, taken or lost, and the current run of jobs without a scratch. Under it, <b>Next</b> shows the three nearest marks on the wall: eighteen career goals from the first job to the final score, each paying ranking, money or both when it lands, and announced in a box when it does.",
    "<b>Standing arrangements</b> is where money goes. Three people on a weekly retainer — a <b>lawyer</b> (anyone taken is held half as long), a <b>doctor</b> (a wound is one week, not two), a <b>fixer</b> (two more postings a week, and one written for the crew you actually have) — paid out of the same payroll as the crew, so a missed week loses them. A <b>safe house</b> is bought outright, in three moves: heat falls 7, then 9, then 11 a week, and the best one keeps most of the float through a raid. And a <b>desk</b> can be paid to lose a file: heat −20, priced by how hot you are.",
    rankLadderText()]},
  job:{h:"A job file",t:[
    "<b>The job</b>, at the top: what the client actually wants, in four sentences — the work itself, how well the thing is held, what the posting asks for, and the terms. It is written from the posting, so it reads the same every time you open it.",
    "<b>The brief</b>: who posted it, and the country — language, money, politics, religion, terrain, and the border rule. Chips: the category, trades and knowledge wanted, and tags such as <i>on the water</i> or <i>at night</i> that trip a crew member's limits.",
    "<b>Who goes</b>: every crew member, ✓ or ✗, with the reason — the border against their passport, a conviction at a strict border, a limit the job hits, an injury. A forger on the crew gets weak passports through.",
    "<b>Bench</b> anyone you would rather keep out of it, yourself included. A benched member takes no cut of the score, learns nothing from the job, and cannot be hurt, arrested or killed on it — and the crew that does go is smaller, which the reckoning counts. Bench yourself and a commander-type runs it in your place. <b>Send everyone</b> puts them all back.",
    "<b>The reckoning</b>: every factor with its number — crew size, who commands, language, a local national, knowledge (double if studied), trades, heat — then the odds. <b>Take the job</b>: the whole eligible crew goes and a week passes. <b>Walk away</b> costs nothing."]},
  recruit:{h:"A personnel file",t:[
    "Everything on record: role, trade, experience, education, knowledge, languages, time in jail, time on the streets, passport, sex, what they will not do, and the price — fee once, a cut of each score, upkeep weekly.",
    "<b>Vet</b> reads the file for informant ties against your crew's instincts. <b>Hire</b> needs an open place and the fee."]},
  result:{h:"The job report",t:[
    "First the job as it happened, minute by minute — who got in and who didn't, who did the talking, what each trade bought, what went right and what went wrong, the exit, the split. Skip to the end if you'd rather.",
    "Then the verdict: <b>Clean</b>, <b>Success</b>, <b>Messy</b>, <b>Botched</b> or <b>Disaster</b> — crew power against difficulty, plus the roll. Gross is the fee earned, cuts go to the crew, the net is yours.",
    "<b>Ranking — why</b> lists every reason the crew's ranking moved: up for a clean or successful job (more for a bigger job, a little more if nobody was hurt), down for messy, botched or disastrous work, a leak, an arrest, or a member walking with the money. <b>What they learned</b>: everyone who went gains experience; ranks are earned at 40, 110, 220 and 400 xp, and good work adds a point to the attributes the job leaned on. If the job wanted a trade nobody on the crew has, somebody spends the week before learning enough of it to stand in — and if the job comes off, that week is worth a point of brains, marked <i>stood in as</i>. A job that doesn't come off teaches them nothing.",
    "<b>Fallout</b>: injuries (out two weeks), arrests (held for weeks, then back on the roster), leaks (an informant talked), and betrayals (someone skimmed the split and vanished).",
    "<b>The twist.</b> On some jobs — one good fit in four, one long shot in twelve — the report stops: something has gone wrong and six options wait for your call. Only one sets the crew free, and it is always the one the crew you brought can actually do: a wheelman can hot-wire the second car, a forger can re-paper the manifest, a hacker can kill the alarm. A call your crew can make but not best costs time and money; a call nobody can make costs blood, a place, and ranking. Walking away is always on the list — it keeps everyone and loses the score. The report then shows what you chose, what would have set you free, and why."]},
  event:{h:"Between jobs",t:[
    "Every few weeks something happens that is not a job: a death on holiday, a member gone without a word, one who wants out, one who has joined another crew and is buying yours drinks, an old face who walked with your money, a detective asking around. The types rotate, so each comes round before any repeats.",
    "Every option has a price and a consequence — money, loyalty, a place, heat — and some are a gamble the text is honest about. Options that need an <b>Enforcer</b> on the crew are greyed without one. The decision cannot be clicked away; the crew remembers it, and the case log keeps it."]},
  office:{h:"The office",t:[
    "Pause and settings, drawn as the boss's office. The <b>radio</b>: SOUND is the master switch, MUSIC switches the track, VOLUME turns both — click the knob's left to lower, right to raise. An hour of suspense loops under the office and every board; each job report brings its own track, and the verdict another. The <b>monitor</b>: brightness. The <b>paper</b>: language. The <b>book</b>: controls and how the game works. The <b>clipboard</b> on the wall: the tutorial whenever you want it — the whole thing, the short reminder, or any one card. The <b>file cabinet</b>: write the game out as a code you can keep anywhere, or read one back in — a save lives in one browser only, and this is how it leaves. The <b>door</b>: back to the game, or burn the file. Your <b>hat</b>: your own file.",
    "Settings are kept apart from the game and survive a new game. Esc closes the office."]},
  over:{h:"The end",t:[
    "You win by taking <b>the last score</b>, and it is not one job. It is three operations against the Committee, in order — read the ledger, open the floor below the floor, then move all of it out — and it appears only when the crew is ready for it: a name at the very top of the board, a career of jobs behind you, five in the field, and a war chest to fund it out of your own float. A stage that goes wrong does not end you; it costs you weeks while they move things, and then the door is worth trying again. You lose when there is no crew left and no money to hire one.",
    "<b>Run it again</b> starts a new file; settings stay."]},
};
function infoHTML(){
  const it=INFO[infoContext()]||INFO.title;
  const tut=(S&&!S.over)?'<button class="btn ghost sm" data-act="tut-remind">The short reminder</button><button class="btn ghost sm" data-act="tut-start">Run the tutorial</button>':'';
  return '<div class="above"><div class="scrim" data-act="info-close"><div class="modal" role="dialog" aria-modal="true" style="max-width:600px">'
    +'<div class="modal-h"><div><div class="kicker">What is this screen</div><h2 style="font-size:20px;margin-top:4px">'+esc(it.h)+'</h2></div><button class="x" data-act="info-close" aria-label="Close">✕</button></div>'
    +'<div class="modal-b info-b">'+it.t.map(p=>'<p>'+p+'</p>').join("")
    +'<hr class="rule"><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">'+tut+'<button class="btn sm" data-act="info-close">Got it</button></div></div></div></div></div>';
}

/* ------------------------------ GRUDGES ------------------------------- */
// A client who lost money on a botched job does not simply post again next week. Some of them
// take it personally, and there are two ways to take it personally: tell everybody, or come and
// find you. Both are visible on the board before anything happens, because a consequence nobody
// can see coming is just a dice roll with extra steps.
const GRUDGE={
  pBotched:0.34, pDisaster:0.62, pMessy:0.05,   // the chance a client takes it badly
  pBlood:0.42,                                   // of those, how many come for you rather than talk
  banWeeks:[16,34],                              // how long the word lasts
  banFriends:[1,2],                              // and how many other clients they take with them
  revengeIn:[2,6],                               // weeks until they turn up
};
function grudges(){return S.grudges||(S.grudges=[]);}
function clientBanned(name){return grudges().some(g=>g.c===name&&S.week<g.until);}
function bannedClients(){const seen={};grudges().forEach(g=>{if(S.week<g.until)seen[g.c]=Math.max(seen[g.c]||0,g.until);});
  return Object.keys(seen).map(c=>({c,until:seen[c]})).sort((a,b)=>b.until-a.until);}
function openClients(){const free=CLIENTS.filter(c=>!clientBanned(c));return free.length?free:CLIENTS;}
// The word goes round: this client, and the ones they drink with, stop posting to you.
function grudgeAdd(client,rng,job,verdict){
  if(!client||client==="the Committee")return null;
  const blood=chance(rng,GRUDGE.pBlood+(verdict===0?0.18:0));
  const until=S.week+ri(rng,GRUDGE.banWeeks[0],GRUDGE.banWeeks[1]);
  const g={c:client,since:S.week,until,kind:blood?"blood":"word",
    job:job?job.title:"",noun:job?("the "+jobNoun(job)):"",country:job?job.country:"",fee:job?job.payout:0,
    revengeAt:blood?S.week+ri(rng,GRUDGE.revengeIn[0],GRUDGE.revengeIn[1]):0,done:false};
  grudges().push(g);
  // they take some of the people they drink with
  const friends=CLIENTS.filter(c=>c!==client&&c!=="the Committee"&&!clientBanned(c));
  const n=ri(rng,GRUDGE.banFriends[0],GRUDGE.banFriends[1]);
  const took=[];
  for(let i=0;i<n&&friends.length;i++){
    const f=friends.splice(Math.floor(rng()*friends.length),1)[0];
    grudges().push({c:f,since:S.week,until:S.week+ri(rng,8,20),kind:"word",job:"",country:"",fee:0,revengeAt:0,done:true,via:client});
    took.push(f);
  }
  // and the postings they already had on the board come down
  const pulled=S.jobs.filter(j=>!j.final&&(j.client===client||took.indexOf(j.client)>=0)).length;
  S.jobs=S.jobs.filter(j=>j.final||(j.client!==client&&took.indexOf(j.client)<0));
  logMsg(cap(client)+" is not taking it well. "+cap(client)+" will not post to you until week "+until
    +(took.length?", and has had a word with "+listAnd(took)+".":".")
    +(pulled?" "+pulled+" posting"+(pulled>1?"s":"")+" came off the board.":"")
    +(blood?" And that is not the end of it.":""),"bad",true);
  return g;
}

    {t:"Have {E} find the man buying the drinks",req:"enforcer",p:0.7,ok:"The drinks stop. So does the asking.",
     bad:"{E} finds him. So does everybody else in the bar, and one of them talks to the police.",eff:{},badEff:{heat:18,det:10}},
    {t:"Let them make their offer and see who takes it",p:0.5,ok:"Nobody takes it. You know something about your crew that you did not know on Monday.",
     bad:"Somebody takes it.",eff:{loyAll:3},badEff:{turn:true}},
   ]},
];
function revengeCost(g){return Math.max(40000,Math.round((g.fee||120000)*0.55/1000)*1000);}
function revengeMake(g,rng){
  const enf=field().find(c=>!c.isPlayer&&c.tech==="enforcer");
  const fix=field().find(c=>!c.isPlayer&&c.tech==="fixer");
  const low=recruits().filter(c=>c.status==="crew").sort((a,b)=>a.loyalty-b.loyalty)[0];
  let pool=REVENGE.slice();
  if(!low)pool=pool.filter(r=>r.k!=="buy");
  if(!field().length)pool=pool.filter(r=>r.k==="police"||r.k==="rob");
  const R=pick(rng,pool.length?pool:REVENGE);
  const v={C:cap(g.c),c:g.c,J:g.noun||"the job",E:enf?enf.first:"your enforcer",F:fix?fix.first:"your fixer",L:low?low.first:"somebody on the crew"};
  return {k:R.k,c:g.c,h:fill2(R.h,v),s:fill2(R.s,v),cost:revengeCost(g),lowId:low?low.id:null,
    opts:R.opts.map(o=>({t:fill2(o.t,v),req:o.req||null,pay:!!o.pay,p:o.p})),v,week:S.week};
}
function revengeCan(o){
  if(!o.req)return true;
  return field().some(c=>!c.isPlayer&&c.tech===o.req);
}
function revengeResolve(i){
  const V=S.revenge;if(!V)return;
  const R=REVENGE.find(x=>x.k===V.k);const o=R&&R.opts[i];
  if(!o)return;
  if(o.req&&!revengeCan(o))return;
  if(o.pay&&S.money<V.cost)return;
  const rng=freshRng();
  const lines=[];
  if(o.pay){S.money=Math.max(0,S.money-V.cost);lines.push(money(V.cost)+" paid.");}
  const good=chance(rng,o.p);
  const e=(good?o.eff:o.badEff)||{};
  lines.push(fill2(good?o.ok:(o.bad||o.ok),V.v));
  const rc=field().filter(c=>!c.isPlayer);
  if(e.money)S.money=Math.max(0,S.money+e.money);
  // They are taking back what they lost, not a percentage of everything you own. A slice of the
  // float alone means a rich crew is robbed of millions over a job that paid two hundred thousand.
  if(e.robbed){
    const cap=Math.max(25000,Math.round((V.cost||80000)*2));
    const lost=Math.min(Math.round(S.money*e.robbed),cap);
    S.money=Math.max(0,S.money-lost);lines.push(money(lost)+" gone.");
  }
  if(e.heat)S.heat=clamp(S.heat+e.heat,0,120);
  if(e.det&&detective())detective().file=clamp(detective().file+e.det,0,100);
  if(e.house&&S.safehouse){S.safehouse=Math.max(0,S.safehouse-1);lines.push("The safe house is burned; you are a step down the list.");}
  if(e.loyAll)rc.forEach(c=>{c.loyalty=clamp(c.loyalty+e.loyAll,0,100);c._touched=true;});
  if(e.loyOne&&V.lowId){const m=byId(V.lowId);if(m){m.loyalty=clamp(m.loyalty+e.loyOne,0,100);m._touched=true;}}
  if(e.hurtEnforcer){const en=field().find(c=>!c.isPlayer&&c.tech==="enforcer");
    if(en){en.status="injured";en.out=S.week+(hasRetainer("doctor")?1:2);en._touched=true;leaveCrew(en);lines.push(en.first+" is out until week "+en.out+".");}}
  if(e.jailEnforcer){const en=field().find(c=>!c.isPlayer&&c.tech==="enforcer");
    if(en){en.status="jailed";en.out=S.week+ri(rng,2,4);en._touched=true;leaveCrew(en);lines.push(en.first+" is held until week "+en.out+".");}}
  if(e.hurt){const pool=rc.filter(c=>c.status==="crew").sort(()=>rng()-0.5);
    for(let n=0;n<e.hurt&&n<pool.length;n++){const c=pool[n];c.status="injured";c.out=S.week+(hasRetainer("doctor")?1:2);c._touched=true;leaveCrew(c);lines.push(c.first+" is hurt — out until week "+c.out+".");}}
  if(e.turn&&V.lowId){const m=byId(V.lowId);
    if(m&&m.status==="crew"){m.status="gone";m._touched=true;leaveCrew(m);looseAdd(m,"poach");lines.push(m.first+" is working for "+cap(V.c)+" now.");}}
  if(e.weeks){for(let n=0;n<e.weeks&&!S.over;n++)weekTick(freshRng());refreshJobs(false);}
  // paying them off, or settling it, lifts the word as well
  if(e.clear){
    const g=grudges().find(x=>x.c===V.c&&S.week<x.until);
    if(g){g.until=S.week;lines.push(cap(V.c)+" will take your calls again.");}
  }
  const g2=grudges().find(x=>x.c===V.c&&x.kind==="blood");
  if(g2){g2.done=true;g2.revengeAt=0;}
  logMsg(cap(V.c)+" — "+V.h+". "+lines.join(" "),good?"warn":"bad",true);
  S.revenge=null;S.modal=null;
  checkOver();save();render();
}
function modalRevenge(){
  const V=S.revenge;if(!V)return "";
  const h='<div class="modal-h"><div><div class="kicker" style="color:var(--stamp)">'+esc(cap(V.c))+' · week '+S.week+'</div>'
    +'<h2 style="font-size:22px;margin-top:4px">'+esc(V.h)+'</h2></div></div>';
  const body='<p class="mono" style="font-size:12.5px;line-height:1.7;margin:0 0 4px">'+esc(V.s)+'</p>';
  const letters="ABCDEF";
  const list='<div class="twist-opts" style="margin-top:12px">'+V.opts.map((o,i)=>{
    const can=(!o.req||revengeCan(o))&&(!o.pay||S.money>=V.cost);
    const why=o.req&&!revengeCan(o)?"You have no "+o.req+" on the crew."
      :o.pay&&S.money<V.cost?"The float will not carry "+money(V.cost)+"."
      :Math.round(o.p*100)+"% it goes the way you want it to.";
    return '<button class="twist-opt" data-act="revenge" data-i="'+i+'" '+(can?"":"disabled")+'>'
      +'<b>'+letters[i]+'</b> <span>'+esc(o.t)+(o.pay?' — '+money(V.cost):'')
      +'<br><span class="mono" style="font-size:11.5px;color:var(--muted)">'+esc(why)+'</span></span></button>';
  }).join("")+'</div>';
  const foot='<div class="sel-help" style="margin-top:10px">This is the bill for a job that went wrong. It is paid whichever answer you give.</div>';
  return modalWrap(h+'<div class="modal-b">'+body+list+foot+'</div>');
}
// Grudges age out, and the ones that are not finished with you turn up.
function grudgeTick(rng){
  if(!S.grudges||!S.grudges.length)return;
  S.grudges=S.grudges.filter(g=>S.week<g.until||(g.kind==="blood"&&!g.done));
  if(S.revenge)return;
  const due=S.grudges.find(g=>g.kind==="blood"&&!g.done&&g.revengeAt&&S.week>=g.revengeAt);
  if(due)S.revenge=revengeMake(due,rng);
}

/* ------------------------- WHAT THEY KNOW ----------------------------- */
// Somebody who has worked with you is not the same as a stranger once they are outside. They
// know which countries, which clients, which nights. The question gets asked every time, and
// answering it wrong is expensive in both directions — a talker costs you the police, and a
// body costs you the crew's opinion of what you are like to work for.
const LOOSE_WHY={
  quit:{l:"walked out over the money",risk:0.26,cold:0},
  betray:{l:"took a cut of the score and vanished",risk:0.46,cold:6},
  poach:{l:"left for another crew",risk:0.38,cold:4},
  resign:{l:"asked to be let out",risk:0.18,cold:0},
  dropped:{l:"was cut loose",risk:0.20,cold:0},
};
// How much of you they are carrying around.
function looseKnows(c){return clamp(1+(c.ranWith||0)+((c.exp||1)>=4?1:0),1,14);}
function looseRisk(c,why){
  const W=LOOSE_WHY[why]||LOOSE_WHY.dropped;
  let p=W.risk+looseKnows(c)*0.018+((c.jail||0)>=6?0.06:0)+(c.greed>70?0.06:0)+(c.mole?0.2:0);
  p-=(c.loyalty||0)/420;
  if(hasTrait(c,"ghost"))p-=0.1;
  if(hasTrait(c,"hothead"))p+=0.08;
  return clamp(p,0.04,0.9);
}
// Every way of dealing with it, with the odds written on it.
function looseOptions(c,why){
  const risk=looseRisk(c,why);
  const kn=looseKnows(c);
  const enf=field().find(x=>!x.isPlayer&&x.tech==="enforcer");
  const cln=field().find(x=>!x.isPlayer&&x.tech==="cleaner");
  const fix=field().find(x=>!x.isPlayer&&x.tech==="fixer");
  const hush=Math.max(8000,Math.round(kn*9000*(1+S.rep/500)/1000)*1000);
  const contract=Math.max(25000,Math.round(kn*22000*(1+S.rep/400)/1000)*1000);
  const o=[];
  o.push({k:"let",t:"Let them go",
    d:"Nothing is done. "+Math.round(risk*100)+"% they say something, to somebody, eventually — and what they say goes in a file.",
    talk:risk,money:0,heat:0,loy:0,kill:false});
  o.push({k:"pay",t:"Buy the silence — "+money(hush),
    d:"Money for nothing, every time it is asked for. Drops it to "+Math.round(risk*0.28*100)+"%. They are alive, and they know you pay.",
    talk:risk*0.28,money:-hush,heat:0,loy:0,kill:false,need:S.money>=hush});
  o.push({k:"word",t:"A word from "+(enf?enf.first:"an enforcer"),
    d:enf?"No money. Drops it to "+Math.round(risk*0.42*100)+"%, costs a little heat, and the crew hears about it.":"You have no enforcer. Nobody on the crew can have that conversation.",
    talk:risk*0.42,money:0,heat:5,loy:-3,kill:false,req:"enforcer",need:!!enf});
  o.push({k:"accident",t:(cln?cln.first+" makes it an accident":"An accident — needs a cleaner"),
    d:cln?"The most expensive answer and the quietest. "+Math.round(0.86*100)+"% it reads as an accident. If it does not: +28 heat and a detective who now has a body. Costs "+money(contract)+" and the crew's opinion.":"Nobody on the crew is a Cleaner. This is not something you improvise.",
    talk:0,money:-contract,heat:4,badHeat:28,clean:0.86,loy:-11,kill:true,req:"cleaner",need:!!cln&&S.money>=contract},
  );
  o.push({k:"contract",t:"Pay somebody outside the crew — "+money(Math.round(contract*0.7/1000)*1000),
    d:"You never meet them and they never meet you. "+Math.round(0.62*100)+"% it is clean. If it is not, it is a stranger explaining to the police where the money came from: +34 heat and the file jumps.",
    talk:0.08,money:-Math.round(contract*0.7/1000)*1000,heat:8,badHeat:34,clean:0.62,loy:-9,kill:true,need:S.money>=Math.round(contract*0.7/1000)*1000});
  o.push({k:"tonight",t:(enf?enf.first+" does it tonight":"Do it tonight — needs an enforcer"),
    d:enf?"Cheap, fast and loud. "+Math.round(0.5*100)+"% it goes without a witness. If it does not, "+enf.first+" is the one the police take, and it is +40 heat.":"You have no enforcer, and this is not a thing you do yourself.",
    talk:0,money:-8000,heat:14,badHeat:40,clean:0.50,loy:-14,kill:true,req:"enforcer",need:!!enf,risker:enf?enf.id:null});
  if(fix)o.push({k:"fixerout",t:fix.first+" arranges for them to be somewhere else",
    d:"Not a body — a reason to be in another country for a long time. "+money(Math.round(hush*1.5/1000)*1000)+", drops it to "+Math.round(risk*0.12*100)+"%, and nobody on the crew has to think about it.",
    talk:risk*0.12,money:-Math.round(hush*1.5/1000)*1000,heat:0,loy:2,kill:false,need:S.money>=Math.round(hush*1.5/1000)*1000});
  return o;
}
// Queue it rather than interrupt — a departure can happen inside a job report or a week tick.
function looseAdd(c,why){
  if(!c||c.isPlayer)return;
  S.loose=S.loose||[];
  if(S.loose.some(l=>l.id===c.id))return;
  S.loose.push({id:c.id,why:why,week:S.week});
}
function looseResolve(i){
  const L=S.loose&&S.loose[0];if(!L)return;
  const c=byId(L.id);
  if(!c){S.loose.shift();S.modal=null;save();render();return;}
  const opts=looseOptions(c,L.why);
  const o=opts[i];
  if(!o||o.need===false){return;}
  const rng=freshRng();
  const lines=[];
  if(o.money)S.money=Math.max(0,S.money+o.money);
  let heat=o.heat||0;
  if(o.kill){
    const clean=chance(rng,o.clean);
    c.status="dead";c._touched=true;leaveCrew(c);
    stats().lost=(stats().lost||0)+1;
    if(clean){
      lines.push(c.first+" is not a problem any more, and nothing about it points anywhere.");
      S.rep=clamp(S.rep+2,0,999);
      lines.push("Ranking +2. People who leave your crew are careful about how they do it now.");
    } else {
      heat+=o.badHeat||20;
      lines.push("It does not go the way it was supposed to. There is a witness, or a phone, or a camera nobody accounted for.");
      if(detective()){detective().file=clamp(detective().file+14,0,100);lines.push(detective().name+" has a body to put next to your alias. The file jumps.");}
      if(o.risker&&chance(rng,0.4)){
        const e=byId(o.risker);
        if(e&&e.status==="crew"){e.status="jailed";e.out=S.week+ri(rng,5,10);leaveCrew(e);e._touched=true;
          lines.push(e.first+" is taken for it. Held until week "+e.out+".");}
      }
      S.rep=Math.max(0,S.rep-3);
      lines.push("Ranking −3. A mess is not the same as a reputation.");
    }
  } else {
    c.talks=o.talk;c._touched=true;
    if(o.k==="let")lines.push(c.first+" walks away with everything they know, and you find out what that is worth later.");
    else if(o.k==="pay")lines.push(c.first+" takes the money. It will be asked for again.");
    else if(o.k==="word")lines.push("The conversation happens somewhere quiet. "+c.first+" understands it.");
    else if(o.k==="fixerout")lines.push(c.first+" has a job, a flat and a reason to be four borders away by the weekend.");
  }
  if(heat)S.heat=clamp(S.heat+heat,0,120);
  // the crew always finds out what kind of employer you are
  if(o.loy){
    const rest=field().filter(x=>!x.isPlayer);
    rest.forEach(x=>{x.loyalty=clamp(x.loyalty+o.loy,0,100);x._touched=true;});
    if(rest.length)lines.push("The crew hears about it. Loyalty "+(o.loy>0?"+":"")+o.loy+" across "+rest.length+".");
  }
  logMsg((o.kill?"Dealt with "+c.first+". ":c.first+": "+o.t+". ")+lines.join(" "),o.kill?"bad":"warn",true);
  S.loose.shift();
  S.modal=null;
  checkOver();save();render();
}
function modalLoose(){
  const L=S.loose&&S.loose[0];if(!L)return "";
  const c=byId(L.id);if(!c)return "";
  const W=LOOSE_WHY[L.why]||LOOSE_WHY.dropped;
  const opts=looseOptions(c,L.why);
  const risk=Math.round(looseRisk(c,L.why)*100);
  const kn=looseKnows(c);
  const h='<div class="modal-h"><div><div class="kicker" style="color:var(--stamp)">Outside the crew · week '+S.week+'</div>'
    +'<h2 style="font-size:22px;margin-top:4px">'+esc(c.n)+' '+esc(W.l)+'</h2></div></div>';
  const who='<div class="mono" style="font-size:12.5px;line-height:1.8">'
    +esc(c.first)+' worked <b>'+kn+'</b> job'+(kn===1?'':'s')+' with this crew'
    +((c.jail||0)?', has '+c.jail+' years inside already':'')
    +', and left on '+c.loyalty+' loyalty. '
    +'<span style="color:var(--stamp)">Left alone, the odds they eventually say something to somebody who writes it down: <b>'+risk+'%</b>.</span> '
    +'A talker does not cost you a week — it raises what the police have, quietly, for as long as they are alive.</div>';
  const list='<div class="twist-opts" style="margin-top:12px">'+opts.map((o,i)=>{
    const dis=o.need===false;
    return '<button class="twist-opt'+(o.kill?' kill':'')+'" data-act="loose" data-i="'+i+'" '+(dis?'disabled':'')+'>'
      +'<b>'+(o.kill?'✕':'·')+'</b> <span><b>'+esc(o.t)+'</b><br><span class="mono" style="font-size:11.5px;color:var(--muted);line-height:1.6">'+esc(o.d)+'</span></span></button>';
  }).join("")+'</div>';
  const foot='<div class="sel-help" style="margin-top:10px">The crew finds out what you decide. So, eventually, does everybody else.</div>';
  return modalWrap(h+'<div class="modal-b">'+who+list+foot+'</div>');
}
// A talker is a slow leak, not an event: every few weeks they put something else in the file.
function looseTick(rng){
  const talkers=S.roster.filter(c=>c.talks&&c.status!=="crew"&&c.status!=="dead");
  talkers.forEach(c=>{
    if(!chance(rng,c.talks*0.08))return;
    S.heat=clamp(S.heat+ri(rng,2,5),0,120);
    if(detective())detective().file=clamp(detective().file+ri(rng,3,7),0,100);
    logMsg(c.first+" has been talking. Somebody wrote it down.","bad");
    c.talks=Math.max(0,c.talks-0.08);c._touched=true;
  });
}

/* --------------------------- RECRUITMENT ------------------------------ */
// Hiring used to be a button and a fee. Nobody joins a crew because a fee was paid: you fly to
// wherever they live, you sit down with them, and they decide. It takes a week, it plays out
// like a job, and it can go wrong — most often with the people who are cheapest to want.
const TRIP_OUT=[
  "You fly out on the Monday, alone, with a bag that would not interest anybody.",
  "Two flights and a border. You are in {city} before the office you invented has opened.",
  "You go by train where you can. Trains ask fewer questions than airports.",
  "A cheap seat, an aisle, a book you do not read. {city} by evening.",
  "You take the long way — a connection through somewhere nobody would fly to on purpose.",
];
const TRIP_LOOK=[
  "The address in the file is a shop that closed. The number behind it still rings.",
  "{F} picks the place: a bar with two doors and a view of both.",
  "You wait an hour in a café opposite before you go anywhere near it.",
  "The meeting is in a kitchen, at the back of a restaurant that is not open.",
  "A hotel lobby with a piano nobody plays, which is exactly why it is used.",
  "A car park on the fourth level. {F} is already there when you arrive.",
  "A bench by the water. {F} brings coffee for two and a newspaper for nobody.",
  "The back room of a garage. Somebody is working on an engine and does not look up.",
];
// One beat that is about the country and nowhere else, built from what the file on it says.
function tripPlaceLine(co,rng){
  if(!co)return "";
  const bits=[];
  if(co.gate===2)bits.push("The visa took a week and a story. The man at the desk in {city} reads it twice and stamps it anyway.");
  else if(co.gate===1)bits.push("The border is a queue and a question about business. Business is a conference nobody can check.");
  else bits.push("You are through the border in ninety seconds. Nobody asks a thing.");
  if(co.auth)bits.push("There is a camera on every corner in {city} and a second one watching the first.");
  if(co.terrain.indexOf("megacity")>=0)bits.push("Nine million people, which is the best cover there is.");
  if(co.terrain.indexOf("islands")>=0)bits.push("A ferry, then a smaller ferry. Nobody comes to {city} by accident.");
  if(co.terrain.indexOf("mountains")>=0)bits.push("The road climbs for two hours. There is exactly one way in and the same way out.");
  if(co.terrain.indexOf("desert")>=0)bits.push("Forty degrees at four in the afternoon. Nobody meets anybody before dark.");
  if(co.eco===1)bits.push("Everything costs nothing and everybody wants paying in {cur}.");
  else if(co.eco===3)bits.push("The coffee alone costs what a week does elsewhere. {cur}, and they keep the receipt.");
  bits.push("You change money badly, twice, so that nobody has a record of one large exchange.");
  return pick(rng,bits);
}
const TRIP_READ=[
  "{F} is smaller than the file says, and reads you before you have sat down.",
  "{F} arrives eleven minutes late, which is a message, and you take it.",
  "{F} shakes your hand like somebody who has been asked for one too many favours.",

// How much trouble this file is to recruit. Both ends of the roster are difficult, for opposite
// reasons: the desperate and the unreliable make a mess of it, and a Legend makes you earn it.
function tripTrouble(c){
  const a=(c.attrs.muscle+c.attrs.brains+c.attrs.tech+c.attrs.charm+c.attrs.nerve)/5;
  let t=0.10;
  if(c.greed>65)t+=0.18;                       // wants more than the file says
  if(c.mole)t+=0.16;                           // has somebody else to answer to

function tripSnagFor(c,rng){
  const kit=tripKit(c);
  const pool=TRIP_SNAGS.filter(s=>{
    if(s.k==="test")return c.exp>=4;                       // only the good ones test you
    if(s.k==="drunk")return c.exp<=3||c.loyalty<50;
    if(s.k==="setup")return c.greed>60||c.mole||(c.jail||0)>=6;
    if(s.k==="police")return kit.co&&(kit.co.gate>=1||kit.co.auth);
    return true;
  });
  return pick(rng,pool.length?pool:TRIP_SNAGS);
}
// An option the crew you brought can actually take. Same rule as a job twist: one of them fits.
function tripCan(o,c,kit){
  if(!o.req)return true;
  if(o.req.tech){const k=o.req.tech;const have=k==="face"?kit.face:k==="enforcer"?kit.enforcer:k==="fixer"?kit.fixer:k==="forger"?kit.forger:null;if(!have)return false;}
  if(o.req.attr&&(kit[o.req.attr]||0)<o.req.min)return false;   // the kit is the one source for this
  if(o.req.lang&&!kit.speaks)return false;
  if(o.req.jobs&&kit.jobs<o.req.jobs)return false;
  return true;
}

function finishTrip(P,choiceIdx,T){

  const out=[];
  // The fee and the incidentals are two different things. The fee is only paid if they sign;
  // the incidentals — a second hotel, a bribe, a bar tab, an envelope taken off you — are paid
  // whatever happens. Keeping them in one number charged the full fee on a no.
  let sign=true,fee=c.fee,extra=0,heat=0,extraWeeks=0,loy=0,cutAdd=0,det=0,hurtYou=false,lostFee=false;
  const W=P.snag?TRIP_SNAGS.find(s=>s.k===P.snag.k):null;

        if(e.money)extra-=e.money;                       // e.money is a negative delta on your float
        if(e.moneyMul)fee=Math.round(fee*(1+e.moneyMul));
        if(e.moneyAll){lostFee=true;}
        if(e.heat)heat+=e.heat;
        if(e.det)det+=e.det;
        if(e.weeks)extraWeeks+=e.weeks;
        if(e.loy)loy+=e.loy;
        if(e.cut)cutAdd+=e.cut;

        if(e.attrHit){ATTRS.forEach(a=>{c.attrs[a]=clamp(c.attrs[a]-ri(rng,2,7),8,98);});c._touched=true;
          out.push({t:"— —",x:"The file was generous. Whatever "+c.first+" was eight years ago, this is what is left of it.",tone:"warn"});}

          Object.assign({},v,{T:o.req&&o.req.tech?TECH_BY_K[o.req.tech].l:"",A:o.req&&o.req.attr?o.req.attr:""})),tone:"bad"});
        heat+=4;

  }

  let spend=Math.max(0,Math.round((sign?fee:0)+extra+(lostFee?c.fee:0)));
  if(sign&&S.money<spend){
    sign=false;spend=Math.max(0,Math.round(extra+(lostFee?c.fee:0)));
    out.push({t:"— —",x:"And then the money is not there. You sit in a bar in "+P.city+" explaining to "+c.first+" that the float will not carry it, which is a conversation neither of you will mention again.",tone:"bad"});
  }
  if(recruits().length>=crewSeats()&&sign){
    sign=false;spend=Math.max(0,Math.round(extra+(lostFee?c.fee:0)));
    out.push({t:"— —",x:"There is no place free on the crew any more. You flew out for somebody you cannot put anywhere.",tone:"bad"});
  }
  S.money=Math.max(0,S.money-spend);
  if(heat)S.heat=clamp(S.heat+heat,0,120);
  if(det&&detective())detective().file=clamp(detective().file+det,0,100);
  countryHeatAdd(P.country,heat?6:2);
  if(hurtYou)out.push({t:"— —",x:"You are home with eleven stitches and a story you will not be telling.",tone:"bad"});
  if(sign){
    c.status="crew";c._touched=true;S.crewIds.push(c.id);
    if(cutAdd)c.cut=Math.round((c.cut+cutAdd)*1000)/1000;
    if(loy)c.loyalty=clamp(c.loyalty+loy,0,100);
    stats().hired++;
    out.push({t:"— —",x:fill2(pick(rng,TRIP_SIGN),v),tone:"good",at:"deal",who:"*",act:"paper"});
    out.push({t:"— —",x:fill2(pick(rng,TRIP_HOME),v),tone:"good",at:"deal",who:"*",act:"walk"});
    logMsg("Hired "+c.n+" — "+TECH_BY_K[c.tech].l+", "+c.nat+", "+(c.role==="commander"?"commander":"soldier")+" ("+money(spend)+", one week in "+P.city+").","");
  } else {
    // a refusal is not permanent, but it is not this month either
    c.coolUntil=S.week+ri(rng,6,14);c._touched=true;
    out.push({t:"— —",x:fill2(pick(rng,TRIP_NO),v),tone:"bad",at:"deal",who:"*",act:"down"});
    logMsg("No deal with "+c.n+" in "+P.city+". A week gone"+(spend?", "+money(spend)+" with it":"")+".","warn");
  }

  S.pendingTrip=null;

    out.forEach(l=>T.narrative.push(l));

// Hiring is a trip, not a button: you go to them, and they decide. Always.
// Why this file cannot be approached right now, or "" if it can.
function hireWhy(c){
  if(!c||c.status!=="available")return "Not on the roster.";
  if(!canSign(c))return signWhy(c);
  if(recruits().length>=crewSeats())return "Every place is taken — cut someone loose first.";
  if(c.coolUntil&&S.week<c.coolUntil)return c.first+" turned you down. Not before week "+c.coolUntil+".";
  if(S.money<c.fee)return "Not enough money — the fee is "+money(c.fee)+".";
  return "";
}

function hire(id){
  const c=byId(id);if(!c||c.status!=="available")return;

  if(recruits().length>=crewSeats()){note("Every place is taken. Cut someone loose first"+(crewSeats()<CREW_MAX_SEATS?", or earn a "+seatRankName()+" name for two more":"")+".");return;}
  if(!canSign(c)){note(signWhy(c));return;}
  if(S.money<c.fee){note("Not enough for the fee.");return;}

document.addEventListener("mouseout",e=>{const el=e.target&&e.target.closest?e.target.closest(".tip"):null;if(el)tipHide();});
document.addEventListener("focusin",e=>{const el=e.target&&e.target.closest?e.target.closest(".tip"):null;if(el)tipShow(el);});
document.addEventListener("focusout",()=>{tipHide();});
document.addEventListener("scroll",()=>{tipHide();},true);
// hovering a posting lights its country on the map
document.addEventListener("mouseover",e=>{
  const row=e.target&&e.target.closest?e.target.closest(".jobrow"):null;if(!row)return;
  document.querySelectorAll(".mk.hov").forEach(m=>m.classList.remove("hov"));
  const cn=(row.getAttribute("data-country")||"").replace(/"/g,"");
  const m=cn?document.querySelector('.mk[data-cn="'+cn+'"]'):null;if(m)m.classList.add("hov");
});
document.addEventListener("mouseout",e=>{
  const row=e.target&&e.target.closest?e.target.closest(".jobrow"):null;if(!row)return;
  document.querySelectorAll(".mk.hov").forEach(m=>m.classList.remove("hov"));
});
let STORAGE_OK=true;
try{localStorage.setItem("thecrew_probe","1");localStorage.removeItem("thecrew_probe");}catch(e){STORAGE_OK=false;}
// A phone or a tablet is not a smaller PC, so it is not given a smaller game. It is turned
// away at the door, before any setting is read and before a sitting is counted.
//
// The test is deliberately reluctant: a false "no" locks a paying PC player out of the game,
// while a phone that slips through merely sees a page it cannot play. So it names devices it
// is sure of and lets everything else in. A Windows or ChromeOS laptop with a touch screen is
// a PC and reports itself as one; an iPad is the one device that lies, claiming to be a Mac,
// and is caught by the touch points no Mac has.
function mobileDevice(){
  try{
    const uad=navigator.userAgentData;
    if(uad&&typeof uad.mobile==="boolean"&&uad.mobile)return true;
    const ua=navigator.userAgent||"";
    if(/Android|iPhone|iPod|iPad|Windows Phone|IEMobile|BlackBerry|BB10|webOS|Opera Mini|Silk|Kindle/i.test(ua))return true;
    if(/Macintosh/i.test(ua)&&(navigator.maxTouchPoints||0)>2)return true;  // iPadOS 13+
  }catch(e){}
  return false;
}
function pcOnlyDoor(){
  const r=document.getElementById("root");
  if(!r)return;
  // The game has no viewport tag on purpose — there is no phone layout to lay out. The door is
  // the one thing a phone must be able to read, so it gets one, and it is let out of the PC
  // minimum width the board is held to.
  try{
    const m=document.createElement("meta");
    m.name="viewport";m.content="width=device-width,initial-scale=1";
    document.head.appendChild(m);
    document.body.style.minWidth="0";
  }catch(e){}
  r.innerHTML='<div class="pconly">'
    +'<div class="k">The Crew</div>'
    +'<h1>Not on a phone</h1>'
    +'<div class="rule"></div>'
    +'<p>This is a game for a computer. It is a board you read across — a world map beside a '
    +'list of postings, a crew above them, a job running minute by minute — and that does not '
    +'fold into a hand.</p>'
    +'<p>Open it on a desktop or a laptop.</p>'
    +'<div class="b">'+BUILD+'</div>'
    +'</div>';
}

(function boot(){
  if(mobileDevice()){pcOnlyDoor();return;}
  loadSettings();applySettings();
  // a play is a sitting: a return after half an hour away counts as the next one
  try{const now=Date.now();if(!SET.lastSeen||now-SET.lastSeen>PLAY_GAP_MS)SET.plays=(SET.plays||0)+1;SET.lastSeen=now;saveSettings();}catch(e){}
  try{
    const hot=window.claude&&window.claude.hot;
    if(hot&&typeof hot.snapshot==="function")hot.snapshot(()=>S?packState():null);
    if(hot&&typeof hot.ready==="function"){hot.ready(function(){render();});return;}
  }catch(e){}
  render();
})();
</script>
