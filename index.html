function tickLine(l){return '<div class="tk '+(l.tone||"")+(l.twist?" tk-twist":"")+'"><span class="tk-t">'+esc(l.t)+'</span><span class="tk-x">'+esc(l.x)+'</span></div>';}
let TICK=null;
function tickerArm(){
  if(TICK){clearInterval(TICK);TICK=null;}
  if(!S||!S.modal||S.modal.type!=="result")return;
  const d=S.modal.data;
  // a re-render shows the latest line, not the first: the marker sits right above the decision
  if(!d.done){const el0=document.getElementById("ticker");if(el0)el0.scrollTop=el0.scrollHeight;}
  if(d.done||d.awaiting)return;
  let reduced=false;
  try{reduced=!!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);}catch(e){}
  if(reduced){tickerFinish();return;}
  TICK=setInterval(()=>{
    if(!S||!S.modal||S.modal.type!=="result"||S.modal.data!==d){clearInterval(TICK);TICK=null;return;}
    d.revealed++;
    const line=d.narrative[d.revealed-1];
    const el=document.getElementById("ticker");
    if(el&&line){el.insertAdjacentHTML("beforeend",tickLine(line));el.scrollTop=el.scrollHeight;}
    sfx("tick");
    if(line&&line.twist&&!d.resolved){clearInterval(TICK);TICK=null;d.awaiting=true;sfx("bad");render();return;}
    if(d.revealed>=d.narrative.length){clearInterval(TICK);TICK=null;tickerFinish();}
  },SPEEDS[speedIdx()][0]);
}
function tickerFinish(){
  if(TICK){clearInterval(TICK);TICK=null;}
  const d=S&&S.modal&&S.modal.type==="result"?S.modal.data:null;if(!d)return;
  if(d.twist&&!d.resolved){
    // skip only as far as the decision
    const i=d.narrative.findIndex(l=>l.twist);
    d.revealed=i>=0?i+1:d.narrative.length;d.awaiting=true;render();return;
  }
  d.revealed=d.narrative.length;d.done=true;d.awaiting=false;
  sfx(d.tier>=3?"good":d.tier===2?"stamp":"bad");
  const vt=verdictTrack(d.tier);musicPlay(vt[0],vt[1],true);
  render();
}
function twistChoose(i){
  const d=S&&S.modal&&S.modal.type==="result"?S.modal.data:null;
  if(!d||!S.pendingJob||d.resolved)return;
  finishJob(S.pendingJob,i,d);
  sfx("click");
  render();
}

function applySettings(){

  const dim=hex=>{const n=parseInt(hex.slice(1),16);return "#"+[(n>>16)&255,(n>>8)&255,n&255].map(v=>Math.round(v*b).toString(16).padStart(2,"0")).join("");};

}

// A handful of synthesised sounds; no files. Nothing plays until the first click.
let AC=null;
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
  if(AC&&AC.state==="suspended")AC.resume();
  return AC;
}
function tone(freq,dur,type,gain,when,slide){
  const c=ac();if(!c)return;
  const t0=c.currentTime+(when||0);
  const o=c.createOscillator(),g=c.createGain();
  o.type=type||"sine";o.frequency.setValueAtTime(freq,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,gain*SET.volume),t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+dur+0.05);
}
function sfx(name){
  if(!SET.sound||SET.volume<=0)return;
  try{
    switch(name){
      case "click": tone(1200,0.03,"square",0.05,0); break;
      case "tick": tone(900,0.02,"square",0.018,0); break;
      case "open": tone(440,0.08,"triangle",0.08,0); tone(660,0.08,"triangle",0.06,0.06); break;
      case "coin": tone(880,0.07,"sine",0.12,0); tone(1320,0.12,"sine",0.12,0.07); break;
      case "stamp": tone(140,0.12,"sine",0.5,0,60); tone(90,0.2,"triangle",0.3,0.02,40); break;
      case "good": sfx("stamp"); tone(660,0.1,"sine",0.1,0.15); tone(990,0.18,"sine",0.1,0.25); break;
      case "bad": sfx("stamp"); tone(220,0.25,"sawtooth",0.08,0.15,110); break;
      case "siren": for(let i=0;i<3;i++){tone(700,0.18,"square",0.06,i*0.36);tone(500,0.18,"square",0.06,i*0.36+0.18);} break;
    }
  }catch(e){}
}

// Fourteen tracks from the creator's compilation: eleven rotate under the live job report,
// three score the verdict. Quiet between jobs. Browsers allow audio only after the first
// click, and the radio in the office reports its state.
const TRACKS={
  report:["music/report-01.mp3","music/report-02.mp3","music/report-03.mp3","music/report-04.mp3","music/report-05.mp3","music/report-06.mp3","music/report-07.mp3","music/report-08.mp3","music/report-09.mp3","music/report-10.mp3","music/report-11.mp3"],
  result:{good:"music/result-success.mp3",messy:"music/result-messy.mp3",bad:"music/result-disaster.mp3"},
  ambient:"music/ambient.mp3",   // the hour of suspense under everything that is not a job report or a verdict, on a loop
};
function musicAmbient(){if(musicWant&&musicWant.src===TRACKS.ambient){musicSync();return;}musicPlay(TRACKS.ambient,"Suspense — the hour under the office, on a loop",true);}
// The report and the verdict bring their own track; every other screen runs under the loop.
function musicRoute(){if(!(S&&S.modal&&S.modal.type==="result"))musicAmbient();}
const SPEEDS=[[4500,"Slowest"],[3000,"Slow"],[2000,"Normal"],[1300,"Fast"],[800,"Fastest"]];
function speedIdx(){return clamp(Math.round(SET.speed==null?2:SET.speed),0,SPEEDS.length-1);}
let MUSIC=null,userGestured=false,musicState="idle",musicNote="",musicWant=null,musicSrc=null;
const musicBlobTried={};
function musicEl(){
  if(!MUSIC){
    try{
      MUSIC=new Audio();MUSIC.preload="auto";
      MUSIC.addEventListener("playing",()=>{musicState="playing";musicNote="";refreshRadio();});
      MUSIC.addEventListener("pause",()=>{if(musicState==="playing"){musicState="stopped";refreshRadio();}});
      MUSIC.addEventListener("ended",()=>{if(musicWant&&!musicWant.loop){musicState="stopped";refreshRadio();}});
      MUSIC.addEventListener("error",()=>{musicLoadFallback();});
    }catch(e){MUSIC=null;musicState="blocked";musicNote="this browser has no audio";}
  }
  return MUSIC;
}
// If a track won't load as a plain source, fetch it and play it from memory.
function musicLoadFallback(){
  const src=musicSrc;if(!src)return;
  const fail=why=>{musicState="blocked";musicNote="the track could not be loaded here ("+why+")";refreshRadio();};
  if(musicBlobTried[src]){fail("media blocked");return;}
  musicBlobTried[src]=true;
  try{
    fetch(src).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.blob();})
      .then(b=>{if(musicSrc!==src)return;MUSIC.src=URL.createObjectURL(b);musicSync();})
      .catch(e=>fail(e&&e.message?e.message:"fetch failed"));
  }catch(e){fail("fetch unavailable");}
}
function musicPlay(src,label,loop){musicWant={src,label,loop:!!loop};musicSync();}
function musicStop(){musicWant=null;musicSync();}
function verdictTrack(tier){return tier>=3?[TRACKS.result.good,"the verdict — success"]:tier===2?[TRACKS.result.messy,"the verdict — messy"]:[TRACKS.result.bad,"the verdict — disaster"];}
function musicSync(){
  const m=musicEl();if(!m)return;
  try{
    m.volume=clamp(SET.volume*0.5,0,1);
    const allowed=SET.sound&&SET.music&&SET.volume>0&&userGestured&&!document.hidden;
    if(musicWant&&allowed){
      if(musicSrc!==musicWant.src){musicSrc=musicWant.src;m.src=musicWant.src;musicState="idle";}
      m.loop=musicWant.loop;
      if(m.paused){
        const p=m.play();
        if(p&&p.catch)p.catch(err=>{
          const n=err&&err.name||"error";
          musicState="blocked";
          musicNote=n==="NotAllowedError"?"the browser wants a click first — press Start the radio":n==="NotSupportedError"?"the track could not be loaded here":"could not play ("+n+")";
          refreshRadio();
        });
      }
    } else if(!m.paused)m.pause();
  }catch(e){}
}
function refreshRadio(){if(UI.office)render();}
function musicStatusText(){
  if(!SET.sound)return "Radio off — sound is off";
  if(!SET.music)return "Radio off";
  if(SET.volume<=0)return "Radio on, volume at zero";
  if(!musicWant)return "Radio quiet — the loop plays under the office and the boards, a track under each job report, another under the verdict";
  if(musicState==="playing")return "♪ Now playing — "+musicWant.label;
  if(musicState==="blocked")return "Radio silent: "+musicNote;
  return "Radio ready — "+musicWant.label+" · press Start the radio, or click anywhere";
}
function radioLabel(){
  if(!SET.sound||!SET.music)return "RADIO OFF";
  if(!musicWant)return "STANDBY";
  if(musicState==="playing")return "♪ ON AIR";
  if(musicState==="blocked")return "NO SIGNAL";
  return "TUNING";
}

  crew:{h:"The Crew",t:[
    "Five seats. You are the first. Each card: flag and passport tier, technique and rank (the pips), the five attributes — Muscle, Brains, Tech, Charm, Nerve — then education, jail, streets, knowledge, languages, and in red what this one will <b>not</b> do.",
    "<b>Loyalty</b> rises with success and bonuses, falls with failure and missed payroll. Under 35, after a big score, a member may skim the split and vanish. <b>Upkeep</b> is charged every week. <b>Cut loose</b> frees the seat.",
    "Everyone on the crew goes on every job — if the border lets them in and the job doesn't trip one of their limits. A commander-type recruit takes your orders badly (−3 on a job you lead) but can run the crew on a job you can't get into.",
    "Loyalty also follows the name: a Nobody's crew loses a point a week, a Respected crew gains one. Every few weeks something happens between jobs — a death, a disappearance, a resignation, a rival crew buying drinks, an old face, a detective — and the least loyal member is usually the one it happens to. An <b>Enforcer</b> on the crew opens the hard answers.",
    "<b>They become a crew.</b> Everyone who goes on a job together builds a bond: +1 for a success or better, −1 for a botched or disastrous one, from −3 to +3. The reckoning counts it — up to ±6 — as <i>They have worked together</i> or <i>Bad blood</i>, and the cards say who gets on with whom. Keeping a team together is worth something; so is breaking one up after a bad run.",
    "<b>Bonus</b> (three weeks' upkeep, $4K at least) buys +14 loyalty and three weeks <b>paid up</b>: +2 on every reckoning that member goes on, deaf to another crew's drinks, never the one who skims the split, and not the one trouble picks on. One at a time; the card says until when. It also settles any grumbling about small jobs.",
    "<b>Small money.</b> Every member has a price: a cut under two weeks of their own upkeep is a job done for you, not for them. The job file says who calls a posting small money before you take it. Three small jobs in a row and they <b>grumble</b> (−5 loyalty a job, −2 on the reckoning, a chip on the card); five, and they may walk out at the split — back on the roster, wanting more. A proper score, or a bonus, resets the count.",
    "<b>Seats.</b> Four to start. A <b>Respected</b> name (ranking 60) opens seats six and seven. <b>Other crews.</b> From week 104 (two years), Feared, with seven on your crew, you can found a second crew — a commander-type and four soldiers out of your seven, named after its commander — that takes a job of its own each week without you, from the same board, with its own reckoning and report; its take, heat and ranking are yours, and so is its payroll. A third crew at three years, a fourth at four, no more. Send and recall people between crews from their cards; dissolve a crew and its people come back as far as your seats allow."]},
  notice:{h:"A milestone",t:[
    "Announced once, in the middle of the screen, when the game reaches it: the two seats a Respected name opens; each year mark (weeks 104, 156, 208) when another crew is within reach, with what is still missing; and the moment a second, third or fourth crew can actually be founded, with a button straight into founding it.",
    "<b>Later</b> closes it; nothing is lost — the Crew tab keeps the seats and the founding panel, and the case log keeps the record."]},
  found:{h:"Founding a crew",t:[
    "Pick the commander — a commander by nature, whose own command score runs the job — and four soldiers from your ready crew. They leave your seats; fill them again from the roster.",
    "The new crew is named after its commander, takes one job a week from the same board, and never faces a twist: you are not there to decide, so its report runs straight through."]},
  roster:{h:"The Roster",t:[
    "5,000 files. <b>Search</b> by name, country, language or knowledge. Filter by <b>technique</b>, <b>role</b> and <b>nationality</b>; sort by fee, experience, raw skill or name. Show 30 more at the bottom.",
    "<b>Hover a technique</b> (or MUS, BRN, TCH, CHM, NRV) for a brief: what it is, what it leans on, what it comes with, and which jobs want it. On a phone, tap it.",
    "<b>Temperament.</b> Two files in three carry a trait, and a trait is a fact about working with them, not a number on a bar. <b>Steady</b> never loses faith after a bad night. <b>Hothead</b> is worth +3 and costs +4 heat. <b>Careful</b> takes 4 heat off any job they work. <b>Quick study</b> learns at double speed; a <b>Mentor</b> is +2 and teaches everyone else half again as fast. <b>Mercenary</b> is +2 and takes 3% more. <b>Lucky</b> adds 4 to the night's roll, <b>Jinx</b> takes 3 off it and pulls twists towards the crew. A <b>Ghost</b> is never the one the police get their hands on.",
    "<b>Fee</b> is paid once. <b>Cut</b> is their share of every score. <b>Upkeep</b> is weekly. <b>File</b> opens the whole profile; <b>Hire</b> needs an open seat, the fee — and a name they will sign with. Rookies, Operators and Professionals sign with anyone; a <b>Veteran</b> wants a Known crew (ranking 40), a <b>Legend</b> a Respected one (60). A file that won't sign yet says so under the fee.",
    "About one file in fourteen is a <b>police informant</b>: they leak jobs and leak heat. <b>Vet</b> a file for $6K — a dull crew misses one in three, so a clean stamp is a guess with money behind it."]},
  jobs:{h:"Jobs",t:[
    "Postings from clients, by country. Each row: category, the techniques and knowledge it wants — <b>green</b> if someone on your crew has it, <b>red</b> if nobody does — city, country and language, crew needed, fee, heat, when it expires, and a chip: <b>Good fit</b>, <b>Risky</b>, <b>Long odds</b>, or how many of your crew can even go.",
    "<b>Sort</b> the board by best fit, crew needed, technique wanted, fee, heat, difficulty, country or expiry. <b>Your crew</b> sits above the board — passport, technique, attributes, languages, knowledge, limits — so a posting can be judged without leaving; hide it if you know them by heart. Keys <b>1–4</b> jump between the tabs.",
    "The bars are difficulty; red means high heat. Open a posting to see the reckoning before you commit.",
    "<b>Lay low a week</b>: −15 heat, upkeep still due, postings refresh, ranking −1. Clients post to a name: a Nobody or Small time crew sees tier 1–2 postings, a Known crew tier 3, Respected and up tier 4 — and the fee is scaled to the name, from −20% to +35%. Reach 100 ranking and the final score appears at the top of the board.",
    "On some jobs the live report stops mid-way: something has gone wrong and six options wait for your call. One sets the crew free — the one the crew you brought can actually do — so read the file before you take the job.",
    "Once you have founded other crews, every job file lists them under <b>Other crews</b> with their own reckoning and a <b>Send</b> button: a crew's job does not spend your week, one job per crew per week, and their reports are filed on the Log like yours."]},
  log:{h:"The Log",t:[
    "<b>Job recaps</b>: every job you have run stays on file. Open one for the full report — the minute-by-minute, the verdict, the split, why the ranking moved, what they learned, who came back.",
    "<b>The case log</b>, week by week — every hire, job, injury, arrest, leak and betrayal. The <b>Week</b> dropdown narrows both the recaps and the log to one week; \"All weeks\" shows everything.",
    "The operation panel counts seats, who is ready, who is hurt or held, weekly upkeep and open postings. Lay low from here too.",
    "<b>The competition and the law</b> name the two things that used to be numbers. Once you are Small time, a rival outfit appears, run by somebody with a name: they work the same board, take the best posting left most weeks, and their standing climbs when they do. When their standing passes your ranking they start buying your crew drinks. You can buy a name inside their operation, or send your enforcer — which works about two times in three, and is loud when it doesn't. A <b>detective</b> opens a file once the heat has been up or your name has grown; the file thickens with heat and thins when you lie low, pay a desk, or get raided — and past 50 the raid comes at heat 90 instead of 100, past 75 at 80.",
    "<b>The record</b> counts everything the crew has done — jobs, verdicts, money earned and paid out, the biggest score, countries worked, twists called right, who was hurt, taken or lost, and the current run of jobs without a scratch. Under it, <b>Next</b> shows the three nearest marks on the wall: eighteen career goals from the first job to the final score, each paying ranking, money or both when it lands, and announced in a box when it does.",
    "<b>Standing arrangements</b> is where money goes. Three people on a weekly retainer — a <b>lawyer</b> (anyone taken is held half as long), a <b>doctor</b> (a wound is one week, not two), a <b>fixer</b> (two more postings a week, and one written for the crew you actually have) — paid out of the same payroll as the crew, so a missed week loses them. A <b>safe house</b> is bought outright, in three moves: heat falls 7, then 9, then 11 a week, and the best one keeps most of the float through a raid. And a <b>desk</b> can be paid to lose a file: heat −20, priced by how hot you are.",
    "<b>Ranking — what the name buys.</b> The name decides everything a client, a recruit and a police force does with you. <b>Nobody</b> (0): jobs pay −20%, only tier 1–2 postings, nobody above Professional will sign, loyalty slips a point a week. <b>Small time</b> (20): pay −10%. <b>Known</b> (40): tier-3 postings, full pay, Veterans sign. <b>Respected</b> (60): tier-4 postings, pay +10%, Legends sign, loyalty +1 a week, heat +5%. <b>Feared</b> (80): pay +20%, heat +10%. <b>The Crew</b> (100): pay +35%, loyalty +2, heat +15%, and the final score appears. Clean and successful work raises it; messy work, leaks, arrests and walkouts lower it; a week laid low costs a point — a name unused is a name forgotten."]},
  job:{h:"A job file",t:[
    "<b>The job</b>, at the top: what the client actually wants, in four sentences — the work itself, how well the thing is held, what the posting asks for, and the terms. It is written from the posting, so it reads the same every time you open it.",
    "<b>The brief</b>: who posted it, and the country — language, money, politics, religion, terrain, and the border rule. Chips: the category, techniques and knowledge wanted, and tags such as <i>on the water</i> or <i>at night</i> that trip a crew member's limits.",
    "<b>Who goes</b>: every crew member, ✓ or ✗, with the reason — the border against their passport, a conviction at a strict border, a limit the job hits, an injury. A forger on the crew gets weak passports through.",
    "<b>Bench</b> anyone you would rather keep out of it, yourself included. A bench seat takes no cut of the score, learns nothing from the job, and cannot be hurt, arrested or killed on it — and the crew that does go is smaller, which the reckoning counts. Bench yourself and a commander-type runs it in your place. <b>Send everyone</b> puts them all back.",
    "<b>The reckoning</b>: every factor with its number — crew size, who commands, language, a local national, knowledge (double if studied), techniques, heat — then the odds. <b>Take the job</b>: the whole eligible crew goes and a week passes. <b>Walk away</b> costs nothing."]},
  recruit:{h:"A personnel file",t:[
    "Everything on record: role, technique, experience, education, knowledge, languages, time in jail, time on the streets, passport, sex, what they will not do, and the price — fee once, a cut of each score, upkeep weekly.",
    "<b>Vet</b> reads the file for informant ties against your crew's instincts. <b>Hire</b> needs an open seat and the fee."]},
  result:{h:"The job report",t:[
    "First the job as it happened, minute by minute — who got in and who didn't, who did the talking, what each technique bought, what went right and what went wrong, the exit, the split. Skip to the end if you'd rather.",
    "Then the verdict: <b>Clean</b>, <b>Success</b>, <b>Messy</b>, <b>Botched</b> or <b>Disaster</b> — crew power against difficulty, plus the roll. Gross is the fee earned, cuts go to the crew, the net is yours.",
    "<b>Ranking — why</b> lists every reason the crew's ranking moved: up for a clean or successful job (more for a bigger job, a little more if nobody was hurt), down for messy, botched or disastrous work, a leak, an arrest, or a member walking with the money. <b>What they learned</b>: everyone who went gains experience; ranks are earned at 40, 110, 220 and 400 xp, and good work adds a point to the attributes the job leaned on.",
    "<b>Fallout</b>: injuries (out two weeks), arrests (held for weeks, then back on the roster), leaks (an informant talked), and betrayals (someone skimmed the split and vanished).",
    "<b>The twist.</b> On some jobs — one good fit in four, one long shot in twelve — the report stops: something has gone wrong and six options wait for your call. Only one sets the crew free, and it is always the one the crew you brought can actually do: a wheelman can hot-wire the second car, a forger can re-paper the manifest, a hacker can kill the alarm. A call your crew can make but not best costs time and money; a call nobody can make costs blood, a seat, and ranking. Walking away is always on the list — it keeps everyone and loses the score. The report then shows what you chose, what would have set you free, and why."]},
  event:{h:"Between jobs",t:[
    "Every few weeks something happens that is not a job: a death on holiday, a member gone without a word, one who wants out, one who has joined another crew and is buying yours drinks, an old face who walked with your money, a detective asking around. The types rotate, so each comes round before any repeats.",
    "Every option has a price and a consequence — money, loyalty, a seat, heat — and some are a gamble the text is honest about. Options that need an <b>Enforcer</b> on the crew are greyed without one. The decision cannot be clicked away; the crew remembers it, and the case log keeps it."]},
  office:{h:"The office",t:[
    "Pause and settings, drawn as the boss's office. The <b>radio</b>: SOUND is the master switch, MUSIC switches the track, VOLUME turns both — click the knob's left to lower, right to raise. An hour of suspense loops under the office and every board; each job report brings its own track, and the verdict another. The <b>monitor</b>: brightness. The <b>paper</b>: language. The <b>book</b>: controls and how the game works. The <b>clipboard</b> on the wall: the tutorial whenever you want it — the whole thing, the short reminder, or any one card. The <b>file cabinet</b>: write the game out as a code you can keep anywhere, or read one back in — a save lives in one browser only, and this is how it leaves. The <b>door</b>: back to the game, or burn the file. Your <b>hat</b>: your own file.",
    "Settings are kept apart from the game and survive a new game. Esc closes the office."]},
  over:{h:"The end",t:[
    "You win when the final score — the job that appears at 100 ranking — comes back Clean or a Success. You lose when there is no crew left and no money to hire one.",
    "<b>Run it again</b> starts a new file; settings stay."]},
};
function infoHTML(){
  const it=INFO[infoContext()]||INFO.title;
  const tut=(S&&!S.over)?'<button class="btn ghost sm" data-act="tut-remind">The short reminder</button><button class="btn ghost sm" data-act="tut-start">Run the tutorial</button>':'';
  return '<div class="above"><div class="scrim" data-act="info-close"><div class="modal" role="dialog" aria-modal="true" style="max-width:600px">'
    +'<div class="modal-h"><div><div class="kicker">What is this screen</div><h2 style="font-size:20px;margin-top:4px">'+esc(it.h)+'</h2></div><button class="x" data-act="info-close" aria-label="Close">✕</button></div>'
    +'<div class="modal-b info-b">'+it.t.map(p=>'<p>'+p+'</p>').join("")
    +'<hr class="rule"><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">'+tut+'<button class="btn sm" data-act="info-close">Got it</button></div></div></div></div></div>';
}

/* ------------------------------ THE OFFICE ---------------------------- */
// Pause and settings, drawn as the boss's office. Every object on the desk does something.
const UI={office:false,panel:null,confirmNew:false,info:false,found:null,confirmDissolve:null,impInfo:null,impRaw:""};
function chrome(){
  return '<div id="tipbox" role="tooltip" hidden></div>'
    +'<button class="ibtn" data-act="info" aria-label="What is this screen? (i)" title="What is this screen? (i)">i</button>'
    +'<button class="burger" data-act="office" aria-label="The office — pause and settings (Esc)" title="The office (Esc)"><span></span><span></span><span></span></button>'
    +(UI.office?officeHTML():"")
    +(UI.info?infoHTML():"")
    +(TUT.on&&S&&!S.over?tutHTML():"");
}
function officeSVG(){
  const K="#111010";
  const on=SET.sound, vol=SET.volume;
  const ang=(-135+270*vol-90)*Math.PI/180;
  const bx=1035+135*((clamp(SET.bright,55,100)-55)/45);
  let dots="";for(let y=580;y<=626;y+=9)for(let x=128;x<=194;x+=9)dots+='<circle class="ns" cx="'+x+'" cy="'+y+'" r="2.2" fill="'+K+'"/>';
  let ticks="";for(let i=0;i<=8;i++){const a=(-135+i*33.75-90)*Math.PI/180;ticks+='<line x1="'+(375+25*Math.cos(a)).toFixed(1)+'" y1="'+(614+25*Math.sin(a)).toFixed(1)+'" x2="'+(375+29*Math.cos(a)).toFixed(1)+'" y2="'+(614+29*Math.sin(a)).toFixed(1)+'"/>';}
  let rays="";for(let d=0;d<360;d+=45){const a=d*Math.PI/180;rays+='<line x1="'+(1005+10*Math.cos(a)).toFixed(1)+'" y1="'+(474+10*Math.sin(a)).toFixed(1)+'" x2="'+(1005+13*Math.cos(a)).toFixed(1)+'" y2="'+(474+13*Math.sin(a)).toFixed(1)+'"/>';}

    +'<polyline fill="none" points="75,378 110,378 110,255 165,255 165,378 190,378 190,185 215,185 215,150 232,118 249,150 249,185 262,185 262,378 320,378 320,240 380,240 380,378 425,378"/>'
    +'<rect x="42" y="380" width="405" height="22" fill="#fff"/></g>'
    // the clipboard on the wall: the tutorial, whenever you want it
    +'<g class="hot" data-act="off-tutor"><title>'+(S?"Recap — the tutorial, any card, whenever you want":"Recap — the tutorial; open a dossier first")+'</title>'
    +'<rect x="640" y="96" width="200" height="214" rx="4" fill="#fff"/><rect x="654" y="124" width="172" height="172" fill="#fff"/>'
    +'<rect x="712" y="84" width="56" height="26" rx="6" fill="#fff"/><circle class="ns" cx="740" cy="97" r="4" fill="'+K+'"/>'
    +'<text x="740" y="152" text-anchor="middle" class="office-label">TUTORIAL</text>'
    +'<line x1="672" y1="176" x2="808" y2="176"/><line x1="672" y1="198" x2="792" y2="198"/><line x1="672" y1="220" x2="800" y2="220"/><line x1="672" y1="242" x2="776" y2="242"/><line x1="672" y1="264" x2="796" y2="264"/>'
    +'<text x="740" y="286" text-anchor="middle" class="office-small">RECAP ANY TIME</text></g>'
    // framed picture
    +'<g><rect x="975" y="140" width="175" height="180" fill="#fff"/><rect x="990" y="155" width="145" height="150" fill="#fff"/>'
    +'<polyline fill="none" points="1000,290 1015,290 1015,215 1035,215 1035,195 1045,195 1045,215 1060,215 1060,290 1075,290 1075,240 1095,240 1095,290 1105,290 1105,205 1120,205 1120,290 1128,290"/><line x1="998" y1="296" x2="1128" y2="296"/></g>'
    // the door
    +'<g class="hot" data-act="off-exit"><title>Exit — leave the office, or burn the file</title>'
    +'<rect x="1250" y="50" width="300" height="650" fill="#fff"/><rect x="1272" y="72" width="262" height="628" fill="#fff"/>'
    +'<rect x="1302" y="112" width="200" height="245" fill="#fff"/><rect x="1302" y="410" width="200" height="240" fill="#fff"/>'
    +'<rect x="1398" y="392" width="72" height="28" fill="#fff"/><text x="1434" y="412" text-anchor="middle" class="office-label">EXIT</text>'
    +'<rect x="1500" y="395" width="36" height="14" rx="7" fill="#fff"/><circle class="ns" cx="1510" cy="402" r="4" fill="'+K+'"/></g>'
    // the hat on the hook
    +'<g class="hot" data-act="off-hat"><title>'+(S?"Your file":"Your file — start a game first")+'</title>'
    +'<path d="M1610 262 q-12 14 -2 28 q10 10 20 0" fill="none"/>'
    +'<path d="M1576 236 C1580 198 1612 186 1636 206 L1646 236 Z" fill="#fff"/>'
    +'<ellipse cx="1606" cy="240" rx="48" ry="12" fill="#fff" transform="rotate(-18 1606 240)"/></g>'
    // the chair, behind the desk
    +'<g><rect x="560" y="320" width="240" height="250" rx="44" fill="#fff"/><path d="M600 340 q80 -14 160 0" fill="none"/><line x1="680" y1="345" x2="680" y2="560"/>'
    +'<rect x="528" y="546" width="62" height="30" rx="10" fill="#fff"/><rect x="770" y="546" width="62" height="30" rx="10" fill="#fff"/></g>'

    +'<g><polygon points="30,700 1520,700 1300,590 300,590" fill="#fff"/><rect x="30" y="700" width="1490" height="26" fill="#fff"/>'
    +'<line x1="62" y1="726" x2="62" y2="900"/><line x1="1490" y1="726" x2="1490" y2="900"/></g>'
    // the lamp
    +'<g><ellipse cx="475" cy="628" rx="44" ry="11" fill="#fff"/><line x1="475" y1="617" x2="462" y2="470"/><path d="M456 472 Q530 410 606 466 Z" fill="#fff"/></g>'
    // the radio
    +'<g><polyline fill="none" points="100,548 118,534 427,520 410,548"/><rect x="100" y="548" width="310" height="112" rx="6" fill="#fff"/>'
    +'<rect x="120" y="572" width="82" height="60" rx="4" fill="#fff"/>'+dots

    // the radio: sound switch (master)

    +'<rect class="ns" x="218" y="562" width="70" height="76" fill="transparent"/>'

    +'<rect x="236" y="590" width="14" height="34" rx="7" fill="#fff"/><circle class="ns" cx="243" cy="'+(on?599:615)+'" r="5" fill="'+K+'"/>'
    +'<text x="258" y="603" class="office-small">ON</text><text x="258" y="627" class="office-small">OFF</text></g>'
    // the radio: music switch
    +'<g class="hot" data-act="off-music"><title>Music — the job tracks — '+(SET.music?"on, click to switch off":"off, click to switch on")+'</title>'

    +'<text x="327" y="603" class="office-small">ON</text><text x="327" y="627" class="office-small">OFF</text></g>'

    +'<circle cx="375" cy="614" r="21" fill="#fff"/>'+ticks
    +'<line x1="375" y1="614" x2="'+(375+16*Math.cos(ang)).toFixed(1)+'" y2="'+(614+16*Math.sin(ang)).toFixed(1)+'" style="stroke-width:4px"/></g>'
    // the paper: language

    +'<polygon points="672,618 842,610 852,662 682,670" fill="#fff"/><text x="762" y="640" text-anchor="middle" class="office-label">LANGUAGE</text>'
    +'<line x1="712" y1="650" x2="812" y2="647"/><line x1="720" y1="658" x2="800" y2="655"/></g>'
    // the monitor: display brightness
    +'<g class="hot" data-act="off-bright"><title>Brightness '+SET.bright+'% — click along the slider</title>'
    +'<rect x="960" y="400" width="236" height="160" rx="5" fill="#fff"/><rect x="972" y="411" width="212" height="138" fill="#fff"/>'
    +'<text x="1078" y="444" text-anchor="middle" class="office-label">DISPLAY</text>'
    +'<circle cx="1005" cy="474" r="7" fill="#fff"/>'+rays
    +'<rect id="brightTrack" class="ns" x="1030" y="462" width="145" height="24" fill="transparent"/><line x1="1035" y1="474" x2="1170" y2="474"/><rect x="'+(bx-6).toFixed(1)+'" y="467" width="12" height="14" fill="#fff"/>'

function bind(){
  const q=document.getElementById("q");
  if(q){q.oninput=()=>{S.filter.q=q.value;S.shown=30;const v=q.value;render();const q2=document.getElementById("q");if(q2){q2.focus();q2.setSelectionRange(v.length,v.length);}};}
  const sel=(id,key)=>{const el=document.getElementById(id);if(el)el.onchange=()=>{S.filter[key]=el.value;S.shown=30;render();};};
  sel("ftech","tech");sel("frole","role");sel("fnat","nat");sel("fsort","sort");
  const js=document.getElementById("jsort");if(js)js.onchange=()=>{S.jobSort=js.value;save();render();};
  const lw=document.getElementById("logweek");if(lw)lw.onchange=()=>{S.logWeek=lw.value;save();render();};
  const pn=document.getElementById("pname");if(pn)pn.oninput=()=>{draft.name=pn.value;const btn=document.querySelector('[data-act=confirm-create]');if(btn)btn.disabled=!draft.name.trim();};
  const pnat=document.getElementById("pnat");if(pnat)pnat.onchange=()=>{draft.nat=pnat.value;rollDraftProfile();showCreate();};
  const pt=document.getElementById("ptech");if(pt)pt.onchange=()=>{draft.tech=pt.value;rollDraftProfile();showCreate();};
  // the face sliders redraw the picture alone, so dragging one doesn't rebuild the screen under the hand
  if(draft&&draft.face)faceParts(draft.gender).forEach(p=>{
    const el=document.getElementById("fp-"+p.k);if(!el)return;
    el.oninput=()=>{
      draft.face[p.k]=clamp(parseInt(el.value,10)||0,0,p.opts.length-1);
      const lab=document.getElementById("fv-"+p.k);if(lab)lab.textContent=p.opts[draft.face[p.k]];
      const av=document.getElementById("bigav");if(av)av.innerHTML=avatar(draft.avseed,draft.gender,draft.face);
    };
  });
}

document.addEventListener("click",e=>{
  userGestured=true;musicSync();
  const t=e.target.closest("[data-act]");if(!t)return;
  const act=t.getAttribute("data-act"),id=t.getAttribute("data-id"),k=t.getAttribute("data-k"),v=t.getAttribute("data-v");
  const cl=t.classList;
  if(cl.contains("btn")||cl.contains("tab")||cl.contains("jobrow")||cl.contains("genbtn")||cl.contains("burger"))sfx("click");
  switch(act){
    case "info": UI.info=!UI.info; render(); break;
    case "info-close": if(e.target===t||cl.contains("x")||cl.contains("btn")){UI.info=false;render();} break;
    case "tut-start": UI.info=false; UI.office=false; UI.panel=null; tutStart("full"); break;
    case "tut-remind": UI.info=false; UI.office=false; UI.panel=null; tutStart("reminder"); break;
    case "tut-next": if(TUT.step>=tutSteps().length-1)tutEnd(); else tutGo(TUT.step+1); break;
    case "tut-back": tutGo(TUT.step-1); break;
    case "tut-skip": tutEnd(); break;
    case "office": UI.office=!UI.office; UI.panel=null; UI.info=false; render(); break;
    case "off-close": UI.office=false; UI.panel=null; render(); break;
    case "off-sound": SET.sound=!SET.sound; saveSettings(); if(SET.sound)sfx("open"); musicSync(); render(); break;
    case "off-music": SET.music=!SET.music; saveSettings(); musicSync(); render(); break;
    case "off-radio-start": SET.sound=true; SET.music=true; if(SET.volume<=0)SET.volume=0.6; saveSettings(); userGestured=true; musicState="idle"; musicSync(); render(); break;
    case "skip-ticker": tickerFinish(); break;
    case "twist": twistChoose(+t.getAttribute("data-i")); break;
    case "event": if(S&&S.event&&!S.event.outcome)eventApply(S.event,+t.getAttribute("data-i")); render(); break;
    case "event-close": if(S){S.event=null;S.modal=null;save();} render(); window.scrollTo(0,0); break;
    case "speed-down": SET.speed=clamp(speedIdx()-1,0,SPEEDS.length-1); saveSettings(); render(); break;
    case "speed-up": SET.speed=clamp(speedIdx()+1,0,SPEEDS.length-1); saveSettings(); render(); break;
    case "recap": {
      const r=(S.reports||[]).find(x=>x.id===id); if(!r)break;
      S.modal={type:"result",data:Object.assign({},r,{revealed:r.narrative.length,done:true,replay:true})};
      const vt=verdictTrack(r.tier); musicPlay(vt[0],vt[1],true); render(); break;
    }
    case "off-vol": { const r=t.getBoundingClientRect(); setVolume(SET.volume+((e.clientX<r.left+r.width/2)?-0.2:0.2)); break; }
    case "off-vol-down": setVolume(SET.volume-0.2); break;
    case "off-vol-up": setVolume(SET.volume+0.2); break;
    case "off-bright": { const tr=document.getElementById("brightTrack"); if(tr){const r=tr.getBoundingClientRect(); if(r.width>0&&e.clientX>=r.left-6&&e.clientX<=r.right+6)setBright(55+45*clamp((e.clientX-r.left)/r.width,0,1));} break; }
    case "off-bright-down": setBright(SET.bright-5); break;
    case "off-bright-up": setBright(SET.bright+5); break;
    case "off-lang": UI.panel="lang"; render(); break;
    case "off-controls": UI.panel="controls"; render(); break;
    case "off-tutor": UI.panel="tutor"; render(); break;
    case "off-cabinet": UI.panel="cabinet"; UI.impInfo=null; UI.impRaw=""; render(); break;
    case "exp-select": { const el=document.getElementById("expCode"); if(el&&el.select){el.focus();el.select();} break; }
    // keep what was pasted: a re-render rebuilds the box, so the text lives in UI, not the DOM
    case "imp-read": { const el=document.getElementById("impCode"); UI.impRaw=el?el.value:"";
      const r=readCode(UI.impRaw);
      if(r.err){UI.impInfo=null;note(r.err);} else {UI.impInfo=r;render();} break; }
    case "imp-load": { const el=document.getElementById("impCode"); const raw=(el&&el.value)||UI.impRaw||""; importCode(raw); break; }
    case "tut-jump": if(S&&!S.over){UI.info=false;UI.office=false;UI.panel=null;TUT.mode="full";TUT.on=true;tutGo(+t.getAttribute("data-i"));} break;
    case "off-exit": UI.panel="exit"; UI.confirmNew=false; render(); break;
    case "off-hat": if(S){UI.panel="file";render();} break;
    case "off-panel-close": if(e.target===t||cl.contains("x")){UI.panel=null;render();} break;
    case "off-burn": UI.confirmNew=true; render(); break;
    case "off-burn-yes": wipe(); S=null; draft=null; UI.office=false; UI.panel=null; UI.confirmNew=false; render(); window.scrollTo(0,0); break;
    case "begin": draft=null; showCreate(); break;
    case "to-title": draft=null; render(); break;
    case "continue": if(load()){if(tutOnEntry())tutGo(0);else render();} break;
    case "draft-gender": draft.gender=v; draft.face=normFace(draft.face,draft.gender); showCreate(); break;
    case "reroll-av": { const r=freshRng(); draft.avseed=ri(r,1,1e9); draft.face=randomFace(r,draft.gender); showCreate(); break; }
    case "reroll-profile": rollDraftProfile(); showCreate(); break;
    case "confirm-create": {
      const nm=(draft.name||"").trim(); if(!nm)break;
      const player=Object.assign({id:"YOU",isPlayer:true,n:nm,first:nm.split(" ")[0],gender:draft.gender,nat:draft.nat,avseed:draft.avseed,face:normFace(draft.face,draft.gender),status:"crew",cut:0,upkeep:0,loyalty:100,greed:0,mole:false,vetted:true,vetFlag:false,limits:[]},draft.profile);
      newGame(player); draft=null; render(); break;
    }
    case "tab": S.tab=k; S.modal=null; render(); window.scrollTo(0,0); break;
    case "scrim":
      if(e.target===t||cl.contains("x")||cl.contains("btn")){
        if(S&&S.modal&&S.modal.type==="result"&&S.modal.data.awaiting)break; // the decision cannot be clicked away
        if(S&&S.modal&&S.modal.type==="result"&&!S.modal.data.done){tickerFinish();break;}
        if(S)S.modal=null;UI.panel=null;render();window.scrollTo(0,0);
      }
      break;
    case "open-recruit": S.modal={type:"recruit",id}; render(); break;
    case "open-job": S.tab="jobs"; S.jobOpen=id; S.modal=null; if(S.benchJob!==id){S.benchJob=null;S.bench=[];} render(); window.scrollTo(0,0); break;
    case "bench": { const j=S.jobs.find(x=>x.id===S.jobOpen); if(j)toggleBench(j,id); render(); break; }
    case "bench-clear": { const j=S.jobs.find(x=>x.id===S.jobOpen); if(j)benchClear(j); render(); break; }
    case "retainer": toggleRetainer(k); break;
    case "safehouse": buySafehouse(); break;
    case "bribe": bribe(); break;
    case "rival-buy": rivalPressure(); break;
    case "rival-enforce": rivalEnforce(); break;
    case "close-job": S.jobOpen=null; render(); break;
    case "map-country": S.jobOpen=null; S.jobCountry=(S.jobCountry===t.getAttribute("data-cn"))?null:t.getAttribute("data-cn"); render(); break;
    case "map-clear": S.jobOpen=null; S.jobCountry=null; render(); break;
    case "more": S.shown+=30; render(); break;
    case "strip-toggle": S.stripHidden=!S.stripHidden; save(); render(); break;
    case "hire": hire(id); break;
    case "vet": vet(id); break;
    case "bonus": bonus(id); break;
    case "drop": drop(id); break;
    case "execute": doExecute(id); break;
    case "execute-crew": doExecute(id,+t.getAttribute("data-crew")); break;
    case "crew-send": crewSend(id,+t.getAttribute("data-crew")); break;
    case "crew-recall": crewRecall(id); break;
    case "crew-dissolve": { const cid=+t.getAttribute("data-crew"); if(UI.confirmDissolve===cid)crewDissolve(cid); else {UI.confirmDissolve=cid;render();} break; }
    case "found-open": UI.found={lead:null,ids:[]}; S.modal={type:"found"}; render(); break;
    case "notice-close": if(e.target===t||cl.contains("x")||cl.contains("btn")){noticeDone();render();} break;
    case "notice-go": noticeDone(); if(k==="found"){UI.found={lead:null,ids:[]};S.modal={type:"found"};} else if(k){S.tab=k;S.jobOpen=null;} render(); window.scrollTo(0,0); break;
    case "found-lead": if(UI.found){UI.found.lead=UI.found.lead===id?null:id;UI.found.ids=UI.found.ids.filter(x=>x!==id);} render(); break;
    case "found-pick": if(UI.found){const f=UI.found;if(f.ids.includes(id))f.ids=f.ids.filter(x=>x!==id);else if(f.ids.length<4)f.ids.push(id);} render(); break;
    case "found-go": if(UI.found)foundCrew(UI.found.lead,UI.found.ids); render(); break;
    case "laylow": layLow(); break;
    case "newgame": wipe(); S=null; draft=null; render(); window.scrollTo(0,0); break;
  }
});
document.addEventListener("keydown",e=>{
  userGestured=true;musicSync();
  const tag=e.target&&e.target.tagName;
  const typing=tag==="INPUT"||tag==="SELECT"||tag==="TEXTAREA";
  if(!typing&&(e.key==="i"||e.key==="I")&&!e.ctrlKey&&!e.metaKey&&!e.altKey){UI.info=!UI.info;render();return;}
  if(!typing&&!UI.office&&!UI.info&&S&&!S.over&&!S.modal&&"1234".includes(e.key)&&e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){S.tab=["crew","jobs","roster","log"][+e.key-1];render();window.scrollTo(0,0);return;}
  if(e.key==="Escape"){
    if(UI.info){UI.info=false;render();}
    else if(TUT.on){tutEnd();}
    else if(UI.panel){UI.panel=null;render();}
    else if(UI.office){UI.office=false;render();}
    else if(S&&S.modal){
      if(S.modal.type==="event"){if(S.event&&S.event.outcome){S.event=null;S.modal=null;save();render();}}
      else if(S.modal.type==="notice"){noticeDone();render();}
      else if(S.modal.type==="result"&&S.modal.data.awaiting){}
      else if(S.modal.type==="result"&&!S.modal.data.done)tickerFinish();
      else{S.modal=null;render();}
    }
    else if(S&&S.jobOpen){S.jobOpen=null;render();}
    else{UI.office=true;UI.panel=null;render();}
    return;
  }
  if(e.key==="Enter"||e.key===" "){
    const el=document.activeElement;if(!el||!el.closest)return;
    const row=el.closest(".jobrow");if(row){e.preventDefault();row.click();}
  }
});

function hire(id){
  const c=byId(id);if(!c||c.status!=="available")return;
  if(recruits().length>=crewSeats()){note("Every seat is taken. Cut someone loose first"+(crewSeats()<CREW_MAX_SEATS?", or earn a Respected name for two more seats":"")+".");return;}
  if(!canSign(c)){note(signWhy(c));return;}
  if(S.money<c.fee){note("Not enough for the fee.");return;}
  S.money-=c.fee;c.status="crew";c._touched=true;S.crewIds.push(c.id);sfx("coin");stats().hired++;
  logMsg("Hired "+c.n+" — "+TECH_BY_K[c.tech].l+", "+c.nat+", "+(c.role==="commander"?"commander":"soldier")+" ("+money(c.fee)+").","");
  if(S.modal&&S.modal.type==="recruit")S.modal=null;
  save();render();
}
function vet(id){
  const c=byId(id);if(!c||c.vetted||S.money<VET_COST)return;
  S.money-=VET_COST;
  const sharpest=field().reduce((s,x)=>Math.max(s,x.attrs.brains),40);
  let flagged=c.mole;
  if(c.mole&&sharpest<55&&chance(freshRng(),0.35))flagged=false;
  c.vetted=true;c.vetFlag=flagged;c._touched=true;
  logMsg("Vetted "+c.n+" ("+money(VET_COST)+"). "+(flagged?"Flag raised — informant ties.":"Came back clean."),flagged?"warn":"");
  save();render();
}
function bonus(id){
  const c=byId(id);if(!c)return;const cost=bonusCostFor(c);
  if(paidUp(c)){note(c.first+" is paid up until week "+c.paidUntil+".");return;}
  if(S.money<cost){note("Can't cover the bonus.");return;}
  S.money-=cost;c.loyalty=clamp(c.loyalty+14,0,100);c.paidUntil=S.week+PAID_WEEKS-1;c._touched=true;sfx("coin");
  const settled=(c.lowRun||0)>=2;c.lowRun=0;
  logMsg("Paid "+c.first+" a "+money(cost)+" bonus. Loyalty up, and paid up through week "+c.paidUntil+": +2 on every reckoning, deaf to other crews, not the one trouble picks on."+(settled?" The grumbling about small jobs stops.":""),"good");save();render();
}
function drop(id){
  const c=byId(id);if(!c)return;
  c.status="available";c.loyalty=clamp(c.loyalty-6,0,100);c._touched=true;
  leaveCrew(c);
  logMsg("Cut "+c.first+" loose.","");checkOver();save();render();
}
function doExecute(id,crewId){
  const j=S.jobs.find(x=>x.id===id);if(!j)return;
  const cr=crewId?crewById(crewId):null;
  if(crewId&&!cr)return;
  if(cr&&(cr.jobWeek===S.week||j.final))return;
  const pool=cr?crewMembers(cr):jobPool(j);
  if(!assessJob(j,pool,cr?cr.leadId||null:null).canRun)return;
  const ti=(S.trackIdx||0)%TRACKS.report.length;S.trackIdx=ti+1;
  musicPlay(TRACKS.report[ti],"report track "+(ti+1)+" of "+TRACKS.report.length,false);
  const res=startJob(j,cr?{crew:cr,noTwist:true}:{pool});
  S.benchJob=null;S.bench=[];
  sfx("open");
  S.jobOpen=null;
  S.modal={type:"result",data:res};
  render();
}
function layLow(){
  S.heat=clamp(S.heat-15,0,120);
  if(detective())detective().file=Math.max(0,detective().file-6);
  const before=rankName(S.rep);
  S.rep=Math.max(0,S.rep-1);
  logMsg("Laid low for a week. Heat cooling. A name unused is a name forgotten — ranking −1.","");
  if(rankName(S.rep)!==before)logMsg("Ranking: "+before+" → "+rankName(S.rep)+". "+rankInfo(S.rep).note,"bad",true);
  weekTick(freshRng());refreshJobs(false);S.modal=null;save();render();
}
function note(msg){logMsg(msg,"warn");render();}

  loadSettings();applySettings();
  // a play is a sitting: a return after half an hour away counts as the next one
  try{const now=Date.now();if(!SET.lastSeen||now-SET.lastSeen>PLAY_GAP_MS)SET.plays=(SET.plays||0)+1;SET.lastSeen=now;saveSettings();}catch(e){}
  try{
    const hot=window.claude&&window.claude.hot;
    if(hot&&typeof hot.snapshot==="function")hot.snapshot(()=>S?packState():null);

})();
