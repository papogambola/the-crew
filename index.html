const STREET_BY_K={};STREET.forEach(s=>STREET_BY_K[s.k]=s);

/* Two or three on offer a week, from the week's own seed, priced and pitched once. */
function streetOffers(){
  if(S.street&&S.street.week===S.week)return S.street.offers;
  const rng=mulberry32((S.seed^0x57BEE7^(S.week*374761393))>>>0);
  const pool=STREET.slice(),offers=[];
  const n=ri(rng,2,3);
  for(let i=0;i<n&&pool.length;i++){
    const st=pool.splice(Math.floor(rng()*pool.length),1)[0];
    const co=pick(rng,COUNTRIES);
    const city=pick(rng,co.cities);
    offers.push({k:st.k,city:city,country:co.name,
      pay:Math.round((st.pay[0]+rng()*(st.pay[1]-st.pay[0]))/50)*50,
      diff:st.diff+ri(rng,-4,4)});
  }
  S.street={week:S.week,offers:offers,doneWeek:(S.street&&S.street.doneWeek)||0};
  return offers;
}
function streetSpent(){return !!(S.street&&S.street.doneWeek===S.week);}
function streetJob(k){return STREET_BY_K[k];}
/* What one soldier is worth on one piece of street work. No trade bonus: nobody out here is
   paying for a Safecracker. Attributes the job leans on, experience, the nerve to work alone,
   and the two temperaments that were always about exactly this. */
function streetFit(c,off){
  const st=STREET_BY_K[off.k];if(!c||!st)return {score:0,why:[],blocked:"unknown work"};
  const why=[];
  let score=0,tw=0;
  Object.keys(st.w).forEach(a=>{tw+=st.w[a];});
  Object.keys(st.w).forEach(a=>{
    const part=(c.attrs[a]||0)*(st.w[a]/tw);
    score+=part;
    why.push({k:ATTR_ABBR[a]+" ×"+st.w[a],v:Math.round(part),note:"their "+a+" is "+c.attrs[a]});
  });
  score=Math.round(score);
  const add=(k,v,note)=>{score+=v;why.push({k,v,note});};
  if(c.exp)add("Experience",c.exp*3,EXP[c.exp]+", and has been caught before");
  if(hasTrait(c,"steady"))add("Steady",6,"does not rattle");
  if(hasTrait(c,"hothead"))add("Hothead",-7,"this is not work for a temper");
  if(hasTrait(c,"careful"))add("Careful",5,"takes the long way in");
  if(hasTrait(c,"ghost"))add("Ghost",8,"never the one they get hold of");
  if(hasTrait(c,"jinx"))add("Jinx",-5,"things happen around them");
  if(hasTrait(c,"lucky"))add("Lucky",4,"things do not");
  if(c.role==="commander")add("A commander",-6,"used to having four people behind them");
  const blocked=(st.lim||[]).map(k=>c.limits.indexOf(k)>=0?LIMIT_BY_K[k].l:null).filter(Boolean)[0]||null;
  return {score,why,blocked,margin:score-off.diff};
}
/* The odds, before you choose — the same shape as every other option in this game. */
function streetOdds(c,off){
  const f=streetFit(c,off);
  if(f.blocked)return Object.assign(f,{pClean:0,pOk:0,pFail:100,pHurt:0,pJail:0});
  const st=STREET_BY_K[off.k];
  const m=f.margin;
  const clean=clamp(Math.round(42+m*1.9),4,88);
  const fail=clamp(100-clean,6,90);
  // going wrong is where a soldier is lost: the worse the fit, the likelier it lands on them
  const swing=clamp(1+(-m)/26,0.5,2.2);
  const pHurt=clamp(Math.round(st.hurt*100*swing),1,52);
  const pJail=clamp(Math.round(st.jail*100*swing),1,48);
  return Object.assign(f,{pClean:clean,pOk:0,pFail:fail,pHurt:pHurt,pJail:pJail});
}
/* Who can be sent: anybody on the books who is fit and not already out. */
function streetPool(){return field().filter(c=>!c.isPlayer&&c.status==="crew");}

function streetRun(k,cid){
  const off=(streetOffers()||[]).find(o=>o.k===k);
  const c=byId(cid);
  if(!off||!c||streetSpent())return null;
  const st=STREET_BY_K[k];
  const o=streetOdds(c,off);
  if(o.blocked)return null;
  const rng=freshRng();
  const roll=ri(rng,0,99);
  const won=roll<o.pClean;
  const lines=[];
  let paid=0;
  if(won){
    paid=off.pay;
    S.money+=paid;
    lines.push(c.first+" is back inside the hour with "+moneyExact(paid)+".");
  }else{
    lines.push(st.bad.replace("{F}",c.first));
  }
  // heat lands either way: the street does not care whether it came off
  const heat=st.heat+(won?0:2);
  S.heat=clamp(S.heat+heat,0,120);
  // and it warms the place it happened in, like any other piece of work
  if(off.country)countryHeatAdd(off.country,Math.max(1,Math.round(heat/2)));
  let mark="";
  if(!won){
    if(chance(rng,o.pJail/100)){
      mark="jailed";
      const held=hasRetainer("lawyer")?ri(rng,1,3):ri(rng,2,5);
      c.status="jailed";c.out=S.week+held;c._touched=true;leaveCrew(c);
      lines.push(c.first+" is held until week "+c.out+".");
    }else if(chance(rng,o.pHurt/100)){
      mark="injured";
      c.status="injured";c.out=S.week+(hasRetainer("doctor")?1:2);c._touched=true;
      lines.push(c.first+" is hurt — out until week "+c.out+".");
    }else{
      lines.push(c.first+" got away with nothing but the walk home.");
    }
    c.loyalty=clamp(c.loyalty-4,0,100);c._touched=true;
  }else{
    c.xp=(c.xp||0)+6;c._touched=true;
  }
  S.street=S.street||{week:S.week,offers:[]};
  S.street.doneWeek=S.week;
  stats().street=(stats().street||0)+1;
  if(won)stats().streetPaid=(stats().streetPaid||0)+paid;
  logMsg("Street work in "+off.city+": "+st.l.toLowerCase()+". "+lines.join(" ")+" (+"+heat+" heat)",
    won?"good":"bad",true);
  const res={k:k,first:c.first,name:c.n,city:off.city,label:st.l,won:won,paid:paid,heat:heat,
    mark:mark,lines:lines,odds:o,diff:off.diff};
  S.streetLast=res;
  checkOver();save();
  return res;
}


function makeJob(rng,tierBias){
  const co=pick(rng,COUNTRIES);
  const cat=CAT_BY_K[pick(rng,co.cats)];
  const r=rng();
  const rk=rankInfo(S.rep);
  // clients post to a name: a Nobody sees tier 1–2, a Known crew tier 3, Respected and up tier 4
  const tier=clamp((tierBias||0)+(r<0.34?1:r<0.64?2:r<0.87?3:4),1,rk.maxTier);
  const need=[0,ri(rng,2,3),ri(rng,3,4),ri(rng,4,5),5][tier];
  // No ceiling: the room is as hard as the name, the tier and the local temperature make it.
  const diff=Math.max(20,Math.round(BAL.diffBase+tier*BAL.diffPerTier+ri(rng,-BAL.diffJitter,BAL.diffJitter)
    +repPressure()+countryHeat(co.name)*BAL.countryPressure+(co.gate===2?5:0)+(co.auth?4:0)));
  const wks=BAL.jobWeeks[tier]||1;
  const payBase=BAL.payTier[tier]*[0,0.65,0.8,1][co.eco]*((1-BAL.payWeeks)+BAL.payWeeks*wks);
  const payout=Math.round(payBase*(0.7+rng()*0.8)*rk.pay/1000)*1000;
  const heat=Math.round(cat.heat*(0.8+tier*0.12)*(co.auth?1.2:1));
  const techs=[];const pool=cat.techs.slice();
  const nt=clamp(1+Math.floor(tier/2),1,3);
  for(let i=0;i<nt&&pool.length;i++)techs.push(pool.splice(Math.floor(rng()*pool.length),1)[0]);
  const know=[pick(rng,cat.know)];
  if(tier>=3&&cat.know.length>1){const k=pick(rng,cat.know);if(!know.includes(k))know.push(k);}
  const tags=[];
  for(const t in cat.tags){
    let p=cat.tags[t];
    if(t==="water"&&!co.terrain.some(x=>["coast","port","islands","fjords","canal","delta","river","lakes"].includes(x)))p*=0.3;
    if(t==="heights"&&co.terrain.some(x=>x==="mountains"||x==="megacity"))p+=0.2;
    if(chance(rng,p))tags.push(t);
  }
  S.jobSeq++;
  return {
    id:"J"+S.jobSeq,cat:cat.k,tier,country:co.name,city:pick(rng,co.cities),
    need,diff,payout,heat,techs,know,tags,
    client:pick(rng,openClients()),   // a client with a grudge does not post to you
    title:pick(rng,cat.v)+" "+pick(rng,cat.n),
    // a job is time as well as money: a big one holds the crew for weeks, and a posting that
    // sits on the board long enough to be cased is a posting somebody else may take first
    weeks:BAL.jobWeeks[tier]||1,
    expires:S.week+ri(rng,3,6),
  };
}

function upList(up){const c={};up.forEach(a=>{c[a]=(c[a]||0)+1;});return Object.keys(c).map(a=>"+"+c[a]+" "+ATTR_ABBR[a]).join(", ");}

function jobSeed(job){
  const s=(job.id||"")+"|"+(job.title||"")+"|"+(job.country||"");
  let h=2166136261;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
  return h>>>0;
}
function jobNoun(job){
  const t=job.title||"";
  const i=t.toLowerCase().indexOf(" the ");
  return i<0?t.toLowerCase():t.slice(i+5);
}
function jobBrief(job){
  if(job.brief)return job.brief;            // the three stages of the last score write their own
  if(job.final)return "Everything you have built, against the one room that has never been opened. There is no posting for this and no client to pay you — there is a name at the end of it, and the certainty that nobody gets a second run at it. Take the whole crew.";
  const rng=mulberry32(jobSeed(job));
  const v={noun:jobNoun(job),city:job.city,country:job.country,client:cap(job.client||"the client"),fee:money(job.payout)};
  const open=fill2(pick(rng,BRIEF_OPEN[job.cat]||BRIEF_OPEN.vault),v);
  const tier=BRIEF_TIER[clamp(job.tier,1,5)];
  const tags=(job.tags||[]).filter(t=>BRIEF_TAG[t]);
  const tag=tags.length?BRIEF_TAG[pick(rng,tags)]:"";
  const techs=(job.techs||[]).map(t=>TECH_BY_K[t]&&TECH_BY_K[t].l).filter(Boolean);
  const wants=techs.length
    ? "The client asked for "+(techs.length>1?techs.slice(0,-1).map(anA).join(", ")+" and "+anA(techs[techs.length-1]):anA(techs[0]))
      +((job.know||[]).length?", and somebody who knows "+job.know.join(" and ")+".":".")
    : "";
  const comma=/[,;]/.test(job.client||"");
  const pay=fill2(pick(rng,comma?BRIEF_PAY_ALT:BRIEF_PAY),comma?Object.assign({},v,{client:job.client}):v);
  return [open,tier,tag,wants,pay].filter(Boolean).join(" ");
}

function refreshJobs(fill){
  const rng=mulberry32((S.seed^(S.week*2654435761))>>>0);
  try{refreshJobsInner(fill,rng);}finally{newsSync();}
}
function refreshJobsInner(fill,rng){
  S.jobs=S.jobs.filter(j=>j.final||j.expires>=S.week);
  let guard=0;
  const want=7+(hasRetainer("fixer")?2:0);
  while(S.jobs.filter(j=>!j.final).length<want&&guard++<40)S.jobs.push(makeJob(rng,0));
  const top=Math.min(3,rankInfo(S.rep).maxTier);
  if(!S.jobs.some(j=>!j.big&&j.tier>=top)&&(fill||chance(rng,0.5)))S.jobs.push(makeJob(rng,2));
  // the seven-place work: one or two standing on the board, drawn from the five hundred
  if(bigOpen()){
    const done=bigDone();
    const have=S.jobs.filter(j=>j.big).length;
    const want=1+(chance(rng,0.45)?1:0);
    const free=bigCatalogue().filter(o=>!done[o.id]&&!clientBanned(o.client)&&!S.jobs.some(j=>j.id===o.id));
    for(let i=have;i<want&&free.length;i++)S.jobs.unshift(bigPosting(free.splice(Math.floor(rng()*free.length),1)[0],rng));
  }
  // the fixer writes one posting a week for the crew you actually have
  if(hasRetainer("fixer")){
    const mine=field().map(c=>c.tech);
    if(mine.length&&!S.jobs.some(j=>j.fixed)){
      let best=null,bestN=-1;
      for(let i=0;i<14;i++){const j=makeJob(rng,chance(rng,0.4)?1:0);const n=j.techs.filter(t=>mine.includes(t)).length;if(n>bestN){bestN=n;best=j;}if(n===j.techs.length)break;}
      if(best){best.fixed=true;best.client="your fixer";S.jobs.unshift(best);}
    }
  }
  maybeUnlockFinal();
}
// The last score is not one roll. It is three operations in order, each one able to go wrong,
// and going wrong sets the crew back rather than ending them — the stage has to be taken again.
const FINAL_STAGES=[
  {id:"JFINAL1",cat:"infiltration",country:"Switzerland",city:"Zug, and a room with no windows",

  {id:"JFINAL2",cat:"vault",country:"Switzerland",city:"Zürich, four floors below the street",
   need:5,diff:176,payout:4200000,heat:62,techs:["safecracker","demolitions","overwatch"],know:["Finance","Weapons"],tags:["underground","night","violence"],

   brief:"Having it is not the same as keeping it. Every border between here and anywhere is now a question with your face on it, and what you are carrying cannot be explained, declared, or put in a bank. This is the part nobody plans, because nobody gets this far. Move all of it, move the crew, and end in a country that will not be asked. Do this and the name at the top of the chart is never spoken aloud again."},
];
/* --------------------- THE SEVEN-PLACE OPERATIONS ---------------------- */
// Five hundred of them, and they are the same five hundred in every game: built once from a fixed
// seed, so OP-317 is the same operation in the same city for everybody, countable, and finishable.
// They are not on the ordinary board — no country lists them and the rival cannot take one — they
// arrive by name once the sixth and seventh places open, and each one is consumed when it is run.
const BIG_SEED=0x7A5C0DE;
let BIG_CACHE=null;
function bigCatalogue(){
  if(BIG_CACHE)return BIG_CACHE;
  const rng=mulberry32(BIG_SEED);
  const out=[];
  for(let i=0;i<BAL.bigCount;i++){
    const cat=pick(rng,BIG_CATS);
    let co=pick(rng,COUNTRIES),guard=0;
    while(cat.terrain&&!cat.terrain.some(t=>co.terrain.includes(t))&&guard++<60)co=pick(rng,COUNTRIES);
    const techs=[],pool=cat.techs.slice();
    const nt=3+Math.floor(rng()*3);                     // three to five wanted trades
    for(let j=0;j<nt&&pool.length;j++)techs.push(pool.splice(Math.floor(rng()*pool.length),1)[0]);
    const know=[],kp=cat.know.slice();
    const nk=2+(chance(rng,0.45)?1:0);                  // two or three kinds of knowledge
    for(let j=0;j<nk&&kp.length;j++)know.push(kp.splice(Math.floor(rng()*kp.length),1)[0]);
    const tags=cat.tags.filter(()=>chance(rng,0.55));
    out.push({op:i+1,id:"OP"+String(i+1).padStart(3,"0"),big:true,tier:5,cat:cat.k,
      country:co.name,city:pick(rng,co.cities),
      need:chance(rng,0.45)?7:6,
      techs,know,tags,weeks:3+Math.floor(rng()*3),
      title:pick(rng,cat.v)+" "+pick(rng,cat.n),
      client:pick(rng,BIG_CLIENTS),
      seed:ri(rng,1,2000000000)});
  }
  BIG_CACHE=out;
  return out;
}
function bigById(id){return bigCatalogue().find(o=>o.id===id)||null;}
// Seven places, which is a Respected name. The same gate as the places themselves — asked of the
// seats rather than the number, so it can never disagree with the card that opens them.
function bigOpen(){return crewSeats()>=CREW_MAX_SEATS;}
function bigDone(){return S.bigDone||(S.bigDone={});}
function bigRun(){return Object.keys(bigDone()).length;}
// What the room is worth and how hard it is held. Both are read at the moment it is offered, so
// they answer the name you have now and the country's temperature this week.
function bigPosting(op,rng){
  const co=COUNTRY_BY_NAME[op.country];
  const j=mulberry32(op.seed>>>0);
  const diff=Math.max(60,Math.round(BAL.bigDiff+ri(j,-BAL.diffJitter,BAL.diffJitter)
    +repPressure()*BAL.bigRepPressure+countryHeat(op.country)*BAL.countryPressure
    +(op.need===7?BAL.bigNeed7:0)+(co.gate===2?5:0)+(co.auth?4:0)));
  const base=BAL.payTier[5]*[0,0.65,0.8,1][co.eco]*((1-BAL.payWeeks)+BAL.payWeeks*op.weeks);
  const payout=Math.round(base*(0.8+j()*0.6)*rankInfo(S.rep).pay/1000)*1000;
  const heat=Math.round(BAL.bigHeat*(co.auth?1.2:1));
  return Object.assign({},op,{diff,payout,heat,expires:S.week+ri(rng||j,6,10)});
}

/* ------------------------------ CASING -------------------------------- */
// A room you have watched is not the room you were told about. Weeks spent on a posting before
// taking it buy margin — and cost the weeks, the money, and the risk that somebody else takes
// the posting or it expires while you are still sitting outside it in a car.
function casedWeeks(job){return (job&&S.cased&&S.cased[job.id])||0;}
function caseMax(job){return job.final?4:(BAL.caseMax[job.tier]||0);}
function caseCost(job){return Math.max(4000,Math.round(job.payout*BAL.caseCostPct/1000)*1000);}
function canCase(job){return !!job&&casedWeeks(job)<caseMax(job)&&assessJob(job,jobPool(job)).team.length>0;}
const CASE_LINES=[
  "Two days on the same bench, a different coat each day. The shift changes at ten past, not on the hour.",
  "The delivery door is propped open every Thursday for eleven minutes. Nobody has noticed in years.",
  "A drink with somebody who used to work the night desk. He talks about the old alarm, which is still the alarm.",
  "The plans cost money and are three years out of date, but the load-bearing walls have not moved.",
  "A dry run at four in the morning, with nothing in anybody's pockets that could not be explained.",
  "The guard with the limp does the basement round. The one who actually looks at the screens does not.",
  "Photographs of a door, from across a street, for six hours. The lock is older than the building's owner.",
  "Somebody's ex-wife, over coffee, on the subject of her ex-husband's routine.",
];
function caseJob(id){
  const j=S.jobs.find(x=>x.id===id);if(!j||!canCase(j))return;
  const c=caseCost(j);
  if(S.money<c){note("Casing it costs "+money(c)+" and the float won't carry it.");return;}
  S.money-=c;
  S.cased=S.cased||{};S.cased[j.id]=casedWeeks(j)+1;
  const rng=freshRng();
  S.heat=clamp(S.heat+BAL.caseHeat,0,120);
  countryHeatAdd(j.country,3);
  logMsg("Cased "+j.title+" ("+money(c)+", one week). "+pick(rng,CASE_LINES)+" The crew goes in knowing "+casedWeeks(j)+" week"+(casedWeeks(j)>1?"s":"")+" more than the client told them.","good");
  weekTick(rng);refreshJobs(false);
  // the board does not wait: a posting can expire while you are still watching it
  if(!S.jobs.some(x=>x.id===j.id)){logMsg("The posting for "+j.title+" is gone. Somebody else took it, or the client stopped waiting. The week and the "+money(c)+" are spent.","bad",true);S.jobOpen=null;}
  save();render();
}
function finalStage(){return S.finalStage||0;}
// What the last score asks for before it will appear at all.
function finalGate(){
  const st=stats();
  return [
    {k:"A name at the top of the board",have:S.rep,want:BAL.finalRep,ok:S.rep>=BAL.finalRep,fmt:v=>"ranking "+v},
    {k:"A career behind you",have:st.jobs,want:55,ok:st.jobs>=55,fmt:v=>v+" jobs run"},
    {k:"A crew, not a pair",have:field().length,want:5,ok:field().length>=5,fmt:v=>v+" in the field"},
    // nobody funds this one. Three operations against people who own banks, out of your float.
    {k:"A war chest",have:S.money,want:BAL.finalMoney,ok:S.money>=BAL.finalMoney,fmt:v=>money(v)+" on hand"},
  ];
}
function finalReady(){return finalGate().every(g=>g.ok);}
function maybeUnlockFinal(){
  if(S.finalDone||finalStage()>=FINAL_STAGES.length)return;
  if(S.finalBack&&S.week<S.finalBack)return;          // a failed stage takes weeks to set up again
  if(!finalReady()){if(S.jobs.some(j=>j.final))S.jobs=S.jobs.filter(j=>!j.final);return;}
  if(S.jobs.some(j=>j.final))return;
  const s=FINAL_STAGES[finalStage()];
  S.jobs.unshift(Object.assign({final:true,tier:5,client:"the Committee",expires:9999,stage:finalStage()},s));
  if(S.seenFinal!==finalStage()){
    S.seenFinal=finalStage();
    logMsg(finalStage()===0?"Your name has reached the right ears. The last score is on the board — three operations, in order."
      :"Stage "+(finalStage()+1)+" of the last score is ready: "+s.title+".","big",true);
  }
}

/* --------------------------- JOB RESOLUTION --------------------------- */
// Can this member work this job? Returns {ok, why}.
function entry(c,job,forgerAboard){
  const co=COUNTRY_BY_NAME[job.country];
  const nat=natOf(c);
  for(const k of c.limits){
    const l=LIMIT_BY_K[k];
    if(l.country&&l.country(co))return {ok:false,why:l.l};
    if(l.tag&&job.tags.includes(l.tag))return {ok:false,why:l.l+" — job is "+TAG_LABEL[l.tag]};
  }
  if(c.status!=="crew")return {ok:false,why:c.status==="injured"?"injured, back week "+c.out:"not available"};
  const local=nat.name===co.name;
  if(!local&&!forgerAboard){
    if(co.gate===2&&nat.tier>1)return {ok:false,why:"strict border, "+TIER_WORD[nat.tier]+" passport — needs a forger aboard"};
    if(co.gate===1&&nat.tier>2)return {ok:false,why:"needs a visa, "+TIER_WORD[nat.tier]+" passport — needs a forger aboard"};
    if(co.gate>=1&&c.jail>=(co.gate===2?3:5))return {ok:false,why:c.jail+" years inside — refused at the border without papers"};
  }
  return {ok:true,why:local?"local national":forgerAboard&&(co.gate>=1)?"papers from the forger":"clean entry"};
}
function memberEff(c,job){
  const cat=CAT_BY_K[job.cat];
  let ws=0,tw=0;
  for(const a in cat.w){ws+=cat.w[a]*c.attrs[a];tw+=cat.w[a];}
  let e=ws/tw;
  e*=(1+(c.exp-1)*0.11);
  if(job.techs.includes(c.tech))e+=14;
  if((cat.w.brains||0)>=3)e+=c.edu*1.2;
  return e;
}
function assessJob(job,members,leadId){
  const co=COUNTRY_BY_NAME[job.country];
  const cat=CAT_BY_K[job.cat];
  const all=members||crewAll();
  const forger=all.some(c=>c.status==="crew"&&c.tech==="forger"&&!c.limits.some(k=>{const l=LIMIT_BY_K[k];return l.country&&l.country(co);}));
  const checks=all.map(c=>Object.assign({c},entry(c,job,forger)));
  const team=checks.filter(x=>x.ok).map(x=>x.c);
  const factors=[];
  let power=0;
  if(team.length){team.forEach(c=>power+=memberEff(c,job));power/=team.length;}
  let adj=0;
  const add=(k,v,note,tip)=>{adj+=v;factors.push(tip?{k,v,note,tip}:{k,v,note});};
  if(team.length<job.need)add("Crew short",-22*(job.need-team.length),team.length+" of "+job.need+" can go");
  else add("Crew size",6+Math.min(9,(team.length-job.need)*3),team.length+" in the field");
  // You are the commander. A commander-type recruit chafes under you, but can lead when you can't get in.
  const youIn=team.some(c=>c.isPlayer);
  const cmdTypes=team.filter(c=>!c.isPlayer&&c.role==="commander");
  if(youIn){
    add("You command",S.player.cmd||5,"your crew, your call");
    if(cmdTypes.length)add("Commanders under you",-3*cmdTypes.length,cmdTypes.map(c=>c.first).join(", ")+" take orders badly");
  } else if(cmdTypes.length){
    const lead=(leadId&&cmdTypes.find(c=>c.id===leadId))||cmdTypes.slice().sort((a,b)=>b.cmd-a.cmd)[0];
    add("Stand-in leader",Math.max(1,lead.cmd-2),lead.first+" runs it while you stay out");
  } else add("Leaderless",-10,"you can't get in and nobody else can lead");
  const speaks=team.some(c=>c.langs.some(l=>co.langs.includes(l)));
  if(speaks)add("Language",6,co.langs[0]+" spoken");
  else add("No "+co.langs[0],cat.lang?-14:-8,"nobody speaks it"+(cat.lang?" — this job is all talk":""));
  if(team.some(c=>natOf(c).name===co.name))add("Local national",8,"knows the ground");
  const covered=job.know.filter(k=>team.some(c=>c.know.includes(k)));
  covered.forEach(k=>{const schooled=team.some(c=>c.know.includes(k)&&c.edu>=3);add("Knows "+k,schooled?10:5,schooled?"and studied it":"street knowledge");});
  job.know.filter(k=>!covered.includes(k)).forEach(k=>add("Nobody knows "+k,-6,"wanted for this job"));
  const hits=job.techs.filter(t=>team.some(c=>c.tech===t)).length;
  if(hits)add("Trades",hits*4,hits+" of "+job.techs.length+" wanted");
  const paid=team.filter(c=>paidUp(c));
  if(paid.length)add("Paid up",Math.min(6,2*paid.length),paid.map(c=>c.first).join(", ")+(paid.length>1?" are":" is")+" working for it");
  const tb=traitBonus(team);
  if(tb.v)add("Temperament",tb.v,tb.who.join(", "));
  const bs=bondScore(team);
  if(bs.v){
    const ids=bs.v>0?bs.goodIds:bs.badIds;
    const names=bs.v>0?bs.good:bs.bad;
    const shown=names.slice(0,3).join(", ")+(names.length>3?" and "+(names.length-3)+" more":"");
    add(bs.v>0?"They have worked together":"Bad blood",bs.v,shown,
      (bs.v>0?"What they have been through together. A pair gains a point for every job that comes off with both of them on it, and loses one for every botched or blown night."
             :"What happened between them. A pair loses a point for every botched or blown night they were both on, and gains one back for every job that comes off.")
      +"\n\n"+bondBackground(ids,3));
  }
  const grum=team.filter(c=>restless(c));
  if(grum.length)add("Restless",-2*grum.length,grum.map(c=>c.first).join(", ")+" grumbling about the money");
  const streets=team.reduce((m,c)=>Math.max(m,c.streets),0);
  const heatCut=Math.min(4,Math.floor(streets/5));
  const cased=casedWeeks(job);
  if(cased)add("Cased",cased*BAL.caseGain,cased+" week"+(cased>1?"s":"")+" watching it before anybody went in");
  if(S.heat>0)add("Heat",-Math.round(S.heat*0.24),"the world is watching");
  const eff=power+adj;
  const margin=eff-job.diff;
  const lo=margin-BAL.roll,hi=margin+BAL.roll;
  const pAbove=t=>clamp((hi-t)/(hi-lo),0,1);
  const pGood=pAbove(BAL.vClean),pWin=pAbove(BAL.vSuccess),pFailish=pAbove(BAL.vMessy),pDis=pAbove(BAL.vBotched);
  return {team,checks,factors,power:Math.round(power),eff:Math.round(eff),margin:Math.round(margin),heatCut,
    canRun:team.length>0&&team.length>=job.need&&!(job.news&&job.news.closed),
    pClean:Math.round(pGood*100),pOk:Math.round((pFailish-pGood)*100),pFail:Math.round((pDis-pFailish)*100),pDis:Math.round((1-pDis)*100),
    pSuccess:Math.round((pWin-pGood)*100),pMessy:Math.round((pFailish-pWin)*100)};
}
// What the fee turns into. Everybody who goes takes their percentage off the top; the commander
// keeps whatever is left, which is what actually reaches the money in the top bar.
//
// The percentages are fixed. The money they are percentages of is not: finishJob pays 1.08× the
// fee for a clean night, the fee for a success, 0.6× for a messy one and nothing at all for a
// botch — so the split is quoted on the fee and the multiplier is stated beside it, rather than
// showing one number that is only true a third of the time.
function jobSplit(job,team){
  const rows=(team||[]).filter(c=>!c.isPlayer&&c.cut>0)
    .map(c=>({c,pct:c.cut,amt:Math.round(job.payout*c.cut)}))
    .sort((a,b)=>b.amt-a.amt);
  const crew=rows.reduce((n,r)=>n+r.amt,0);
  const crewPct=rows.reduce((n,r)=>n+r.pct,0);
  return {rows,crew,crewPct,you:Math.max(0,job.payout-crew),youPct:Math.max(0,1-crewPct)};
}
// The weeks on the ground are paid for. weekTick charges the whole payroll and every retainer
// once a week, for as many weeks as the job holds the crew — and it charges for everyone on the
// books, so somebody you benched still draws their wages. Benching saves their cut and nothing
// else, which is the single most misleading thing this screen could leave out.
function jobWeeks(job){return Math.max(1,job.final?BAL.finalWeeks:(job.weeks||BAL.jobWeeks[job.tier]||1));}
function jobUpkeep(job){
  const perWeek=retainerCost()+payroll().filter(c=>c.status==="crew").reduce((n,c)=>n+c.upkeep,0);
  return {perWeek,weeks:jobWeeks(job),total:perWeek*jobWeeks(job)};
}
// What the commander keeps on an ordinary night, over many of them: every verdict's takings
// weighted by its own odds, with the crew's percentage off each. A botched or blown job pays
// nothing, so it contributes nothing but still costs its share of the odds — which is the whole
// reason benching for a bigger share can leave you with less.
const VERDICT_PAY=[0,0,BAL.messyPay,1,1.08];   // disaster, botched, messy, success, clean
function outcome(n,strong){
  const s=n<0?moneyExact(-n)+" out of pocket":"about "+moneyExact(n);
  return strong?"<b>"+s+"</b>":s;
}
function expectedKeep(job,a){
  const sp=jobSplit(job,a.team);
  const p=[a.pDis,a.pFail,a.pMessy,a.pSuccess,a.pClean];
  let n=0;
  for(let t=0;t<5;t++)n+=(p[t]/100)*job.payout*VERDICT_PAY[t]*sp.youPct;
  return Math.round(n-jobUpkeep(job).total);   // the wages are paid whatever the night does
}

/* ---------------------------- PROGRESSION ----------------------------- */
// Everyone who goes on a job learns from it. Experience ranks are earned, not bought.
const XP_STEPS=BAL.xpSteps;
function xpNeeded(exp){return exp>=5?null:XP_STEPS[exp];}
// Ranking is a name with consequences: what clients post, what they pay, who will sign,
// whether the crew stays, and how hard the police look. Resolved in one place.
// Eight names across six hundred points, not six across a hundred. The old ladder was climbed
// out of in eight jobs; this one is a career, and the last two rungs are most of it.

// The ladder, written out from RANKS itself — so the help can never describe a ladder the
// game no longer has. It went stale once already, when six rungs became eight.
function rankLadderText(){
  return "<b>Ranking — what the name buys.</b> The name decides everything a client, a recruit and a police force does with you, and it decides how hard the rooms you are offered are defended. "
    +RANKS.slice().reverse().map(r=>"<b>"+r[1]+"</b> ("+r[0]+"): "+r[2].note).join(" ")
    +" Clean and successful work raises it — a job well beneath your name barely moves it — messy work, leaks, arrests and walkouts lower it, and "
    +BAL.idleEvery+" weeks without a job costs a point. A name unused is a name forgotten.";
}
function rankInfo(rep){for(const r of RANKS)if(rep>=r[0])return Object.assign({name:r[1],min:r[0]},r[2]);const r=RANKS[RANKS.length-1];return Object.assign({name:r[1],min:r[0]},r[2]);}
function rankName(rep){return rankInfo(rep).name;}
function rankNext(rep){let nx=null;for(const r of RANKS){if(r[0]>rep&&(nx===null||r[0]<nx[0]))nx=r;}return nx?Object.assign({name:nx[1],min:nx[0]},nx[2]):null;}
// Who will sign: a Legend does not join a Nobody. The ranking that opens the door for a given experience.
function canSign(c){return c.isPlayer||c.exp<=rankInfo(S.rep).hireExp;}
function repToSign(exp){let best=null;for(const r of RANKS){if(r[2].hireExp>=exp&&(best===null||r[0]<best))best=r[0];}return best===null?0:best;}
function signWhy(c){return "A "+EXP[c.exp-1]+" won't sign with a "+rankName(S.rep)+" crew. Ranking "+repToSign(c.exp)+" opens the door.";}

function fill2(s,v){return String(s).replace(/\{(\w+)\}/g,(_,k)=>v[k]!==undefined?v[k]:"{"+k+"}");}
// A draw that remembers: the last sixty lines drawn anywhere stay out of the pool, so a line read
// on this trip is not read on the next. The report does the same inside narrate().
function freshPick(rng,pool){S.recent=S.recent||[];const key=p=>typeof p==="string"?p:p[0];let cand=pool.filter(p=>!S.recent.includes(key(p)));if(!cand.length)cand=pool;const pk=pick(rng,cand);S.recent.push(key(pk));if(S.recent.length>60)S.recent.shift();return pk;}
// The report in two halves: "pre" is the arrival and the plan, "post" is the work and what it cost.
// A twist can sit between them. The clock carries over.
function narrate(job,a,tier,rng,x,mode,clock){
  mode=mode||"all";x=x||{};
  const co=COUNTRY_BY_NAME[job.country];
  const team=a.team;
  let h=clock?clock.h:(job.tags.includes("night")?ri(rng,20,23):ri(rng,7,15)),m=clock?clock.m:ri(rng,0,59);
  const lines=[];
  const stood=[];                                 // {id,k}: who learned a trade the crew hasn't got
  const push=(t,tone,at,who,act)=>{m+=ri(rng,4,26);if(m>=60){m-=60;h=(h+1)%24;}
    const L={t:String(h).padStart(2,"0")+":"+String(m).padStart(2,"0"),x:t,tone:tone||""};
    if(at)L.at=at;if(who)L.who=who;if(act)L.act=act;
    lines.push(L);};
  S.recent=S.recent||[];
  const key=p=>typeof p==="string"?p:p[0];
  const fresh=pool=>{let cand=pool.filter(p=>!S.recent.includes(key(p)));if(!cand.length)cand=pool;const pk=pick(rng,cand);S.recent.push(key(pk));if(S.recent.length>60)S.recent.shift();return pk;};
  const pair=(p,c)=>typeof p==="string"?p:(c&&c.isPlayer?p[1]:p[0]);
  const nm=c=>c.isPlayer?"You":c.first;
  const say=(pool,c,vars,tone,at,act)=>push(fill2(pair(fresh(pool),c),Object.assign({X:c?nm(c):"",P:cap(police(co))},vars||{})),tone,at||(c?techSite(c.tech):null),c?c.id:null,act);
  const someone=()=>team.length?pick(rng,team):null;
  // two missing trades are two people's weeks, not one person's — unless the crew is smaller
  // than the number of gaps, and then somebody covers two and still learns one thing.
  const someoneNew=()=>{if(!team.length)return null;const used=stood.map(s=>s.id);const free=team.filter(c=>used.indexOf(c.id)<0);return pick(rng,free.length?free:team);};
  if(mode!=="post"){
    const kind=co.terrain.some(t=>["islands","coast","port","fjords","canal"].includes(t))&&chance(rng,0.5)?"water":co.terrain.includes("megacity")?"city":co.terrain.includes("mountains")?"mountain":"road";
    const how=fresh(HOW[kind]);
    push(fill2(fresh(ARRIVE),{city:job.city,country:job.country,how,How:cap(how)}),"","road","*");
    if(chance(rng,0.5))push(fresh(WEATHER),"","road");
    a.checks.forEach(c=>{
      if(c.ok){
        if(c.why==="local national")say(LOCAL,c.c,null,"","road");
        else if(c.why.indexOf("papers")===0)say(PAPERS,c.c,null,"","road","paper");
      } else say(OUT,c.c,{why:c.why},"warn","road","down");
    });
    const speaker=team.find(c=>c.langs.some(l=>co.langs.includes(l)));
    if(speaker)say(SPEAKS,speaker,{L:co.langs.find(l=>speaker.langs.includes(l))},"","road","talk");
    else if(team.length)say(NOSPEAK,someone(),{L:co.langs[0]},"warn","road","talk");
    // you can't be across the street and at the door: if your own trade is wanted, you work it
    const you=team.find(c=>c.isPlayer);
    if(you&&job.techs.includes(you.tech))push(fresh(YOU_INSIDE),"",techSite(you.tech),you.id);
    else if(you)push(fill2(fresh(YOU_RUN),{place:fresh(PLACES)}),"","watch",you.id);
    else if(team.length){const lead=team.filter(c=>c.role==="commander").sort((p,q)=>q.cmd-p.cmd)[0];if(lead)say(STANDIN,lead,null,"","watch");else push(fresh(LEADERLESS),"warn","watch");}
    let tb=0;
    job.techs.forEach(t=>{const c=team.find(y=>y.tech===t);
      if(c){if(tb<2){push(nm(c)+" ("+TECH_BY_K[t].l+") "+pair(fresh(TECH_BEAT[t]),c)+".","",techSite(t),c.id);tb++;}}
      else{const st=someoneNew();if(st)stood.push({id:st.id,k:t});say(NOTECH,st,{T:TECH_BY_K[t].l,aT:anA(TECH_BY_K[t].l)},"warn",techSite(t));}});
    job.know.forEach(k=>{const c=team.find(y=>y.know.includes(k));
      if(c)say(KNOW_HAS,c,{k,y:KNOW_BEAT[k]},"","inside");
      else push(fill2(fresh(KNOW_NONE),{k,y:KNOW_BEAT[k],Y:cap(KNOW_BEAT[k])}),"warn","inside");});
    if(team.length&&chance(rng,0.7))say(TEXTURE,someone(),null,"","watch");
  }
  if(mode!=="pre"){
    const B=CAT_BEATS[job.cat]||CAT_BEATS.vault;
    const take=(arr,n,tone)=>{for(let i=0;i<n;i++)push(fresh(arr),tone,"inside","*");};
    if(tier===4)take(B.go,2,"good");
    else if(tier===3){take(B.go,1,"good");take(B.hitch,1,"warn");push(fresh(FIXED),"good");}
    else if(tier===2){take(B.hitch,2,"warn");take(B.go,1,"good");}
    else if(tier===1){take(B.hitch,1,"warn");take(B.blow,1,"bad");}
    else take(B.blow,2,"bad");
    if(team.length&&chance(rng,0.3))say(TEXTURE,someone(),null,"","watch");
    const wheel=team.find(c=>c.tech==="wheelman");
    if(tier>=2){if(wheel)say(EXIT_OK,wheel,{W:nm(wheel)},"","exit");else push(fresh(EXIT_NOWHEEL),"","exit","*");}
    else{
      let s=fill2(fresh(POLICE_COME),{P:cap(police(co)),p:police(co),where:fresh(WHERE)});
      s+=" "+(wheel?fill2(pair(fresh(GAP_WHEEL),wheel),{W:nm(wheel)}):fresh(GAP_NONE));
      push(s,"bad","exit","*");
    }
    if(x.leaked)push("Someone talked. "+cap(police(co))+" were waiting two streets away.","bad","exit","*");
    (x.fallout||[]).forEach(e=>push(e,"bad","exit",null,"down"));
    if(x.heatGain>0)push(fill2(fresh(MORNING),{P:cap(police(co)),p:police(co),thing:fresh(THINGS),n:x.heatGain}),x.heatGain>=20?"warn":"");
    else if(chance(rng,0.5))push(fresh(QUIET));
    if(x.take>0)push(fill2(fresh(SPLIT),{g:money(x.take),c:money(x.cuts),n:money(x.net)}),"good");
    else push(fresh(NOPAY),"bad");
    (x.betrayals||[]).forEach(b=>push(b,"bad"));
  }
  return {lines,clock:{h,m},stood};
}

    {t:"Send someone to sit with him until it's done",req:{tech:["enforcer"]},pri:2,ok:"{X} keeps him company. He doesn't call anyone.",slow:"{X} sits with him. He stays quiet; the job runs a man short.",bad:"Nobody is built for that conversation. He makes the call.",wrong:{dm:-20,jail:1,heat:10}},
    {t:"Cut his phone — and the building's",req:{tech:["hacker"]},pri:3,ok:"{X} kills his phone and the building's. He can't call anyone.",slow:"{X} kills the phones. Late — he had time for one call, and it wasn't the police.",bad:"Nobody can touch the phones. He makes the call.",wrong:{dm:-20,jail:1,heat:10}},
    {t:"Pay double",pri:5,fallback:true,lose:0.3,bad:"You pay double to a man who could have been talked down. He takes it, and he remembers that you pay.",ok:"You pay. It hurts; it works."},
    {t:"Threaten him over the phone",pri:9,bad:"He hangs up and dials. Sirens in eight minutes.",wrong:{dm:-26,jail:1,heat:14}},
    {t:"Ignore him",pri:9,bad:"He wasn't bluffing.",wrong:{dm:-30,jail:1,hurt:1,heat:16}},
   ]},
  {k:"plan",cats:["vault","recovery","sabotage","cyber","infiltration"],h:"The plan is last year's",
   s:["The floor plan is last year's. The room you want has moved a floor, and the clock hasn't.","The corridor on the plan is a wall. The room you came for is somewhere above or below it, and the clock is still running.","Somebody refitted the building since the plan was drawn. The door you want is not where the door is."],
   opts:[
    {t:"Go down through the ceiling",req:{tech:["demolitions"]},pri:1,ok:"{X} measures twice and the ceiling opens like a door. Clear.",slow:"{X} makes a hole. It takes longer than a door would have.",bad:"Nobody knows how. You make noise and a hole in the wrong place.",wrong:{dm:-18,hurt:1,heat:10}},
    {t:"Pull the new plan from the manager's terminal",req:{tech:["hacker"]},pri:2,ok:"{X} has this year's plan in four minutes. Clear.",slow:"{X} finds the plan. Eleven minutes of the clock gone.",bad:"Nobody can get into the terminal. You guess.",wrong:{dm:-16,hurt:1,heat:8}},
    {t:"Walk into the manager's office and ask",req:{tech:["face","grifter","infiltrator"]},pri:3,ok:"{X} asks a night manager for directions and gets them, with a coffee. Clear.",slow:"{X} gets directions, and a manager who remembers a face.",bad:"Nobody on the crew can bluff a manager. Security is called.",wrong:{dm:-22,jail:1,heat:12}},
    {t:"Try every door on the floor",req:{tech:["safecracker"]},pri:4,ok:"{X} opens six doors in eleven minutes; the seventh is the one. Clear.",slow:"{X} opens doors until the right one. The clock nearly runs out.",bad:"Six locked doors and nobody who can open them.",wrong:{dm:-18,heat:8}},
    {t:"Split up and search",pri:9,bad:"Four people on four floors. One of them meets a guard.",wrong:{dm:-26,jail:1,heat:12}},
    {t:"Abort — out the way you came",pri:5,fallback:true,lose:1,bad:"You leave by the way you came, past a ceiling somebody could have opened. Empty-handed, and seen on the stairs.",ok:"You leave with nothing and with everyone."},
   ]},
  {k:"checkpoint",cats:["smuggling","interception","escort","extraction"],h:"A checkpoint where none was",
   s:["A checkpoint on the only road, and the paperwork is in yesterday's name.","Cones, a barrier and two officers, on a road that had none of them this morning. The manifest is in the wrong name.","The road narrows to one lane and a man with a torch. The papers in the glovebox say something the cargo doesn't."],
   opts:[
    {t:"Re-paper it in the back seat",req:{tech:["forger"]},pri:1,ok:"{X} rewrites the manifest with a borrowed pen. The officer stamps it. Clear.",slow:"{X} fixes the papers. The officer wonders why you needed a minute.",bad:"Nobody can fix paper that fast. The officer keeps the manifest.",wrong:{dm:-22,jail:1,heat:12}},
    {t:"Take the track the dogs don't work",req:{tech:["smuggler"]},pri:2,ok:"{X} knows a farm road. Twenty minutes longer, no checkpoint. Clear.",slow:"{X} finds a way around. It costs an hour and a tyre.",bad:"Nobody knows the back roads. You drive in circles and back to the checkpoint.",wrong:{dm:-18,hurt:1,heat:10}},
    {t:"Call the sergeant who owes a favour",req:{tech:["fixer"]},pri:3,ok:"{X} makes a call. The barrier lifts. Clear.",slow:"{X} makes a call; the barrier lifts, eventually, for a price.",bad:"There is no sergeant to call. The barrier stays down.",wrong:{dm:-18,jail:1,heat:10}},
    {t:"Bore the officer into waving you through",req:{tech:["grifter","face"]},pri:4,ok:"{X} explains the paperwork for so long the officer waves you on. Clear.",slow:"{X} talks the officer round. He writes down the plate.",bad:"Nobody talks well enough. The officer opens the back.",wrong:{dm:-24,jail:1,heat:12}},
    {t:"Force it",pri:9,bad:"The barrier breaks. So does the plan. Gunfire.",wrong:{dm:-30,jail:1,hurt:1,heat:18}},
    {t:"Turn back",pri:5,fallback:true,lose:0.5,bad:"You turn back from a barrier that could have been talked, papered or driven around. The turn is noticed, and followed for a while.",ok:"You turn back. Half the cargo reaches the buyer by another route, a week late."},
   ]},
  {k:"radio",cats:["negotiation","forgery","recovery","infiltration","surveillance"],h:"A police radio in the buyer's car",
   s:["In the buyer's car, under a coat: a police radio, switched on.","The buyer's driver gets out to smoke, and on the passenger seat, half under a jacket, is a police radio, and it is live.","The buyer's car has a radio that isn't for music. It's on, and it's quiet in the way those radios are quiet."],
   opts:[
    {t:"Have the lookout read the street before you move",req:{tech:["lookout"]},pri:1,ok:"{X} counts two plain cars and a van. You move the meeting; the van doesn't follow. Clear.",slow:"{X} reads the street. You move late, and one car follows for a while.",bad:"Nobody is watching the street. The van is already behind you.",wrong:{dm:-24,jail:1,heat:12}},
    {t:"Swap the goods for the decoy and finish the deal",req:{tech:["forger","pickpocket"]},pri:2,ok:"{X} makes the swap under a table. They buy the decoy; you keep the goods and the fee. Clear.",slow:"{X} makes the swap. They notice a day later.",bad:"Nobody can make a swap like that. They buy the real thing and arrest you for it.",wrong:{dm:-24,jail:1,heat:12}},
    {t:"Change the venue, now",req:{tech:["fixer","face"]},pri:3,ok:"{X} moves the meeting to a place with two exits and a cousin at the door. Clear.",slow:"{X} moves the meeting. The other side is late and nervous.",bad:"Nobody has a second venue. You do the deal where they chose.",wrong:{dm:-20,jail:1,heat:10}},
    {t:"Draw on them",pri:9,bad:"Nobody draws faster than a radio. Everybody is taken.",wrong:{dm:-32,jail:1,hurt:1,heat:20}},
    {t:"Finish the deal as planned",pri:9,bad:"The deal finishes. So does the night, in a cell.",wrong:{dm:-28,jail:1,heat:16}},
    {t:"Walk away with the goods",pri:5,fallback:true,lose:1,bad:"You walk, with the goods and without the fee, past a street somebody could have read. The walk is watched.",ok:"You keep the goods and lose the fee. Nobody is taken."},
   ]},
  {k:"down",cats:["extraction","escort","sabotage","interception"],h:"{M} is hit",
   s:["{M} is hit. Moving {M} means leaving the take; leaving {M} means leaving {M}.","{M} goes down and doesn't get up. There is one car, one bag, and a choice nobody wanted to make out loud.","{M} is bleeding, and not slowly. The take is in the other room. You can carry one of them."],
   opts:[
    {t:"Patch and carry — both",req:{tech:["cleaner"],know:["Medicine"]},pri:1,ok:"{X} stops the bleeding with a belt and a shirt; the take goes in the same car. Clear.",slow:"{X} stops the bleeding. The take is heavier than it was.",bad:"Nobody knows what to do with a wound. You carry {M} and lose the take.",wrong:{dm:-16,hurt:1,heat:6,lose:1}},
    {t:"Carry {M} and the take",req:{tech:["enforcer"]},pri:2,ok:"{X} carries {M} and the bag. Nobody argues. Clear.",slow:"{X} carries {M}. The bag comes in a second trip that nearly doesn't happen.",bad:"Nobody can carry both. You choose {M}, and the take stays.",wrong:{dm:-14,hurt:1,lose:1,heat:6}},
    {t:"Leave {M} with a phone for an ambulance",pri:9,bad:"The ambulance comes with a patrol car. {M} is treated, then held.",wrong:{dm:-14,jail:1,heat:10}},
    {t:"Call an ambulance and wait",pri:9,bad:"Everyone waits with {M}. Everyone is taken with {M}.",wrong:{dm:-30,jail:1,heat:16}},
    {t:"Leave the take, carry {M} out",pri:5,fallback:true,lose:1,bad:"You leave the take that somebody could have carried, and {M} is carried badly. Nobody is paid, and {M} does not thank you.",ok:"You leave the take and carry {M}. Nobody is taken."},
    {t:"Split up",pri:9,bad:"{M} is left with one person and no plan. Both are found.",wrong:{dm:-26,jail:1,hurt:1,heat:14}},
   ]},
  {k:"alarm",cats:["vault","cyber","sabotage","surveillance","recovery"],h:"The alarm goes early",
   s:["The alarm trips forty seconds before the plan said it could. Response time: six minutes.","A bell, inside the wall, that wasn't supposed to ring for another forty seconds. Six minutes until a car.","The panel goes red early. Somebody in a control room is picking up a phone. Six minutes, give or take."],
   opts:[
    {t:"Kill the alarm at the panel",req:{tech:["hacker"]},pri:1,ok:"{X} kills it at the panel and tells the monitoring company it was a fault. Clear.",slow:"{X} kills it. The company sends a car anyway, slowly.",bad:"Nobody can touch the panel. It keeps ringing.",wrong:{dm:-20,jail:1,heat:12}},
    {t:"Take what's in hand — overwatch calls the window",req:{tech:["overwatch"]},pri:2,ok:"{X} calls it from the roof: four minutes, one car. You leave with what you have. Clear.",slow:"{X} calls the window. You leave with less than you came for.",bad:"Nobody is watching the street. You leave blind.",wrong:{dm:-16,hurt:1,heat:10}},
    {t:"Leave now, the long way",req:{tech:["wheelman"]},pri:3,ok:"{X} takes the long way out and the response car takes the short way in. Clear.",slow:"{X} drives. The long way is very long tonight.",bad:"Nobody knows a long way. You meet the response car at the corner.",wrong:{dm:-22,jail:1,heat:12}},
    {t:"Rush the rest of the plan",pri:9,bad:"Six minutes of plan in three. Somebody drops something; somebody is cut.",wrong:{dm:-20,hurt:1,heat:12}},
    {t:"Freeze and wait for it to stop",pri:9,bad:"It doesn't stop. The car does.",wrong:{dm:-30,jail:1,heat:16}},
    {t:"Abort with nothing",pri:5,fallback:true,lose:1,bad:"You leave with nothing, from an alarm that could have been silenced. The response car passes you on the way out, and slows.",ok:"You leave with nothing and with everyone."},
   ]},
  {k:"tail",cats:["surveillance","infiltration","escort","negotiation","forgery","smuggling"],h:"The grey car",
   s:["A grey car has been behind you since the second roundabout. It is not lost.","The same grey saloon, three cars back, for the last four turns. Nobody drives like that by accident.","A grey car took the last turn with you, and the one before. Its driver is not looking at the road."],
   opts:[
    {t:"The lookout calls it; you drop it in the market",req:{tech:["lookout"]},pri:1,ok:"{X} calls the turn. The grey car meets a fruit cart and a one-way street. Clear.",slow:"{X} calls it. You lose the car, and forty minutes.",bad:"Nobody can read a tail. The grey car is still there at the job.",wrong:{dm:-22,jail:1,heat:12}},
    {t:"Lose it",req:{tech:["wheelman"]},pri:2,ok:"{X} loses it in three turns and a car park. Clear.",slow:"{X} loses it, eventually, and a wing mirror.",bad:"Nobody drives like that. The grey car follows you home.",wrong:{dm:-20,heat:14}},
    {t:"Have a word with the driver at the lights",req:{tech:["enforcer"]},pri:3,ok:"{X} walks back at the lights and says one sentence. The grey car turns off. Clear.",slow:"{X} has a word. The driver has a radio; the word is heard by more people than intended.",bad:"Nobody on the crew has that kind of word. The driver has a badge.",wrong:{dm:-26,jail:1,heat:14}},
    {t:"Confront them",pri:9,bad:"Two of them, one of you, and a badge. Somebody is taken.",wrong:{dm:-26,jail:1,heat:14}},
    {t:"Ignore it",pri:9,bad:"The grey car sees the whole job. Then its friends do.",wrong:{dm:-30,jail:1,heat:18}},
    {t:"Call it off for today",pri:5,fallback:true,lose:0.5,bad:"You call it off from a car that could have been lost. Tomorrow the grey car is there again, and it has brought a friend.",ok:"You drive to a restaurant and eat slowly. The job happens tomorrow, for half."},
   ]},
  {k:"guard",cats:["vault","infiltration","recovery","sabotage","surveillance"],h:"A guard who isn't on the roster",
   s:["A torch on the stairs. The roster said nobody until four; the torch says otherwise.","Footsteps in a corridor that was empty on every night you watched it. He is whistling, which means he hasn't seen you yet.","A guard, on the wrong floor, at the wrong hour, with a radio on his belt and a coffee in his hand."],
   opts:[
    {t:"Send the enforcer to have a quiet word",req:{tech:["enforcer"]},pri:1,ok:"{X} meets him on the landing. He decides he saw nothing, and means it. Clear.",slow:"{X} deals with him. It takes longer than a word should, and there is a mark on the wall.",bad:"Nobody on the crew is built for that. He sees four people and a bag, and reaches for the radio.",wrong:{dm:-22,jail:1,heat:12}},
    {t:"Talk him into believing you belong there",req:{tech:["face","grifter","infiltrator"]},pri:2,ok:"{X} is the contractor from the lift company, annoyed at the hour. He apologises. Clear.",slow:"{X} talks him round. He wants a name for his log, and gets one that will not hold for long.",bad:"Nobody can bluff a man with a torch. He asks for a pass, and there isn't one.",wrong:{dm:-20,jail:1,heat:10}},
    {t:"Lift his radio and keys as he passes",req:{tech:["pickpocket"]},pri:3,ok:"{X} brushes past him in the dark. He has no radio and no keys and doesn't know it yet. Clear.",slow:"{X} gets the radio. He notices the keys are gone before you are, and starts looking.",bad:"Nobody has hands like that. He feels the touch and turns round.",wrong:{dm:-18,jail:1,heat:10}},
    {t:"Rush him",pri:9,bad:"He is faster to the radio than four people are to the stairs. A name is said into it.",wrong:{dm:-26,jail:1,hurt:1,heat:14}},
    {t:"Hide and hope",pri:9,bad:"He finds the bag first, then the people it belongs to.",wrong:{dm:-28,jail:1,heat:14}},
    {t:"Abort — out the back, empty-handed",pri:5,fallback:true,lose:1,bad:"You go out the back from a guard who could have been handled. He is quicker to the radio than you are to the door.",ok:"You go down the fire stairs while he goes up the main ones. Nobody is taken, nothing is paid."},
   ]},
  {k:"buyer",cats:["forgery","negotiation","smuggling","recovery","interception"],h:"The buyer is late",
   s:["The buyer is forty minutes late and the goods are in the car, in a street with cameras. Every minute is a photograph.","The buyer's man calls: an hour, maybe two. You are sitting on the goods, in public, with a car that is starting to look parked.","The buyer hasn't come. The goods are in the boot, the boot is in a car park, and the car park has a man in a booth who has looked at you twice."],
   opts:[
    {t:"Have the lookout hold the street while you wait",req:{tech:["lookout"]},pri:1,ok:"{X} watches the street for an hour and calls it clean every ten minutes. The buyer comes. Clear.",slow:"{X} watches the street. A patrol goes past twice; the second time, slowly.",bad:"Nobody is watching. By the time the buyer comes, so has somebody else.",wrong:{dm:-20,jail:1,heat:12}},
    {t:"Have the fixer find a second buyer, tonight",req:{tech:["fixer"]},pri:2,ok:"{X} makes three calls. A different buyer, a different car park, the same money. Clear.",slow:"{X} finds another buyer. Less money, and a long drive.",bad:"Nobody has a second buyer's number. You wait, in the open.",wrong:{dm:-16,heat:10}},
    {t:"Move the goods to a lock-up and reschedule",req:{tech:["cleaner","quarter","smuggler"]},pri:3,ok:"{X} has a lock-up with a roof and no camera. The goods sleep there; the deal happens tomorrow. Clear.",slow:"{X} finds somewhere. Moving it twice costs an hour and a scratched crate.",bad:"There is nowhere to put it. It stays in the car, and the car stays in the street.",wrong:{dm:-16,heat:10}},
    {t:"Wait in the car with the engine running",pri:9,bad:"An hour of an engine running is a thing people notice. One of them has a uniform.",wrong:{dm:-24,jail:1,heat:14}},
    {t:"Leave the goods in the car and come back later",pri:9,bad:"The car is towed. The goods go with it, to a compound with a police desk.",wrong:{dm:-28,heat:12,lose:1}},
    {t:"Call it off, keep the goods",pri:5,fallback:true,lose:1,bad:"You leave with the goods, from a street somebody could have watched for you. The buyer's man sees you go, and says so to somebody.",ok:"You drive away with the goods and without the fee. Nobody is taken."},
   ]},
  {k:"dog",cats:["smuggling","extraction","recovery","interception","sabotage"],h:"The dog",
   s:["A dog at the fence that nobody mentioned, and it has decided about you.","Something big and quiet on the other side of the gate, watching, not yet barking. It was not in the file.","A dog on a chain long enough to matter, between the crew and the door."],
   opts:[
    {t:"The chemist has something for it",req:{tech:["chemist","medic"]},pri:1,ok:"{X} throws a rag over the fence. The dog is asleep in ninety seconds and fine by morning. Clear.",slow:"{X} sorts the dog. It takes two rags and five minutes of noise.",bad:"Nobody has anything for a dog. It has something for you.",wrong:{dm:-18,hurt:1,heat:8}},
    {t:"The smuggler knows dogs",req:{tech:["smuggler","handler"]},pri:2,ok:"{X} walks up to the fence talking nonsense, and the dog decides you are the boring kind of stranger. Clear.",slow:"{X} settles the dog. It barks twice first, and a light goes on somewhere.",bad:"Nobody knows dogs. It knows you.",wrong:{dm:-18,hurt:1,heat:8}},
    {t:"Go over somewhere the dog isn't",req:{tech:["climber","drone"]},pri:3,ok:"{X} finds the corner the chain doesn't reach and the wall it can't see. Clear.",slow:"{X} finds another way in. It is a long way round and a long way up.",bad:"Nobody can find another way in. There is the dog's way, and the dog.",wrong:{dm:-16,hurt:1,heat:8}},
    {t:"Run past it",pri:9,bad:"Nobody outruns a dog. Somebody finds that out.",wrong:{dm:-24,hurt:1,heat:12}},
    {t:"Deal with it, loudly",pri:9,bad:"The noise wakes the street. The street wakes the police.",wrong:{dm:-26,jail:1,heat:16}},
    {t:"Go round the long way and lose an hour",pri:5,fallback:true,lose:0.5,bad:"You go the long way round a dog that could have been settled. The long way has a fence, and the fence has a light.",ok:"You go the long way. It costs an hour, and the hour costs half the take."},
   ]},
  {k:"power",cats:["vault","cyber","sabotage","surveillance","infiltration","forgery"],h:"The power goes",
   s:["Every light in the building goes out at once, and so does the plan that needed them on.","The screens go black, the lift stops between floors, and somewhere a battery-backed alarm starts thinking about it.","The street goes dark, the building goes dark, and four people stand very still in it."],
   opts:[
    {t:"The electrician finds the generator",req:{tech:["electrician"]},pri:1,ok:"{X} has the building on its own generator in three minutes, and the alarm never wakes. Clear.",slow:"{X} finds the generator. It takes ten minutes of dark, and the dark is loud.",bad:"Nobody knows where a generator would be. You work by phone light, badly.",wrong:{dm:-18,hurt:1,heat:8}},
    {t:"Change the plan to one that works in the dark",req:{tech:["hacker","safecracker"]},pri:2,ok:"{X} says the dark is a gift: no cameras, no locks that need power. It is. Clear.",slow:"{X} makes a new plan in the dark. It is slower than the old one by a long way.",bad:"Nobody knows how to work without the lights. Things are dropped.",wrong:{dm:-16,hurt:1,heat:8}},
    {t:"Overwatch calls the street while you wait",req:{tech:["overwatch","lookout"]},pri:3,ok:"{X} says the whole district is dark and nobody is coming for one building. The power is back in twenty. Clear.",slow:"{X} calls it. The wait is longer than called, and a van comes to look at the substation.",bad:"Nobody knows if this is the street or the building. You wait blind.",wrong:{dm:-20,jail:1,heat:10}},
    {t:"Carry on in the dark",pri:9,bad:"The plan was drawn for a lit building. Somebody falls. Something breaks.",wrong:{dm:-22,hurt:1,heat:10}},
    {t:"Wait for it to come back",pri:9,bad:"It comes back with a maintenance crew and a police escort.",wrong:{dm:-28,jail:1,heat:14}},
    {t:"Leave with what's in hand",pri:5,fallback:true,lose:0.6,bad:"You leave in a dark that somebody could have lit, with half the bags and a torch that goes on at the wrong moment.",ok:"You take what is in the bags and leave by the stairs. Some of it was the point; most of it wasn't."},
   ]},
  {k:"phone",cats:["extraction","escort","surveillance","negotiation","recovery"],h:"A phone in the bag",
   s:["Something in the bag is ringing. Nobody on the crew put a phone in the bag.","A buzz from under the seat, from a phone nobody owns. Somebody is calling it, and somebody knows where it is.","The bag has a phone in it that was not there when the bag was packed. It has a signal, and a caller."],
   opts:[
    {t:"Signals finds the tracker and kills it",req:{tech:["signals","hacker"]},pri:1,ok:"{X} has it in bits in forty seconds and the SIM in a drain. Whoever is calling is calling a puddle. Clear.",slow:"{X} kills it. It had been talking for a while before it stopped.",bad:"Nobody knows what to do with it. It keeps ringing, and keeps reporting.",wrong:{dm:-22,jail:1,heat:14}},
    {t:"The cleaner dumps it somewhere useful",req:{tech:["cleaner","pickpocket"]},pri:2,ok:"{X} drops it in the pocket of a man boarding a coach to the coast. Whoever follows it follows him. Clear.",slow:"{X} gets rid of it. Somewhere close, which is not the same as somewhere useful.",bad:"Nobody thinks to move it. It travels with you, to the safe house.",wrong:{dm:-24,jail:1,heat:16}},
    {t:"Change the route, now",req:{tech:["wheelman","analyst"]},pri:3,ok:"{X} turns off the plan and onto a road nobody would pick. The phone goes in a bin at a petrol station. Clear.",slow:"{X} changes the route. The phone has already said where you were heading.",bad:"Nobody knows another route. You drive the planned one with a phone that knows it.",wrong:{dm:-20,jail:1,heat:12}},
    {t:"Answer it",pri:9,bad:"A voice asks who this is. Then the voice knows.",wrong:{dm:-24,jail:1,heat:14}},
    {t:"Throw it out of the window and carry on",pri:9,bad:"It lands on the route. Whoever is watching now has the route.",wrong:{dm:-22,jail:1,heat:14}},
    {t:"Stop, strip everything, start again",pri:5,fallback:true,lose:0.5,bad:"You stop on a verge to strip the bags, with a phone somebody could have killed in forty seconds. It has already said where the verge is.",ok:"You pull over, empty every bag onto a verge, and leave the phone in the grass. An hour gone; half the night with it."},
   ]},
  {k:"boat",cats:["smuggling","extraction","recovery","escort"],h:"The boat isn't there",
   s:["The quay is empty. The boat that was to be here at two is not here at two, or at half past.","The mooring is bare rope and a gull. No boat, no message, and a tide that will not wait.","There is a boat at the quay. It is the wrong boat, and its crew is asleep and not yours."],
   opts:[
    {t:"The skipper finds another way off the water",req:{tech:["skipper","diver"]},pri:1,ok:"{X} knows a fisherman two coves along who owes something. You are at sea by three. Clear.",slow:"{X} finds a boat. It is slower and smaller, and it is nearly dawn when it leaves.",bad:"Nobody knows the coast. You stand on a quay waiting for a boat that has been sold.",wrong:{dm:-22,jail:1,heat:12}},
    {t:"The smuggler's man with a truck",req:{tech:["smuggler","fixer"]},pri:2,ok:"{X} makes a call. A truck comes instead of a boat; the border it crosses is a different one. Clear.",slow:"{X} finds a truck. It is a long drive and a nervous driver.",bad:"Nobody has a man with a truck. You are on foot on a coast road at three in the morning.",wrong:{dm:-20,jail:1,heat:12}},
    {t:"The pilot's strip up the coast",req:{tech:["pilot"]},pri:3,ok:"{X} has a strip forty minutes north and a plane that will start. Clear.",slow:"{X} gets you airborne. Late, and low on fuel.",bad:"Nobody flies. The sea stays the only way out, and there is no boat on it.",wrong:{dm:-20,jail:1,heat:10}},
    {t:"Wait on the quay",pri:9,bad:"The boat doesn't come. A patrol launch does.",wrong:{dm:-28,jail:1,heat:16}},
    {t:"Swim for the other boat",pri:9,bad:"The water is colder than it looked and the other boat has a crew. Somebody doesn't make it aboard.",wrong:{dm:-26,hurt:1,jail:1,heat:12}},
    {t:"Drive inland, try another border next week",pri:5,fallback:true,lose:0.5,bad:"You drive inland from a coast somebody knew a way off. The inland road has a checkpoint the coast did not.",ok:"You drive inland and sit on the cargo for a week. Half of it is still worth something by then."},
   ]},
  {k:"kid",cats:["sabotage","vault","recovery","interception","forgery","surveillance"],h:"A kid on a bike",
   s:["A kid on a bike has stopped at the end of the street and is watching, and is not going anywhere.","There is a boy of about twelve on the wall opposite, eating crisps and looking straight at the van.","A kid with a bike and a phone, at the corner, taking an interest. Kids remember plates."],

  if(job.tier>=3)st["tier"+Math.min(4,job.tier)]=(st["tier"+Math.min(4,job.tier)]||0)+1;
  if(P.crewId)st.crewJobs++;
  if(twRec)twRec.free?st.twistRight++:st.twistWrong++;
  const scratched=Object.keys(marks).length>0;
  st.hurt+=Object.keys(marks).filter(k=>marks[k]==="hurt").length;
  st.taken+=Object.keys(marks).filter(k=>marks[k]==="taken").length;
  st.lost+=Object.keys(marks).filter(k=>marks[k]==="gone"||marks[k]==="quit").length;
  if(scratched)st.streak=0;else{st.streak++;if(st.streak>st.bestStreak)st.bestStreak=st.streak;}
  S.reports=S.reports||[];S.reports.push(Object.assign({},res));if(S.reports.length>80)S.reports.shift();
  S.pendingJob=null;
  if(d)Object.assign(d,res,{narrative,revealed:d.revealed,done:false,awaiting:false,resolved:true,twist:twRec});
  save();
  return res;
}

function makeEvent(rng){
  const rc=recruits().filter(c=>c.status==="crew");
  const gone=S.roster.filter(c=>c.status==="gone");
  if(!S.twistBag||!S.twistBag.length){S.twistBag=WEEKLY.map(w=>w.k);for(let i=S.twistBag.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));const t=S.twistBag[i];S.twistBag[i]=S.twistBag[j];S.twistBag[j]=t;}}
  let k=null;
  for(let i=0;i<S.twistBag.length;i++){
    const W=WEEKLY.find(w=>w.k===S.twistBag[i]);
    const ok=W.rival?!!rival():(W.needsGone?gone.length>0:(W.k==="detective"||rc.length>=1));
    if(ok){k=S.twistBag.splice(i,1)[0];break;}
  }
  if(!k)return null;
  const W=WEEKLY.find(w=>w.k===k);
  let M=null;
  // trouble picks on the ones nobody has paid lately
  const pool=rc.filter(c=>!paidUp(c)).length?rc.filter(c=>!paidUp(c)):rc;
  if(W.needsGone)M=pick(rng,gone);
  else if(pool.length){M=W.lowest?pool.slice().sort((a,b)=>(b.lowRun||0)-(a.lowRun||0)||a.loyalty-b.loyalty)[0]:pick(rng,pool);}
  const L=rc.filter(c=>!M||c.id!==M.id).sort((a,b)=>a.loyalty-b.loyalty)[0]||null;
  const v={M:M?M.first:"one of the crew",G:M?M.first:"someone",L:L?L.first:"somebody",
    R:rival()?cap(rival().name):"another crew",B:rival()?rival().boss:"their boss",D:detective()?detective().name:"a detective"};
  return {k,h:fill2(W.h,v),text:fill2(W.text,v),mId:M?M.id:null,lId:L?L.id:null,opts:W.opts.map(o=>({t:fill2(o.t,v),req:o.req||null})),v,outcome:null,week:S.week};
}
// Who a choice needs on the crew. "quiet" is either of the two trades that can end something
// without it becoming a story — an enforcer to do it or a cleaner to make it read as nothing.
function eventCan(o){
  if(!o||!o.req)return true;
  const has=k=>recruits().some(c=>c.status==="crew"&&c.tech===k);
  if(o.req==="quiet")return has("enforcer")||has("cleaner");
  return has(o.req);
}
function eventNeedWord(o){
  if(!o||!o.req)return "";
  return o.req==="quiet"?"needs an Enforcer or a Cleaner":"needs a"+(/^[aeiou]/i.test(o.req)?"n ":" ")+cap(o.req);
}
function eventApply(ev,i){
  const W=WEEKLY.find(w=>w.k===ev.k);const o=W.opts[i];if(!o)return;const rng=freshRng();
  if(!eventCan(o))return;
  const M=ev.mId?byId(ev.mId):null,L=ev.lId?byId(ev.lId):null;
  const rc=()=>recruits().filter(c=>c.status==="crew");
  let eff=o;let out=o.out||"";
  if(o.roll){let r=rng(),acc=0,ch=o.roll[o.roll.length-1];for(const c of o.roll){acc+=c.p;if(r<acc){ch=c;break;}}eff=Object.assign({},o,ch);out=ch.out;}
  const lines=[fill2(out,ev.v)];
  if(eff.money){S.money=Math.max(0,S.money+eff.money);}
  if(eff.moneyPer){const n=rc().length;S.money=Math.max(0,S.money+eff.moneyPer*n);lines.push(money(-eff.moneyPer*n)+" paid out.");}
  if(eff.heat){S.heat=clamp(S.heat+eff.heat,0,120);}
  if(eff.loyAll){rc().forEach(c=>{if(!M||c.id!==M.id)c.loyalty=clamp(c.loyalty+eff.loyAll,0,100);});lines.push("Crew loyalty "+(eff.loyAll>0?"+":"")+eff.loyAll+".");}
  if(M&&eff.loy!=null){M.loyalty=clamp(M.loyalty+eff.loy,0,100);}
  if(M&&eff.cut){M.cut=Math.round((M.cut+eff.cut)*100)/100;}
  if(M&&eff.set==="gone"){M.status="gone";M._touched=true;leaveCrew(M);if(!eff.noLoose)looseAdd(M,"resign");}
  if(M&&eff.set==="jailed"){M.status="jailed";M.out=S.week+(eff.weeks||3);M._touched=true;leaveCrew(M);}
  if(M&&W.kill){M.status="gone";M._touched=true;leaveCrew(M);}
  if(M&&W.gone&&M.status==="crew"){M.status="gone";M._touched=true;leaveCrew(M);looseAdd(M,"resign");}
  if(eff.lose==="lowest"&&L&&L.status==="crew"){L.status="gone";L._touched=true;leaveCrew(L);looseAdd(L,"poach");}
  if(eff.rehire&&M&&recruits().length<crewSeats()){M.status="crew";M.loyalty=30;M._touched=true;S.crewIds.push(M.id);}
  else if(eff.rehire&&M){lines.push("No place free; "+M.first+" stays outside, and quiet.");}
  const rvName=rival()?rival().name:null;
  if(eff.poach!=null){if(eff.poach>0)S.poach={name:rvName||(M?M.first:"the other crew"),weeks:eff.poach};else S.poach=null;}
  else if(W.k==="poach"&&!S.poach)S.poach={name:rvName||(M?M.first:"the other crew"),weeks:3};
  if(eff.rivalDown&&rival())rival().standing=clamp(rival().standing-eff.rivalDown,0,999);
  if(eff.rivalUp&&rival())rival().standing=clamp(rival().standing+eff.rivalUp,0,999);
  if(eff.detDown&&detective())detective().file=Math.max(0,detective().file-eff.detDown);
  if(eff.detUp&&detective())detective().file=clamp(detective().file+eff.detUp,0,100);
  if(eff.poachWeeks)S.poach={name:rival()?rival().name:"the other crew",weeks:eff.poachWeeks};
  if(eff.weeks){for(let i=0;i<eff.weeks;i++)weekTick(rng);refreshJobs(false);}
  logMsg(ev.h+" — "+lines[0],eff.set==="gone"||W.kill?"bad":"warn",true);
  ev.outcome=lines.join(" ");
  checkOver();
  save();
}

function weekTick(rng){
  S.week++;
  const rc=payroll().filter(c=>c.status==="crew");   // every crew's people are on the books
  let up=retainerCost();rc.forEach(c=>up+=c.upkeep);
  if(up>0){
    if(S.money>=up)S.money-=up;
    else{
      S.money=0;rc.forEach(c=>c.loyalty=clamp(c.loyalty-9,0,100));
      const dropped=RETAINERS.filter(r=>hasRetainer(r.k));
      if(dropped.length){dropped.forEach(r=>{S.retainers[r.k]=false;});logMsg("Couldn't make payroll ("+money(up)+"). Loyalty slipping, and "+dropped.map(r=>r.l.toLowerCase()).join(" and ")+" stopped answering.","bad",true);}
      else logMsg("Couldn't make payroll ("+money(up)+"). Loyalty slipping.","bad");
    }
  }
  // a mole on the books leaks a little heat every week, unexplained
  const moles=rc.filter(c=>c.mole).length;
  if(moles)S.heat=clamp(S.heat+3*moles,0,120);
  // the crew's standing drifts loyalty: nobody stays loyal to a nobody
  const rk=rankInfo(S.rep);
  if(rk.loyDrift)rc.forEach(c=>c.loyalty=clamp(c.loyalty+rk.loyDrift,0,100));
  // someone out there is buying your crew drinks
  if(S.poach&&S.poach.weeks>0){
    S.poach.weeks--;
    const low=recruits().filter(c=>c.status==="crew"&&!paidUp(c)).sort((a,b)=>a.loyalty-b.loyalty)[0];
    if(low&&low.loyalty<60&&chance(rng,0.35)){low.status="gone";low._touched=true;leaveCrew(low);looseAdd(low,"poach");logMsg(low.first+" left for "+S.poach.name+"'s crew.","bad",true);}
    if(S.poach.weeks<=0){S.poach=null;logMsg("The drinks have stopped. Whoever was going has gone.","");}
  }
  S.roster.forEach(c=>{
    if(c.status==="injured"&&S.week>=c.out){c.status="crew";logMsg(c.first+" is back on the job.","good");}
    if(c.status==="jailed"&&S.week>=c.out){c.status="available";c.jail+=1;logMsg(c.first+" walked. Back on the roster, a year older.","warn");}
  });
  S.heat=clamp(S.heat-heatDrop(),0,120);
  // a country you have worked lately is watching for you, and forgets slowly
  if(S.coHeat)for(const k in S.coHeat){S.coHeat[k]=Math.max(0,S.coHeat[k]-BAL.countryHeatDecay);if(!S.coHeat[k])delete S.coHeat[k];}
  // A name unused is a name forgotten. Weeks spent on a job are not unused weeks — the counter
  // is reset by finishing one — so a three-week operation never costs you for taking it.
  S.idle=(S.idle||0)+1;
  if(S.idle>=BAL.idleEvery){S.idle=0;if(S.rep>0)S.rep=Math.max(0,S.rep-BAL.idleDecay);}
  // somebody else is working the board, and somebody is keeping a file
  if(!S.rival&&S.rep>=20){S.rival=makeRival(rng);
    S.notices=(S.notices||[]).concat([{k:"The competition · week "+S.week,h:cap(S.rival.name),
      text:S.rival.boss+" runs "+S.rival.name+" out of the same online board as you. They take a posting most weeks — the best one left — and their standing rises when they do. When they are ahead of you, they start buying your crew drinks. The Log says where they stand.",go:"log",goText:"The record →"}]);
    logMsg(cap(S.rival.name)+" is working the same board. "+S.rival.boss+" runs it.","warn",true);}
  if(!S.det&&(S.heat>=30||S.rep>=40)){S.det=makeDetective(rng);
    logMsg(S.det.name+" has your alias in a folder.","warn",true);}
  rivalWorks(rng);detWatch(rng);looseTick(rng);grudgeTick(rng);
  if(S.heat>=raidAt()){
    const rc2=recruits().filter(c=>c.status==="crew");
    if(rc2.length){
      const n=Math.min(rc2.length,ri(rng,1,2));
      for(let i=0;i<n;i++){const c=rc2[i];c.status="jailed";c.out=S.week+ri(rng,4,7);leaveCrew(c);}
      logMsg("RAID"+(detective()?" — "+detective().name+" came with a squad":". The heat boiled over")+" — "+n+" of your crew taken.","bad",true);sfx("siren");
      if(detective())detective().file=Math.max(0,detective().file-25);
    }
    S.money=Math.round(S.money*(safehouseLevel()>=3?0.85:0.7));
    S.heat=58;
  }
  // something that isn't a job, every few weeks
  if(S.nextTwistWeek==null)S.nextTwistWeek=S.week+ri(rng,3,6);
  if(!S.event&&S.week>=S.nextTwistWeek){
    const ev=makeEvent(rng);
    if(ev){S.event=ev;S.nextTwistWeek=S.week+ri(rng,3,7);}
    else S.nextTwistWeek=S.week+2;
  }
  checkOver();
}

function checkOver(){
  if(S.over)return;
  if(payroll().length>0)return;
  const fees=S.roster.filter(c=>c.status==="available").map(c=>c.fee);
  const minFee=fees.length?Math.min.apply(null,fees):Infinity;
  if(S.money<minFee){S.over="lose";logMsg("No crew, no float. The name means nothing now.","bad",true);}
}

function logMsg(t,tone,big){S.log.unshift({t,tone:tone||"",big:!!big,wk:S.week});if(S.log.length>100)S.log.pop();}

// The roster is rebuilt from the seed; only changed members are stored.
function packState(){
  const ov={};
  S.roster.forEach(c=>{if(c.status!=="available"||c.vetted||c._touched){ov[c.id]={status:c.status,out:c.out,loyalty:c.loyalty,vetted:c.vetted,vetFlag:c.vetFlag,jail:c.jail,exp:c.exp,xp:c.xp||0,attrs:c.attrs,cut:c.cut,paidUntil:c.paidUntil==null?null:c.paidUntil,lowRun:c.lowRun||0,traits:c.traits,coolUntil:c.coolUntil||0,ranWith:c.ranWith||0,talks:c.talks||0};}});
  const d=Object.assign({},S);delete d.roster;delete d.modal;d.ov=ov;
  return d;
}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(packState()));}catch(e){}try{SET.lastSeen=Date.now();saveSettings();}catch(e){}}
function load(){
  try{
    const r=localStorage.getItem(SAVE_KEY);if(!r)return false;
    const d=JSON.parse(r);if(!d||d.v!==2||!d.seed||!d.player)return false;
    const roster=buildRoster(d.seed);
    const ov=d.ov||{};
    roster.forEach(c=>{const o=ov[c.id];if(o)Object.assign(c,o);});
    delete d.ov;d.roster=roster;d.modal=null;d.player.isPlayer=true;d.player.status="crew";d.player.role="commander";if(!d.player.cmd)d.player.cmd=5;
    migrateReports(d);
    S=d;
    // a file opened before temperament and the face builder existed gets both, from its own seed
    if(S.player&&!S.player.traits){
      const r=mulberry32((S.player.avseed||S.seed)>>>0);
      const t=[];const n=chance(r,0.34)?0:chance(r,0.72)?1:2;
      for(let i=0;i<n;i++){const x=pick(r,TRAITS);if(t.indexOf(x.k)<0)t.push(x.k);}
      S.player.traits=t;
    }
    if(S.player&&!S.player.face)S.player.face=randomFace(mulberry32(((S.player.avseed||1)*2654435761)>>>0),S.player.gender);
    // A file from before the long game: the last score used to be one job at ranking 100, and
    // postings had no weeks on them. seenFinal was a flag and is now which stage was announced.
    S.cased=S.cased||{};S.coHeat=S.coHeat||{};S.idle=S.idle||0;S.grudges=S.grudges||[];S.revenge=S.revenge||null;
    S.finalStage=S.finalStage||0;S.finalBack=S.finalBack||0;
    if(typeof S.seenFinal!=="number")S.seenFinal=S.seenFinal?0:-1;
    (S.jobs||[]).forEach(j=>{if(!j.final&&!j.weeks)j.weeks=BAL.jobWeeks[j.tier]||1;});
    S.jobs=(S.jobs||[]).filter(j=>!j.final);   // the old single final score is not this one
    if(S.finalDone)S.finalStage=FINAL_STAGES.length;
    // a job left mid-decision picks up exactly there: the report so far, then the six options
    const P=S.pendingJob;
    if(P&&P.twist&&Array.isArray(P.pre)){
      const narrative=P.pre.slice();narrative.push({t:"— —",x:P.twist.cue||"Then it goes wrong.",tone:"bad",twist:true});
      S.modal={type:"result",data:{id:P.jobId+"-w"+P.week,week:P.week,job:P.job,narrative,revealed:narrative.length,done:false,
        twist:{h:P.twist.h,s:P.twist.s,opts:P.twist.opts.map(o=>o.t)},awaiting:true,resolved:false,teamIds:P.teamIds,events:[],growth:[],rk:[],marks:{}}};
    } else if(P){S.pendingJob=null;}
    // a recruitment trip stopped at the meeting picks up exactly there, the same way
    const R=S.pendingTrip;
    if(R&&R.snag&&Array.isArray(R.pre)){
      const cc=byId(R.cid);
      const narrative=R.pre.slice();narrative.push({t:"— —",x:R.snag.h+".",tone:"bad",twist:true});
      S.modal={type:"trip",data:{cid:R.cid,name:cc?cc.n:"",first:cc?cc.first:"",city:R.city,country:R.country,week:R.week,fee:R.fee,
        narrative,revealed:narrative.length,done:false,awaiting:true,resolved:false,snag:R.snag,trouble:R.trouble,outcome:null}};
    } else if(R){S.pendingTrip=null;}
    return true;
  }catch(e){return false;}
}
// Recaps written before the report spoke to the player as "you" still name the player.
// Turn those lines to second person, verbs included, so old files read like new ones.
function migrateReports(d){
  const first=d.player&&d.player.first;if(!first||!d.reports||!d.reports.length)return;
  const V={does:"do",knows:"know",has:"have",is:"are",owns:"own",walks:"walk",papers:"paper",makes:"make",buys:"buy",measures:"measure",lifts:"lift",counts:"count",finds:"find",brings:"bring",points:"point",improvises:"improvise",stays:"stay",crosses:"cross",reads:"read",gets:"get",orders:"order",handles:"handle",learns:"learn",plays:"play",sleeps:"sleep",keeps:"keep",argues:"argue",wins:"win",listens:"listen",times:"time",ages:"age",needs:"need",stands:"stand",tests:"test",wants:"want",bumps:"bump",sits:"sit",spots:"spot",turns:"turn",books:"book",talks:"talk",takes:"take",runs:"run",watches:"watch",goes:"go"};
  const sp=v=>V[v]||(v.endsWith("ies")?v.slice(0,-3)+"y":(/(?:[sxz]|[sc]h)es$/.test(v)?v.slice(0,-2):v.endsWith("s")?v.slice(0,-1):v));
  const q=first.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const rePoss=new RegExp("(^|\\. )"+q+"['’]s ","g");
  const reOut=new RegExp("(^|\\. )"+q+" doesn['’]t come","g");
  const reHome=new RegExp("(^|\\. )"+q+" is home","g");
  const reTech=new RegExp("(^|\\. )"+q+" \\(([^)]+)\\) (\\w+)","g");
  const reVerb=new RegExp("(^|\\. )"+q+" (\\w+)","g");
  d.reports.forEach(r=>{
    (r.narrative||[]).forEach(l=>{
      if(typeof l.x!=="string"||l.x.indexOf(first)<0)return;
      l.x=l.x.replace(rePoss,"$1Your ").replace(reOut,"$1You can't get in").replace(reHome,"$1You're home")
        .replace(reTech,(m,p,t,v)=>p+"You ("+t+") "+sp(v))
        .replace(reVerb,(m,p,v)=>p+"You "+sp(v))
        .replace("You point and pays","You point and pay");
    });
    (r.growth||[]).forEach(g=>{if(g.first===first)g.first="You";});
  });
}
// A game lives in one browser's storage, which is one cleared cache away from gone.
// The file can be written out as text and read back in anywhere.
function exportCode(){
  try{
    const s=JSON.stringify(packState());
    const b=btoa(unescape(encodeURIComponent(s)));
    return "CREW1:"+b;
  }catch(e){return "";}
}
function readCode(code){
  try{
    let s=String(code||"").trim().replace(/\s+/g,"");
    if(s.indexOf("CREW1:")===0)s=s.slice(6);
    if(!s)return {err:"Nothing pasted."};
    const j=decodeURIComponent(escape(atob(s)));
    const d=JSON.parse(j);
    if(!d||d.v!==2||!d.seed||!d.player||!d.player.n)return {err:"That is not a Crew file."};
    return {d,n:d.player.n,week:d.week||1,rep:d.rep||0,money:d.money||0,crew:(d.crewIds||[]).length};
  }catch(e){return {err:"That code is damaged — a character is missing or an extra one crept in."};}
}
function importCode(code){
  const r=readCode(code);
  if(r.err){note(r.err);return false;}
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(r.d));}catch(e){note("This browser is refusing to keep saves.");return false;}
  if(!load()){note("The file would not open.");return false;}
  UI.panel=null;UI.office=false;UI.impInfo=null;UI.impRaw="";
  logMsg("File read in from a code — "+r.n+", week "+r.week+".","good",true);
  save();render();window.scrollTo(0,0);
  return true;
}
function wipe(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}

function money(n){n=Math.round(n);const neg=n<0;n=Math.abs(n);let s;
  if(n>=1e6)s="$"+(n/1e6).toFixed(n>=1e7?1:2).replace(/\.?0+$/,"")+"M";
  else if(n>=1e3)s="$"+Math.round(n/1000)+"K";
  else s="$"+n;
  return (neg?"−":"")+s;}
function moneyExact(n){n=Math.round(n);const neg=n<0;n=Math.abs(n);
  return (neg?"−":"")+"$"+String(n).replace(/\B(?=(\d{3})+(?!\d))/g,",");}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
function cap(s){s=String(s);return s.charAt(0).toUpperCase()+s.slice(1);}
function pips(n){let s='<span class="exp" title="'+EXP[n-1]+'">';for(let i=0;i<5;i++)s+='<i class="pip'+(i<n?" f":"")+'"></i>';return s+"</span>";}
function diffbar(d,hot){const filled=Math.round(d/100*8);let s='<span class="diffbar" aria-label="difficulty '+d+'">';for(let i=0;i<8;i++)s+='<i class="'+(i<filled?(hot?"h":"f"):"")+'"></i>';return s+"</span>";}

// The tabs sit under the top bar, which wraps to two rows when the window is narrow. Measure it
// rather than guessing, on every render and whenever the window changes shape.
// The logotype is set to fill the column at Anton's width, which is measured. If Anton has not
// loaded — a blocked font CDN, a copy opened offline — a fallback face has its own metrics, and a
// wide one would run the title off the page. So it is measured on the screen it is actually on and
// brought down if it does not fit. Same reason as syncTopbarH below: the number is not knowable
// in advance, so it is read rather than assumed.
function fitTitle(){
  try{
    const h=document.querySelector(".hero.title h1");if(!h||!h.getBoundingClientRect)return;
    const wrap=document.querySelector(".wrap");if(!wrap)return;
    h.style.fontSize="";
    const col=wrap.getBoundingClientRect().width-32;
    if(!col)return;
    const rng=document.createRange();rng.selectNodeContents(h);
    const ink=rng.getBoundingClientRect().width;
    if(!ink||ink<=col)return;
    h.style.fontSize=Math.floor(parseFloat(getComputedStyle(h).fontSize)*col/ink)+"px";
  }catch(e){}
}
try{
  window.addEventListener("resize",fitTitle);
  if(document.fonts&&document.fonts.ready&&document.fonts.ready.then)document.fonts.ready.then(fitTitle);
}catch(e){}
function syncTopbarH(){
  try{
    const tb=document.querySelector(".topbar");
    const h=tb?Math.round(tb.getBoundingClientRect().height):0;
    if(h)document.documentElement.style.setProperty("--topbar-h",h+"px");
  }catch(e){}
}
