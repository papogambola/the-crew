const BUILD="build 11 · 15 September 2026";
function footNote(){return '<div class="foot-note">THE CREW · a work of fiction. Every operative, client and job is invented.<br>Black ink, white paper, and a great deal of nerve. · '+BUILD+'</div>';}

/* ------------------------------ ACTIONS ------------------------------- */
function bind(){
  const q=document.getElementById("q");
  if(q){q.oninput=()=>{S.filter.q=q.value;S.shown=30;const v=q.value;render();const q2=document.getElementById("q");if(q2){q2.focus();q2.setSelectionRange(v.length,v.length);}};}
  const sel=(id,key)=>{const el=document.getElementById(id);if(el)el.onchange=()=>{S.filter[key]=el.value;S.shown=30;render();};};
  sel("ftech","tech");sel("frole","role");sel("fnat","nat");sel("fsort","sort");
  const js=document.getElementById("jsort");if(js)js.onchange=()=>{S.jobSort=js.value;save();render();};
  const lw=document.getElementById("logweek");if(lw)lw.onchange=()=>{S.logWeek=lw.value;save();render();};
  const pn=document.getElementById("pname");if(pn)pn.oninput=()=>{draft.name=pn.value;const btn=document.querySelector('[data-act=confirm-create]');if(btn)btn.disabled=!draft.name.trim();};
  const pnat=document.getElementById("pnat");if(pnat)pnat.onchange=()=>{draft.nat=pnat.value;rollDraftProfile();showCreate();};
  const pt=document.getElementById("ptech");if(pt)pt.onchange=()=>{draft.tech=pt.value;rollDraftProfile();showCreate();};
}
function showCreate(){root.innerHTML=screenCreate()+chrome();bind();}

document.addEventListener("click",e=>{
  userGestured=true;musicSync();
  const t=e.target.closest("[data-act]");if(!t)return;
  const act=t.getAttribute("data-act"),id=t.getAttribute("data-id"),k=t.getAttribute("data-k"),v=t.getAttribute("data-v");
  const cl=t.classList;
  if(cl.contains("btn")||cl.contains("tab")||cl.contains("jobrow")||cl.contains("genbtn")||cl.contains("burger"))sfx("click");
  switch(act){
    case "info": UI.info=!UI.info; render(); break;
    case "info-close": if(e.target===t||cl.contains("x")||cl.contains("btn")){UI.info=false;render();} break;
    case "tut-start": UI.info=false; UI.office=false; UI.panel=null; tutStart(); break;
    case "tut-next": if(TUT.step>=TUT_STEPS.length-1)tutEnd(); else tutGo(TUT.step+1); break;
    case "tut-back": tutGo(TUT.step-1); break;
    case "tut-skip": tutEnd(); break;
    case "office": UI.office=!UI.office; UI.panel=null; UI.info=false; render(); break;
    case "off-close": UI.office=false; UI.panel=null; render(); break;
    case "off-sound": SET.sound=!SET.sound; saveSettings(); if(SET.sound)sfx("open"); musicSync(); render(); break;
    case "off-music": SET.music=!SET.music; saveSettings(); musicSync(); render(); break;
    case "off-radio-start": SET.sound=true; SET.music=true; if(SET.volume<=0)SET.volume=0.6; saveSettings(); userGestured=true; musicState="idle"; musicSync(); render(); break;
    case "skip-ticker": tickerFinish(); break;
    case "speed-down": SET.speed=clamp(speedIdx()-1,0,SPEEDS.length-1); saveSettings(); render(); break;
    case "speed-up": SET.speed=clamp(speedIdx()+1,0,SPEEDS.length-1); saveSettings(); render(); break;
    case "recap": {
      const r=(S.reports||[]).find(x=>x.id===id); if(!r)break;
      S.modal={type:"result",data:Object.assign({},r,{revealed:r.narrative.length,done:true,replay:true})};
      const vt=verdictTrack(r.tier); musicPlay(vt[0],vt[1],true); render(); break;
    }
    case "off-vol": { const r=t.getBoundingClientRect(); setVolume(SET.volume+((e.clientX<r.left+r.width/2)?-0.2:0.2)); break; }
    case "off-vol-down": setVolume(SET.volume-0.2); break;
    case "off-vol-up": setVolume(SET.volume+0.2); break;
    case "off-bright": { const tr=document.getElementById("brightTrack"); if(tr){const r=tr.getBoundingClientRect(); if(r.width>0&&e.clientX>=r.left-6&&e.clientX<=r.right+6)setBright(55+45*clamp((e.clientX-r.left)/r.width,0,1));} break; }
    case "off-bright-down": setBright(SET.bright-5); break;
    case "off-bright-up": setBright(SET.bright+5); break;
    case "off-lang": UI.panel="lang"; render(); break;
    case "off-controls": UI.panel="controls"; render(); break;
    case "off-exit": UI.panel="exit"; UI.confirmNew=false; render(); break;
    case "off-hat": if(S){UI.panel="file";render();} break;
    case "off-panel-close": if(e.target===t||cl.contains("x")){UI.panel=null;render();} break;
    case "off-burn": UI.confirmNew=true; render(); break;
    case "off-burn-yes": wipe(); S=null; draft=null; UI.office=false; UI.panel=null; UI.confirmNew=false; render(); window.scrollTo(0,0); break;
    case "begin": draft=null; showCreate(); break;
    case "to-title": draft=null; render(); break;
    case "continue": if(load())render(); break;
    case "draft-gender": draft.gender=v; showCreate(); break;
    case "reroll-av": draft.avseed=ri(freshRng(),1,1e9); showCreate(); break;
    case "reroll-profile": rollDraftProfile(); showCreate(); break;
    case "confirm-create": {
      const nm=(draft.name||"").trim(); if(!nm)break;
      const player=Object.assign({id:"YOU",isPlayer:true,n:nm,first:nm.split(" ")[0],gender:draft.gender,nat:draft.nat,avseed:draft.avseed,status:"crew",cut:0,upkeep:0,loyalty:100,greed:0,mole:false,vetted:true,vetFlag:false,limits:[]},draft.profile);
      newGame(player); draft=null; render(); break;
    }
    case "tab": S.tab=k; S.modal=null; render(); window.scrollTo(0,0); break;
    case "scrim":
      if(e.target===t||cl.contains("x")||cl.contains("btn")){
        if(S&&S.modal&&S.modal.type==="result"&&!S.modal.data.done){tickerFinish();break;}
        if(S&&S.modal&&S.modal.type==="result")musicStop();
        if(S)S.modal=null;UI.panel=null;render();window.scrollTo(0,0);
      }
      break;
    case "open-recruit": S.modal={type:"recruit",id}; render(); break;
    case "open-job": S.tab="jobs"; S.jobOpen=id; S.modal=null; render(); window.scrollTo(0,0); break;
    case "close-job": S.jobOpen=null; render(); break;
    case "map-country": S.jobOpen=null; S.jobCountry=(S.jobCountry===t.getAttribute("data-cn"))?null:t.getAttribute("data-cn"); render(); break;
    case "map-clear": S.jobOpen=null; S.jobCountry=null; render(); break;
    case "more": S.shown+=30; render(); break;
    case "strip-toggle": S.stripHidden=!S.stripHidden; save(); render(); break;
    case "hire": hire(id); break;
    case "vet": vet(id); break;
    case "bonus": bonus(id); break;
    case "drop": drop(id); break;
    case "execute": doExecute(id); break;
    case "laylow": layLow(); break;
    case "newgame": wipe(); S=null; draft=null; render(); window.scrollTo(0,0); break;
  }
});
document.addEventListener("keydown",e=>{
  userGestured=true;musicSync();
  const tag=e.target&&e.target.tagName;
  const typing=tag==="INPUT"||tag==="SELECT"||tag==="TEXTAREA";
  if(!typing&&(e.key==="i"||e.key==="I")&&!e.ctrlKey&&!e.metaKey&&!e.altKey){UI.info=!UI.info;render();return;}
  if(!typing&&!UI.office&&!UI.info&&S&&!S.over&&!S.modal&&"1234".includes(e.key)&&e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){S.tab=["crew","jobs","roster","log"][+e.key-1];render();window.scrollTo(0,0);return;}
  if(e.key==="Escape"){
    if(UI.info){UI.info=false;render();}
    else if(TUT.on){tutEnd();}
    else if(UI.panel){UI.panel=null;render();}
    else if(UI.office){UI.office=false;render();}
    else if(S&&S.modal){if(S.modal.type==="result"&&!S.modal.data.done)tickerFinish();else{if(S.modal.type==="result")musicStop();S.modal=null;render();}}
    else if(S&&S.jobOpen){S.jobOpen=null;render();}
    else{UI.office=true;UI.panel=null;render();}
    return;
  }
  if(e.key==="Enter"||e.key===" "){
    const el=document.activeElement;if(!el||!el.closest)return;
    const row=el.closest(".jobrow");if(row){e.preventDefault();row.click();}
  }
});

function hire(id){
  const c=byId(id);if(!c||c.status!=="available")return;
  if(recruits().length>=CREW_SLOTS){note("All four seats are taken. Cut someone loose first.");return;}
  if(S.money<c.fee){note("Not enough for the fee.");return;}
  S.money-=c.fee;c.status="crew";c._touched=true;S.crewIds.push(c.id);sfx("coin");
  logMsg("Hired "+c.n+" — "+TECH_BY_K[c.tech].l+", "+c.nat+", "+(c.role==="commander"?"commander":"soldier")+" ("+money(c.fee)+").","");
  if(S.modal&&S.modal.type==="recruit")S.modal=null;
  save();render();
}
function vet(id){
  const c=byId(id);if(!c||c.vetted||S.money<VET_COST)return;
  S.money-=VET_COST;
  const sharpest=field().reduce((s,x)=>Math.max(s,x.attrs.brains),40);
  let flagged=c.mole;
  if(c.mole&&sharpest<55&&chance(freshRng(),0.35))flagged=false;
  c.vetted=true;c.vetFlag=flagged;c._touched=true;
  logMsg("Vetted "+c.n+" ("+money(VET_COST)+"). "+(flagged?"Flag raised — informant ties.":"Came back clean."),flagged?"warn":"");
  save();render();
}
function bonus(id){
  const c=byId(id);if(!c)return;const cost=bonusCostFor(c);
  if(S.money<cost){note("Can't cover the bonus.");return;}
  S.money-=cost;c.loyalty=clamp(c.loyalty+14,0,100);c._touched=true;
  logMsg("Paid "+c.first+" a "+money(cost)+" bonus. Loyalty up.","good");save();render();
}
function drop(id){
  const c=byId(id);if(!c)return;
  c.status="available";c.loyalty=clamp(c.loyalty-6,0,100);c._touched=true;
  S.crewIds=S.crewIds.filter(x=>x!==id);
  logMsg("Cut "+c.first+" loose.","");checkOver();save();render();
}
function doExecute(id){
  const j=S.jobs.find(x=>x.id===id);if(!j)return;
  if(!assessJob(j).canRun)return;
  const ti=(S.trackIdx||0)%TRACKS.report.length;S.trackIdx=ti+1;
  musicPlay(TRACKS.report[ti],"report track "+(ti+1)+" of "+TRACKS.report.length,false);
  const res=executeJob(j);
  sfx("open");
  S.jobOpen=null;
  S.modal={type:"result",data:res};
  render();
}
function layLow(){
  S.heat=clamp(S.heat-15,0,120);
  logMsg("Laid low for a week. Heat cooling.","");
  weekTick(freshRng());refreshJobs(false);S.modal=null;save();render();
}
function note(msg){logMsg(msg,"warn");render();}

document.addEventListener("visibilitychange",()=>{musicSync();});
// hovering a posting lights its country on the map
document.addEventListener("mouseover",e=>{

document.addEventListener("mouseout",e=>{
  const row=e.target&&e.target.closest?e.target.closest(".jobrow"):null;if(!row)return;
  document.querySelectorAll(".mk.hov").forEach(m=>m.classList.remove("hov"));
});
let STORAGE_OK=true;
try{localStorage.setItem("thecrew_probe","1");localStorage.removeItem("thecrew_probe");}catch(e){STORAGE_OK=false;}
(function boot(){
  loadSettings();applySettings();
  try{
    const hot=window.claude&&window.claude.hot;
    if(hot&&typeof hot.snapshot==="function")hot.snapshot(()=>S?packState():null);
    if(hot&&typeof hot.ready==="function"){hot.ready(function(){render();});return;}
  }catch(e){}
  render();
})();
