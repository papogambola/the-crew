<title>The Crew</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600;700&family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --paper:#f6f4ee;
    --paper-2:#efece3;
    --card:#fbfaf6;
    --ink:#111010;
    --ink-2:#4a463e;
    --muted:#726c60;
    --line:#d9d5c8;
    --line-2:#c4bfae;
    --stamp:#9a2b1e;
    --good:#2f6b34;
    --warn:#8a6212;
    --bad:#9a2b1e;
    --shadow:0 1px 0 rgba(17,16,16,.04), 0 8px 24px -18px rgba(17,16,16,.5);
    color-scheme:light;
    --f-logo:"Anton","Impact","Oswald","Arial Narrow",sans-serif;
    --f-disp:"Oswald","Arial Narrow",system-ui,sans-serif;
    --f-body:"Spectral","Iowan Old Style",Georgia,serif;
    --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--f-body);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    background-image:repeating-linear-gradient(0deg,transparent,transparent 27px,rgba(17,16,16,.02) 27px,rgba(17,16,16,.02) 28px);
  }
  .wrap{max-width:1060px;margin:0 auto;padding:0 16px 64px}
  .mono{font-family:var(--f-mono)}
  .num{font-variant-numeric:tabular-nums}
  h1,h2,h3{font-family:var(--f-disp);font-weight:600;margin:0;letter-spacing:.02em;text-wrap:balance;line-height:1.05}
  button{font-family:inherit;color:inherit;cursor:pointer}
  a{color:inherit}
  .kicker{font-family:var(--f-mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}

  .topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--paper);border-bottom:2px solid var(--ink)}
  .topbar-in{max-width:1060px;margin:0 auto;padding:8px 112px 8px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{font-family:var(--f-logo);font-weight:400;font-size:24px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;line-height:1}
  .stat{display:flex;flex-direction:column;line-height:1;gap:3px;min-width:72px}
  .stat .l{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .stat .v{font-family:var(--f-mono);font-size:15px;font-weight:500}
  .heatwrap{min-width:132px;flex:1 1 132px;max-width:220px}
  .heatbar{height:9px;border:1px solid var(--ink);background:repeating-linear-gradient(45deg,var(--paper-2),var(--paper-2) 5px,transparent 5px,transparent 10px);position:relative;overflow:hidden}
  .heatbar>i{position:absolute;inset:0;width:0;background:var(--ink);transition:width .5s ease}
  .heatbar.hot>i{background:var(--stamp)}
  .spacer{flex:1 1 auto}

  .tabs{display:flex;border-bottom:2px solid var(--ink);margin:0 0 18px;flex-wrap:wrap}
  .tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:12px 16px 10px;font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.12em;font-size:14px;color:var(--muted)}
  .tab.on{color:var(--ink);border-color:var(--stamp)}
  .tab .b{font-family:var(--f-mono);font-size:10px;color:var(--muted);margin-left:6px}

  .panel{background:var(--card);border:1px solid var(--line-2);box-shadow:var(--shadow)}
  .panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .panel-h h2{font-size:16px;letter-spacing:.08em;text-transform:uppercase}
  .panel-b{padding:16px}
  .grid{display:grid;gap:14px}
  .g-hq{grid-template-columns:1.3fr 1fr}
  @media(max-width:720px){.g-hq{grid-template-columns:1fr}}

  .rule{height:1px;background:var(--line);border:0;margin:12px 0}
  .btn{appearance:none;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.1em;font-size:13px;padding:9px 16px;transition:.12s}
  .btn:hover{background:#000}
  .btn:disabled{opacity:.32;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--ink)}
  .btn.ghost:hover{background:var(--paper-2)}
  .btn.sm{font-size:11px;padding:6px 11px;letter-spacing:.08em}
  .btn.stamp{border-color:var(--stamp);background:var(--stamp)}
  .btn.stamp:hover{background:#7f2116}

  .tag{display:inline-block;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line-2);padding:2px 6px;color:var(--ink-2);background:var(--paper)}
  .tag.spec{border-color:var(--ink);color:var(--ink)}
  .tag.pass{border-style:dashed}
  .tag.ok{border-color:var(--good);color:var(--good)}
  .tag.no{border-color:var(--stamp);color:var(--stamp)}
  .chip{font-family:var(--f-mono);font-size:10px;padding:1px 6px;border:1px solid;letter-spacing:.05em;text-transform:uppercase}
  .c-good{color:var(--good);border-color:var(--good)}
  .c-warn{color:var(--warn);border-color:var(--warn)}
  .c-bad{color:var(--bad);border-color:var(--bad)}
  .c-ink{color:var(--ink);border-color:var(--ink)}

  .rosterbar{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
  .field{display:flex;flex-direction:column;gap:3px}
  .field label{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  input[type=text],select{font-family:var(--f-mono);font-size:13px;padding:7px 9px;border:1px solid var(--line-2);background:var(--paper);color:var(--ink);max-width:100%}
  input[type=text]:focus,select:focus,.tab:focus-visible,.btn:focus-visible,button:focus-visible,.jobrow:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
  .count{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-left:auto;padding-bottom:8px}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .id{border:1px solid var(--line-2);background:var(--card);display:flex;flex-direction:column;position:relative}
  .id.you{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
  .id.slot{border-style:dashed;justify-content:center;align-items:center;min-height:200px;color:var(--muted);font-family:var(--f-mono);font-size:12px;text-align:center;padding:16px;gap:10px}
  .id .top{display:flex;gap:10px;padding:11px 11px 8px}
  .id .av{width:60px;height:72px;flex:none;border:1px solid var(--ink);background:#fff}
  .id .who{min-width:0;flex:1}
  .id .nm{font-family:var(--f-disp);font-size:16px;line-height:1.05;letter-spacing:.02em}
  .id .sub{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-top:3px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
  .id .spec{font-family:var(--f-mono);font-size:11px;margin-top:6px;letter-spacing:.04em}
  .exp{display:inline-flex;gap:2px;margin-top:6px;vertical-align:middle}
  .pip{width:9px;height:9px;border:1px solid var(--ink);display:inline-block;flex:none}
  .pip.f{background:var(--ink)}
  .attrs{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;padding:2px 11px 8px}
  .attr{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10px;color:var(--ink-2)}
  .attr .k{width:34px;color:var(--muted);letter-spacing:.05em}
  .attr .bar{flex:1;height:5px;background:var(--paper-2);border:1px solid var(--line)}
  .attr .bar>i{display:block;height:100%;background:var(--ink)}
  .attr .n{width:20px;text-align:right}
  .prof{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2);padding:0 11px 10px;line-height:1.55;border-top:1px dotted var(--line);padding-top:7px;margin:0 0 0}
  .prof b{font-weight:500;color:var(--ink)}
  .prof .lim{color:var(--stamp)}
  .id .foot{margin-top:auto;border-top:1px dashed var(--line-2);padding:8px 11px;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
  .fee{font-family:var(--f-mono);font-size:13px;font-weight:500}
  .stampmark{position:absolute;top:8px;right:8px;font-family:var(--f-disp);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--stamp);border:2px solid var(--stamp);padding:1px 5px;transform:rotate(-8deg);opacity:.9;background:rgba(251,250,246,.85)}
  .stampmark.ink{color:var(--ink-2);border-color:var(--ink-2)}

  .jobrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;transition:.1s}
  .jobrow:hover{background:var(--paper-2)}
  .jobrow:last-child{border-bottom:0}
  .jobrow .code{font-family:var(--f-mono);font-size:11px;color:var(--muted);width:52px}
  .jobrow .t{font-family:var(--f-disp);font-size:17px;letter-spacing:.02em}
  .jobrow .loc{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:2px}
  .jobrow .pay{font-family:var(--f-mono);font-size:15px;text-align:right;font-weight:500}
  .jobrow .meta{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
  @media(max-width:520px){.jobrow{grid-template-columns:1fr auto}.jobrow .code{display:none}}
  .diffbar{display:inline-flex;gap:2px;vertical-align:middle}
  .diffbar i{width:6px;height:11px;background:var(--paper-2);border:1px solid var(--line-2)}
  .diffbar i.f{background:var(--ink);border-color:var(--ink)}
  .diffbar i.h{background:var(--stamp);border-color:var(--stamp)}

  .scrim{position:fixed;inset:0;background:rgba(17,16,16,.44);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:26px 14px;overflow:auto}
  .modal{background:var(--paper);border:2px solid var(--ink);max-width:680px;width:100%;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
  .modal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:14px 16px;border-bottom:2px solid var(--ink);background:var(--paper-2)}
  .modal-b{padding:16px}
  .x{appearance:none;border:1px solid var(--ink);background:var(--paper);width:30px;height:30px;font-size:16px;line-height:1;flex:none}

  .check{display:flex;align-items:center;gap:10px;padding:7px 8px;border:1px solid var(--line-2);margin-bottom:6px;background:var(--card)}
  .check.out{opacity:.6}
  .check .av{width:34px;height:41px;border:1px solid var(--ink);background:#fff;flex:none}
  .check .mark{font-family:var(--f-mono);font-size:14px;width:18px;text-align:center;flex:none}
  .check .why{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
  .check.out .why{color:var(--stamp)}

  .req{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .req .b{border:1px solid var(--line-2);padding:6px 9px;background:var(--card);min-width:78px;flex:1 1 78px}
  .req .b .k{font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .req .b .v{font-family:var(--f-disp);font-size:16px}
  .brief{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);line-height:1.65;border-left:3px solid var(--ink);padding:4px 10px;margin:8px 0 10px;background:var(--card)}
  .brief .client{color:var(--ink);font-weight:500}
  .factors{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-family:var(--f-mono);font-size:11px;margin-top:8px}
  .factors .k{color:var(--muted)}
  .factors .plus{color:var(--good)}
  .factors .minus{color:var(--stamp)}

  .odds{height:12px;border:1px solid var(--ink);display:flex;overflow:hidden;font-size:0}
  .odds i{height:100%;display:block}
  .odds .o-good{background:var(--good)}
  .odds .o-mid{background:var(--warn)}
  .odds .o-bad{background:var(--stamp)}

  .hero{padding:56px 0 30px;text-align:center;border-bottom:2px solid var(--ink);margin-bottom:26px;position:relative}
  .hero .eyebrow{font-family:var(--f-mono);letter-spacing:.4em;text-transform:uppercase;font-size:12px;color:var(--muted)}
  .hero h1{font-family:var(--f-logo);font-size:clamp(60px,17vw,150px);letter-spacing:.01em;line-height:.9;margin:10px 0 6px;text-transform:uppercase;font-weight:400}
  .hero .tagline{font-family:var(--f-body);font-style:italic;font-size:clamp(15px,2.4vw,19px);color:var(--ink-2);max-width:46ch;margin:8px auto 0}
  .filecard{max-width:720px;margin:0 auto}
  .redacted{background:var(--ink);color:var(--ink);user-select:none}

  .create-grid{display:grid;grid-template-columns:200px 1fr;gap:22px}
  @media(max-width:640px){.create-grid{grid-template-columns:1fr}}
  .bigav{width:200px;height:240px;border:2px solid var(--ink);background:#fff;margin:0 auto}
  .swatchrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
  .genbtn{border:1px solid var(--ink);background:var(--paper);padding:8px 14px;font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.1em;font-size:13px}
  .genbtn.on{background:var(--ink);color:var(--paper)}
  .rolled{border:1px solid var(--line-2);background:var(--card);padding:10px 12px;margin-top:6px}

  .log{display:flex;flex-direction:column;max-height:420px;overflow:auto}
  .logline{font-family:var(--f-mono);font-size:12px;padding:7px 0;border-bottom:1px dotted var(--line);display:flex;gap:9px}
  .logline .wk{color:var(--muted);flex:none;width:30px}
  .logline.good .tx{color:var(--good)}
  .logline.bad .tx{color:var(--bad)}
  .logline.warn .tx{color:var(--warn)}
  .logline.big .tx{font-weight:600}

  .empty{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding:22px;text-align:center}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-family:var(--f-mono);font-size:12px}
  .kv .k{color:var(--muted)}
  .foot-note{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;margin-top:26px;line-height:1.6}
  .loy{height:6px;border:1px solid var(--ink);background:var(--paper-2);width:100%;position:relative}
  .loy>i{display:block;height:100%;background:var(--ink)}
  .loy.low>i{background:var(--stamp)}
  .result-verdict{font-family:var(--f-logo);font-size:clamp(30px,7vw,46px);text-transform:uppercase;letter-spacing:.03em;line-height:1}
  @keyframes stampin{0%{transform:scale(2.4) rotate(-14deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-6deg);opacity:1}}
  .verdict-stamp{display:inline-block;border:3px solid;padding:4px 14px;transform:rotate(-6deg);animation:stampin .3s ease-out}
  @media(prefers-reduced-motion:reduce){.verdict-stamp{animation:none}.heatbar>i{transition:none}}
  .num-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;margin-top:12px}
  .num-grid .b{border:1px solid var(--line-2);padding:8px 10px;background:var(--card)}
  .num-grid .b .k{font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .num-grid .b .v{font-family:var(--f-mono);font-size:18px}
  .warnbox{border:1px solid var(--stamp);background:var(--paper);padding:10px 12px;font-family:var(--f-mono);font-size:12px;color:var(--stamp);margin-bottom:12px}
  .sel-help{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin:6px 0 12px}

  /* ---- the burger and the office ---- */
  .burger{position:fixed;top:calc(env(safe-area-inset-top,0px) + 9px);right:16px;z-index:75;width:40px;height:36px;border:1px solid var(--ink);background:var(--paper);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;padding:0}
  .burger span{display:block;width:20px;height:2.5px;background:var(--ink)}
  .burger:hover{background:var(--paper-2)}
  .office{position:fixed;inset:0;z-index:70;background:var(--paper);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
  .office-in{max-width:1100px;margin:0 auto}
  .office-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:4px 104px 10px 0;border-bottom:2px solid var(--ink);margin-bottom:12px}
  .office-head h2{font-family:var(--f-logo);font-size:28px;letter-spacing:.03em;text-transform:uppercase;font-weight:400}
  .office-svg{width:100%;height:auto;display:block;border:1px solid var(--line-2);background:#fff}
  .office-svg :is(path,rect,line,polygon,polyline,ellipse,circle):not(.ns){stroke:var(--ink);stroke-width:2.2px;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
  .office-svg text{font-family:var(--f-mono);fill:var(--ink);stroke:none}
  .office-label{font-size:16px;font-weight:500;letter-spacing:.08em}
  .office-small{font-size:12px;letter-spacing:.06em}
  .office-svg .hot{cursor:pointer}
  .office-svg .hot:hover :is(rect,path,polygon,ellipse):not(.ns){fill:var(--paper-2)}
  .office-words{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;font-family:var(--f-mono);font-size:12px}
  .office-words .grp{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-2);padding:3px 6px;background:var(--card)}
  .office-words .grp button{appearance:none;border:1px solid var(--ink);background:var(--paper);width:24px;height:24px;font-family:var(--f-mono);padding:0}
  .above .scrim{z-index:80}

  /* ---- the i button, the tutorial ---- */
  .ibtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 9px);right:64px;z-index:75;width:36px;height:36px;border:1px solid var(--ink);border-radius:50%;background:var(--paper);font-family:var(--f-body);font-style:italic;font-weight:600;font-size:19px;line-height:1;padding:0 0 2px}
  .ibtn:hover{background:var(--paper-2)}
  .info-b p{margin:0 0 10px;font-size:14px;line-height:1.6}
  .info-b p:last-of-type{margin-bottom:0}
  .tut{position:fixed;left:0;right:0;bottom:0;z-index:90;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 16px);pointer-events:none}
  .tut-card{pointer-events:auto;max-width:560px;margin:0 auto;background:var(--paper);border:2px solid var(--ink);box-shadow:0 20px 50px -20px rgba(0,0,0,.6);padding:12px 16px 14px}
  .tut-card h3{font-size:18px;margin:4px 0 6px;text-transform:uppercase;letter-spacing:.06em}
  .tut-card p{margin:0;font-size:14px;line-height:1.55}
  .tut-btns{display:flex;gap:8px;align-items:center;margin-top:12px}
  .tut-target{outline:3px solid var(--stamp);outline-offset:4px;box-shadow:0 0 0 8px rgba(154,43,30,.14)}

  /* ---- the live job report ---- */
  .ticker{max-height:320px;overflow:auto;border:1px solid var(--line-2);background:var(--card);padding:6px 10px;font-family:var(--f-mono);font-size:12.5px;line-height:1.5;margin-top:8px}
  .tk{display:flex;gap:10px;padding:4px 0;border-bottom:1px dotted var(--line)}
  .tk:last-child{border-bottom:0}
  .tk-t{color:var(--muted);flex:none;width:44px}
  .tk.good .tk-x{color:var(--good)}
  .tk.warn .tk-x{color:var(--warn)}
  .tk.bad .tk-x{color:var(--stamp)}
  .live{color:var(--stamp);font-weight:500;animation:blink 1.2s steps(2) infinite}
  @keyframes blink{50%{opacity:.25}}
  @media(prefers-reduced-motion:reduce){.live{animation:none}}
  details summary::-webkit-details-marker{display:none}
  details summary{list-style:none}
  details summary::before{content:"▸ ";}
  details[open] summary::before{content:"▾ ";}

  /* ---- who came back: marks on the field roster ---- */
  .fld{width:58px;text-align:center;position:relative}
  .fld-av{width:58px;height:68px;border:1px solid var(--ink);background:#fff}
  .fld-n{font-family:var(--f-mono);font-size:9.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fld-w{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--stamp)}
  .fld-stamp{position:absolute;top:24px;left:-8px;right:-8px;font-family:var(--f-logo);font-size:15px;letter-spacing:.12em;color:var(--stamp);border:2px solid var(--stamp);background:rgba(255,255,255,.88);transform:rotate(-14deg);padding:0 2px;line-height:1.25}

function genProfile(rng,nat,gender,opts){
  opts=opts||{};
  const tech=opts.tech?TECH_BY_K[opts.tech]:pick(rng,TECHS);
  const role=opts.role||(chance(rng,0.25)?"commander":"soldier");
  const r=rng();
  const exp=r<0.40?1:r<0.70?2:r<0.87?3:r<0.97?4:5;
  const er=rng();
  const edu=er<0.15?0:er<0.40?1:er<0.65?2:er<0.87?3:er<0.95?4:5;
  const jail=chance(rng,0.55)?0:ri(rng,1,12);
  const streets=clamp(ri(rng,0,25)-edu*2,0,25);
  const base=24+(exp-1)*11;
  const attrs={};
  ATTRS.forEach(a=>{
    let v=base+ri(rng,-8,18);
    if(a===tech.a)v+=ri(rng,10,26);
    if(role==="commander"&&(a==="brains"||a==="charm"))v+=5;
    if(role==="soldier"&&(a==="muscle"||a==="nerve"))v+=4;
    if(a==="brains")v+=edu*2;
    if(a==="nerve")v+=Math.round(jail*0.6+streets*0.4);
    attrs[a]=clamp(Math.round(v),12,98);
  });
  const know=[tech.know];
  const nk=chance(rng,0.55)?1:chance(rng,0.5)?2:0;
  for(let i=0;i<nk;i++){const k=pick(rng,KNOW);if(!know.includes(k))know.push(k);}
  const langs=nat.langs.slice(0,chance(rng,0.6)?1:2);
  if(chance(rng,0.5)){const l=pick(rng,EXTRA_LANGS);if(!langs.includes(l))langs.push(l);}
  if(chance(rng,0.25)){const l=pick(rng,EXTRA_LANGS);if(!langs.includes(l))langs.push(l);}
  const limits=[];
  const nl=chance(rng,0.6)?0:chance(rng,0.75)?1:2;
  for(let i=0;i<nl;i++){const l=pick(rng,LIMITS);if(!limits.includes(l.k))limits.push(l.k);}
  return {tech:tech.k,role,exp,edu,jail,streets,attrs,know,langs,limits,cmd:role==="commander"?ri(rng,3,9):0};
}
function genChar(rng,i,used){
  const nat=pick(rng,COUNTRIES);
  const gender=chance(rng,0.5)?"M":"F";
  const pool=NAMES[nat.pool];
  const first=pick(rng,gender==="M"?pool.m:pool.f);
  const last=pick(rng,pool.s);
  let n=first+" "+last;
  let guard=0;
  while(used.has(n)&&guard++<40){n=first+" "+String.fromCharCode(65+ri(rng,0,25))+". "+last;}
  used.add(n);
  const p=genProfile(rng,nat,gender);
  const feeBase=(p.exp*7000)+(avg(p.attrs)*260)+(p.know.length-1)*2500+p.edu*900+(p.tech==="hacker"||p.tech==="safecracker"||p.tech==="forger"?4000:0);
  const fee=Math.round(feeBase*(1+rng()*0.35)/500)*500;
  let cut=Math.round((0.05+(p.exp-1)*0.02+rng()*0.05)*100)/100;
  if(p.limits.includes("cut"))cut=Math.max(cut,0.15);
  return Object.assign({
    id:"C"+(1000+i),n,first,gender,nat:nat.name,
    fee,cut,
    upkeep:Math.round((p.exp*1200+rng()*800)/100)*100,
    loyalty:ri(rng,42,68),
    greed:ri(rng,15,90),
    mole:chance(rng,0.07),
    vetted:false,vetFlag:false,
    status:"available",   // available | crew | injured | jailed | gone
    out:0,
    avseed:ri(rng,1,1e9),
  },p);
}
function avg(o){let s=0,n=0;for(const k in o){s+=o[k];n++;}return s/n;}
function buildRoster(seed){
  const rng=mulberry32(seed);
  const used=new Set();
  const arr=new Array(ROSTER_SIZE);
  for(let i=0;i<ROSTER_SIZE;i++)arr[i]=genChar(rng,i,used);
  return arr;
}

function byId(id){if(id==="YOU")return S.player;return S.roster.find(c=>c.id===id);}
function recruits(){return S.crewIds.map(byId).filter(Boolean);}
function crewAll(){return [S.player].concat(recruits());}

/* ------------------------------ JOBS ---------------------------------- */
function makeJob(rng,tierBias){
  const co=pick(rng,COUNTRIES);
  const cat=CAT_BY_K[pick(rng,co.cats)];
  const r=rng();
  const tier=clamp((tierBias||0)+(r<0.34?1:r<0.64?2:r<0.87?3:4),1,4);
  const need=[0,ri(rng,2,3),ri(rng,3,4),ri(rng,4,5),5][tier];
  const diff=clamp(34+tier*10+ri(rng,-6,6)+Math.floor(S.rep/14)+(co.gate===2?4:0),34,96);
  const payBase=[0,42000,120000,300000,720000][tier]*[0,0.65,0.8,1][co.eco];
  const payout=Math.round(payBase*(0.7+rng()*0.8)/1000)*1000;
  const heat=Math.round(cat.heat*(0.8+tier*0.12)*(co.auth?1.2:1));
  const techs=[];const pool=cat.techs.slice();
  const nt=clamp(1+Math.floor(tier/2),1,3);
  for(let i=0;i<nt&&pool.length;i++)techs.push(pool.splice(Math.floor(rng()*pool.length),1)[0]);
  const know=[pick(rng,cat.know)];
  if(tier>=3&&cat.know.length>1){const k=pick(rng,cat.know);if(!know.includes(k))know.push(k);}
  const tags=[];
  for(const t in cat.tags){
    let p=cat.tags[t];
    if(t==="water"&&!co.terrain.some(x=>["coast","port","islands","fjords","canal","delta","river","lakes"].includes(x)))p*=0.3;
    if(t==="heights"&&co.terrain.some(x=>x==="mountains"||x==="megacity"))p+=0.2;
    if(chance(rng,p))tags.push(t);
  }
  S.jobSeq++;
  return {
    id:"J"+S.jobSeq,cat:cat.k,tier,country:co.name,city:pick(rng,co.cities),
    need,diff,payout,heat,techs,know,tags,
    client:pick(rng,CLIENTS),
    title:pick(rng,cat.v)+" "+pick(rng,cat.n),
    expires:S.week+ri(rng,2,4),
  };
}
function refreshJobs(fill){
  const rng=mulberry32((S.seed^(S.week*2654435761))>>>0);
  S.jobs=S.jobs.filter(j=>j.final||j.expires>=S.week);
  let guard=0;
  while(S.jobs.filter(j=>!j.final).length<7&&guard++<40)S.jobs.push(makeJob(rng,0));
  if(!S.jobs.some(j=>j.tier>=3)&&(fill||chance(rng,0.5)))S.jobs.push(makeJob(rng,2));
  maybeUnlockFinal();
}
function maybeUnlockFinal(){
  if(S.rep>=100&&!S.finalDone&&!S.jobs.some(j=>j.final)){
    S.jobs.unshift({id:"JFINAL",final:true,cat:"vault",tier:5,country:"Switzerland",city:"Zürich, then everywhere",
      need:5,diff:94,payout:6000000,heat:60,techs:["safecracker","hacker","wheelman"],know:["Finance","Logistics"],tags:["night","underground"],
      client:"the Committee",title:"The one that ends it",expires:9999});
    if(!S.seenFinal){S.seenFinal=true;logMsg("Your name has reached the right ears. The final score is on the board.","big",true);}
  }
}

/* --------------------------- JOB RESOLUTION --------------------------- */
// Can this member work this job? Returns {ok, why}.
function entry(c,job,forgerAboard){
  const co=COUNTRY_BY_NAME[job.country];
  const nat=natOf(c);
  for(const k of c.limits){
    const l=LIMIT_BY_K[k];
    if(l.country&&l.country(co))return {ok:false,why:l.l};
    if(l.tag&&job.tags.includes(l.tag))return {ok:false,why:l.l+" — job is "+TAG_LABEL[l.tag]};
  }
  if(c.status!=="crew")return {ok:false,why:c.status==="injured"?"injured, back week "+c.out:"not available"};
  const local=nat.name===co.name;
  if(!local&&!forgerAboard){
    if(co.gate===2&&nat.tier>1)return {ok:false,why:"strict border, "+TIER_WORD[nat.tier]+" passport — needs a forger aboard"};
    if(co.gate===1&&nat.tier>2)return {ok:false,why:"needs a visa, "+TIER_WORD[nat.tier]+" passport — needs a forger aboard"};
    if(co.gate>=1&&c.jail>=(co.gate===2?3:5))return {ok:false,why:c.jail+" years inside — refused at the border without papers"};
  }
  return {ok:true,why:local?"local national":forgerAboard&&(co.gate>=1)?"papers from the forger":"clean entry"};
}
function memberEff(c,job){
  const cat=CAT_BY_K[job.cat];
  let ws=0,tw=0;
  for(const a in cat.w){ws+=cat.w[a]*c.attrs[a];tw+=cat.w[a];}
  let e=ws/tw;
  e*=(1+(c.exp-1)*0.11);
  if(job.techs.includes(c.tech))e+=14;
  if((cat.w.brains||0)>=3)e+=c.edu*1.2;
  return e;
}
function assessJob(job){
  const co=COUNTRY_BY_NAME[job.country];
  const cat=CAT_BY_K[job.cat];
  const all=crewAll();
  const forger=all.some(c=>c.status==="crew"&&c.tech==="forger"&&!c.limits.some(k=>{const l=LIMIT_BY_K[k];return l.country&&l.country(co);}));
  const checks=all.map(c=>Object.assign({c},entry(c,job,forger)));
  const team=checks.filter(x=>x.ok).map(x=>x.c);
  const factors=[];
  let power=0;
  if(team.length){team.forEach(c=>power+=memberEff(c,job));power/=team.length;}
  let adj=0;
  const add=(k,v,note)=>{adj+=v;factors.push({k,v,note});};
  if(team.length<job.need)add("Crew short",-22*(job.need-team.length),team.length+" of "+job.need+" can go");
  else add("Crew size",6+Math.min(9,(team.length-job.need)*3),team.length+" in the field");
  // You are the commander. A commander-type recruit chafes under you, but can lead when you can't get in.
  const youIn=team.some(c=>c.isPlayer);
  const cmdTypes=team.filter(c=>!c.isPlayer&&c.role==="commander");
  if(youIn){
    add("You command",S.player.cmd||5,"your crew, your call");
    if(cmdTypes.length)add("Commanders under you",-3*cmdTypes.length,cmdTypes.map(c=>c.first).join(", ")+" take orders badly");
  } else if(cmdTypes.length){
    const lead=cmdTypes.slice().sort((a,b)=>b.cmd-a.cmd)[0];
    add("Stand-in leader",Math.max(1,lead.cmd-2),lead.first+" runs it while you stay out");
  } else add("Leaderless",-10,"you can't get in and nobody else can lead");
  const speaks=team.some(c=>c.langs.some(l=>co.langs.includes(l)));
  if(speaks)add("Language",6,co.langs[0]+" spoken");
  else add("No "+co.langs[0],cat.lang?-14:-8,"nobody speaks it"+(cat.lang?" — this job is all talk":""));
  if(team.some(c=>natOf(c).name===co.name))add("Local national",8,"knows the ground");
  const covered=job.know.filter(k=>team.some(c=>c.know.includes(k)));
  covered.forEach(k=>{const schooled=team.some(c=>c.know.includes(k)&&c.edu>=3);add("Knows "+k,schooled?10:5,schooled?"and studied it":"street knowledge");});
  job.know.filter(k=>!covered.includes(k)).forEach(k=>add("Nobody knows "+k,-6,"wanted for this job"));
  const hits=job.techs.filter(t=>team.some(c=>c.tech===t)).length;
  if(hits)add("Techniques",hits*4,hits+" of "+job.techs.length+" wanted");
  const streets=team.reduce((m,c)=>Math.max(m,c.streets),0);
  const heatCut=Math.min(4,Math.floor(streets/5));
  if(S.heat>0)add("Heat",-Math.round(S.heat*0.24),"the world is watching");
  const eff=power+adj;
  const margin=eff-job.diff;
  const lo=margin-18,hi=margin+18;
  const pAbove=t=>clamp((hi-t)/(hi-lo),0,1);
  const pGood=pAbove(22),pFailish=pAbove(-4),pDis=pAbove(-22);
  return {team,checks,factors,power:Math.round(power),eff:Math.round(eff),margin:Math.round(margin),heatCut,
    canRun:team.length>0&&team.length>=job.need,
    pClean:Math.round(pGood*100),pOk:Math.round((pFailish-pGood)*100),pFail:Math.round((pDis-pFailish)*100),pDis:Math.round((1-pDis)*100)};
}

// The job, minute by minute: who got in, who talked, what went right, what went wrong.
const POLICE={"Italy":"the Carabinieri","France":"the gendarmes","Spain":"the Guardia Civil","Mexico":"the federales","Germany":"the Polizei","Russia":"the OMON","Brazil":"the Polícia Federal","Israel":"the Mishtara","India":"the CBI","South Africa":"the Hawks","United Kingdom":"the Met","United States":"the FBI","Netherlands":"the Marechaussee","Switzerland":"the Kantonspolizei","China":"the Public Security Bureau","Japan":"the Keisatsu","Turkey":"the Emniyet","Colombia":"the DIJIN"};

const CAT_BEATS={
  interception:{go:["The convoy slows for roadworks that weren't there yesterday.","The manifest says twelve pallets; there are twelve pallets.","The handover takes ninety seconds, as drawn."],hitch:["The escort is two cars, not one.","The driver has a radio, and uses it.","A second truck nobody mentioned."],blow:["The escort was waiting for you.","The cargo was a decoy. The real one is elsewhere, and so are the police.","Gunfire. Then more of it."]},

function narrate(job,a,tier,rng,x){
  const co=COUNTRY_BY_NAME[job.country];
  const team=a.team;
  let h=job.tags.includes("night")?22:ri(rng,8,15),m=ri(rng,0,59);
  const lines=[];
  const push=(t,tone)=>{m+=ri(rng,4,26);if(m>=60){m-=60;h=(h+1)%24;}lines.push({t:String(h).padStart(2,"0")+":"+String(m).padStart(2,"0"),x:t,tone:tone||""});};
  const how=co.terrain.some(t=>["islands","coast","port","fjords","canal"].includes(t))&&chance(rng,0.5)?"off the ferry":co.terrain.includes("megacity")?"on separate flights, two days apart":co.terrain.includes("mountains")?"up the pass in a hired van":"by road, at night";
  push(job.city+", "+job.country+". The crew comes in "+how+".");
  a.checks.forEach(c=>{
    if(c.ok){
      if(c.why==="local national")push(c.c.first+" is home — the taxi driver knows a cousin.");
      else if(c.why.indexOf("papers")===0)push(c.c.first+"'s new passport gets a second look, then a stamp.");
    } else push(c.c.first+" doesn't come: "+c.why+".","warn");
  });
  const speaker=team.find(c=>c.langs.some(l=>co.langs.includes(l)));
  if(speaker)push(speaker.first+" does the talking, in "+co.langs.find(l=>speaker.langs.includes(l))+".");
  else if(team.length)push("Nobody speaks "+co.langs[0]+". "+team[0].first+" points and pays.","warn");
  if(team.some(c=>c.isPlayer))push("You run it from "+pick(rng,["the back seat of a rented car","a hotel room with the curtains drawn","a café across the street","a rooftop with a thermos"])+".");
  else if(team.length){const lead=team.filter(c=>c.role==="commander").sort((p,q)=>q.cmd-p.cmd)[0];push(lead?lead.first+" runs it while you wait across the border.":"Nobody is running it, and it shows.","warn");}
  let tb=0;
  job.techs.forEach(t=>{const c=team.find(y=>y.tech===t);if(c){if(tb<2){push(c.first+" ("+TECH_BY_K[t].l+") "+TECH_BEAT[t]+".");tb++;}}else push("No "+TECH_BY_K[t].l+" on the crew. "+(team.length?pick(rng,team).first+" improvises.":"Nobody improvises."),"warn");});
  job.know.forEach(k=>{const c=team.find(y=>y.know.includes(k));if(c)push(c.first+" knows "+k+": "+KNOW_BEAT[k]+" is no mystery.");else push("Nobody knows "+k+". "+cap(KNOW_BEAT[k])+" is guesswork.","warn");});
  const B=CAT_BEATS[job.cat]||CAT_BEATS.vault;
  const take=(arr,n,tone)=>{const pool=arr.slice();for(let i=0;i<n&&pool.length;i++)push(pool.splice(Math.floor(rng()*pool.length),1)[0],tone);};
  if(tier===4)take(B.go,2,"good");
  else if(tier===3){take(B.go,1,"good");take(B.hitch,1,"warn");push(pick(rng,["It costs twenty minutes and a favour.","Handled. Nobody outside the crew ever knows.","It's tight, and then it isn't."]),"good");}
  else if(tier===2){take(B.hitch,2,"warn");take(B.go,1,"good");}
  else if(tier===1){take(B.hitch,1,"warn");take(B.blow,1,"bad");}
  else take(B.blow,2,"bad");
  const wheel=team.find(c=>c.tech==="wheelman");
  if(tier>=2)push(wheel?wheel.first+" has the engine running. Nobody runs.":"Out the way you came in, one at a time.");
  else push(cap(police(co))+" arrive "+pick(rng,["two streets away","at the door","from both ends of the road"])+". "+(wheel?wheel.first+" makes a gap nobody else saw.":"There is no plan for this part."),"bad");
  if(x.leaked)push("Someone talked. "+cap(police(co))+" were waiting two streets away.","bad");
  x.fallout.forEach(e=>push(e,"bad"));
  if(x.heatGain>0)push("By morning "+police(co)+" have "+pick(rng,["a partial plate","a description","a name that isn't yours, yet","footage of somebody's back"])+". Heat +"+x.heatGain+".",x.heatGain>=20?"warn":"");
  if(x.take>0)push("The split: "+money(x.take)+" gross, "+money(x.cuts)+" to the crew, "+money(x.net)+" to you.","good");
  else push("No payment. The client doesn't return the call.","bad");
  x.betrayals.forEach(b=>push(b,"bad"));
  return lines;
}

function executeJob(job){
  const rng=freshRng();
  const a=assessJob(job);
  const team=a.team;
  let roll=ri(rng,-18,18);
  const hasMole=team.some(c=>c.mole);
  let leaked=false;
  if(hasMole&&chance(rng,0.55)){roll-=16;leaked=true;}
  const m=a.margin+roll;
  let tier;
  if(m>22)tier=4;else if(m>10)tier=3;else if(m>-4)tier=2;else if(m>-22)tier=1;else tier=0;
  const verdictName=["DISASTER","BOTCHED","MESSY","SUCCESS","CLEAN"][tier];
  const base=job.final?100:[0,6,12,22,36][job.tier];
  let take=0,loyD=0,heatMul=0;
  if(tier===4){take=Math.round(job.payout*1.08);loyD=6;heatMul=0.5;}
  else if(tier===3){take=job.payout;loyD=3;heatMul=0.85;}
  else if(tier===2){take=Math.round(job.payout*0.55);loyD=-3;heatMul=1.25;}
  else if(tier===1){loyD=-7;heatMul=1.5;}
  else{loyD=-13;heatMul=1.9;}
  let cuts=0;
  team.forEach(c=>{if(!c.isPlayer)cuts+=Math.round(take*c.cut);});
  const net=Math.max(0,take-cuts);
  S.money+=net;
  const heatGain=Math.max(0,Math.round(job.heat*heatMul)-a.heatCut)+(leaked?12:0);
  S.heat=clamp(S.heat+heatGain,0,120);
  team.forEach(c=>{if(!c.isPlayer)c.loyalty=clamp(c.loyalty+loyD+(tier>=3?2:0),0,100);});
  // fallout
  const fallout=[],betrayals=[];
  if(tier<=1){
    const hitPool=team.filter(c=>!c.isPlayer).sort(()=>rng()-0.5);
    const nHit=Math.min(hitPool.length,tier===0?ri(rng,2,3):1);
    for(let i=0;i<nHit;i++){
      const c=hitPool[i];
      if(tier===0&&chance(rng,0.5)){c.status="jailed";c.out=S.week+ri(rng,4,8);S.crewIds=S.crewIds.filter(id=>id!==c.id);fallout.push(c.first+" is taken at the scene. Held until week "+c.out+".");}
      else{c.status="injured";c.out=S.week+2;fallout.push(c.first+" is hurt — out for two weeks.");}
    }
  }
  if(net>60000){
    team.forEach(c=>{
      if(c.isPlayer||c.status!=="crew")return;
      // a loyal member stays loyal; the danger is the disloyal, the greedy, and the informant
      const risk=(c.loyalty<70?((70-c.loyalty)/70)*0.45:0)+(c.greed>75?0.04:0)+(c.mole?0.25:0);
      if(risk>0&&chance(rng,risk*0.6)){
        const stolen=Math.round(net*(0.15+rng()*0.2));
        S.money=Math.max(0,S.money-stolen);
        c.status="gone";S.crewIds=S.crewIds.filter(id=>id!==c.id);
        betrayals.push(c.first+" skims "+money(stolen)+" from the split and vanishes.");
        S.heat=clamp(S.heat+6,0,120);
      }
    });
  }
  // who came back, and who didn't
  const marks={};
  team.forEach(c=>{if(c.status==="gone")marks[c.id]="gone";else if(c.status==="jailed")marks[c.id]="taken";else if(c.status==="injured")marks[c.id]="hurt";});
  // ranking: up for the job and how it went, down when it goes wrong
  const rk=[];
  const addR=(k,v)=>rk.push({k,v});
  if(tier===4){addR("Clean — tier "+job.tier+" job",base);if(!fallout.length)addR("Nobody hurt",2);}
  else if(tier===3)addR("Success — tier "+job.tier+" job",Math.round(base*0.7));
  else if(tier===2)addR("Messy work",-job.tier*2);
  else if(tier===1)addR("Botched job",-job.tier*4);
  else addR("Disaster",-job.tier*6);
  if(leaked)addR("The job leaked",-3);
  betrayals.forEach(()=>addR("A member walked with the money",-2));
  if(fallout.some(f=>f.indexOf("taken")>=0))addR("Someone taken by the police",-2);
  const repBefore=S.rep,rankBefore=rankName(S.rep);
  const repDelta=rk.reduce((s,r)=>s+r.v,0);
  S.rep=clamp(S.rep+repDelta,0,999);
  const rankAfter=rankName(S.rep);
  if(rankAfter!==rankBefore)logMsg("Ranking: "+rankBefore+" → "+rankAfter+".",S.rep>repBefore?"good":"bad",true);
  // progression: everyone who went learns something
  const growth=[];
  const xpBase=job.final?60:[0,10,18,28,40][job.tier];
  const xpMul=[0.2,0.3,0.6,1,1.2][tier];
  const cat=CAT_BY_K[job.cat];
  const weighted=Object.keys(cat.w).sort((p,q)=>cat.w[q]-cat.w[p]);
  team.forEach(c=>{
    const g={first:c.first,xp:Math.round(xpBase*xpMul),up:[],rank:null};
    c.xp=(c.xp||0)+g.xp;c._touched=true;
    const need=xpNeeded(c.exp);
    if(need!==null&&c.xp>=need){c.exp=Math.min(5,c.exp+1);g.rank=EXP[c.exp-1];logMsg(c.first+" is now a "+g.rank+".","good");}
    const n=tier>=3?(chance(rng,0.5)?2:1):(tier===2&&chance(rng,0.5)?1:0);
    for(let i=0;i<n;i++){const at=weighted[Math.min(i,weighted.length-1)];if(c.attrs[at]<98){c.attrs[at]+=1;g.up.push(at);}}
    growth.push(g);
  });
  const narrative=narrate(job,a,tier,rng,{leaked,fallout,betrayals,heatGain,take,cuts,net});
  S.jobs=S.jobs.filter(j=>j!==job);
  logMsg(verdictName+" — "+job.title+" ("+job.city+", "+job.country+"). "+(net>0?"Net "+money(net)+".":"No pay.")+" Ranking "+(repDelta>=0?"+":"")+repDelta+".",tier>=3?"good":tier===2?"warn":"bad",true);
  if(job.final&&tier>=3){S.finalDone=true;S.over="win";}
  const wk=S.week;
  weekTick(rng);
  refreshJobs(false);
  const res={id:job.id+"-w"+wk,week:wk,tier,verdictName,take,cuts,net,heatGain,repDelta,repBefore,repAfter:S.rep,rankBefore,rankAfter,rk,growth,marks,events:fallout.concat(betrayals),leaked,job,teamIds:team.map(t=>t.id),narrative,revealed:0,done:false};
  // every job stays on file, for the case log
  S.reports=S.reports||[];S.reports.push(Object.assign({},res));if(S.reports.length>80)S.reports.shift();
  save();
  return res;
}
function weekTick(rng){
  S.week++;
  const rc=recruits().filter(c=>c.status==="crew");
  let up=0;rc.forEach(c=>up+=c.upkeep);
  if(up>0){
    if(S.money>=up)S.money-=up;
    else{S.money=0;rc.forEach(c=>c.loyalty=clamp(c.loyalty-9,0,100));logMsg("Couldn't make payroll ("+money(up)+"). Loyalty slipping.","bad");}
  }
  const moles=rc.filter(c=>c.mole).length;
  if(moles)S.heat=clamp(S.heat+3*moles,0,120);
  S.roster.forEach(c=>{
    if(c.status==="injured"&&S.week>=c.out){c.status="crew";logMsg(c.first+" is back on the job.","good");}
    if(c.status==="jailed"&&S.week>=c.out){c.status="available";c.jail+=1;logMsg(c.first+" walked. Back on the roster, a year older.","warn");}
  });
  S.heat=clamp(S.heat-5,0,120);
  if(S.heat>=100){
    const rc2=recruits().filter(c=>c.status==="crew");
    if(rc2.length){
      const n=Math.min(rc2.length,ri(rng,1,2));
      for(let i=0;i<n;i++){const c=rc2[i];c.status="jailed";c.out=S.week+ri(rng,4,7);S.crewIds=S.crewIds.filter(id=>id!==c.id);}
      logMsg("RAID. The heat boiled over — "+n+" of your crew taken.","bad",true);sfx("siren");
    }
    S.money=Math.round(S.money*0.7);
    S.heat=58;
  }
  checkOver();
}
function checkOver(){
  if(S.over)return;
  if(recruits().length>0)return;
  const fees=S.roster.filter(c=>c.status==="available").map(c=>c.fee);
  const minFee=fees.length?Math.min.apply(null,fees):Infinity;
  if(S.money<minFee){S.over="lose";logMsg("No crew, no float. The name means nothing now.","bad",true);}
}

// The roster is rebuilt from the seed; only changed members are stored.
function packState(){
  const ov={};
  S.roster.forEach(c=>{if(c.status!=="available"||c.vetted||c._touched){ov[c.id]={status:c.status,out:c.out,loyalty:c.loyalty,vetted:c.vetted,vetFlag:c.vetFlag,jail:c.jail,exp:c.exp,xp:c.xp||0,attrs:c.attrs};}});
  const d=Object.assign({},S);delete d.roster;delete d.modal;d.ov=ov;
  return d;
}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(packState()));}catch(e){}}
function load(){
  try{
    const r=localStorage.getItem(SAVE_KEY);if(!r)return false;
    const d=JSON.parse(r);if(!d||d.v!==2||!d.seed||!d.player)return false;
    const roster=buildRoster(d.seed);
    const ov=d.ov||{};
    roster.forEach(c=>{const o=ov[c.id];if(o)Object.assign(c,o);});
    delete d.ov;d.roster=roster;d.modal=null;d.player.isPlayer=true;d.player.status="crew";d.player.role="commander";if(!d.player.cmd)d.player.cmd=5;
    S=d;return true;
  }catch(e){return false;}
}
function wipe(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}
function hasSave(){try{return !!localStorage.getItem(SAVE_KEY);}catch(e){return false;}}

/* ------------------------------ FORMAT -------------------------------- */
function money(n){n=Math.round(n);const neg=n<0;n=Math.abs(n);let s;
  if(n>=1e6)s="$"+(n/1e6).toFixed(n>=1e7?1:2).replace(/\.?0+$/,"")+"M";
  else if(n>=1e3)s="$"+Math.round(n/1000)+"K";
  else s="$"+n;
  return (neg?"−":"")+s;}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
function cap(s){s=String(s);return s.charAt(0).toUpperCase()+s.slice(1);}
function pips(n){let s='<span class="exp" title="'+EXP[n-1]+'">';for(let i=0;i<5;i++)s+='<i class="pip'+(i<n?" f":"")+'"></i>';return s+"</span>";}
function diffbar(d,hot){const filled=Math.round(d/100*8);let s='<span class="diffbar" aria-label="difficulty '+d+'">';for(let i=0;i<8;i++)s+='<i class="'+(i<filled?(hot?"h":"f"):"")+'"></i>';return s+"</span>";}
function yrs(n){return n===1?"1 yr":n+" yrs";}

  "Russia":[60,90,3],"Ukraine":[49,32,2],"Serbia":[44,21,1],"Mexico":[23,-102,2],"Colombia":[4,-73,2],"Argentina":[-34,-64,3],"Chile":[-33,-71,2],"Panama":[8.5,-80,1],"Brazil":[-10,-53,3],
  "Nigeria":[9,8,2],"Ghana":[8,-1,1],"Kenya":[0.5,37.5,2],"South Africa":[-29,25,2],"Morocco":[32,-6,2],"Egypt":[27,30,2],"Lebanon":[33.9,35.8,1],"U.A.E.":[24,54,1],"Saudi Arabia":[24,45,3],"Turkey":[39,35,2],"Israel":[31.5,35,1],
  "China":[35,103,3],"Japan":[36,138,2],"South Korea":[36.5,128,1],"Singapore":[1.3,103.8,1],"India":[21,78,3],"Pakistan":[30,69,2],"Thailand":[15,101,2],"Vietnam":[16,107,2],"Philippines":[12,122,2],"Indonesia":[-2,118,3],
};
const MAP={prev:null};
function proj(lat,lon){return [(lon+180)/360*1000,(90-lat)/180*500];}
function mapFocusCountry(){
  if(S.jobOpen){const j=S.jobs.find(x=>x.id===S.jobOpen);if(j)return j.country;}
  return S.jobCountry||null;
}
function mapTransform(){
  const cn=mapFocusCountry();
  if(!cn||!GEO[cn])return "translate(0px, 0px) scale(1)";
  const g=GEO[cn],z=g[2]===3?2.8:g[2]===2?4.2:6,p=proj(g[0],g[1]);
  return "translate("+(500-p[0]*z).toFixed(1)+"px, "+(220-p[1]*z).toFixed(1)+"px) scale("+z+")";
}
function mapSVG(){
  const counts={};S.jobs.forEach(j=>{counts[j.country]=(counts[j.country]||0)+1;});
  const cn=mapFocusCountry();
  const pts=poly=>poly.map(p=>{const q=proj(p[1],p[0]);return q[0].toFixed(1)+","+q[1].toFixed(1);}).join(" ");
  const land=LAND.map(p=>'<polygon class="map-land" points="'+pts(p)+'"/>').join("");
  const water=WATER.map(p=>'<polygon class="map-water" points="'+pts(p)+'"/>').join("");
  let grid="";
  for(let lon=-150;lon<=150;lon+=30){const x=(lon+180)/360*1000;grid+='<line class="map-grid" x1="'+x+'" y1="20" x2="'+x+'" y2="420"/>';}
  for(let lat=-60;lat<=60;lat+=30){const y=(90-lat)/180*500;grid+='<line class="map-grid" x1="0" y1="'+y+'" x2="1000" y2="'+y+'"/>';}
  let marks="",lit=0;
  Object.keys(GEO).forEach(name=>{
    const g=GEO[name],p=proj(g[0],g[1]),n=counts[name]||0;
    if(!n){marks+='<circle class="mk-dot" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="1.6"/>';return;}
    lit++;
    marks+='<g class="mk'+(name===cn?" focus":"")+'" data-act="map-country" data-cn="'+esc(name)+'" transform="translate('+p[0].toFixed(1)+','+p[1].toFixed(1)+')"><title>'+esc(name)+' · '+n+' posting'+(n>1?'s':'')+' — click to show only these</title>'
      +'<circle class="mk-halo" r="11"/><circle class="mk-lit" r="4.2"/>'+(n>1?'<text class="mk-n" x="6" y="-5">'+n+'</text>':'')+'</g>';
  });
  let focus="";
  if(cn){
    const n=counts[cn]||0;
    const j=S.jobOpen?S.jobs.find(x=>x.id===S.jobOpen):null;
    const sub=j?esc(j.city)+' · '+n+' posting'+(n>1?'s':'')+' here':n+' posting'+(n>1?'s':'')+' · showing only these';
    focus='<defs><radialGradient id="hole"><stop offset="52%" stop-color="#000"/><stop offset="100%" stop-color="#fff"/></radialGradient>'
      +'<mask id="dimmask"><rect x="0" y="20" width="1000" height="400" fill="#fff"/><circle cx="500" cy="220" r="110" fill="url(#hole)"/></mask></defs>'
      +'<rect x="0" y="20" width="1000" height="400" class="map-dim" mask="url(#dimmask)"/>'
      +'<circle cx="500" cy="220" r="46" class="map-ring"/>'
      +'<text x="500" y="308" text-anchor="middle" class="map-label">'+esc(cn.toUpperCase())+'</text>'
      +'<text x="500" y="328" text-anchor="middle" class="map-sub">'+sub+'</text>';
  }
  const start=MAP.prev||"translate(0px, 0px) scale(1)";
  return '<svg class="map-svg" viewBox="0 20 1000 400" role="img" aria-label="World map. Lit countries have postings.'+(cn?' Focused on '+esc(cn)+'.':'')+'">'
    +'<rect x="0" y="20" width="1000" height="400" fill="var(--card)"/>'
    +'<g id="mapg" style="transform:'+start+'">'+grid+land+water+marks+'</g>'+focus+'</svg>';
}
// Animate the map from where it was to where it should be, once the new page is in place.
function mapArm(){
  const g=document.getElementById("mapg");
  if(!g||!g.style)return;
  const target=mapTransform();
  const from=MAP.prev;
  MAP.prev=target;
  if(from&&from!==target&&typeof requestAnimationFrame==="function"){
    g.style.transition="none";g.style.transform=from;
    if(typeof g.getBoundingClientRect==="function")g.getBoundingClientRect();
    requestAnimationFrame(()=>{g.style.transition="";g.style.transform=target;});
  } else g.style.transform=target;
}

/* ------------------------------- JOBS --------------------------------- */
function tabJobs(){
  if(S.jobOpen&&!S.jobs.find(x=>x.id===S.jobOpen))S.jobOpen=null;
  const strip=crewStrip();
  const openJob=S.jobOpen?S.jobs.find(x=>x.id===S.jobOpen):null;
  const left=openJob?jobPanel(openJob):jobsList();
  const cn=mapFocusCountry();
  const nLit=new Set(S.jobs.map(j=>j.country)).size;
  const right='<div class="map-panel panel"><div class="panel-h" style="padding:8px 12px"><h2 style="font-size:13px">The map</h2>'
    +(cn?'<button class="btn ghost sm" data-act="map-clear">Whole map</button>':'<span class="kicker">'+S.jobs.length+' postings · '+nLit+' countries lit</span>')+'</div>'
    +mapSVG()
    +'<div class="map-cap"><span>● a lit country has postings · click one to show only its jobs</span>'+(cn?'<span>Focused: '+esc(cn)+'</span>':'')+'</div></div>';
  return strip+'<div class="jobs-grid"><div class="jobs-left">'+left+'</div><div class="jobs-right">'+right+'</div></div>';
}
function jobsList(){
  const inField=field();
  const has=t=>inField.some(c=>c.tech===t);
  const knows=k=>inField.some(c=>c.know.includes(k));
  const sortOpts=[["fit","Best fit first"],["need","Crew needed"],["tech","Technique wanted"],["pay","Fee, high first"],["heat","Heat, low first"],["diff","Difficulty, low first"],["country","Country"],["expires","Expiring soonest"]];
  const cur=S.jobSort||"fit";
  const sortSel='<span class="field" style="gap:2px"><label for="jsort">Sort</label><select id="jsort">'+sortOpts.map(o=>'<option value="'+o[0]+'"'+(cur===o[0]?" selected":"")+'>'+o[1]+'</option>').join("")+'</select></span>';
  const head='<div class="panel-h"><h2>Jobs · Postings</h2><span style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap"><span class="kicker" style="padding-bottom:8px">Week '+S.week+' · postings expire</span>'+sortSel+'<button class="btn ghost sm" data-act="laylow" style="margin-bottom:2px">Lay low a week</button></span></div>';
  const filt=S.jobCountry?'<div style="display:flex;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap"><span class="tag ok">Showing '+esc(S.jobCountry)+'</span><button class="btn ghost sm" data-act="map-clear">All countries</button></div>':'';
  let jobs=S.jobs;
  if(S.jobCountry)jobs=jobs.filter(j=>j.country===S.jobCountry);
  if(!jobs.length)return '<div class="panel">'+head+filt+'<div class="empty">'+(S.jobCountry?'No postings in '+esc(S.jobCountry)+' this week.':'The board is quiet. Lay low a week and check again.')+'</div></div>';
  const items=jobs.map(j=>({j,a:assessJob(j)}));
  const cmp={
    fit:(x,y)=>(y.j.final?1:0)-(x.j.final?1:0)||(y.a.canRun?1:0)-(x.a.canRun?1:0)||y.a.margin-x.a.margin,
    need:(x,y)=>x.j.need-y.j.need||y.a.margin-x.a.margin,
    tech:(x,y)=>TECH_BY_K[x.j.techs[0]].l.localeCompare(TECH_BY_K[y.j.techs[0]].l)||y.a.margin-x.a.margin,
    pay:(x,y)=>y.j.payout-x.j.payout,
    heat:(x,y)=>x.j.heat-y.j.heat||y.a.margin-x.a.margin,
    diff:(x,y)=>x.j.diff-y.j.diff,
    country:(x,y)=>x.j.country.localeCompare(y.j.country)||x.j.city.localeCompare(y.j.city),
    expires:(x,y)=>x.j.expires-y.j.expires||y.a.margin-x.a.margin,
  }[cur]||(()=>0);
  items.sort(cmp);
  const rows=items.map(({j,a})=>{
    const co=COUNTRY_BY_NAME[j.country];
    const fit=a.canRun?(a.margin>=10?'<span class="chip c-good">Good fit</span>':a.margin>=-4?'<span class="chip c-warn">Risky</span>':'<span class="chip c-bad">Long odds</span>'):'<span class="chip c-bad">'+a.team.length+' of '+j.need+' can go</span>';
    const techs=j.techs.map(t=>'<span class="tag spec '+(has(t)?"ok":"no")+'" title="'+(has(t)?"on your crew":"nobody on your crew has it")+'">'+(has(t)?"✓ ":"✗ ")+TECH_BY_K[t].l+'</span>').join(" ");
    const kn=j.know.map(x=>'<span class="tag '+(knows(x)?"ok":"no")+'" title="'+(knows(x)?"someone on the crew knows it":"nobody on the crew knows it")+'">'+(knows(x)?"✓ ":"✗ ")+'knows '+x+'</span>').join(" ");
    return '<div class="jobrow" data-act="open-job" data-id="'+j.id+'" data-country="'+esc(j.country)+'" role="button" tabindex="0">'
      +'<div class="code">'+(j.final?"—":"№"+j.id.slice(1).padStart(3,"0"))+'<br>'+diffbar(j.diff,j.heat>22)+'</div>'
      +'<div><div class="t">'+(j.final?'<span class="chip c-bad">Final score</span> ':'')+esc(j.title)+'</div>'
        +'<div class="loc">'+co.flag+' '+esc(j.city)+', '+esc(j.country)+' · crew of '+j.need+' · '+esc(co.langs[0])+' · from '+esc(j.client)+(j.final?'':' · expires wk '+j.expires)+'</div>'
        +'<div class="meta"><span class="tag">'+CAT_BY_K[j.cat].l+'</span>'+techs+' '+kn+' '+fit+'</div></div>'
      +'<div class="pay num">'+money(j.payout)+'<div class="loc" style="text-align:right">+'+j.heat+' heat</div></div></div>';
  }).join("");
  return '<div class="panel">'+head+filt+rows+'</div>';
}

  const brief='<div class="brief"><span class="client">Posted by '+esc(j.client)+'.</span> '

    +esc(co.pol)+'; '+esc(co.rel.toLowerCase())+'. Terrain: '+co.terrain.join(", ")+'. '

    +chip(speaks,'speaks '+co.langs[0],speaks?'someone going speaks it':'nobody going speaks it'+(cat.lang?' — and this job is all talk':''))
    +j.tags.map(t=>{const b=blockedBy(t);return chip(!b.length,TAG_LABEL[t],b.length?b.join(", ")+' won\'t — sits this one out':'nobody on the crew minds');}).join("")+'</div>';
  const checks=a.checks.map(x=>{const c=x.c;
    return '<div class="check'+(x.ok?"":" out")+'"><div class="av">'+avatar(c.avseed,c.gender)+'</div>'
      +'<div style="flex:1;min-width:0"><div class="mono" style="font-size:12.5px">'+esc(c.n)+' '+natOf(c).flag+' <span class="mono" style="color:var(--muted);font-size:10.5px">'+TECH_BY_K[c.tech].l+(c.role==="commander"?' · cmdr':'')+'</span></div>'
      +'<div class="why">'+esc(x.why)+'</div></div><div class="mark">'+(x.ok?"✓":"✗")+'</div></div>';}).join("");
  const factors='<div class="factors">'+a.factors.map(f=>'<span class="k">'+esc(f.k)+'</span><span><span class="'+(f.v>=0?"plus":"minus")+' num">'+(f.v>=0?"+":"")+f.v+'</span> · '+esc(f.note)+'</span>').join("")+'</div>';
  const odds=a.team.length?('<div class="odds" title="estimated outcome spread"><i class="o-good" style="width:'+a.pClean+'%"></i><i class="o-mid" style="width:'+a.pOk+'%"></i><i class="o-bad" style="width:'+(a.pFail+a.pDis)+'%"></i></div>'

// Your crew, compact, above the postings — so a job can be judged without leaving the board.
function crewStrip(){
  const hidden=!!S.stripHidden;
  const head='<div class="strip-h"><span class="kicker">Your crew · '+field().length+' ready · green tags below are techniques and knowledge you have, red are missing</span>'
    +'<span style="display:flex;gap:6px"><button class="btn ghost sm" data-act="tab" data-k="crew">Open crew</button><button class="btn ghost sm" data-act="strip-toggle">'+(hidden?"Show crew":"Hide")+'</button></span></div>';
  if(hidden)return '<div class="strip">'+head+'</div>';
  const cards=crewAll().map(c=>{
    const nat=natOf(c);
    return '<div class="sm'+(c.status!=="crew"?" out":"")+'"><div class="sm-av">'+avatar(c.avseed,c.gender)+'</div><div class="sm-b">'
      +'<div class="sm-n">'+esc(c.first)+(c.isPlayer?' <span class="chip c-bad">you</span>':'')+(c.status==="injured"?' <span class="chip c-warn">hurt</span>':'')+'</div>'
      +'<div class="sm-l">'+nat.flag+' P'+nat.tier+' · <b>'+TECH_BY_K[c.tech].l+'</b> · '+EXP[c.exp-1]+(c.role==="commander"&&!c.isPlayer?' · cmdr':'')+'</div>'
      +'<div class="sm-a num">'+ATTRS.map(a=>ATTR_ABBR[a]+' '+c.attrs[a]).join(' · ')+'</div>'
      +'<div class="sm-l">'+c.langs.join(", ")+' · knows '+c.know.join(", ")+(c.limits.length?' · <span style="color:var(--stamp)">'+c.limits.map(k=>LIMIT_BY_K[k].l).join(", ")+'</span>':'')+'</div>'
      +'</div></div>';
  }).join("");
  return '<div class="strip">'+head+'<div class="strip-row">'+cards+'</div></div>';
}

/* ---- ROSTER ---- */
function tabRoster(){
  const f=S.filter;
  let list=S.roster.filter(c=>c.status==="available");
  if(f.q){const q=f.q.toLowerCase();list=list.filter(c=>c.n.toLowerCase().includes(q)||c.nat.toLowerCase().includes(q)||c.langs.some(l=>l.toLowerCase().includes(q))||c.know.some(k=>k.toLowerCase().includes(q)));}
  if(f.tech)list=list.filter(c=>c.tech===f.tech);
  if(f.role)list=list.filter(c=>c.role===f.role);
  if(f.nat)list=list.filter(c=>c.nat===f.nat);
  const sorters={fee:(a,b)=>a.fee-b.fee,feeD:(a,b)=>b.fee-a.fee,exp:(a,b)=>b.exp-a.exp||b.fee-a.fee,power:(a,b)=>avg(b.attrs)-avg(a.attrs),name:(a,b)=>a.n.localeCompare(b.n)};
  list.sort(sorters[f.sort]||sorters.fee);
  const total=list.length;
  const shown=list.slice(0,S.shown);
  const canHire=recruits().length<CREW_SLOTS;
  const opt=(v,l,cur)=>'<option value="'+esc(v)+'"'+(cur===v?" selected":"")+'>'+l+'</option>';
  const bar='<div class="rosterbar">'
    +'<div class="field"><label for="q">Search</label><input type="text" id="q" value="'+esc(f.q)+'" placeholder="name, country, language, knowledge" autocomplete="off" style="min-width:220px"></div>'
    +'<div class="field"><label for="ftech">Technique</label><select id="ftech">'+opt("","All",f.tech)+TECHS.map(t=>opt(t.k,t.l,f.tech)).join("")+'</select></div>'
    +'<div class="field"><label for="frole">Role</label><select id="frole">'+opt("","Any",f.role)+opt("commander","Commander",f.role)+opt("soldier","Soldier",f.role)+'</select></div>'
    +'<div class="field"><label for="fnat">Nationality</label><select id="fnat">'+opt("","All",f.nat)+COUNTRIES.map(c=>opt(c.name,c.flag+" "+c.name,f.nat)).join("")+'</select></div>'
    +'<div class="field"><label for="fsort">Sort</label><select id="fsort">'+opt("fee","Fee, low first",f.sort)+opt("feeD","Fee, high first",f.sort)+opt("exp","Experience",f.sort)+opt("power","Raw skill",f.sort)+opt("name","Name",f.sort)+'</select></div>'
    +'<span class="count num">'+total.toLocaleString()+' match · showing '+shown.length+'</span></div>';
  const cards=shown.map(c=>'<div class="id">'+vetStamp(c)+idCardTop(c)
    +'<div class="attrs">'+attrRow(c)+'</div>'+profLine(c)
    +'<div class="foot"><span class="fee num">'+money(c.fee)+'</span>'
      +'<span style="display:flex;gap:6px"><button class="btn ghost sm" data-act="open-recruit" data-id="'+c.id+'">File</button>'
      +'<button class="btn sm" data-act="hire" data-id="'+c.id+'" '+(canHire&&S.money>=c.fee?"":"disabled")+'>Hire</button></span></div></div>').join("");
  const more=total>shown.length?'<div style="text-align:center;margin-top:14px"><button class="btn ghost" data-act="more">Show 30 more</button></div>':'';
  return '<div class="panel-h" style="border:0;padding:0 0 6px"><h2>Roster</h2><span class="kicker num">'+S.roster.length.toLocaleString()+' operatives on file · '+(CREW_SLOTS-recruits().length)+' seats open</span></div>'
    +bar+(shown.length?'<div class="cards">'+cards+'</div>'+more:'<div class="empty">No one matches. Loosen the filters.</div>');
}

/* ---- LOG ---- */
function tabLog(){
  const rc=recruits();
  const status=[
    ["Seats filled",(1+rc.length)+" / 5"],

let TICK=null;
function tickerArm(){
  if(TICK){clearInterval(TICK);TICK=null;}
  if(!S||!S.modal||S.modal.type!=="result")return;
  const d=S.modal.data;
  if(d.done)return;
  let reduced=false;
  try{reduced=!!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);}catch(e){}
  if(reduced){tickerFinish();return;}
  TICK=setInterval(()=>{
    if(!S||!S.modal||S.modal.type!=="result"||S.modal.data!==d){clearInterval(TICK);TICK=null;return;}
    d.revealed++;
    const el=document.getElementById("ticker");
    if(el){el.insertAdjacentHTML("beforeend",tickLine(d.narrative[d.revealed-1]));el.scrollTop=el.scrollHeight;}
    sfx("tick");
    if(d.revealed>=d.narrative.length){clearInterval(TICK);TICK=null;tickerFinish();}
  },SPEEDS[speedIdx()][0]);
}
function tickerFinish(){
  if(TICK){clearInterval(TICK);TICK=null;}
  const d=S&&S.modal&&S.modal.type==="result"?S.modal.data:null;if(!d)return;
  d.revealed=d.narrative.length;d.done=true;
  sfx(d.tier>=3?"good":d.tier===2?"stamp":"bad");
  const vt=verdictTrack(d.tier);musicPlay(vt[0],vt[1],true);
  render();
}

// Settings live outside the game save, so they survive a new game.
const SET_KEY="thecrew_settings_v1";
const SET={sound:true,music:true,volume:0.6,bright:100,lang:"en",tutorialDone:false,speed:2};
function loadSettings(){try{const r=localStorage.getItem(SET_KEY);if(r)Object.assign(SET,JSON.parse(r));}catch(e){}}
function saveSettings(){try{localStorage.setItem(SET_KEY,JSON.stringify(SET));}catch(e){}}
function applySettings(){
  const b=clamp(SET.bright,55,100)/100;
  const dim=hex=>{const n=parseInt(hex.slice(1),16);return "#"+[(n>>16)&255,(n>>8)&255,n&255].map(v=>Math.round(v*b).toString(16).padStart(2,"0")).join("");};
  const st=document.documentElement.style;
  st.setProperty("--paper",dim("#f6f4ee"));st.setProperty("--paper-2",dim("#efece3"));st.setProperty("--card",dim("#fbfaf6"));st.setProperty("--line",dim("#d9d5c8"));
}
function setVolume(v){SET.volume=clamp(Math.round(v*100)/100,0,1);saveSettings();sfx("click");musicSync();render();}
function setBright(b){SET.bright=clamp(Math.round(b),55,100);saveSettings();applySettings();render();}

/* ------------------------------ SOUND --------------------------------- */
// A handful of synthesised sounds; no files. Nothing plays until the first click.
let AC=null;
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
  if(AC&&AC.state==="suspended")AC.resume();
  return AC;
}
function tone(freq,dur,type,gain,when,slide){
  const c=ac();if(!c)return;
  const t0=c.currentTime+(when||0);
  const o=c.createOscillator(),g=c.createGain();
  o.type=type||"sine";o.frequency.setValueAtTime(freq,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,gain*SET.volume),t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+dur+0.05);
}
function sfx(name){
  if(!SET.sound||SET.volume<=0)return;
  try{
    switch(name){
      case "click": tone(1200,0.03,"square",0.05,0); break;
      case "tick": tone(900,0.02,"square",0.018,0); break;
      case "open": tone(440,0.08,"triangle",0.08,0); tone(660,0.08,"triangle",0.06,0.06); break;
      case "coin": tone(880,0.07,"sine",0.12,0); tone(1320,0.12,"sine",0.12,0.07); break;
      case "stamp": tone(140,0.12,"sine",0.5,0,60); tone(90,0.2,"triangle",0.3,0.02,40); break;
      case "good": sfx("stamp"); tone(660,0.1,"sine",0.1,0.15); tone(990,0.18,"sine",0.1,0.25); break;
      case "bad": sfx("stamp"); tone(220,0.25,"sawtooth",0.08,0.15,110); break;
      case "siren": for(let i=0;i<3;i++){tone(700,0.18,"square",0.06,i*0.36);tone(500,0.18,"square",0.06,i*0.36+0.18);} break;
    }
  }catch(e){}
}

/* ------------------------------ MUSIC --------------------------------- */
// Fourteen tracks from the creator's compilation: eleven rotate under the live job report,
// three score the verdict. Quiet between jobs. Browsers allow audio only after the first
// click, and the radio in the office reports its state.
const TRACKS={
  report:["music/report-01.mp3","music/report-02.mp3","music/report-03.mp3","music/report-04.mp3","music/report-05.mp3","music/report-06.mp3","music/report-07.mp3","music/report-08.mp3","music/report-09.mp3","music/report-10.mp3","music/report-11.mp3"],
  result:{good:"music/result-success.mp3",messy:"music/result-messy.mp3",bad:"music/result-disaster.mp3"},
};
const SPEEDS=[[4500,"Slowest"],[3000,"Slow"],[2000,"Normal"],[1300,"Fast"],[800,"Fastest"]];
function speedIdx(){return clamp(Math.round(SET.speed==null?2:SET.speed),0,SPEEDS.length-1);}
let MUSIC=null,userGestured=false,musicState="idle",musicNote="",musicWant=null,musicSrc=null;
const musicBlobTried={};
function musicEl(){
  if(!MUSIC){
    try{
      MUSIC=new Audio();MUSIC.preload="auto";
      MUSIC.addEventListener("playing",()=>{musicState="playing";musicNote="";refreshRadio();});
      MUSIC.addEventListener("pause",()=>{if(musicState==="playing"){musicState="stopped";refreshRadio();}});
      MUSIC.addEventListener("ended",()=>{if(musicWant&&!musicWant.loop){musicState="stopped";refreshRadio();}});
      MUSIC.addEventListener("error",()=>{musicLoadFallback();});
    }catch(e){MUSIC=null;musicState="blocked";musicNote="this browser has no audio";}
  }
  return MUSIC;
}
// If a track won't load as a plain source, fetch it and play it from memory.
function musicLoadFallback(){
  const src=musicSrc;if(!src)return;
  const fail=why=>{musicState="blocked";musicNote="the track could not be loaded here ("+why+")";refreshRadio();};
  if(musicBlobTried[src]){fail("media blocked");return;}
  musicBlobTried[src]=true;
  try{
    fetch(src).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.blob();})
      .then(b=>{if(musicSrc!==src)return;MUSIC.src=URL.createObjectURL(b);musicSync();})
      .catch(e=>fail(e&&e.message?e.message:"fetch failed"));
  }catch(e){fail("fetch unavailable");}
}
function musicPlay(src,label,loop){musicWant={src,label,loop:!!loop};musicSync();}
function musicStop(){musicWant=null;musicSync();}
function verdictTrack(tier){return tier>=3?[TRACKS.result.good,"the verdict — success"]:tier===2?[TRACKS.result.messy,"the verdict — messy"]:[TRACKS.result.bad,"the verdict — disaster"];}
function musicSync(){
  const m=musicEl();if(!m)return;
  try{
    m.volume=clamp(SET.volume*0.5,0,1);
    const allowed=SET.sound&&SET.music&&SET.volume>0&&userGestured&&!document.hidden;
    if(musicWant&&allowed){
      if(musicSrc!==musicWant.src){musicSrc=musicWant.src;m.src=musicWant.src;musicState="idle";}
      m.loop=musicWant.loop;
      if(m.paused){
        const p=m.play();
        if(p&&p.catch)p.catch(err=>{
          const n=err&&err.name||"error";
          musicState="blocked";
          musicNote=n==="NotAllowedError"?"the browser wants a click first — press Start the radio":n==="NotSupportedError"?"the track could not be loaded here":"could not play ("+n+")";
          refreshRadio();
        });
      }
    } else if(!m.paused)m.pause();
  }catch(e){}
}
function refreshRadio(){if(UI.office)render();}
function musicStatusText(){
  if(!SET.sound)return "Radio off — sound is off";
  if(!SET.music)return "Radio off";
  if(SET.volume<=0)return "Radio on, volume at zero";
  if(!musicWant)return "Radio quiet between jobs — a track plays under each job report, another under the verdict";
  if(musicState==="playing")return "♪ Now playing — "+musicWant.label;
  if(musicState==="blocked")return "Radio silent: "+musicNote;
  return "Radio ready — "+musicWant.label+" · press Start the radio, or click anywhere";
}
function radioLabel(){
  if(!SET.sound||!SET.music)return "RADIO OFF";
  if(!musicWant)return "STANDBY";
  if(musicState==="playing")return "♪ ON AIR";
  if(musicState==="blocked")return "NO SIGNAL";
  return "TUNING";
}

      +'Clients post jobs online by country; each country has its own categories, language, money, politics and terrain. Everyone on the crew goes on every job, if they can get in and the job doesn\'t hit one of their limits. '
      +'Success pays and builds ranking; failure adds heat and gets people hurt or held. Reach 100 ranking and the final score appears.</div>'
      +(S&&!S.over?'<hr class="rule"><button class="btn ghost sm" data-act="tut-start">Run the tutorial again</button>':'');
  } else if(UI.panel==="exit"){
    h="The door";
    b=UI.confirmNew
      ?'<div class="warnbox">This burns the current file. The crew, the money, the ranking — gone. Sure?</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn stamp" data-act="off-burn-yes">Yes, burn it</button><button class="btn ghost" data-act="off-exit">No, keep it</button></div>'
      :'<div class="mono" style="font-size:12.5px;line-height:1.7;color:var(--ink-2)">The game saves itself; walking out loses nothing.</div><hr class="rule"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="off-close">'+(S?"Back to the game":"Back")+'</button>'+(S?'<button class="btn ghost" data-act="off-burn">Burn the file · new game</button>':'')+'</div>';
  }
  return '<div class="above"><div class="scrim" data-act="off-panel-close"><div class="modal" role="dialog" aria-modal="true" style="max-width:560px"><div class="modal-h"><h2>'+h+'</h2><button class="x" data-act="off-panel-close" aria-label="Close">✕</button></div><div class="modal-b">'+b+'</div></div></div></div>';
}

/* --------------------------- TITLE / CREATE --------------------------- */
function screenTitle(){
  const has=hasSave();
  const sv=savedSummary();
  const redact=w=>'<span class="redacted">'+"█".repeat(w)+'</span>';
  return '<div class="wrap"><div class="hero">'
    +'<div class="eyebrow">Case file · Classified</div><h1>The Crew</h1>'
    +'<p class="tagline">Five seats. Five thousand files. You are the criminals — the clients online are worse. A job in every country, a border in front of each one. Know your crew, or the job will teach you.</p></div>'
    +'<div class="filecard panel"><div class="panel-h"><h2>Open a Dossier</h2><span class="kicker">5,000 operatives on file</span></div>'
    +'<div class="panel-b"><div class="mono" style="font-size:13px;line-height:1.7;color:var(--ink-2)">'
      +'You are the name at the top of the police\'s chart. Everyone below is '+redact(6)+' — a passport, a set of hands, a record, a price, and a secret. '
      +'Some of them are '+redact(9)+'. Your job is to know which, before the border does.</div>'
    +'<hr class="rule">'
    +(sv?'<div class="mono" style="font-size:12px;margin-bottom:10px">Saved game: <b>'+esc(sv.n)+'</b> · week '+sv.week+' · ranking '+sv.rep+' ('+esc(rankName(sv.rep))+') · '+money(sv.money)+'</div>':'')
    +(STORAGE_OK?'':'<div class="warnbox">This browser is not keeping saves — a private window, or site data blocked. You can play, but progress is lost when you leave.</div>')
    +'<div style="display:flex;gap:10px;flex-wrap:wrap">'
    +(sv?'<button class="btn stamp" data-act="continue">Continue →</button><button class="btn ghost" data-act="begin">New game</button>'
        :'<button class="btn stamp" data-act="begin">New game →</button>'+(has?'<button class="btn ghost" data-act="continue">Continue last game</button>':''))
    +'</div></div></div>'
    +footNote()+'</div>';
}
function savedSummary(){
  try{const r=localStorage.getItem(SAVE_KEY);if(!r)return null;const d=JSON.parse(r);if(!d||!d.player||d.over)return null;return {n:d.player.n,week:d.week,rep:d.rep||0,money:d.money||0};}catch(e){return null;}
}
function rollDraftProfile(){
  const rng=freshRng();
  const nat=COUNTRY_BY_NAME[draft.nat];
  draft.role="commander";
  draft.profile=genProfile(rng,nat,draft.gender,{tech:draft.tech,role:"commander"});
  draft.profile.cmd=Math.max(5,draft.profile.cmd);
}
function screenCreate(){
  if(!draft){
    const r=freshRng();
    draft={name:"",gender:"M",nat:pick(r,COUNTRIES).name,role:"commander",tech:pick(r,TECHS).k,avseed:ri(r,1,1e9),profile:null};
    rollDraftProfile();
  }
  const p=draft.profile;
  const natOpts=COUNTRIES.map(n=>'<option value="'+esc(n.name)+'"'+(draft.nat===n.name?" selected":"")+'>'+n.flag+' '+esc(n.name)+' · P'+n.tier+'</option>').join("");
  const techOpts=TECHS.map(t=>'<option value="'+t.k+'"'+(draft.tech===t.k?" selected":"")+'>'+t.l+'</option>').join("");
  const g=(v,l,act,key)=>'<button class="genbtn'+(draft[key]===v?" on":"")+'" data-act="'+act+'" data-v="'+v+'">'+l+'</button>';
  const fake={attrs:p.attrs,edu:p.edu,jail:p.jail,streets:p.streets,know:p.know,langs:p.langs,limits:p.limits};
  return '<div class="wrap"><div class="hero" style="padding:34px 0 22px"><div class="eyebrow">New dossier</div><h1 style="font-size:clamp(38px,10vw,74px)">Who are you?</h1></div>'
    +'<div class="panel" style="max-width:820px;margin:0 auto"><div class="panel-b"><div class="create-grid">'
      +'<div><div class="bigav">'+avatar(draft.avseed,draft.gender)+'</div><div style="text-align:center;margin-top:10px"><button class="btn ghost sm" data-act="reroll-av">↻ New likeness</button></div></div>'
      +'<div>'
        +'<div class="field" style="margin-bottom:12px"><label for="pname">Alias</label><input type="text" id="pname" maxlength="22" value="'+esc(draft.name)+'" placeholder="e.g. Vera Kessler" autocomplete="off"></div>'
        +'<div class="field" style="margin-bottom:12px"><label>Sex</label><div class="swatchrow">'+g("M","Male","draft-gender","gender")+g("F","Female","draft-gender","gender")+'</div></div>'
        +'<div class="field" style="margin-bottom:12px"><label>Role</label><div class="mono" style="font-size:13px"><b>Commander</b> — it\'s your crew. The seats are for soldiers, and the odd commander-type who takes your orders badly but can lead when you can\'t get in.</div></div>'
        +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">'
          +'<div class="field"><label for="pnat">Nationality · passport</label><select id="pnat">'+natOpts+'</select></div>'
          +'<div class="field"><label for="ptech">Technique</label><select id="ptech">'+techOpts+'</select></div></div>'
        +'<div class="kicker">Your file</div><div class="rolled">'
          +'<div class="attrs" style="padding:0 0 6px;grid-template-columns:1fr 1fr">'+attrRow(fake)+'</div>'
          +'<div class="mono" style="font-size:11px;line-height:1.6;color:var(--ink-2)"><b>'+EDU[p.edu]+'</b> · jail '+yrs(p.jail)+' · streets '+yrs(p.streets)+'<br>Knows '+p.know.join(", ")+' · Speaks '+p.langs.join(", ")
          +(p.limits.length?'<br><span style="color:var(--stamp)">'+p.limits.map(k=>LIMIT_BY_K[k].l).join(" · ")+'</span>':'<br>No known limits')+'</div>'
          +'<div style="margin-top:8px"><button class="btn ghost sm" data-act="reroll-profile">↻ Another life</button></div></div>'
        +'<hr class="rule"><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost" data-act="to-title">← Back</button>'
          +'<button class="btn stamp" data-act="confirm-create" '+(draft.name.trim()?"":"disabled")+'>Fill the seats →</button></div>'
      +'</div></div></div></div>'+footNote()+'</div>';
}
function screenOver(){
  const win=S.over==="win";
  const col=win?"var(--good)":"var(--stamp)";
  return '<div class="wrap"><div class="hero" style="padding:60px 0 30px"><div class="eyebrow">'+(win?"Case closed":"The file is burned")+'</div>'
    +'<h1 style="color:'+col+'">'+(win?"You are<br>The Crew":"Game<br>Over")+'</h1>'
    +'<p class="tagline">'+(win?'The score cleared, and the name at the top of the chart was never spoken aloud. '+esc(S.player.n)+' walks away, and the crew walks too.'
      :'The heat won, the loyalty didn\'t hold, and the float ran dry. Somewhere a detective closes a folder with your alias on the tab.')+'</p></div>'
    +'<div class="panel" style="max-width:520px;margin:0 auto"><div class="panel-b"><div class="num-grid">'
      +'<div class="b"><div class="k">Weeks run</div><div class="v num">'+S.week+'</div></div>'
      +'<div class="b"><div class="k">Ranking</div><div class="v num">'+S.rep+'</div></div>'
      +'<div class="b"><div class="k">Final float</div><div class="v num">'+money(S.money)+'</div></div></div>'
    +'<hr class="rule"><div style="display:flex;justify-content:center"><button class="btn stamp" data-act="newgame">Run it again →</button></div></div></div>'+footNote()+'</div>';
