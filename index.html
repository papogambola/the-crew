<title>The Crew</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600;700&family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --paper:#f6f4ee;
    --paper-2:#efece3;
    --card:#fbfaf6;
    --ink:#111010;
    --ink-2:#4a463e;
    --muted:#726c60;
    --line:#d9d5c8;
    --line-2:#c4bfae;
    --stamp:#9a2b1e;
    --good:#2f6b34;
    --warn:#8a6212;
    --bad:#9a2b1e;
    --shadow:0 1px 0 rgba(17,16,16,.04), 0 8px 24px -18px rgba(17,16,16,.5);
    color-scheme:light;
    --f-logo:"Anton","Impact","Oswald","Arial Narrow",sans-serif;
    --f-disp:"Oswald","Arial Narrow",system-ui,sans-serif;
    --f-body:"Spectral","Iowan Old Style",Georgia,serif;
    --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  /* A PC game has one layout. Below this the window scrolls; nothing rearranges. */
  body{min-width:960px;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--f-body);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    background-image:repeating-linear-gradient(0deg,transparent,transparent 27px,rgba(17,16,16,.02) 27px,rgba(17,16,16,.02) 28px);
  }
  .wrap{max-width:1060px;margin:0 auto;padding:0 16px 64px}
  .mono{font-family:var(--f-mono)}
  .flag{display:inline-block;width:18px;height:12px;vertical-align:-1px;border:1px solid rgba(17,16,16,.4);background:#fff;box-sizing:content-box}
  .num{font-variant-numeric:tabular-nums}
  h1,h2,h3{font-family:var(--f-disp);font-weight:600;margin:0;letter-spacing:.02em;text-wrap:balance;line-height:1.05}
  button{font-family:inherit;color:inherit;cursor:pointer}
  a{color:inherit}
  .jobback{margin:0 0 8px}
  .kicker{font-family:var(--f-mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}

  .topbar{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:2px solid var(--ink)}
  .topbar-in{max-width:1060px;margin:0 auto;padding:8px 112px 8px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{font-family:var(--f-logo);font-weight:400;font-size:24px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;line-height:1}
  .stat{display:flex;flex-direction:column;line-height:1;gap:3px;min-width:72px}
  .stat .l{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .stat .v{font-family:var(--f-mono);font-size:15px;font-weight:500}
  .heatwrap{min-width:132px;flex:1 1 132px;max-width:220px}
  /* three bands on the track — green to 60, amber to 80, red to 100 — and the fill in the colour of the band the heat is in */
  .heatbar{height:9px;border:1px solid var(--ink);position:relative;overflow:hidden;
    background:linear-gradient(90deg,color-mix(in srgb,var(--good) 26%,var(--paper-2)) 0 60%,color-mix(in srgb,var(--warn) 30%,var(--paper-2)) 60% 80%,color-mix(in srgb,var(--stamp) 28%,var(--paper-2)) 80% 100%)}
  .heatbar::before,.heatbar::after{content:"";position:absolute;top:0;bottom:0;width:1px;background:var(--ink);opacity:.55;z-index:1}
  .heatbar::before{left:60%}.heatbar::after{left:80%}
  .heatbar>i{position:absolute;inset:0;width:0;background:var(--good);transition:width .5s ease,background-color .5s ease}
  .heatbar.amber>i{background:var(--warn)}
  .heatbar.red>i{background:var(--stamp)}
  .spacer{flex:1 1 auto}

  /* The tabs pin under the top bar, so Crew/Jobs/Roster/Log are reachable from anywhere down a
     long board. The offset is the top bar's real height — it wraps to two rows in a narrow window,
     so a hardcoded number would leave a gap or hide the first row. See syncTopbarH(). */
  /* The one screen a phone or tablet ever gets. It is not a layout of the game; it is a door. */
  .pconly{min-width:0;max-width:640px;margin:0 auto;padding:56px 22px;text-align:center}
  .pconly h1{font-family:var(--f-logo);font-weight:400;font-size:44px;letter-spacing:.02em;text-transform:uppercase;margin:0 0 6px;line-height:1}
  .pconly .rule{height:2px;background:var(--ink);margin:16px auto 20px;max-width:120px}
  .pconly p{font-size:16px;line-height:1.65;margin:0 0 14px}
  .pconly .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
  .pconly .b{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--muted);margin-top:26px}

  .tabs{position:sticky;top:var(--topbar-h,56px);z-index:30;
    background:var(--paper);display:flex;border-bottom:2px solid var(--ink);margin:0 0 18px;flex-wrap:wrap}
  .tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:12px 16px 10px;font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.12em;font-size:14px;color:var(--muted)}
  .tab.on{color:var(--ink);border-color:var(--stamp)}
  .tab .b{font-family:var(--f-mono);font-size:10px;color:var(--muted);margin-left:6px}

  .panel{background:var(--card);border:1px solid var(--line-2);box-shadow:var(--shadow)}
  .panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .panel-h h2{font-size:16px;letter-spacing:.08em;text-transform:uppercase}
  .panel-b{padding:16px}
  .grid{display:grid;gap:14px}
  .g-hq{grid-template-columns:1.3fr 1fr}

  .rule{height:1px;background:var(--line);border:0;margin:12px 0}
  .btn{appearance:none;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.1em;font-size:13px;padding:9px 16px;transition:.12s}
  .btn:hover{background:#000}
  .btn:disabled,.btn:disabled:hover{opacity:1;background:var(--paper-2);color:var(--muted);border-color:var(--line-2);cursor:not-allowed}
  .btn.ghost:disabled,.btn.ghost:disabled:hover{background:transparent}
  .btn.ghost{background:transparent;color:var(--ink)}
  .btn.ghost:hover{background:var(--paper-2)}
  .btn.sm{font-size:11px;padding:6px 11px;letter-spacing:.08em}
  .btn.stamp{border-color:var(--stamp);background:var(--stamp)}
  .btn.stamp:hover{background:#7f2116}

  .tag{display:inline-block;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line-2);padding:2px 6px;color:var(--ink-2);background:var(--paper)}
  .tag.spec{border-color:var(--ink);color:var(--ink)}
  .tag.pass{border-style:dashed}
  .tag.ok{border-color:var(--good);color:var(--good)}
  .tag.no{border-color:var(--stamp);color:var(--stamp)}
  .chip{font-family:var(--f-mono);font-size:10px;padding:1px 6px;border:1px solid;letter-spacing:.05em;text-transform:uppercase}
  .c-good{color:var(--good);border-color:var(--good)}
  .c-warn{color:var(--warn);border-color:var(--warn)}
  .c-bad{color:var(--bad);border-color:var(--bad)}
  .c-ink{color:var(--ink);border-color:var(--ink)}

  .rosterbar{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
  .field{display:flex;flex-direction:column;gap:3px}
  .field label{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  input[type=text],select{font-family:var(--f-mono);font-size:13px;padding:7px 9px;border:1px solid var(--line-2);background:var(--paper);color:var(--ink);max-width:100%}
  input[type=text]:focus,select:focus,.tab:focus-visible,.btn:focus-visible,button:focus-visible,.jobrow:focus-visible,.streetrow:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
  .count{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-left:auto;padding-bottom:8px}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .id{border:1px solid var(--line-2);background:var(--card);display:flex;flex-direction:column;position:relative}
  .id.you{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
  .id.slot{border-style:dashed;justify-content:center;align-items:center;min-height:200px;color:var(--muted);font-family:var(--f-mono);font-size:12px;text-align:center;padding:16px;gap:10px}
  /* Locked reads the same wherever it appears: a faded, dashed, hatched card you cannot use yet. */
  .id.slot.locked,.panel.locked{opacity:.62;border-style:dashed;
    background-image:repeating-linear-gradient(135deg,transparent 0 9px,rgba(0,0,0,.035) 9px 10px)}
  .panel.locked h2{color:var(--muted)}
  .id .top{display:flex;gap:10px;padding:11px 11px 8px}
  .id .av{width:60px;height:72px;flex:none;border:1px solid var(--ink);background:#fff}
  .id .who{min-width:0;flex:1}
  .id .nm{font-family:var(--f-disp);font-size:16px;line-height:1.05;letter-spacing:.02em}
  .nm-tr{font-weight:500;color:var(--ink-2)}
  .nm-tr .tip{text-decoration-color:var(--ink-2)}
  .id .sub{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-top:3px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
  .id .spec{font-family:var(--f-mono);font-size:11px;margin-top:6px;letter-spacing:.04em}
  .exp{display:inline-flex;gap:2px;margin-top:6px;vertical-align:middle}
  .pip{width:9px;height:9px;border:1px solid var(--ink);display:inline-block;flex:none}
  .pip.f{background:var(--ink)}
  .attrs{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;padding:2px 11px 8px}
  .attr{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10px;color:var(--ink-2)}
  .attr .k{width:34px;color:var(--muted);letter-spacing:.05em}
  .attr .bar{flex:1;height:5px;background:var(--paper-2);border:1px solid var(--line)}
  .attr .bar>i{display:block;height:100%;background:var(--ink)}
  .attr .n{width:20px;text-align:right}
  .prof{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2);padding:0 11px 10px;line-height:1.55;border-top:1px dotted var(--line);padding-top:7px;margin:0 0 0}
  .prof b{font-weight:500;color:var(--ink)}
  .prof .lim{color:var(--stamp)}
  .id .foot{margin-top:auto;border-top:1px dashed var(--line-2);padding:8px 11px;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
  .fee{font-family:var(--f-mono);font-size:13px;font-weight:500}
  .stampmark{position:absolute;top:8px;right:8px;font-family:var(--f-disp);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--stamp);border:2px solid var(--stamp);padding:1px 5px;transform:rotate(-8deg);opacity:.9;background:rgba(251,250,246,.85)}
  .stampmark.ink{color:var(--ink-2);border-color:var(--ink-2)}

  .jobrow,.streetrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;transition:.1s}
  .jobrow:hover,.streetrow:hover{background:var(--paper-2)}
  .jobrow:last-child,.streetrow:last-child{border-bottom:0}
  .jobrow .code,.streetrow .code{font-family:var(--f-mono);font-size:11px;color:var(--muted);width:52px}
  .jobrow .t,.streetrow .t{font-family:var(--f-disp);font-size:17px;letter-spacing:.02em}
  .jobrow .loc,.streetrow .loc{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:2px}
  .jobrow .pay,.streetrow .pay{font-family:var(--f-mono);font-size:15px;text-align:right;font-weight:500}
  .jobrow .meta,.streetrow .meta{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
  .streetrow .t{font-size:15px}
  .diffbar{display:inline-flex;gap:2px;vertical-align:middle}
  .diffbar i{width:6px;height:11px;background:var(--paper-2);border:1px solid var(--line-2)}
  .diffbar i.f{background:var(--ink);border-color:var(--ink)}
  .diffbar i.h{background:var(--stamp);border-color:var(--stamp)}

  .scrim{position:fixed;inset:0;background:rgba(17,16,16,.44);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:26px 14px;overflow:auto}
  .modal{background:var(--paper);border:2px solid var(--ink);max-width:680px;width:100%;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
  .modal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:14px 16px;border-bottom:2px solid var(--ink);background:var(--paper-2)}
  .modal-b{padding:16px}
  .x{appearance:none;border:1px solid var(--ink);background:var(--paper);width:30px;height:30px;font-size:16px;line-height:1;flex:none}

  .check{display:flex;align-items:center;gap:10px;padding:7px 8px;border:1px solid var(--line-2);margin-bottom:6px;background:var(--card)}
  .check.out{opacity:.6}
  .check.sat{border-style:dashed;background:var(--paper-2)}
  .check.sat .av{opacity:.45}
  .check.sat .why{color:var(--muted);font-style:italic}
  .check .av{width:34px;height:41px;border:1px solid var(--ink);background:#fff;flex:none}
  .check .mark{font-family:var(--f-mono);font-size:14px;width:18px;text-align:center;flex:none}
  .check .why{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
  .check.out .why{color:var(--stamp)}

  .req{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .req .b{border:1px solid var(--line-2);padding:6px 9px;background:var(--card);min-width:78px;flex:1 1 78px}
  .req .b .k{font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .req .b .v{font-family:var(--f-disp);font-size:16px}
  .req .b .sub{font-family:var(--f-mono);font-size:10px;letter-spacing:.04em;margin-top:2px}
  .brief{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);line-height:1.65;border-left:3px solid var(--ink);padding:4px 10px;margin:8px 0 10px;background:var(--card)}
  /* ---- what the job actually is ---- */
  .jobbrief{border:1px solid var(--line-2);background:var(--card);padding:9px 12px 11px;margin:2px 0 10px}
  .jobbrief p{margin:5px 0 0;font-family:var(--f-body);font-size:14.5px;line-height:1.6;color:var(--ink)}
  .brief .client{color:var(--ink);font-weight:500}
  .factors{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-family:var(--f-mono);font-size:11px;margin-top:8px}
  /* the dashboard: every section shut is still a line of numbers */
  .fold{border:1px solid var(--line-2);background:var(--card);margin-bottom:10px}
  .fold.on{border-color:var(--ink)}
  .fold-h{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;appearance:none;border:0;
    background:none;padding:11px 13px;cursor:pointer;color:inherit}
  .fold-h:hover{background:var(--paper-2)}
  .fold.on .fold-h{border-bottom:1px solid var(--line)}
  .fold-c{font-family:var(--f-mono);font-size:12px;color:var(--muted);flex:none;width:11px}
  .fold-t{font-family:var(--f-disp);font-size:16px;letter-spacing:.02em;text-transform:uppercase;flex:none}
  .fold-s{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);letter-spacing:.02em;
    margin-left:auto;text-align:right;line-height:1.45}
  .fold-s .bad{color:var(--stamp)}
  .fold-s .ok{color:var(--good)}
  .fold-b{padding:12px 13px 13px}
  /* the panels inside a section have already been introduced by its header */
  .fold-b>.panel{border:0;margin:0!important;background:none}
  .fold-b>.panel>.panel-h{display:none}
  .fold-b>.panel>.panel-b{padding:0}
  @media(prefers-reduced-motion:no-preference){.fold-c{transition:none}}
  /* what the reckoning said, and what would have answered it */
  .wrongs{margin-top:8px;border:1px solid var(--line-2);background:var(--card)}
  .wr{padding:7px 10px}
  .wr+.wr{border-top:1px solid var(--line)}
  .wr-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .wr-k{font-family:var(--f-disp);font-size:13px;letter-spacing:.02em}
  .wr-v{font-family:var(--f-mono);font-size:12px;color:var(--stamp)}
  .wr-n{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-top:1px}
  .wr-f{font-size:13px;line-height:1.5;margin-top:4px}
  /* Who the fee goes to. Name, share, money — the money column right-aligned so the amounts
     line up against each other, which is the only way a split reads at a glance. */
  .split{border:1px solid var(--line-2);background:var(--card);margin-top:8px}
  .split .r{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:baseline;padding:5px 10px;font-family:var(--f-mono);font-size:12px}
  .split .r+.r{border-top:1px solid var(--line)}
  .split .r .p{color:var(--muted);font-size:11px;min-width:46px;text-align:right}
  .split .r .m{min-width:92px;text-align:right}
  .split .r .w .t{color:var(--muted);font-size:10.5px}
  .split .r.sum{border-top:1px solid var(--ink);background:var(--paper-2)}
  .split .r.keep{border-top:2px solid var(--ink);font-family:var(--f-disp);font-size:15px}
  .split .r.keep .p{font-family:var(--f-mono)}
  .split .r.off{color:var(--muted)}
  .split .r.off .m{text-decoration:line-through}
  .split .r.cost .m{color:var(--stamp)}
  .benchdelta{border:1px solid var(--ink);background:var(--paper-2);padding:8px 10px;margin-top:8px;font-family:var(--f-mono);font-size:11.5px;line-height:1.6}
  .benchdelta b{font-family:var(--f-disp);font-size:13px;letter-spacing:.01em}
  .benchdelta .up{color:var(--good)}
  .benchdelta .dn{color:var(--stamp)}
  .benchdelta .small{color:var(--muted);font-size:10.5px;line-height:1.55;display:inline-block;margin-top:3px}
  /* the file of whoever the between-jobs question is about — a crew card, under the question */
  .evwho{margin:6px 0 4px;padding-bottom:9px}
  .evfacts{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-family:var(--f-mono);font-size:11px;padding:4px 11px 0;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
  .evfacts .k{color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-size:9.5px}
  .factors .k{color:var(--muted)}
  .factors .plus{color:var(--good)}
  .factors .minus{color:var(--stamp)}

  .odds{height:12px;border:1px solid var(--ink);display:flex;overflow:hidden;font-size:0}
  .odds i{height:100%;display:block}
  .odds .o-good{background:var(--good)}
  .odds .o-mid{background:var(--warn)}
  .odds .o-bad{background:var(--stamp)}

  .hero{padding:56px 0 30px;text-align:center;border-bottom:2px solid var(--ink);margin-bottom:26px;position:relative}
  /* ---- the title screen ---- */
  .hero.title{padding:30px 0 26px}
  /* The logotype fills the column. "THE CREW" in Anton is 3.6948em wide, measured, and the
     column is 928px at the narrowest window the game allows and 1028px once the wrap caps —
     so 26vw between those two stops keeps the mark at 97% of the width all the way across. */
  .hero.title h1{margin:16px 0 2px;font-size:clamp(249px,26vw,276px);letter-spacing:0}
  /* The crew, before there is one: five files drawn fresh every time the door opens. */
  .lineup{display:flex;justify-content:center;align-items:flex-end;gap:18px;margin:22px 0 0}
  .lu{width:128px}
  .lu-av{width:128px;height:154px;border:1.5px solid var(--ink);background:#fff;box-shadow:var(--shadow)}
  .lu-n{font-family:var(--f-mono);font-size:9px;letter-spacing:.2em;color:var(--muted);margin-top:5px;text-transform:uppercase}
  .lineup-rule{height:2px;background:var(--ink);max-width:740px;margin:14px auto 0}
  .lineup-cap{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:8px}
  /* ---- the publisher's mark at the foot of the title screen ---- */
  .titlefoot{text-align:center;margin-top:34px;padding-top:22px;border-top:1px solid var(--line)}
  .shhh{display:inline-flex;align-items:center;gap:18px}
  .shhh svg{display:block;fill:var(--ink)}
  .shhh .mark{height:92px;width:auto}
  .shhh .word{height:44px;width:auto}
  .titlefoot .year{font-family:var(--f-mono);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-2);margin-top:12px}
  .hero .eyebrow{font-family:var(--f-mono);letter-spacing:.4em;text-transform:uppercase;font-size:12px;color:var(--muted)}
  .hero h1{font-family:var(--f-logo);font-size:clamp(60px,17vw,150px);letter-spacing:.01em;line-height:.9;margin:10px 0 6px;text-transform:uppercase;font-weight:400}
  .hero .tagline{font-family:var(--f-body);font-style:italic;font-size:clamp(15px,2.4vw,19px);color:var(--ink-2);max-width:46ch;margin:8px auto 0}
  .filecard{max-width:720px;margin:0 auto}
  .redacted{background:var(--ink);color:var(--ink);user-select:none}

  .create-grid{display:grid;grid-template-columns:288px 1fr;gap:22px;align-items:start}
  .bigav{width:100%;max-width:288px;aspect-ratio:200/240;border:2px solid var(--ink);background:#fff;margin:0 auto}
  /* The picture stays put while the ten sliders scroll past it. Choosing a nose you cannot see
     is not choosing anything, and ten parts is taller than a laptop screen. */
  .facecol{position:sticky;top:12px;z-index:2;background:var(--paper);padding-bottom:8px}
  /* ---- the face builder: one slider a part ---- */
  .facebox{margin-top:10px;padding:10px 12px 12px}
  /* label and value share a line, so a part is two rows instead of three */
  .facerow{display:grid;grid-template-columns:1fr auto;column-gap:10px;align-items:baseline;margin-top:7px}
  /* placed explicitly: the name and the choice share the top line, the slider runs under both.
     Left to auto-placement the value lands below its own slider and reads as the next part's. */
  .facerow label{grid-area:1/1;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .faceval{grid-area:1/2;text-align:right;font-family:var(--f-mono);font-size:11px;color:var(--ink)}
  .faceslide{grid-area:2/1/3/3}
  /* what the trade actually is, the first time anybody reads the word */
  .tradehint{margin-top:6px;font-size:11.5px;line-height:1.6;color:var(--ink-2);border-left:2px solid var(--line);padding-left:9px}
  .faceslide{-webkit-appearance:none;appearance:none;width:100%;height:14px;background:transparent;cursor:pointer;margin:2px 0}
  .faceslide::-webkit-slider-runnable-track{height:12px;background:var(--line-2);border:1px solid var(--line)}
  .faceslide::-moz-range-track{height:12px;background:var(--line-2);border:1px solid var(--line)}
  .faceslide::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:12px;background:var(--ink);border:0;border-radius:0}
  .faceslide::-moz-range-thumb{width:22px;height:12px;background:var(--ink);border:0;border-radius:0}
  .faceslide:focus-visible::-webkit-slider-thumb{outline:2px solid var(--stamp);outline-offset:2px}
  .faceslide:focus-visible::-moz-range-thumb{outline:2px solid var(--stamp);outline-offset:2px}
  .swatchrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
  .genbtn{border:1px solid var(--ink);background:var(--paper);padding:8px 14px;font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.1em;font-size:13px}
  .genbtn.on{background:var(--ink);color:var(--paper)}
  .rolled{border:1px solid var(--line-2);background:var(--card);padding:10px 12px;margin-top:6px}

  .log{display:flex;flex-direction:column;max-height:420px;overflow:auto}
  .logline{font-family:var(--f-mono);font-size:12px;padding:7px 0;border-bottom:1px dotted var(--line);display:flex;gap:9px}
  .logline .wk{color:var(--muted);flex:none;width:30px}
  .logline.good .tx{color:var(--good)}
  .logline.bad .tx{color:var(--bad)}
  .logline.warn .tx{color:var(--warn)}
  .logline.big .tx{font-weight:600}

  .empty{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding:22px;text-align:center}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-family:var(--f-mono);font-size:12px}
  .kv .k{color:var(--muted)}
  .foot-note{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;margin-top:26px;line-height:1.6}
  .foot-note a{color:var(--ink-2);text-underline-offset:3px}
  .foot-note a:hover{color:var(--stamp)}
  .loy{height:6px;border:1px solid var(--ink);background:var(--paper-2);width:100%;position:relative}
  .loy>i{display:block;height:100%;background:var(--ink)}
  .loy.low>i{background:var(--stamp)}
  .result-verdict{font-family:var(--f-logo);font-size:clamp(30px,7vw,46px);text-transform:uppercase;letter-spacing:.03em;line-height:1}
  @keyframes stampin{0%{transform:scale(2.4) rotate(-14deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-6deg);opacity:1}}
  .verdict-stamp{display:inline-block;border:3px solid;padding:4px 14px;transform:rotate(-6deg);animation:stampin .3s ease-out}
  @media(prefers-reduced-motion:reduce){.verdict-stamp{animation:none}.heatbar>i{transition:none}}
  .num-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;margin-top:12px}
  .num-grid .b{border:1px solid var(--line-2);padding:8px 10px;background:var(--card)}
  .num-grid .b .k{font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .num-grid .b .v{font-family:var(--f-mono);font-size:18px}
  .warnbox{border:1px solid var(--stamp);background:var(--paper);padding:10px 12px;font-family:var(--f-mono);font-size:12px;color:var(--stamp);margin-bottom:12px}
  .sel-help{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin:6px 0 12px}

  /* ---- the burger and the office ---- */
  .burger{position:fixed;top:9px;right:16px;z-index:75;width:40px;height:36px;border:1px solid var(--ink);background:var(--paper);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;padding:0}
  .burger span{display:block;width:20px;height:2.5px;background:var(--ink)}
  .burger:hover{background:var(--paper-2)}
  .office{position:fixed;inset:0;z-index:70;background:var(--paper);overflow:auto;padding:12px 16px 24px}
  .office-in{max-width:1100px;margin:0 auto}
  .office-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:4px 104px 10px 0;border-bottom:2px solid var(--ink);margin-bottom:12px}
  .office-head h2{font-family:var(--f-logo);font-size:28px;letter-spacing:.03em;text-transform:uppercase;font-weight:400}
  .office-svg{width:100%;height:auto;display:block;border:1px solid var(--line-2);background:#fff}
  .office-svg :is(path,rect,line,polygon,polyline,ellipse,circle):not(.ns){stroke:var(--ink);stroke-width:2.2px;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
  .office-svg text{font-family:var(--f-mono);fill:var(--ink);stroke:none}
  .office-label{font-size:16px;font-weight:500;letter-spacing:.08em}
  .office-small{font-size:12px;letter-spacing:.06em}
  .office-svg .hot{cursor:pointer}
  .office-svg .hot:hover :is(rect,path,polygon,ellipse):not(.ns){fill:var(--paper-2)}
  .office-words{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;font-family:var(--f-mono);font-size:12px}
  .office-words .grp{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-2);padding:3px 6px;background:var(--card)}
  .office-words .grp button{appearance:none;border:1px solid var(--ink);background:var(--paper);width:24px;height:24px;font-family:var(--f-mono);padding:0}
  .above .scrim{z-index:80}

  /* ---- the i button, the tutorial ---- */
  .ibtn{position:fixed;top:9px;right:64px;z-index:75;width:36px;height:36px;border:1px solid var(--ink);border-radius:50%;background:var(--paper);font-family:var(--f-body);font-style:italic;font-weight:600;font-size:19px;line-height:1;padding:0 0 2px}
  .ibtn:hover{background:var(--paper-2)}
  .info-b p{margin:0 0 10px;font-size:14px;line-height:1.6}
  .info-b p:last-of-type{margin-bottom:0}
  .tut{position:fixed;left:0;right:0;bottom:0;z-index:90;padding:0 16px 16px;pointer-events:none}
  .tut-card{pointer-events:auto;max-width:560px;margin:0 auto;background:var(--paper);border:2px solid var(--ink);box-shadow:0 20px 50px -20px rgba(0,0,0,.6);padding:12px 16px 14px}
  .tut-card h3{font-size:18px;margin:4px 0 6px;text-transform:uppercase;letter-spacing:.06em}
  .tut-card p{margin:0;font-size:14px;line-height:1.55}
  .tut-btns{display:flex;gap:8px;align-items:center;margin-top:12px}
  .tut-target{outline:3px solid var(--stamp);outline-offset:4px;box-shadow:0 0 0 8px rgba(154,43,30,.14)}

  /* ---- the live job report ---- */
  /* the job on the world, zoomed to where it is, with the crew working on it */
  .feedmap{position:relative;border:1px solid var(--line-2);background:var(--card);margin-top:8px;overflow:hidden}
  .fm-clock{position:absolute;left:0;top:0;z-index:2;background:var(--ink);color:var(--paper);
    font-size:13px;letter-spacing:.14em;padding:3px 8px 2px;line-height:1.2}
  .fm-svg{display:block;width:100%;height:auto}
  .fm-grid{stroke:var(--line);stroke-width:.25;vector-effect:non-scaling-stroke;opacity:.7}
  .fm-land{fill:var(--paper-2);stroke:var(--ink);stroke-width:1.1px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
  .fm-water{fill:var(--card);stroke:var(--ink);stroke-width:.9px;vector-effect:non-scaling-stroke}
  .fm-city-h{fill:none;stroke:var(--stamp);stroke-width:.8px;vector-effect:non-scaling-stroke;opacity:.35}
  .fm-city-d{fill:var(--stamp)}
  .fm-where{position:absolute;right:0;top:0;z-index:2;background:var(--paper);border-left:1px solid var(--line-2);
    border-bottom:1px solid var(--line-2);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);padding:4px 8px 3px;line-height:1.2}
  .fm-tether line{stroke:var(--ink);stroke-width:.7px;vector-effect:non-scaling-stroke;opacity:.28}
  .fm-site circle{fill:var(--paper);stroke:var(--ink);stroke-width:1px;vector-effect:non-scaling-stroke}
  .fm-site text{font-family:var(--f-mono);letter-spacing:.18em;fill:var(--ink);text-anchor:middle;font-weight:500;
    paint-order:stroke;stroke:var(--paper-2);stroke-width:1.6px;stroke-linejoin:round}
  .fm-site.on circle{stroke:var(--stamp);stroke-width:2px}
  .fm-site.on text{fill:var(--stamp)}
  .fm-op{transition:transform .55s ease}
  .fm-op-b{fill:#fff}
  .fm-op-r{fill:none;stroke:var(--ink);stroke-width:1.5px;vector-effect:non-scaling-stroke}
  .fm-op-bb{fill:var(--ink);stroke:var(--paper);stroke-width:1.1}
  .fm-op-g{fill:none;stroke:var(--paper);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .fm-op-g circle{fill:none}
  .fm-op-n{font-family:var(--f-mono);font-size:2.8px;fill:var(--ink);text-anchor:middle;
    paint-order:stroke;stroke:var(--paper);stroke-width:1.6px;stroke-linejoin:round}
  @media(prefers-reduced-motion:reduce){.fm-op{transition:none}}
  /* the live screen: the feed on the left, the plan on the right, pinned while the feed scrolls */
  .modal.feed{max-width:1060px}
  .feed-cols{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
  .feed-side{position:sticky;top:0}
  .feed-side .feedmap{margin-top:0}
  .feed-main .ticker{margin-top:0;max-height:min(66vh,640px)}
  @media(max-width:920px){.feed-cols{grid-template-columns:1fr}.feed-side{position:static;order:-1}}
  .fm-flag{width:16px;height:11px;vertical-align:-1px;margin-right:5px}
  /* the plan: streets, water, the building, in ink */
  .sc-ground{fill:var(--paper-2)}
  .sc-block{fill:var(--paper);stroke:var(--ink);stroke-width:.5px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
  .sc-inner{fill:var(--paper-2);stroke:var(--ink);stroke-width:.4px;vector-effect:non-scaling-stroke}
  .sc-target{fill:var(--paper);stroke:var(--ink);stroke-width:1.5px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
  .sc-strong{fill:var(--paper);stroke:var(--ink);stroke-width:2px;vector-effect:non-scaling-stroke}
  .sc-line{fill:none;stroke:var(--ink);stroke-width:.6px;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
  .sc-thin{fill:none;stroke:var(--ink);stroke-width:.35px;vector-effect:non-scaling-stroke;opacity:.7}
  .sc-hatch{stroke:var(--ink);stroke-width:.3px;vector-effect:non-scaling-stroke;opacity:.5}
  .sc-road-e{fill:none;stroke:var(--ink);stroke-linejoin:round;stroke-linecap:round;opacity:.8}
  .sc-road{fill:none;stroke:var(--paper-2);stroke-linejoin:round;stroke-linecap:round}
  .sc-water{fill:var(--card);stroke:var(--ink);stroke-width:.7px;vector-effect:non-scaling-stroke}
  .sc-fence{fill:none;stroke:var(--ink);stroke-width:.5px;vector-effect:non-scaling-stroke;stroke-dasharray:1.2 .9}
  .sc-tree{fill:var(--paper);stroke:var(--ink);stroke-width:.4px;vector-effect:non-scaling-stroke}
  .sc-dash{fill:none;stroke:var(--ink);stroke-width:.45px;vector-effect:non-scaling-stroke;stroke-dasharray:1.5 1.1}
  .sc-solid{fill:var(--ink);stroke:none}
  .sc-text{font-family:var(--f-mono);fill:var(--muted);letter-spacing:.12em;paint-order:stroke;stroke:var(--paper-2);stroke-width:.8px;stroke-linejoin:round}
  .ticker{max-height:320px;overflow:auto;border:1px solid var(--line-2);background:var(--card);padding:6px 10px;font-family:var(--f-mono);font-size:12.5px;line-height:1.5;margin-top:8px}
  .tk{display:flex;gap:10px;padding:4px 0;border-bottom:1px dotted var(--line)}
  .tk:last-child{border-bottom:0}
  .tk-t{color:var(--muted);flex:none;width:44px}
  .tk.good .tk-x{color:var(--good)}
  .tk.warn .tk-x{color:var(--warn)}
  .tk.bad .tk-x{color:var(--stamp)}
  .tk.tk-twist{border-top:1px solid var(--stamp);border-bottom:1px solid var(--stamp);margin-top:4px;padding:6px 0}
  .tk.tk-twist .tk-x{font-weight:600;letter-spacing:.04em;text-transform:uppercase}
  /* ---- the twist: the report stops and waits for a call ---- */
  .twist{border:2px solid var(--stamp);background:var(--paper);padding:12px 14px;margin-top:12px}
  .twist h3{font-size:20px;margin:6px 0 4px;text-transform:uppercase;letter-spacing:.05em}
  .twist p{margin:0 0 10px;font-size:14.5px;line-height:1.55}
  .twist-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .twist-opt{text-align:left;font-family:var(--f-mono);font-size:12.5px;line-height:1.45;border:1px solid var(--ink);background:var(--card);color:var(--ink);padding:8px 10px;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
  .twist-opt b{font-family:var(--f-logo);font-size:15px;letter-spacing:.06em;color:var(--stamp);flex:none;width:16px}
  .twist-opt:hover:not(:disabled),.twist-opt:focus-visible{background:var(--ink);color:var(--paper)}
  .twist-opt:hover:not(:disabled) b,.twist-opt:focus-visible b{color:var(--paper)}
  /* The answers that end somebody are marked, and the whole column of them is one wide list. */
  .twist-opt.kill{border-color:var(--stamp)}
  .twist-opt.kill b{color:var(--stamp)}
  .twist-opt:disabled{opacity:.45;cursor:not-allowed}
  .modal-b .twist-opts:has(.twist-opt.kill){grid-template-columns:1fr}
  .twist-opt:disabled{color:var(--muted);border-color:var(--line-2);cursor:not-allowed;background:var(--paper-2)}

//
// The rule the old numbers broke: a crew's effectiveness runs past 150 while difficulty was
// capped at 96, so any competent crew took CLEAN on every job and the game was over in
// eighteen weeks. The world now answers the name — the bigger the crew, the better defended
// the rooms it is given, and a country worked lately is watching for it.

  // The spread between tiers widens rather than the floor rising: a tier-1 errand stays a way
  // for a new crew to eat, a tier-4 room is a different kind of problem.
  diffBase:25, diffPerTier:16, diffJitter:7,
  repPressure:19,         // difficulty per 100 ranking, sub-linear: at 420 the world is +62 harder
  countryPressure:0.34,   // difficulty added per point of local heat
  // --- the verdict --- margin thresholds, widest first. CLEAN is the one that moved: it used
  // to be the default outcome for any competent crew, and it is now something you prepare for.
  vClean:34, vSuccess:8, vMessy:-12, vBotched:-36,
  roll:26,                // ±, so no margin is ever safe and none is ever hopeless
  messyPay:0.6,           // a messy job still has to feed the crew
  // --- time --- weeks on the ground per job tier, and what casing one costs
  jobWeeks:[0,1,1,2,3,4], finalWeeks:4,
  caseMax:[0,1,2,3,4,5],  // how many weeks of casing a tier will take
  caseGain:9,             // margin per week cased
  caseCostPct:0.06,       // of the fee, per week
  caseHeat:2,
  // --- the name --- how ranking climbs, and how it slips
  repDamp:900,            // gains fall away as the name grows; the climb slows, never stops
  idleDecay:1, idleEvery:3,   // a name unused is a name forgotten
  // --- the end ---
  finalRep:420,           // the ranking the last score asks for
  finalStages:3,          // and it is three jobs, not one
  finalMoney:5000000,     // and it is funded out of your own float, which gives the late money a job
  // --- the crew --- how long it takes to become good, which is most of what a career is
  attrCeil:105,           // an attribute this high stops improving; 40 climbs fast, 85 crawls
  xpSteps:[0,60,180,430,900],  // Operator, Professional, Veteran, Legend
  // --- the money --- a crew of six takes roughly half the gross in cuts and eats every week
  // whether it works or not, so the fee has to be worth the weeks the job costs. It didn't
  // used to matter: every job was one week and the game was over in eighteen of them.

  // every score between them — so building the crew the game wants you to build bankrupted you.

  cutBase:0.03, cutPerExp:0.012, cutJitter:0.03,

  // and two or three kinds of knowledge, which is more than a five-person crew has room to carry.
  bigDiff:122,            // before ranking, local heat and the seventh body are added
  // These rooms are hard because of what they are, not because of who you are. An ordinary posting
  // is defended against your name — that is the whole of repPressure — but an operation four floors
  // under Zurich was built that way before anybody had heard of you, so it takes half the pressure.
  // At full pressure the base and the name compound, and the last rung of the ladder cannot run one.
  bigRepPressure:0.5,
  bigNeed7:8,             // a seven-body operation is harder than a six-body one
  bigHeat:34,
  bigCount:500,
};
/* ----------------------------- RNG ------------------------------------ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function ri(rng,a,b){return Math.floor(rng()*(b-a+1))+a;}
function pick(rng,arr){return arr[Math.floor(rng()*arr.length)];}
function chance(rng,p){return rng()<p;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function freshRng(){return mulberry32((Date.now()^Math.floor(Math.random()*1e9))>>>0);}

function genProfile(rng,nat,gender,opts){
  opts=opts||{};
  const tech=opts.tech?TECH_BY_K[opts.tech]:pick(rng,opts.pool||TECHS);
  const role=opts.role||(chance(rng,0.25)?"commander":"soldier");
  const r=rng();
  const exp=r<0.40?1:r<0.70?2:r<0.87?3:r<0.97?4:5;
  const er=rng();
  const edu=er<0.15?0:er<0.40?1:er<0.65?2:er<0.87?3:er<0.95?4:5;
  const jail=chance(rng,0.55)?0:ri(rng,1,12);
  const streets=clamp(ri(rng,0,25)-edu*2,0,25);
  const base=24+(exp-1)*11;
  const attrs={};
  ATTRS.forEach(a=>{
    let v=base+ri(rng,-8,18);
    if(a===tech.a)v+=ri(rng,10,26);
    if(role==="commander"&&(a==="brains"||a==="charm"))v+=5;
    if(role==="soldier"&&(a==="muscle"||a==="nerve"))v+=4;
    if(a==="brains")v+=edu*2;
    if(a==="nerve")v+=Math.round(jail*0.6+streets*0.4);
    attrs[a]=clamp(Math.round(v),12,98);
  });
  const know=[tech.know];
  const nk=chance(rng,0.55)?1:chance(rng,0.5)?2:0;
  for(let i=0;i<nk;i++){const k=pick(rng,KNOW);if(!know.includes(k))know.push(k);}
  const langs=nat.langs.slice(0,chance(rng,0.6)?1:2);
  if(chance(rng,0.5)){const l=pick(rng,EXTRA_LANGS);if(!langs.includes(l))langs.push(l);}
  if(chance(rng,0.25)){const l=pick(rng,EXTRA_LANGS);if(!langs.includes(l))langs.push(l);}
  const limits=[];
  const nl=chance(rng,0.6)?0:chance(rng,0.75)?1:2;
  for(let i=0;i<nl;i++){const l=pick(rng,LIMITS);if(!limits.includes(l.k))limits.push(l.k);}
  // temperament: what this one is like to work with, on top of what they can do
  const traits=[];
  const nt=chance(rng,0.34)?0:chance(rng,0.72)?1:2;
  for(let i=0;i<nt;i++){const t=pick(rng,TRAITS);if(!traits.includes(t.k))traits.push(t.k);}
  return {tech:tech.k,role,exp,edu,jail,streets,attrs,know,langs,limits,traits,cmd:role==="commander"?ri(rng,3,9):0};
}
function genChar(rng,i,used){
  const nat=pick(rng,COUNTRIES);
  const gender=chance(rng,0.5)?"M":"F";
  const pool=NAMES[nat.pool];
  const first=pick(rng,gender==="M"?pool.m:pool.f);
  const last=pick(rng,pool.s);
  let n=first+" "+last;
  let guard=0;
  while(used.has(n)&&guard++<40){n=first+" "+String.fromCharCode(65+ri(rng,0,25))+". "+last;}
  used.add(n);
  const p=genProfile(rng,nat,gender,{pool:i>=ROSTER_CORE?TECHS_BIG:TECHS});
  const feeBase=(p.exp*7000)+(avg(p.attrs)*260)+(p.know.length-1)*2500+p.edu*900+(p.tech==="hacker"||p.tech==="safecracker"||p.tech==="forger"?4000:0)+(isBigTech(p.tech)?9000:0);
  const fee=Math.round(feeBase*(1+rng()*0.35)/500)*500;
  let cut=Math.round((BAL.cutBase+(p.exp-1)*BAL.cutPerExp+rng()*BAL.cutJitter)*1000)/1000;
  if(p.limits.includes("cut"))cut=Math.max(cut,0.1);
  if(p.traits&&p.traits.indexOf("mercenary")>=0)cut=Math.round((cut+0.02)*1000)/1000;
  return Object.assign({
    id:"C"+(1000+i),n,first,gender,nat:nat.name,
    fee,cut,
    upkeep:Math.round((p.exp*1200+rng()*800)/100)*100,
    loyalty:ri(rng,42,68),
    greed:ri(rng,15,90),
    mole:chance(rng,0.07),
    vetted:false,vetFlag:false,
    status:"available",   // available | crew | injured | jailed | gone
    out:0,
    avseed:ri(rng,1,1e9),
  },p);
}
function avg(o){let s=0,n=0;for(const k in o){s+=o[k];n++;}return s/n;}
function buildRoster(seed){
  const rng=mulberry32(seed);
  const used=new Set();
  const arr=new Array(ROSTER_SIZE);
  for(let i=0;i<ROSTER_SIZE;i++)arr[i]=genChar(rng,i,used);
  return arr;
}
function natOf(c){return COUNTRY_BY_NAME[c.nat];}
// A name that goes with a passport. Same pools, same rule, as everyone else on the roster.
function nameFor(rng,natName,gender){
  const nat=COUNTRY_BY_NAME[natName];
  const pool=NAMES[(nat&&nat.pool)||"Anglo"]||NAMES.Anglo;
  const first=pick(rng,gender==="F"?pool.f:pool.m);
  return first+" "+pick(rng,pool.s);
}

const NOSES=[{l:"Straight",t:55,d:63,w:3.5,o:4,b:66.5,sw:2.4},{l:"Fine",t:53,d:62,w:2.4,o:3,b:65.2,sw:2.2},{l:"Broad",t:56,d:64,w:5.2,o:5.6,b:67.6,sw:2.6},{l:"Long",t:50,d:65.5,w:4,o:4.5,b:68.6,sw:2.4},{l:"Snub",t:58,d:63,w:3,o:3.4,b:65.4,sw:2.8}];
const MOUTHS=[{l:"Set",uy:69.5,ub:67.3,ly:73,lb:75.6,w1:7,w2:5,t1:2.2,t2:2.4},
  {l:"Half a smile",uy:69.8,ub:67.9,ly:72.4,lb:77.4,w1:7.5,w2:6,t1:2.2,t2:2.6},
  {l:"Downturned",uy:70.4,ub:68.8,ly:74.6,lb:71.6,w1:7,w2:5,t1:2.2,t2:2.4},
  {l:"Full",uy:68.8,ub:65.6,ly:73.2,lb:77.4,w1:8,w2:6.5,t1:2.9,t2:3.4},
  {l:"Thin",uy:70.6,ub:69.6,ly:72.8,lb:73.3,w1:6.5,w2:5,t1:1.8,t2:1.8}];
const EARS=[{l:"Small",o:3.5,y1:47,y2:58},{l:"Normal",o:5,y1:46,y2:60},{l:"Large",o:7,y1:45,y2:62},{l:"Tucked in",o:0,y1:0,y2:0}];
const GLASS_KINDS=["none","square","round","heavy"];
const GLASS_L=["None","Square frames","Round frames","Heavy frames"];
const FH_KINDS=["none","stubble","mustache","goatee","beard"];
const FH_L=["Clean shaven","Stubble","Moustache","Goatee","Beard"];
const EARRING_KINDS=["none","studs","hoops"];
const EARRING_L=["None","Studs","Hoops"];
const SCAR_L=["None","An old one"];
function hairList(g){return g==="M"?HAIR_M:HAIR_F;}
function faceParts(gender){
  const M=gender==="M";
  return [
    {k:"hair",l:"Hair / hat",opts:M?HAIR_L_M:HAIR_L_F},
    {k:"shape",l:"Face shape",opts:SHAPES.map(x=>x.l)},
    {k:"brow",l:"Eyebrows",opts:BROWS.map(x=>x.l)},
    {k:"eye",l:"Eyes",opts:EYE_SET.map(x=>x.l)},
    {k:"nose",l:"Nose",opts:NOSES.map(x=>x.l)},
    {k:"mouth",l:"Mouth",opts:MOUTHS.map(x=>x.l)},
    {k:"ear",l:"Ears",opts:EARS.map(x=>x.l)},
    {k:"glasses",l:"Glasses",opts:GLASS_L},
    M?{k:"fh",l:"Facial hair",opts:FH_L}:{k:"earring",l:"Earrings",opts:EARRING_L},
    {k:"scar",l:"Scar",opts:SCAR_L},
  ];
}
function randomFace(rng,gender){
  const M=gender==="M";
  return {
    hair:Math.floor(rng()*hairList(gender).length),
    shape:Math.floor(rng()*SHAPES.length),
    brow:M?pick(rng,[1,3,4]):pick(rng,[0,1,2]),
    eye:Math.floor(rng()*EYE_SET.length),
    nose:Math.floor(rng()*NOSES.length),
    mouth:Math.floor(rng()*MOUTHS.length),
    ear:pick(rng,[0,1,1,2]),
    glasses:chance(rng,0.24)?ri(rng,1,3):0,
    fh:M?pick(rng,[0,0,0,1,2,3,4]):0,
    earring:M?0:pick(rng,[0,0,0,1,1,2]),
    scar:chance(rng,0.08)?1:0,
  };
}
function normFace(face,gender){
  const parts=faceParts(gender),out={};
  parts.forEach(p=>{const n=p.opts.length;let v=face&&face[p.k];v=(typeof v==="number"&&isFinite(v))?Math.round(v):0;out[p.k]=clamp(v,0,n-1);});
  if(gender==="M"){out.earring=0;}else{out.fh=0;}
  return out;
}
// seed draws the texture (stubble, wisps, a buzz cut's flecks); face decides the parts.
// The bust itself, on a 100x120 field. avatar() frames it; the map nests it.
function avatarBody(seed,gender,face){
  const rng=mulberry32(seed>>>0);
  const K="#111010",W="#ffffff";
  const f=v=>Math.round(v*10)/10;
  const M=gender==="M";
  const F=face?normFace(face,gender):randomFace(rng,gender);
  const SH=SHAPES[F.shape],EY=EYE_SET[F.eye],NO=NOSES[F.nose],MO=MOUTHS[F.mouth],EA=EARS[F.ear],BR=BROWS[F.brow];
  const hw=clamp((M?21:19)+SH.dw,15,24);
  const jaw=SH.jaw;
  const nw=M?9:7;
  const cx=50,top=20,chin=78+SH.dc,mid=50,L=cx-hw,R=cx+hw,ey=50,ex=9;
  const style=hairList(gender)[F.hair];
  const glasses=GLASS_KINDS[F.glasses];
  const fh=FH_KINDS[F.fh];
  const earring=EARRING_KINDS[F.earring];
  const scar=F.scar===1;
  const browAng=BR.ang,browThick=BR.th;
  const st=w=>' stroke="'+K+'" stroke-width="'+(w||2.6)+'" stroke-linejoin="round" stroke-linecap="round"';
  const P=(d,fill,w)=>'<path d="'+d+'" fill="'+fill+'"'+st(w)+'/>';
  const ink=(d,w)=>P(d,K,w);
  const white=(d,w)=>P(d,W,w);
  const line=(d,w)=>'<path d="'+d+'" fill="none"'+st(w)+'/>';
  const wline=(d,w)=>'<path d="'+d+'" fill="none" stroke="'+W+'" stroke-width="'+w+'" stroke-linecap="round"/>';
  const dot=(x,y,r,c)=>'<circle cx="'+f(x)+'" cy="'+f(y)+'" r="'+r+'" fill="'+c+'"/>';
  function scallop(sx,sy,rx,ry,a0,a1,n,bump){
    const pt=i=>{const a=(a0+(a1-a0)*i/n)*Math.PI/180;return [sx+rx*Math.cos(a),sy+ry*Math.sin(a)];};
    let d='M'+f(pt(0)[0])+' '+f(pt(0)[1]);
    for(let i=1;i<=n;i++){
      const p0=pt(i-1),p1=pt(i);
      const a=(a0+(a1-a0)*(i-0.5)/n)*Math.PI/180;
      d+=' Q'+f((p0[0]+p1[0])/2+bump*1.6*Math.cos(a))+' '+f((p0[1]+p1[1])/2+bump*1.6*Math.sin(a))+' '+f(p1[0])+' '+f(p1[1]);
    }
    return d;
  }
  const capTop='M'+L+' '+mid+' C'+L+' 36 '+f(cx-hw*0.95)+' '+top+' '+cx+' '+top+' C'+f(cx+hw*0.95)+' '+top+' '+R+' 36 '+R+' '+mid;
  const hairline=' L'+R+' 44 C'+f(cx+hw*0.7)+' 34 '+f(cx+hw*0.35)+' 31 '+cx+' 31 C'+f(cx-hw*0.35)+' 31 '+f(cx-hw*0.7)+' 34 '+L+' 44 Z';
  const hairline2=' L'+R+' 46 C'+f(cx+hw*0.7)+' 35 '+f(cx+hw*0.35)+' 32 '+cx+' 32 C'+f(cx-hw*0.35)+' 32 '+f(cx-hw*0.7)+' 35 '+L+' 46 Z';
  const headD='M'+cx+' '+top+' C'+f(cx-hw*0.95)+' '+top+' '+L+' 36 '+L+' '+mid+' C'+L+' 63 '+f(cx-hw*jaw)+' '+chin+' '+cx+' '+chin+' C'+f(cx+hw*jaw)+' '+chin+' '+R+' 63 '+R+' '+mid+' C'+R+' 36 '+f(cx+hw*0.95)+' '+top+' '+cx+' '+top+' Z';
  let s='<rect x="0" y="0" width="100" height="120" fill="'+W+'"/>';
  if(style.indexOf("long")===0)s+=ink('M'+f(L-5)+' 40 C'+f(L-5)+' 14 '+f(R+5)+' 14 '+f(R+5)+' 40 L'+f(R+5)+' 96 Q'+f(R+5)+' 101 '+R+' 101 L'+L+' 101 Q'+f(L-5)+' 101 '+f(L-5)+' 96 Z',2.4);
  else if(style.indexOf("bob")===0)s+=ink('M'+f(L-6)+' 40 C'+f(L-6)+' 14 '+f(R+6)+' 14 '+f(R+6)+' 40 L'+f(R+6)+' 70 Q'+f(R+6)+' 78 '+f(R-2)+' 78 L'+f(L+2)+' 78 Q'+f(L-6)+' 78 '+f(L-6)+' 70 Z',2.4);
  else if(!M&&style==="curly")s+=ink(scallop(cx,48,hw+9,36,150,390,16,5)+' L'+f(R+6)+' 84 L'+f(L-6)+' 84 Z',2.2);
  else if(style==="ponytail")s+=ink('M'+f(R-2)+' 34 C'+f(R+13)+' 40 '+f(R+11)+' 66 '+f(R+3)+' 88 C'+f(R+1)+' 70 '+f(R+4)+' 52 '+f(R-4)+' 42 Z',2.2);
  else if(style==="afro")s+=ink(scallop(cx,42,hw+13,31,172,368,20,5)+' L'+f(R+10)+' 60 L'+f(L-10)+' 60 Z',2.2);
  else if(style==="wavy")s+=ink(scallop(cx,54,hw+8,40,178,362,14,4)+' L'+f(R+8)+' 97 Q'+f(R+8)+' 101 '+f(R+3)+' 101 L'+f(L-3)+' 101 Q'+f(L-8)+' 101 '+f(L-8)+' 97 Z',2.3);
  else if(style==="headscarf")s+=ink('M'+f(L-8)+' 44 C'+f(L-8)+' 8 '+f(R+8)+' 8 '+f(R+8)+' 44 L'+f(R+11)+' 101 L'+f(L-11)+' 101 Z',2.4);
  else if(style==="braid")s+=ink('M'+f(R-2)+' 36 C'+f(R+12)+' 44 '+f(R+12)+' 70 '+f(R+6)+' 98 L'+f(R+1)+' 98 C'+f(R+4)+' 72 '+f(R+3)+' 52 '+f(R-5)+' 42 Z',2.2);
  s+=white('M'+(cx-nw)+' 66 L'+(cx-nw)+' 100 L'+(cx+nw)+' 100 L'+(cx+nw)+' 66 Z',2.6);
  s+='<path d="M0 120 L0 104 C12 97 26 93 36 92 Q50 106 64 92 C74 93 88 97 100 104 L100 120 Z" fill="'+K+'"/>';
  s+=line('M35 89 Q50 103 65 89',3);
  if(style!=="headscarf"&&EA.o>0){   // a scarf covers the ears, and some are tucked in
    s+=white('M'+f(L+1)+' '+EA.y1+' C'+f(L-EA.o)+' '+f(EA.y1-2)+' '+f(L-EA.o-1)+' '+f(EA.y2-2)+' '+f(L+1)+' '+EA.y2+' Z',2.4);
    s+=white('M'+f(R-1)+' '+EA.y1+' C'+f(R+EA.o)+' '+f(EA.y1-2)+' '+f(R+EA.o+1)+' '+f(EA.y2-2)+' '+f(R-1)+' '+EA.y2+' Z',2.4);
  }
  s+=white(headD,2.8);
  const brow=(ec,dir)=>{const ox=ec-dir*7.5,ix=ec+dir*7;
    return 'M'+f(ox)+' '+f(ey-7.5)+' Q'+ec+' '+f(ey-11.5)+' '+f(ix)+' '+f(ey-8.5+browAng)+' L'+f(ix)+' '+f(ey-8.5+browAng+browThick)+' Q'+ec+' '+f(ey-11.5+browThick)+' '+f(ox)+' '+f(ey-7.5+browThick)+' Z';};
  s+=ink(brow(cx-ex,1),1.2)+ink(brow(cx+ex,-1),1.2);
  [cx-ex,cx+ex].forEach((ec,i)=>{
    s+=white('M'+f(ec-EY.w)+' '+ey+' Q'+ec+' '+f(ey-EY.up)+' '+f(ec+EY.w)+' '+ey+' Q'+ec+' '+f(ey+EY.lo)+' '+f(ec-EY.w)+' '+ey+' Z',2.2);
    s+=dot(ec,ey+0.4,EY.p,K);
    if(!M){const ox=i===0?ec-EY.w:ec+EY.w,dx=i===0?-2.2:2.2;s+=line('M'+f(ox)+' '+f(ey-0.5)+' l'+dx+' -2.2',1.8);}
  });
  s+=line('M'+f(cx-1)+' '+NO.t+' L'+f(cx-NO.w)+' '+NO.d+' Q'+cx+' '+NO.b+' '+f(cx+NO.o)+' '+NO.d,NO.sw);
  s+=line('M'+f(cx-MO.w1)+' '+MO.uy+' Q'+f(cx-MO.w1/2)+' '+MO.ub+' '+cx+' '+f(MO.uy-0.3)+' Q'+f(cx+MO.w1/2)+' '+MO.ub+' '+f(cx+MO.w1)+' '+MO.uy,MO.t1);
  s+=line('M'+f(cx-MO.w2)+' '+MO.ly+' Q'+cx+' '+MO.lb+' '+f(cx+MO.w2)+' '+MO.ly,M?MO.t2:MO.t2+0.2);
  const mustache='M'+f(cx-7.5)+' 65.5 Q'+cx+' 60.5 '+f(cx+7.5)+' 65.5 Q'+cx+' 67.8 '+f(cx-7.5)+' 65.5 Z';
  if(fh==="stubble"){
    for(let i=0;i<70;i++){const x=cx+(rng()*2-1)*hw*0.88,y=60+rng()*(chin-58);
      const nx=(x-cx)/(hw*0.93),ny=(y-50)/(chin-50+1.5);
      if(nx*nx+ny*ny>1||(Math.abs(x-cx)<8.5&&y<75)||(y<64&&Math.abs(x-cx)<11))continue;
      s+=dot(x,y,0.85,K);}
  } else if(fh==="beard"){
    s+=ink('M'+f(L+1)+' 56 C'+f(L+1)+' 70 '+f(cx-hw*jaw)+' '+(chin+7)+' '+cx+' '+(chin+7)+' C'+f(cx+hw*jaw)+' '+(chin+7)+' '+f(R-1)+' 70 '+f(R-1)+' 56 L'+f(R-1)+' 60 C'+f(R-3)+' 73 '+f(cx+9)+' 77.5 '+cx+' 77.5 C'+f(cx-9)+' 77.5 '+f(L+3)+' 73 '+f(L+1)+' 60 Z',2);
    s+=ink(mustache,1.2);
    for(let i=0;i<12;i++)s+=dot(cx+(rng()*2-1)*hw*0.7,72+rng()*9,0.6,W);
  } else if(fh==="mustache"){s+=ink(mustache,1.2);}
  else if(fh==="goatee"){s+=ink('M'+f(cx-6)+' 74 Q'+cx+' 84 '+f(cx+6)+' 74 Q'+cx+' 77 '+f(cx-6)+' 74 Z',1.2);}
  const front={
    center:capTop+' L'+R+' 46 C'+R+' 34 '+f(cx+hw*0.6)+' 27 '+f(cx+2)+' 25 L'+cx+' 31 L'+f(cx-2)+' 25 C'+f(cx-hw*0.6)+' 27 '+L+' 34 '+L+' 46 Z',
    sweep:capTop+' L'+R+' 44 C'+f(cx+hw*0.6)+' 36 '+f(cx+hw*0.2)+' 33 '+f(cx-hw*0.3)+' 40 C'+f(cx-hw*0.6)+' 44 '+L+' 46 '+L+' '+mid+' Z',
    bangs:capTop+' L'+R+' 44 L'+f(R-2)+' 39 L'+f(L+2)+' 39 L'+L+' 44 Z',
  };
  if(style==="buzz"){s+=ink(capTop+hairline,2.4);for(let i=0;i<16;i++)s+=dot(cx+(rng()*2-1)*hw*0.62,24.5+rng()*5.5,0.6,W);}
  else if(style==="slick"){
    s+=ink('M'+L+' '+mid+' C'+L+' 34 '+f(cx-hw*0.9)+' 17 '+f(cx+2)+' 16 C'+f(cx+hw*0.95)+' 15 '+f(R+1)+' 30 '+R+' '+mid+' L'+R+' 44 C'+f(cx+hw*0.7)+' 34 '+f(cx+hw*0.3)+' 31 '+f(cx-3)+' 32 C'+f(cx-hw*0.45)+' 33.5 '+f(cx-hw*0.72)+' 36.5 '+L+' 44 Z',2.4);
    s+=wline('M'+f(cx-hw*0.55)+' 27 C'+f(cx-hw*0.2)+' 20.5 '+f(cx+hw*0.3)+' 19 '+f(cx+hw*0.65)+' 22.5',1.6);
  }
  else if(style==="curly"&&M){
    s+=ink(scallop(cx,40,hw+3,24,190,350,9,4)+hairline2,2.2);
    for(let i=0;i<6;i++){const a=(205+rng()*130)*Math.PI/180,x=cx+(hw-3)*Math.cos(a),y=39+15*Math.sin(a);s+=wline('M'+f(x)+' '+f(y)+' q3 -3 6 0',1.4);}
  }
  else if(style==="spiky"){
    const pts=[[L,mid],[L,40],[L+2,30],[L+6,33],[cx-9,21],[cx-4,29],[cx,17],[cx+4,28],[cx+9,20],[cx+12,30],[R-3,26],[R,40],[R,mid]];
    s+=ink('M'+pts.map(p=>f(p[0])+' '+f(p[1])).join(' L')+hairline,2.2);
  }
  else if(style==="long-center")s+=ink(front.center,2.4);
  else if(style==="long-sweep"||style==="bob-sweep"||style==="wavy")s+=ink(front.sweep,2.4);
  else if(style==="long-bangs"||style==="bob-bangs"||(style==="curly"&&!M))s+=ink(front.bangs,2.4);
  else if(style==="ponytail"||style==="braid"||style==="crop"||style==="headscarf")s+=ink(capTop+hairline2,2.4);
  else if(style==="pixie"||style==="afro")s+=ink(scallop(cx,36,hw+1,18,185,355,10,3)+hairline2,2.2);
  else if(style==="bun"){s+=ink(capTop+hairline2,2.4);s+='<circle cx="'+cx+'" cy="13.5" r="8.5" fill="'+K+'"'+st(2.2)+'/>';s+=wline('M'+f(cx-4)+' 10.5 q4 -3.5 8 0',1.2);}
  // the finishing lines that make the styles read: plaits, waves, folds, a part
  if(style==="braid")for(let y=46;y<96;y+=8)s+=wline('M'+f(R+3)+' '+y+' l6 -3',1.3);
  if(style==="wavy")s+=wline('M'+f(L-4)+' 60 q3 7 0 14 q-3 7 0 14',1.4)+wline('M'+f(R+4)+' 60 q-3 7 0 14 q3 7 0 14',1.4);
  if(style==="headscarf")s+=wline('M'+f(L+2)+' 42 Q'+cx+' 24 '+f(R-2)+' 42',1.4)+wline('M'+f(L-5)+' 58 Q'+f(L-7)+' 78 '+f(L-9)+' 99',1.3)+wline('M'+f(R+5)+' 58 Q'+f(R+7)+' 78 '+f(R+9)+' 99',1.3);
  if(style==="crop")s+=wline('M'+f(cx-hw*0.5)+' 27 C'+f(cx-hw*0.2)+' 21.5 '+f(cx+hw*0.25)+' 20.5 '+f(cx+hw*0.55)+' 24.5',1.5);
  if(style==="beanie"){
    s+=ink('M'+f(L-3)+' 44 C'+f(L-3)+' 24 '+f(cx-hw*0.9)+' 12 '+cx+' 12 C'+f(cx+hw*0.9)+' 12 '+f(R+3)+' 24 '+f(R+3)+' 44 Z',2.4);
    for(let x=L+2;x<=R-2;x+=4.5)s+=wline('M'+f(x)+' 18 L'+f(x)+' 40',1);
    s+='<rect x="'+f(L-5)+'" y="36" width="'+f(2*hw+10)+'" height="10" rx="2" fill="'+K+'"'+st(2)+'/>';
    for(let x=L-2;x<=R+2;x+=3.5)s+=wline('M'+f(x)+' 38.5 L'+f(x)+' 43.5',1);
  }
  if(glasses==="square"||glasses==="heavy"){
    const t=glasses==="heavy"?3.6:2.6;
    s+='<rect x="'+f(cx-ex-8)+'" y="44.5" width="15" height="10.5" rx="2" fill="none"'+st(t)+'/>';
    s+='<rect x="'+f(cx+ex-7)+'" y="44.5" width="15" height="10.5" rx="2" fill="none"'+st(t)+'/>';
    s+=line('M'+f(cx-2)+' 49 L'+f(cx+2)+' 49',t)+line('M'+f(cx-ex-8)+' 49 L'+f(L-1)+' 48',2.2)+line('M'+f(cx+ex+8)+' 49 L'+f(R+1)+' 48',2.2);
  } else if(glasses==="round"){
    s+='<circle cx="'+f(cx-ex)+'" cy="49.5" r="7.4" fill="none"'+st(2.4)+'/>';
    s+='<circle cx="'+f(cx+ex)+'" cy="49.5" r="7.4" fill="none"'+st(2.4)+'/>';
    s+=line('M'+f(cx-ex+7.4)+' 49.5 L'+f(cx+ex-7.4)+' 49.5',2.2)+line('M'+f(cx-ex-7.4)+' 49 L'+f(L-1)+' 48',2.2)+line('M'+f(cx+ex+7.4)+' 49 L'+f(R+1)+' 48',2.2);
  }
  if(earring==="studs")s+=dot(L-3,61.5,1.7,K)+dot(R+3,61.5,1.7,K);
  else if(earring==="hoops"){
    s+='<circle cx="'+f(L-2.5)+'" cy="64" r="3.4" fill="none"'+st(1.6)+'/>';
    s+='<circle cx="'+f(R+2.5)+'" cy="64" r="3.4" fill="none"'+st(1.6)+'/>';
  }
  if(scar)s+=line('M'+f(R-7)+' 55 l1.5 7',1.6);
  return s;
}

function avatar(seed,gender,face){
  return '<svg viewBox="0 0 100 120" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" aria-hidden="true" style="display:block">'+avatarBody(seed,gender,face)+'</svg>';
}

/* ------------------------------ STATE --------------------------------- */
let S=null;
const SAVE_KEY="thecrew_save_v2";
// How hot a country is on you: working one burns it, and it cools a point a week.
function countryHeat(name){return (S&&S.coHeat&&S.coHeat[name])||0;}
function countryHeatAdd(name,n){if(!S)return;S.coHeat=S.coHeat||{};S.coHeat[name]=clamp((S.coHeat[name]||0)+n,0,100);}
// The world answers the name. Sub-linear, so the last hundred points of ranking do not make
// the game unplayable — but a Feared crew is never handed an easy room again.
function repPressure(){return Math.round(BAL.repPressure*Math.pow(Math.max(0,(S?S.rep:0))/100,0.92));}
// What a job of this tier is worth to a name of this size. Full value for the biggest thing
// the board will post to you; a fraction of it for anything well below that.
function tierWorth(jobTier){
  if(jobTier>=5)return 1;
  const under=Math.max(0,(rankInfo(S?S.rep:0).maxTier)-jobTier);
  return [1,0.55,0.28,0.12][Math.min(3,under)];
}

function newGame(player){
  const seed=(Date.now()^Math.floor(Math.random()*1e9))>>>0;
  S={
    v:2,seed,player,roster:buildRoster(seed),
    crewIds:[],money:BAL.startMoney,heat:0,week:1,rep:0,jobSeq:0,

function crewAll(){return [S.player].concat(recruits());}

// What a file is like to work with, and what the crew becomes by working together.
const TRAITS=[
  {k:"steady",l:"Steady",d:"Takes a bad night without losing faith — loyalty never drops when a job goes wrong."},
  {k:"hothead",l:"Hothead",d:"Worth +3 in the field and costs +4 heat every time out. Somebody always remembers the noise."},
  {k:"careful",l:"Careful",d:"−4 heat on any job this one works. Gloves, timings, and a route home."},
  {k:"quick",l:"Quick study",d:"Learns at double speed — twice the experience from every job."},
  {k:"mentor",l:"Mentor",d:"+2 in the field, and everyone else on the job learns half again as much."},
  {k:"mercenary",l:"Mercenary",d:"+2 in the field and takes 3% more of every score. Nothing personal."},
  {k:"lucky",l:"Lucky",d:"The roll falls their way: +4 on the night, whatever the plan says."},
  {k:"jinx",l:"Jinx",d:"−3 on the night, and things go wrong around this one more often than they should."},
  {k:"ghost",l:"Ghost",d:"Never the one the police get their hands on. Somebody else is always closer to the door."},
];
const TRAIT_BY_K={};TRAITS.forEach(t=>TRAIT_BY_K[t.k]=t);
function traits(c){return (c&&c.traits)||[];}
function hasTrait(c,k){return traits(c).indexOf(k)>=0;}
function traitBonus(team){
  let v=0;const who=[];
  team.forEach(c=>{
    let n=0;
    if(hasTrait(c,"hothead"))n+=3;
    if(hasTrait(c,"mentor"))n+=2;
    if(hasTrait(c,"mercenary"))n+=2;
    if(hasTrait(c,"jinx"))n-=3;
    if(n){v+=n;who.push((c.isPlayer?"you":c.first)+" "+(n>0?"+":"")+n);}
  });
  return {v,who};
}
// Bonds: people who work together learn to, and people who lose together remember it.
function bondKey(a,b){return a<b?a+"|"+b:b+"|"+a;}
function bondOf(a,b){return (S.bonds&&S.bonds[bondKey(a,b)])||0;}
function bondScore(team){
  let v=0;const good=[],bad=[],goodIds=[],badIds=[];
  for(let i=0;i<team.length;i++)for(let j=i+1;j<team.length;j++){
    const b=bondOf(team[i].id,team[j].id);if(!b)continue;
    v+=b;
    const pair=(team[i].isPlayer?"you":team[i].first)+" & "+(team[j].isPlayer?"you":team[j].first);
    if(b>0){good.push(pair);goodIds.push([team[i].id,team[j].id]);}
    else{bad.push(pair);badIds.push([team[i].id,team[j].id]);}
  }
  return {v:clamp(v,-6,6),good,bad,goodIds,badIds};
}
const BOND_LOG_MAX=6;   // the last half-dozen nights; a pair that has run twenty jobs needs a story, not a ledger
function bondUpdate(team,tier,job){
  if(team.length<2)return;
  S.bonds=S.bonds||{};S.bondLog=S.bondLog||{};
  const d=tier>=3?1:tier<=1?-1:0;
  if(!d)return;
  // what happened, so the screen can say why rather than only how much
  const night={w:S.week,t:tier,n:job?jobNoun(job):"",c:job?job.country:"",d};
  for(let i=0;i<team.length;i++)for(let j=i+1;j<team.length;j++){
    const k=bondKey(team[i].id,team[j].id);
    S.bonds[k]=clamp((S.bonds[k]||0)+d,-3,3);
    const l=S.bondLog[k]=(S.bondLog[k]||[]).concat([night]);
    if(l.length>BOND_LOG_MAX)l.splice(0,l.length-BOND_LOG_MAX);
    // the number can come back to nothing; what they went through does not un-happen
    if(!S.bonds[k])delete S.bonds[k];
  }
}
// The background, in the order it happened. A file saved before any of this was written down has
// the number and no nights behind it, and says so rather than inventing any.
const VERDICT_WORD=["a disaster","a botched job","a messy night","a job that came off","clean work"];
function signed(n){return n>0?"+"+n:n<0?"−"+Math.abs(n):"0";}
function bondNights(a,b){return (S.bondLog&&S.bondLog[bondKey(a,b)])||[];}
function bondBackground(pairs,max){
  const groups=[],byKey={};
  pairs.forEach(p=>{
    const v=bondOf(p[0],p[1]);
    const nights=bondNights(p[0],p[1]);
    const key=v+"|"+nights.map(n=>n.w+":"+n.t+":"+n.n+":"+n.c).join(",");
    let g=byKey[key];
    if(!g){g=byKey[key]={v,nights,people:[],n:0};groups.push(g);}
    g.n++;
    [p[0],p[1]].forEach(id=>{if(g.people.indexOf(id)<0)g.people.push(id);});
  });
  groups.sort((x,y)=>Math.abs(y.v)-Math.abs(x.v)||y.n-x.n);
  return groups.map(g=>{
    const names=g.people.map(id=>{const c=byId(id);return c?(c.isPlayer?"You":c.first):"someone";});
    // "You" first if present, so the sentence reads from the player outwards
    const i=names.indexOf("You");if(i>0){names.splice(i,1);names.unshift("You");}
    const word=bondWord(g.v);
    const head=g.n===1
      ? names[0]+" "+(names[0]==="You"?youWord(word):word)+" "+(names[1]||"")+"  ("+signed(g.v)+")"
      : listAnd(names)+" — "+(g.v>0?"all of one another":"bad blood all round")+"  ("+signed(g.v)+" each, "+g.n+" pairs)";
    if(!g.nights.length)return head+"\n  from jobs run before the crew kept a record of them";
    const l=max&&g.nights.length>max?g.nights.slice(-max):g.nights;
    const lines=l.map(x=>"  week "+x.w+"  "+VERDICT_WORD[x.t]+(x.n?", "+x.n:"")+(x.c?", "+x.c:"")+"  "+signed(x.d));
    const hidden=g.nights.length-l.length;
    return head+"\n"+lines.join("\n")+(hidden>0?"\n  and "+hidden+" more before "+(l.length===1?"that":"those"):"");
  }).join("\n\n");
}
function youWord(w){return w.replace(/^is /,"are ").replace(/^has /,"have ").replace(/^works /,"work ").replace(/^gets /,"get ");}
function bondStory(a,b,max){
  const A=byId(a),B=byId(b);if(!A||!B)return "";
  const nA=A.isPlayer?"You":A.first,nB=B.isPlayer?"you":B.first;
  const v=bondOf(a,b);
  const head=nA+" "+(A.isPlayer?youWord(bondWord(v)):bondWord(v))+" "+nB+"  ("+signed(v)+")";
  const all=bondNights(a,b);
  if(!all.length)return head+"\n  from jobs run before the crew kept a record of them";
  const l=max&&all.length>max?all.slice(-max):all;
  const lines=l.map(x=>"  week "+x.w+"  "+VERDICT_WORD[x.t]+(x.n?", "+x.n:"")+(x.c?", "+x.c:"")+"  "+signed(x.d));
  const hidden=all.length-l.length;
  const more=hidden>0?"  and "+hidden+" more before "+(max===1?"that":"those")
            :(all.length>=BOND_LOG_MAX?"  (the last "+BOND_LOG_MAX+"; there were more)":"");
  return head+"\n"+lines.join("\n")+(more?"\n"+more:"");
}
function bondsFor(c){
  const out=[];if(!S.bonds)return out;
  crewAll().concat(crews().reduce((a,cr)=>a.concat(crewMembers(cr)),[])).forEach(o=>{
    if(o.id===c.id)return;
    const b=bondOf(c.id,o.id);if(b)out.push({c:o,b});
  });
  return out.sort((a,b)=>Math.abs(b.b)-Math.abs(a.b));
}
function bondWord(b){return b>=3?"would go anywhere with":b===2?"works well with":b===1?"gets on with":b===-1?"is cool towards":b===-2?"has bad blood with":"will not be in a room with";}
// Who goes on this job. Everyone eligible goes unless you bench them on the job file:
// a benched member takes no cut, learns nothing, and cannot be hurt — and the crew that does go is smaller.
function benchSet(job){return (job&&S.benchJob===job.id&&Array.isArray(S.bench))?S.bench:[];}
function jobPool(job){const b=benchSet(job);return crewAll().filter(c=>b.indexOf(c.id)<0);}
function toggleBench(job,id){
  if(!job)return;
  if(S.benchJob!==job.id){S.benchJob=job.id;S.bench=[];}
  S.bench=S.bench||[];
  const i=S.bench.indexOf(id);
  if(i>=0)S.bench.splice(i,1);else S.bench.push(id);
  save();
}
function benchClear(job){S.benchJob=job?job.id:null;S.bench=[];save();}

// Somebody else is working the same board, and somebody is keeping a file on you. Both have names.
const OUTFIT=["outfit","crew","firm","people","lot","company"];
function randomName(rng,g){
  const keys=Object.keys(NAMES);
  const p=NAMES[pick(rng,keys)];
  return {first:pick(rng,g==="F"?p.f:p.m),last:pick(rng,p.s)};
}
function makeRival(rng){
  const g=chance(rng,0.5)?"M":"F";
  const n=randomName(rng,g);
  return {boss:n.first+" "+n.last,last:n.last,gender:g,name:"the "+n.last+" "+pick(rng,OUTFIT),standing:Math.max(6,S.rep-ri(rng,0,8)),took:0,since:S.week};
}
function makeDetective(rng){
  const g=chance(rng,0.5)?"M":"F";
  const n=randomName(rng,g);
  return {name:"Detective "+n.last,full:n.first+" "+n.last,gender:g,file:0,since:S.week};
}
function rival(){return S.rival||null;}
function detective(){return S.det||null;}
function detFile(){return S.det?Math.round(S.det.file):0;}
// A thick file brings the raid forward.
function raidAt(){const f=detFile();return 100-(f>=50?10:0)-(f>=75?10:0);}
function rivalAhead(){return !!(rival()&&rival().standing>S.rep);}
// The rival takes a posting off the board — the best one still there.
function rivalWorks(rng){
  const rv=rival();if(!rv)return;
  const open=S.jobs.filter(j=>!j.final&&!j.big);
  if(open.length<5)return;
  if(!chance(rng,rivalAhead()?0.5:0.38))return;
  const j=open.slice().sort((a,b)=>b.tier-a.tier||b.payout-a.payout)[0];
  S.jobs=S.jobs.filter(x=>x.id!==j.id);
  rv.standing=clamp(rv.standing+j.tier,0,999);rv.took++;
  logMsg(cap(rv.name)+" took the "+j.city+" job off the board — "+j.title.toLowerCase()+". Their standing "+rv.standing+".","warn");
}
function detWatch(rng){
  const d=detective();if(!d)return;
  const was=detFile();
  d.file=clamp(d.file+S.heat/22+(S.heat>=70?0.8:0),0,100);
  if(S.heat<25)d.file=Math.max(0,d.file-0.9);   // a quiet month is a cold case
  const now=detFile();
  if(was<50&&now>=50)logMsg(d.name+"'s file is thick enough to brief a squad. A raid will come at heat "+raidAt()+" now.","bad",true);
  else if(was<25&&now>=25)logMsg(d.name+" has opened a file on your alias.","warn",true);
}
function rivalPressure(){
  const rv=rival();if(!rv)return;
  const cost=Math.max(40000,rv.standing*3000);
  if(S.money<cost){note("Buying somebody inside "+rv.name+" costs "+money(cost)+".");return;}
  S.money-=cost;rv.standing=clamp(rv.standing-ri(freshRng(),8,14),0,999);
  logMsg("Bought a name inside "+rv.name+" for "+money(cost)+". Their standing "+rv.standing+".","good");
  save();render();
}
function rivalEnforce(){
  const rv=rival();if(!rv)return;
  if(!payroll().some(c=>c.status==="crew"&&c.tech==="enforcer")){note("That needs an Enforcer on the books.");return;}
  const rng=freshRng();
  if(chance(rng,0.65)){rv.standing=clamp(rv.standing-ri(rng,12,20),0,999);S.heat=clamp(S.heat+6,0,120);
    logMsg("Your enforcer had a word with "+rv.name+". Their standing "+rv.standing+". Heat +6.","good",true);}
  else{S.heat=clamp(S.heat+16,0,120);rv.standing=clamp(rv.standing+4,0,999);
    logMsg("Your enforcer's word with "+rv.name+" went loud, in a street with windows. Heat +16, and they are not frightened.","bad",true);}
  save();render();
}

function goalsDone(){S.goals=S.goals||{};return S.goals;}
function checkGoals(){
  if(!S||S.over)return;
  const done=goalsDone();S.notices=S.notices||[];
  GOALS.forEach(g=>{

    S.notices.push({k:"A mark on the wall · week "+S.week,h:g.l,text:g.d+(paid?"  —  "+paid:""),go:"log",goText:"The record →"});

// Money with somewhere to go: people on a weekly retainer, a safe house bought outright,
// and a desk that can be paid to look the other way.
const RETAINERS=[
  {k:"lawyer",l:"A lawyer on retainer",cost:12000,d:"Anyone taken is out in half the weeks — a firm that answers the phone at four in the morning."},
  {k:"doctor",l:"A doctor on call",cost:9000,d:"A wound is a week instead of two, and no questions asked about how it happened."},
  {k:"fixer",l:"A fixer on retainer",cost:15000,d:"Two more postings on the board each week, and one of them written for the crew you actually have."},
];
const RET_BY_K={};RETAINERS.forEach(r=>RET_BY_K[r.k]=r);
const SAFEHOUSES=[
  {cost:80000,l:"A lock-up behind a laundry",d:"Heat falls 7 a week instead of 5."},
  {cost:200000,l:"A flat nobody rented to you",d:"Heat falls 9 a week."},
  {cost:450000,l:"A yard, a name on a lease, two ways out",d:"Heat falls 11 a week, and a raid takes less of the float."},
];
function hasRetainer(k){return !!(S.retainers&&S.retainers[k]);}
function retainerCost(){return RETAINERS.reduce((s,r)=>s+(hasRetainer(r.k)?r.cost:0),0);}
function safehouseLevel(){return S.safehouse||0;}
function heatDrop(){return 5+2*safehouseLevel();}
function bribeCost(){return Math.max(10000,Math.round(S.heat*3000/1000)*1000);}
function toggleRetainer(k){
  const r=RET_BY_K[k];if(!r)return;
  S.retainers=S.retainers||{};
  if(S.retainers[k]){S.retainers[k]=false;logMsg("Let "+r.l.toLowerCase()+" go. "+money(r.cost)+" a week back in the float.","");}
  else{
    if(S.money<r.cost){note("Not enough to open the account — the first week is "+money(r.cost)+".");return;}
    S.money-=r.cost;S.retainers[k]=true;sfx("coin");
    logMsg("Put "+r.l.toLowerCase()+" on the books — "+money(r.cost)+" a week. "+r.d,"good");
  }
  save();render();
}
function buySafehouse(){
  const lv=safehouseLevel();if(lv>=SAFEHOUSES.length)return;
  const h=SAFEHOUSES[lv];
  if(S.money<h.cost){note("Not enough — "+h.l.toLowerCase()+" costs "+money(h.cost)+".");return;}
  S.money-=h.cost;S.safehouse=lv+1;S.heat=clamp(S.heat-10,0,120);sfx("stamp");
  logMsg("Moved the operation: "+h.l.toLowerCase()+" ("+money(h.cost)+"). "+h.d+" Heat −10 tonight.","good",true);
  save();render();
}
function bribe(){
  const c=bribeCost();
  if(S.heat<20){note("Nothing to buy off yet — the heat is low.");return;}
  if(S.money<c){note("The desk wants "+money(c)+".");return;}
  S.money-=c;S.heat=clamp(S.heat-20,0,120);sfx("coin");
  if(detective())detective().file=Math.max(0,detective().file-12);
  logMsg("Paid a desk "+money(c)+" to lose a file. Heat −20"+(detective()?", and "+detective().name+"'s folder is thinner":"")+".","good");
  save();render();
}
function crews(){return S.crews||[];}
function crewMembers(cr){return cr.memberIds.map(byId).filter(Boolean);}
function crewOf(id){return crews().find(cr=>cr.memberIds.includes(id))||null;}
function crewById(id){return crews().find(cr=>cr.id===id)||null;}
function payroll(){let a=recruits();crews().forEach(cr=>{a=a.concat(crewMembers(cr));});return a;}   // everyone on the books
function leaveCrew(c){S.crewIds=S.crewIds.filter(id=>id!==c.id);crews().forEach(cr=>{cr.memberIds=cr.memberIds.filter(id=>id!==c.id);});}
// The commander the crew was founded under leads it while on the books and on their feet; otherwise the best commander-type left.
function crewLeader(cr){
  const named=cr.leadId?byId(cr.leadId):null;
  if(named&&cr.memberIds.includes(named.id)&&named.status==="crew"&&named.role==="commander")return named;
  return crewMembers(cr).filter(c=>c.status==="crew"&&c.role==="commander").sort((a,b)=>b.cmd-a.cmd)[0]||null;
}
// A bonus buys three weeks of a member working for it: sharper on the job, deaf to other crews, and not the one trouble picks on.
const PAID_WEEKS=3;
function paidUp(c){return !c.isPlayer&&c.paidUntil!=null&&c.paidUntil>=S.week;}
// Small money: a cut under two weeks of a member's own upkeep is a job done for you, not for them.
// Three in a row and they grumble; five and they may walk.
// A cut worth less than a week of what they cost you is a job they did for you, not for
// themselves. Tied to a week rather than two, because the cuts themselves were halved — the
// test has to move with them or every job on the board reads as an insult.
function smallMoney(c,job){return !c.isPlayer&&job.payout*c.cut<c.upkeep*(job.weeks||1);}
function restless(c){return !c.isPlayer&&(c.lowRun||0)>=3;}
function foundingRules(){
  const n=crews().length;
  const week=n<EXTRA_CREW_WEEKS.length?EXTRA_CREW_WEEKS[n]:null;
  const ready=recruits().filter(c=>c.status==="crew");
  return {n,more:week!==null,week,rep:EXTRA_CREW_REP,weekOk:week!==null&&S.week>=week,repOk:S.rep>=EXTRA_CREW_REP,

// Milestones are announced once, in a box in the middle of the screen: the places a name opens,

        text:years+" years in, "+rankName(S.rep)+", seven on the crew. You can found a "+ord+" crew: a commander-type and four soldiers out of your seven, named after its commander, taking a job of its own each week without you. Its take, its heat and its ranking are yours — and so is its payroll.",go:"found",goText:"Found a crew →"});

        text:"A "+ord+" crew is within reach: a commander and four soldiers out of your seven, working without you, from the same board. Still needed: "+need.join("; ")+". The Crew tab keeps the list.",go:"crew",goText:"To the crew →"});

   client, an hour's work and a few hundred to a few thousand at the end of it — against a real

   The whole game of it is who you send. A trade counts for nothing here: nobody is paying for a
   Safecracker on a parked car. What counts is the two attributes the job actually leans on, what
   they will not do, and whether they have the nerve for something with no plan behind it. The
   fit is printed against every name before you choose, because the odds are always written on
   the option in this game.

   piece of street work a week however big the crew, the money is small enough that it never
   funds a job, and the downside is a person — the most expensive thing you own. */
