<title>The Crew</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600;700&family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --paper:#f6f4ee;
    --paper-2:#efece3;
    --card:#fbfaf6;
    --ink:#111010;
    --ink-2:#4a463e;
    --muted:#726c60;
    --line:#d9d5c8;
    --line-2:#c4bfae;
    --stamp:#9a2b1e;
    --good:#2f6b34;
    --warn:#8a6212;
    --bad:#9a2b1e;
    --shadow:0 1px 0 rgba(17,16,16,.04), 0 8px 24px -18px rgba(17,16,16,.5);
    color-scheme:light;
    --f-logo:"Anton","Impact","Oswald","Arial Narrow",sans-serif;
    --f-disp:"Oswald","Arial Narrow",system-ui,sans-serif;
    --f-body:"Spectral","Iowan Old Style",Georgia,serif;
    --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  /* A PC game has one layout. Below this the window scrolls; nothing rearranges. */
  body{min-width:960px;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--f-body);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    background-image:repeating-linear-gradient(0deg,transparent,transparent 27px,rgba(17,16,16,.02) 27px,rgba(17,16,16,.02) 28px);
  }
  .wrap{max-width:1060px;margin:0 auto;padding:0 16px 64px}
  .mono{font-family:var(--f-mono)}
  .num{font-variant-numeric:tabular-nums}
  h1,h2,h3{font-family:var(--f-disp);font-weight:600;margin:0;letter-spacing:.02em;text-wrap:balance;line-height:1.05}
  button{font-family:inherit;color:inherit;cursor:pointer}
  a{color:inherit}
  .kicker{font-family:var(--f-mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}

  .topbar{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:2px solid var(--ink)}
  .topbar-in{max-width:1060px;margin:0 auto;padding:8px 112px 8px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{font-family:var(--f-logo);font-weight:400;font-size:24px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;line-height:1}
  .stat{display:flex;flex-direction:column;line-height:1;gap:3px;min-width:72px}
  .stat .l{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .stat .v{font-family:var(--f-mono);font-size:15px;font-weight:500}
  .heatwrap{min-width:132px;flex:1 1 132px;max-width:220px}
  .heatbar{height:9px;border:1px solid var(--ink);background:repeating-linear-gradient(45deg,var(--paper-2),var(--paper-2) 5px,transparent 5px,transparent 10px);position:relative;overflow:hidden}
  .heatbar>i{position:absolute;inset:0;width:0;background:var(--ink);transition:width .5s ease}
  .heatbar.hot>i{background:var(--stamp)}
  .spacer{flex:1 1 auto}

  /* The tabs pin under the top bar, so Crew/Jobs/Roster/Log are reachable from anywhere down a
     long board. The offset is the top bar's real height — it wraps to two rows in a narrow window,
     so a hardcoded number would leave a gap or hide the first row. See syncTopbarH(). */
  /* The one screen a phone or tablet ever gets. It is not a layout of the game; it is a door. */
  .pconly{min-width:0;max-width:640px;margin:0 auto;padding:56px 22px;text-align:center}
  .pconly h1{font-family:var(--f-logo);font-weight:400;font-size:44px;letter-spacing:.02em;text-transform:uppercase;margin:0 0 6px;line-height:1}
  .pconly .rule{height:2px;background:var(--ink);margin:16px auto 20px;max-width:120px}
  .pconly p{font-size:16px;line-height:1.65;margin:0 0 14px}
  .pconly .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
  .pconly .b{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--muted);margin-top:26px}

  .tabs{position:sticky;top:var(--topbar-h,56px);z-index:30;
    background:var(--paper);display:flex;border-bottom:2px solid var(--ink);margin:0 0 18px;flex-wrap:wrap}
  .tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:12px 16px 10px;font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.12em;font-size:14px;color:var(--muted)}
  .tab.on{color:var(--ink);border-color:var(--stamp)}
  .tab .b{font-family:var(--f-mono);font-size:10px;color:var(--muted);margin-left:6px}

  .panel{background:var(--card);border:1px solid var(--line-2);box-shadow:var(--shadow)}
  .panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .panel-h h2{font-size:16px;letter-spacing:.08em;text-transform:uppercase}
  .panel-b{padding:16px}
  .grid{display:grid;gap:14px}
  .g-hq{grid-template-columns:1.3fr 1fr}

  .rule{height:1px;background:var(--line);border:0;margin:12px 0}
  .btn{appearance:none;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.1em;font-size:13px;padding:9px 16px;transition:.12s}
  .btn:hover{background:#000}
  .btn:disabled,.btn:disabled:hover{opacity:1;background:var(--paper-2);color:var(--muted);border-color:var(--line-2);cursor:not-allowed}
  .btn.ghost:disabled,.btn.ghost:disabled:hover{background:transparent}
  .btn.ghost{background:transparent;color:var(--ink)}
  .btn.ghost:hover{background:var(--paper-2)}
  .btn.sm{font-size:11px;padding:6px 11px;letter-spacing:.08em}
  .btn.stamp{border-color:var(--stamp);background:var(--stamp)}
  .btn.stamp:hover{background:#7f2116}

  .tag{display:inline-block;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line-2);padding:2px 6px;color:var(--ink-2);background:var(--paper)}
  .tag.spec{border-color:var(--ink);color:var(--ink)}
  .tag.pass{border-style:dashed}
  .tag.ok{border-color:var(--good);color:var(--good)}
  .tag.no{border-color:var(--stamp);color:var(--stamp)}
  .chip{font-family:var(--f-mono);font-size:10px;padding:1px 6px;border:1px solid;letter-spacing:.05em;text-transform:uppercase}
  .c-good{color:var(--good);border-color:var(--good)}
  .c-warn{color:var(--warn);border-color:var(--warn)}
  .c-bad{color:var(--bad);border-color:var(--bad)}
  .c-ink{color:var(--ink);border-color:var(--ink)}

  .rosterbar{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
  .field{display:flex;flex-direction:column;gap:3px}
  .field label{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  input[type=text],select{font-family:var(--f-mono);font-size:13px;padding:7px 9px;border:1px solid var(--line-2);background:var(--paper);color:var(--ink);max-width:100%}
  input[type=text]:focus,select:focus,.tab:focus-visible,.btn:focus-visible,button:focus-visible,.jobrow:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
  .count{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-left:auto;padding-bottom:8px}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .id{border:1px solid var(--line-2);background:var(--card);display:flex;flex-direction:column;position:relative}
  .id.you{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
  .id.slot{border-style:dashed;justify-content:center;align-items:center;min-height:200px;color:var(--muted);font-family:var(--f-mono);font-size:12px;text-align:center;padding:16px;gap:10px}
  /* Locked reads the same wherever it appears: a faded, dashed, hatched card you cannot use yet. */
  .id.slot.locked,.panel.locked{opacity:.62;border-style:dashed;
    background-image:repeating-linear-gradient(135deg,transparent 0 9px,rgba(0,0,0,.035) 9px 10px)}
  .panel.locked h2{color:var(--muted)}
  .id .top{display:flex;gap:10px;padding:11px 11px 8px}
  .id .av{width:60px;height:72px;flex:none;border:1px solid var(--ink);background:#fff}
  .id .who{min-width:0;flex:1}
  .id .nm{font-family:var(--f-disp);font-size:16px;line-height:1.05;letter-spacing:.02em}
  .id .sub{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-top:3px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
  .id .spec{font-family:var(--f-mono);font-size:11px;margin-top:6px;letter-spacing:.04em}
  .exp{display:inline-flex;gap:2px;margin-top:6px;vertical-align:middle}
  .pip{width:9px;height:9px;border:1px solid var(--ink);display:inline-block;flex:none}
  .pip.f{background:var(--ink)}
  .attrs{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;padding:2px 11px 8px}
  .attr{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10px;color:var(--ink-2)}
  .attr .k{width:34px;color:var(--muted);letter-spacing:.05em}
  .attr .bar{flex:1;height:5px;background:var(--paper-2);border:1px solid var(--line)}
  .attr .bar>i{display:block;height:100%;background:var(--ink)}
  .attr .n{width:20px;text-align:right}
  .prof{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2);padding:0 11px 10px;line-height:1.55;border-top:1px dotted var(--line);padding-top:7px;margin:0 0 0}
  .prof b{font-weight:500;color:var(--ink)}
  .prof .lim{color:var(--stamp)}
  .id .foot{margin-top:auto;border-top:1px dashed var(--line-2);padding:8px 11px;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
  .fee{font-family:var(--f-mono);font-size:13px;font-weight:500}
  .stampmark{position:absolute;top:8px;right:8px;font-family:var(--f-disp);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--stamp);border:2px solid var(--stamp);padding:1px 5px;transform:rotate(-8deg);opacity:.9;background:rgba(251,250,246,.85)}
  .stampmark.ink{color:var(--ink-2);border-color:var(--ink-2)}

  .jobrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;transition:.1s}
  .jobrow:hover{background:var(--paper-2)}
  .jobrow:last-child{border-bottom:0}
  .jobrow .code{font-family:var(--f-mono);font-size:11px;color:var(--muted);width:52px}
  .jobrow .t{font-family:var(--f-disp);font-size:17px;letter-spacing:.02em}
  .jobrow .loc{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:2px}
  .jobrow .pay{font-family:var(--f-mono);font-size:15px;text-align:right;font-weight:500}
  .jobrow .meta{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
  .diffbar{display:inline-flex;gap:2px;vertical-align:middle}
  .diffbar i{width:6px;height:11px;background:var(--paper-2);border:1px solid var(--line-2)}
  .diffbar i.f{background:var(--ink);border-color:var(--ink)}
  .diffbar i.h{background:var(--stamp);border-color:var(--stamp)}

  .scrim{position:fixed;inset:0;background:rgba(17,16,16,.44);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:26px 14px;overflow:auto}
  .modal{background:var(--paper);border:2px solid var(--ink);max-width:680px;width:100%;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
  .modal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:14px 16px;border-bottom:2px solid var(--ink);background:var(--paper-2)}
  .modal-b{padding:16px}
  .x{appearance:none;border:1px solid var(--ink);background:var(--paper);width:30px;height:30px;font-size:16px;line-height:1;flex:none}

  .check{display:flex;align-items:center;gap:10px;padding:7px 8px;border:1px solid var(--line-2);margin-bottom:6px;background:var(--card)}
  .check.out{opacity:.6}
  .check.sat{border-style:dashed;background:var(--paper-2)}
  .check.sat .av{opacity:.45}
  .check.sat .why{color:var(--muted);font-style:italic}
  .check .av{width:34px;height:41px;border:1px solid var(--ink);background:#fff;flex:none}
  .check .mark{font-family:var(--f-mono);font-size:14px;width:18px;text-align:center;flex:none}
  .check .why{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
  .check.out .why{color:var(--stamp)}

  .req{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .req .b{border:1px solid var(--line-2);padding:6px 9px;background:var(--card);min-width:78px;flex:1 1 78px}
  .req .b .k{font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .req .b .v{font-family:var(--f-disp);font-size:16px}
  .req .b .sub{font-family:var(--f-mono);font-size:10px;letter-spacing:.04em;margin-top:2px}
  .brief{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);line-height:1.65;border-left:3px solid var(--ink);padding:4px 10px;margin:8px 0 10px;background:var(--card)}
  /* ---- what the job actually is ---- */
  .jobbrief{border:1px solid var(--line-2);background:var(--card);padding:9px 12px 11px;margin:2px 0 10px}
  .jobbrief p{margin:5px 0 0;font-family:var(--f-body);font-size:14.5px;line-height:1.6;color:var(--ink)}
  .brief .client{color:var(--ink);font-weight:500}
  .factors{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-family:var(--f-mono);font-size:11px;margin-top:8px}
  /* what the reckoning said, and what would have answered it */
  .wrongs{margin-top:8px;border:1px solid var(--line-2);background:var(--card)}
  .wr{padding:7px 10px}
  .wr+.wr{border-top:1px solid var(--line)}
  .wr-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .wr-k{font-family:var(--f-disp);font-size:13px;letter-spacing:.02em}
  .wr-v{font-family:var(--f-mono);font-size:12px;color:var(--stamp)}
  .wr-n{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-top:1px}
  .wr-f{font-size:13px;line-height:1.5;margin-top:4px}
  /* Who the fee goes to. Name, share, money — the money column right-aligned so the amounts
     line up against each other, which is the only way a split reads at a glance. */
  .split{border:1px solid var(--line-2);background:var(--card);margin-top:8px}
  .split .r{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:baseline;padding:5px 10px;font-family:var(--f-mono);font-size:12px}
  .split .r+.r{border-top:1px solid var(--line)}
  .split .r .p{color:var(--muted);font-size:11px;min-width:46px;text-align:right}
  .split .r .m{min-width:92px;text-align:right}
  .split .r .w .t{color:var(--muted);font-size:10.5px}
  .split .r.sum{border-top:1px solid var(--ink);background:var(--paper-2)}
  .split .r.keep{border-top:2px solid var(--ink);font-family:var(--f-disp);font-size:15px}
  .split .r.keep .p{font-family:var(--f-mono)}
  .split .r.off{color:var(--muted)}
  .split .r.off .m{text-decoration:line-through}
  .split .r.cost .m{color:var(--stamp)}
  .benchdelta{border:1px solid var(--ink);background:var(--paper-2);padding:8px 10px;margin-top:8px;font-family:var(--f-mono);font-size:11.5px;line-height:1.6}
  .benchdelta b{font-family:var(--f-disp);font-size:13px;letter-spacing:.01em}
  .benchdelta .up{color:var(--good)}
  .benchdelta .dn{color:var(--stamp)}
  .benchdelta .small{color:var(--muted);font-size:10.5px;line-height:1.55;display:inline-block;margin-top:3px}
  /* the file of whoever the between-jobs question is about — a crew card, under the question */
  .evwho{margin:6px 0 4px;padding-bottom:9px}
  .evfacts{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-family:var(--f-mono);font-size:11px;padding:4px 11px 0;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
  .evfacts .k{color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-size:9.5px}
  .factors .k{color:var(--muted)}
  .factors .plus{color:var(--good)}
  .factors .minus{color:var(--stamp)}

  .odds{height:12px;border:1px solid var(--ink);display:flex;overflow:hidden;font-size:0}
  .odds i{height:100%;display:block}
  .odds .o-good{background:var(--good)}
  .odds .o-mid{background:var(--warn)}
  .odds .o-bad{background:var(--stamp)}

  .hero{padding:56px 0 30px;text-align:center;border-bottom:2px solid var(--ink);margin-bottom:26px;position:relative}
  .hero .eyebrow{font-family:var(--f-mono);letter-spacing:.4em;text-transform:uppercase;font-size:12px;color:var(--muted)}
  .hero h1{font-family:var(--f-logo);font-size:clamp(60px,17vw,150px);letter-spacing:.01em;line-height:.9;margin:10px 0 6px;text-transform:uppercase;font-weight:400}
  .hero .tagline{font-family:var(--f-body);font-style:italic;font-size:clamp(15px,2.4vw,19px);color:var(--ink-2);max-width:46ch;margin:8px auto 0}
  .filecard{max-width:720px;margin:0 auto}
  .redacted{background:var(--ink);color:var(--ink);user-select:none}

  .create-grid{display:grid;grid-template-columns:288px 1fr;gap:22px;align-items:start}
  .bigav{width:100%;max-width:288px;aspect-ratio:200/240;border:2px solid var(--ink);background:#fff;margin:0 auto}
  /* The picture stays put while the ten sliders scroll past it. Choosing a nose you cannot see
     is not choosing anything, and ten parts is taller than a laptop screen. */
  .facecol{position:sticky;top:12px;z-index:2;background:var(--paper);padding-bottom:8px}
  /* ---- the face builder: one slider a part ---- */
  .facebox{margin-top:10px;padding:10px 12px 12px}
  /* label and value share a line, so a part is two rows instead of three */
  .facerow{display:grid;grid-template-columns:1fr auto;column-gap:10px;align-items:baseline;margin-top:7px}
  /* placed explicitly: the name and the choice share the top line, the slider runs under both.
     Left to auto-placement the value lands below its own slider and reads as the next part's. */
  .facerow label{grid-area:1/1;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .faceval{grid-area:1/2;text-align:right;font-family:var(--f-mono);font-size:11px;color:var(--ink)}
  .faceslide{grid-area:2/1/3/3}
  /* what the trade actually is, the first time anybody reads the word */
  .tradehint{margin-top:6px;font-size:11.5px;line-height:1.6;color:var(--ink-2);border-left:2px solid var(--line);padding-left:9px}
  .faceslide{-webkit-appearance:none;appearance:none;width:100%;height:14px;background:transparent;cursor:pointer;margin:2px 0}
  .faceslide::-webkit-slider-runnable-track{height:12px;background:var(--line-2);border:1px solid var(--line)}
  .faceslide::-moz-range-track{height:12px;background:var(--line-2);border:1px solid var(--line)}
  .faceslide::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:12px;background:var(--ink);border:0;border-radius:0}
  .faceslide::-moz-range-thumb{width:22px;height:12px;background:var(--ink);border:0;border-radius:0}
  .faceslide:focus-visible::-webkit-slider-thumb{outline:2px solid var(--stamp);outline-offset:2px}
  .faceslide:focus-visible::-moz-range-thumb{outline:2px solid var(--stamp);outline-offset:2px}
  .swatchrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
  .genbtn{border:1px solid var(--ink);background:var(--paper);padding:8px 14px;font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.1em;font-size:13px}
  .genbtn.on{background:var(--ink);color:var(--paper)}
  .rolled{border:1px solid var(--line-2);background:var(--card);padding:10px 12px;margin-top:6px}

  .log{display:flex;flex-direction:column;max-height:420px;overflow:auto}
  .logline{font-family:var(--f-mono);font-size:12px;padding:7px 0;border-bottom:1px dotted var(--line);display:flex;gap:9px}
  .logline .wk{color:var(--muted);flex:none;width:30px}
  .logline.good .tx{color:var(--good)}
  .logline.bad .tx{color:var(--bad)}
  .logline.warn .tx{color:var(--warn)}
  .logline.big .tx{font-weight:600}

  .empty{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding:22px;text-align:center}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-family:var(--f-mono);font-size:12px}
  .kv .k{color:var(--muted)}
  .foot-note{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;margin-top:26px;line-height:1.6}

function genProfile(rng,nat,gender,opts){
  opts=opts||{};
  const tech=opts.tech?TECH_BY_K[opts.tech]:pick(rng,TECHS);
  const role=opts.role||(chance(rng,0.25)?"commander":"soldier");
  const r=rng();
  const exp=r<0.40?1:r<0.70?2:r<0.87?3:r<0.97?4:5;
  const er=rng();
  const edu=er<0.15?0:er<0.40?1:er<0.65?2:er<0.87?3:er<0.95?4:5;
  const jail=chance(rng,0.55)?0:ri(rng,1,12);
  const streets=clamp(ri(rng,0,25)-edu*2,0,25);
  const base=24+(exp-1)*11;
  const attrs={};
  ATTRS.forEach(a=>{
    let v=base+ri(rng,-8,18);
    if(a===tech.a)v+=ri(rng,10,26);
    if(role==="commander"&&(a==="brains"||a==="charm"))v+=5;
    if(role==="soldier"&&(a==="muscle"||a==="nerve"))v+=4;
    if(a==="brains")v+=edu*2;
    if(a==="nerve")v+=Math.round(jail*0.6+streets*0.4);
    attrs[a]=clamp(Math.round(v),12,98);
  });
  const know=[tech.know];
  const nk=chance(rng,0.55)?1:chance(rng,0.5)?2:0;
  for(let i=0;i<nk;i++){const k=pick(rng,KNOW);if(!know.includes(k))know.push(k);}
  const langs=nat.langs.slice(0,chance(rng,0.6)?1:2);
  if(chance(rng,0.5)){const l=pick(rng,EXTRA_LANGS);if(!langs.includes(l))langs.push(l);}
  if(chance(rng,0.25)){const l=pick(rng,EXTRA_LANGS);if(!langs.includes(l))langs.push(l);}
  const limits=[];
  const nl=chance(rng,0.6)?0:chance(rng,0.75)?1:2;
  for(let i=0;i<nl;i++){const l=pick(rng,LIMITS);if(!limits.includes(l.k))limits.push(l.k);}
  // temperament: what this one is like to work with, on top of what they can do
  const traits=[];
  const nt=chance(rng,0.34)?0:chance(rng,0.72)?1:2;
  for(let i=0;i<nt;i++){const t=pick(rng,TRAITS);if(!traits.includes(t.k))traits.push(t.k);}
  return {tech:tech.k,role,exp,edu,jail,streets,attrs,know,langs,limits,traits,cmd:role==="commander"?ri(rng,3,9):0};
}
function genChar(rng,i,used){
  const nat=pick(rng,COUNTRIES);
  const gender=chance(rng,0.5)?"M":"F";
  const pool=NAMES[nat.pool];
  const first=pick(rng,gender==="M"?pool.m:pool.f);
  const last=pick(rng,pool.s);
  let n=first+" "+last;
  let guard=0;
  while(used.has(n)&&guard++<40){n=first+" "+String.fromCharCode(65+ri(rng,0,25))+". "+last;}
  used.add(n);
  const p=genProfile(rng,nat,gender);
  const feeBase=(p.exp*7000)+(avg(p.attrs)*260)+(p.know.length-1)*2500+p.edu*900+(p.tech==="hacker"||p.tech==="safecracker"||p.tech==="forger"?4000:0);
  const fee=Math.round(feeBase*(1+rng()*0.35)/500)*500;
  let cut=Math.round((BAL.cutBase+(p.exp-1)*BAL.cutPerExp+rng()*BAL.cutJitter)*1000)/1000;
  if(p.limits.includes("cut"))cut=Math.max(cut,0.1);
  if(p.traits&&p.traits.indexOf("mercenary")>=0)cut=Math.round((cut+0.02)*1000)/1000;
  return Object.assign({
    id:"C"+(1000+i),n,first,gender,nat:nat.name,
    fee,cut,
    upkeep:Math.round((p.exp*1200+rng()*800)/100)*100,
    loyalty:ri(rng,42,68),
    greed:ri(rng,15,90),
    mole:chance(rng,0.07),
    vetted:false,vetFlag:false,
    status:"available",   // available | crew | injured | jailed | gone
    out:0,
    avseed:ri(rng,1,1e9),
  },p);
}
function avg(o){let s=0,n=0;for(const k in o){s+=o[k];n++;}return s/n;}
function buildRoster(seed){
  const rng=mulberry32(seed);
  const used=new Set();
  const arr=new Array(ROSTER_SIZE);
  for(let i=0;i<ROSTER_SIZE;i++)arr[i]=genChar(rng,i,used);
  return arr;
}

function nameFor(rng,natName,gender){
  const nat=COUNTRY_BY_NAME[natName];
  const pool=NAMES[(nat&&nat.pool)||"Anglo"]||NAMES.Anglo;
  const first=pick(rng,gender==="F"?pool.f:pool.m);
  return first+" "+pick(rng,pool.s);
}

/* ------------------------------ STATE --------------------------------- */
let S=null;
const SAVE_KEY="thecrew_save_v2";
// How hot a country is on you: working one burns it, and it cools a point a week.
function countryHeat(name){return (S&&S.coHeat&&S.coHeat[name])||0;}
function countryHeatAdd(name,n){if(!S)return;S.coHeat=S.coHeat||{};S.coHeat[name]=clamp((S.coHeat[name]||0)+n,0,100);}
// The world answers the name. Sub-linear, so the last hundred points of ranking do not make
// the game unplayable — but a Feared crew is never handed an easy room again.
function repPressure(){return Math.round(BAL.repPressure*Math.pow(Math.max(0,(S?S.rep:0))/100,0.92));}
// What a job of this tier is worth to a name of this size. Full value for the biggest thing
// the board will post to you; a fraction of it for anything well below that.
function tierWorth(jobTier){
  if(jobTier>=5)return 1;
  const under=Math.max(0,(rankInfo(S?S.rep:0).maxTier)-jobTier);
  return [1,0.55,0.28,0.12][Math.min(3,under)];
}

function newGame(player){
  const seed=(Date.now()^Math.floor(Math.random()*1e9))>>>0;

}
function byId(id){if(id==="YOU")return S.player;return S.roster.find(c=>c.id===id);}
function recruits(){return S.crewIds.map(byId).filter(Boolean);}
function crewAll(){return [S.player].concat(recruits());}
function field(){return crewAll().filter(c=>c.status==="crew");}
// Places on your crew come with the name; other crews come with the years.
const CREW_MAX_SEATS=6;                 // six soldiers, plus you
const EXTRA_CREW_SIZE=5;                // a commander and four soldiers
const EXTRA_CREW_WEEKS=[104,156,208];   // two, three and four years in — and no more

// Which name opens the last two places, read off the ladder rather than written into the copy —
// the card said "ranking 60" for a while after the ladder moved it to 65.
function seatRank(){return RANKS.slice().reverse().find(r=>r[2].seats>=CREW_MAX_SEATS)||RANKS[0];}
function seatRankName(){return seatRank()[1];}

/* ------------------------ TEMPERAMENT AND BONDS ----------------------- */
// What a file is like to work with, and what the crew becomes by working together.
const TRAITS=[
  {k:"steady",l:"Steady",d:"Takes a bad night without losing faith — loyalty never drops when a job goes wrong."},
  {k:"hothead",l:"Hothead",d:"Worth +3 in the field and costs +4 heat every time out. Somebody always remembers the noise."},
  {k:"careful",l:"Careful",d:"−4 heat on any job this one works. Gloves, timings, and a route home."},
  {k:"quick",l:"Quick study",d:"Learns at double speed — twice the experience from every job."},
  {k:"mentor",l:"Mentor",d:"+2 in the field, and everyone else on the job learns half again as much."},
  {k:"mercenary",l:"Mercenary",d:"+2 in the field and takes 3% more of every score. Nothing personal."},
  {k:"lucky",l:"Lucky",d:"The roll falls their way: +4 on the night, whatever the plan says."},
  {k:"jinx",l:"Jinx",d:"−3 on the night, and things go wrong around this one more often than they should."},
  {k:"ghost",l:"Ghost",d:"Never the one the police get their hands on. Somebody else is always closer to the door."},
];
const TRAIT_BY_K={};TRAITS.forEach(t=>TRAIT_BY_K[t.k]=t);
function traits(c){return (c&&c.traits)||[];}
function hasTrait(c,k){return traits(c).indexOf(k)>=0;}
function traitBonus(team){
  let v=0;const who=[];
  team.forEach(c=>{
    let n=0;
    if(hasTrait(c,"hothead"))n+=3;
    if(hasTrait(c,"mentor"))n+=2;
    if(hasTrait(c,"mercenary"))n+=2;
    if(hasTrait(c,"jinx"))n-=3;
    if(n){v+=n;who.push((c.isPlayer?"you":c.first)+" "+(n>0?"+":"")+n);}
  });
  return {v,who};
}
// Bonds: people who work together learn to, and people who lose together remember it.
function bondKey(a,b){return a<b?a+"|"+b:b+"|"+a;}
function bondOf(a,b){return (S.bonds&&S.bonds[bondKey(a,b)])||0;}
function bondScore(team){
  let v=0;const good=[],bad=[],goodIds=[],badIds=[];
  for(let i=0;i<team.length;i++)for(let j=i+1;j<team.length;j++){
    const b=bondOf(team[i].id,team[j].id);if(!b)continue;
    v+=b;
    const pair=(team[i].isPlayer?"you":team[i].first)+" & "+(team[j].isPlayer?"you":team[j].first);
    if(b>0){good.push(pair);goodIds.push([team[i].id,team[j].id]);}
    else{bad.push(pair);badIds.push([team[i].id,team[j].id]);}
  }
  return {v:clamp(v,-6,6),good,bad,goodIds,badIds};
}
const BOND_LOG_MAX=6;   // the last half-dozen nights; a pair that has run twenty jobs needs a story, not a ledger
function bondUpdate(team,tier,job){
  if(team.length<2)return;
  S.bonds=S.bonds||{};S.bondLog=S.bondLog||{};
  const d=tier>=3?1:tier<=1?-1:0;
  if(!d)return;
  // what happened, so the screen can say why rather than only how much
  const night={w:S.week,t:tier,n:job?jobNoun(job):"",c:job?job.country:"",d};
  for(let i=0;i<team.length;i++)for(let j=i+1;j<team.length;j++){
    const k=bondKey(team[i].id,team[j].id);
    S.bonds[k]=clamp((S.bonds[k]||0)+d,-3,3);
    const l=S.bondLog[k]=(S.bondLog[k]||[]).concat([night]);
    if(l.length>BOND_LOG_MAX)l.splice(0,l.length-BOND_LOG_MAX);
    // the number can come back to nothing; what they went through does not un-happen
    if(!S.bonds[k])delete S.bonds[k];
  }
}
// The background, in the order it happened. A file saved before any of this was written down has
// the number and no nights behind it, and says so rather than inventing any.
const VERDICT_WORD=["a disaster","a botched job","a messy night","a job that came off","clean work"];
function signed(n){return n>0?"+"+n:n<0?"−"+Math.abs(n):"0";}
function bondNights(a,b){return (S.bondLog&&S.bondLog[bondKey(a,b)])||[];}
function bondBackground(pairs,max){
  const groups=[],byKey={};
  pairs.forEach(p=>{
    const v=bondOf(p[0],p[1]);
    const nights=bondNights(p[0],p[1]);
    const key=v+"|"+nights.map(n=>n.w+":"+n.t+":"+n.n+":"+n.c).join(",");
    let g=byKey[key];
    if(!g){g=byKey[key]={v,nights,people:[],n:0};groups.push(g);}
    g.n++;
    [p[0],p[1]].forEach(id=>{if(g.people.indexOf(id)<0)g.people.push(id);});
  });
  groups.sort((x,y)=>Math.abs(y.v)-Math.abs(x.v)||y.n-x.n);
  return groups.map(g=>{
    const names=g.people.map(id=>{const c=byId(id);return c?(c.isPlayer?"You":c.first):"someone";});
    // "You" first if present, so the sentence reads from the player outwards
    const i=names.indexOf("You");if(i>0){names.splice(i,1);names.unshift("You");}
    const word=bondWord(g.v);
    const head=g.n===1
      ? names[0]+" "+(names[0]==="You"?youWord(word):word)+" "+(names[1]||"")+"  ("+signed(g.v)+")"
      : listAnd(names)+" — "+(g.v>0?"all of one another":"bad blood all round")+"  ("+signed(g.v)+" each, "+g.n+" pairs)";
    if(!g.nights.length)return head+"\n  from jobs run before the crew kept a record of them";
    const l=max&&g.nights.length>max?g.nights.slice(-max):g.nights;
    const lines=l.map(x=>"  week "+x.w+"  "+VERDICT_WORD[x.t]+(x.n?", "+x.n:"")+(x.c?", "+x.c:"")+"  "+signed(x.d));
    const hidden=g.nights.length-l.length;
    return head+"\n"+lines.join("\n")+(hidden>0?"\n  and "+hidden+" more before "+(l.length===1?"that":"those"):"");
  }).join("\n\n");
}
function youWord(w){return w.replace(/^is /,"are ").replace(/^has /,"have ").replace(/^works /,"work ").replace(/^gets /,"get ");}
function bondStory(a,b,max){
  const A=byId(a),B=byId(b);if(!A||!B)return "";
  const nA=A.isPlayer?"You":A.first,nB=B.isPlayer?"you":B.first;
  const v=bondOf(a,b);
  const head=nA+" "+(A.isPlayer?youWord(bondWord(v)):bondWord(v))+" "+nB+"  ("+signed(v)+")";
  const all=bondNights(a,b);
  if(!all.length)return head+"\n  from jobs run before the crew kept a record of them";
  const l=max&&all.length>max?all.slice(-max):all;
  const lines=l.map(x=>"  week "+x.w+"  "+VERDICT_WORD[x.t]+(x.n?", "+x.n:"")+(x.c?", "+x.c:"")+"  "+signed(x.d));
  const hidden=all.length-l.length;
  const more=hidden>0?"  and "+hidden+" more before "+(max===1?"that":"those")
            :(all.length>=BOND_LOG_MAX?"  (the last "+BOND_LOG_MAX+"; there were more)":"");
  return head+"\n"+lines.join("\n")+(more?"\n"+more:"");
}
function bondsFor(c){
  const out=[];if(!S.bonds)return out;
  crewAll().concat(crews().reduce((a,cr)=>a.concat(crewMembers(cr)),[])).forEach(o=>{
    if(o.id===c.id)return;
    const b=bondOf(c.id,o.id);if(b)out.push({c:o,b});
  });
  return out.sort((a,b)=>Math.abs(b.b)-Math.abs(a.b));
}
function bondWord(b){return b>=3?"would go anywhere with":b===2?"works well with":b===1?"gets on with":b===-1?"is cool towards":b===-2?"has bad blood with":"will not be in a room with";}
// Who goes on this job. Everyone eligible goes unless you bench them on the job file:
// a benched member takes no cut, learns nothing, and cannot be hurt — and the crew that does go is smaller.
function benchSet(job){return (job&&S.benchJob===job.id&&Array.isArray(S.bench))?S.bench:[];}
function jobPool(job){const b=benchSet(job);return crewAll().filter(c=>b.indexOf(c.id)<0);}
function toggleBench(job,id){
  if(!job)return;
  if(S.benchJob!==job.id){S.benchJob=job.id;S.bench=[];}
  S.bench=S.bench||[];
  const i=S.bench.indexOf(id);
  if(i>=0)S.bench.splice(i,1);else S.bench.push(id);
  save();
}
function benchClear(job){S.benchJob=job?job.id:null;S.bench=[];save();}

/* --------------------- THE COMPETITION AND THE LAW -------------------- */
// Somebody else is working the same board, and somebody is keeping a file on you. Both have names.
const OUTFIT=["outfit","crew","firm","people","lot","company"];
function randomName(rng,g){
  const keys=Object.keys(NAMES);
  const p=NAMES[pick(rng,keys)];
  return {first:pick(rng,g==="F"?p.f:p.m),last:pick(rng,p.s)};
}
function makeRival(rng){
  const g=chance(rng,0.5)?"M":"F";
  const n=randomName(rng,g);
  return {boss:n.first+" "+n.last,last:n.last,gender:g,name:"the "+n.last+" "+pick(rng,OUTFIT),standing:Math.max(6,S.rep-ri(rng,0,8)),took:0,since:S.week};
}
function makeDetective(rng){
  const g=chance(rng,0.5)?"M":"F";
  const n=randomName(rng,g);
  return {name:"Detective "+n.last,full:n.first+" "+n.last,gender:g,file:0,since:S.week};
}
function rival(){return S.rival||null;}
function detective(){return S.det||null;}
function detFile(){return S.det?Math.round(S.det.file):0;}
// A thick file brings the raid forward.
function raidAt(){const f=detFile();return 100-(f>=50?10:0)-(f>=75?10:0);}
function rivalAhead(){return !!(rival()&&rival().standing>S.rep);}
// The rival takes a posting off the board — the best one still there.
function rivalWorks(rng){
  const rv=rival();if(!rv)return;
  const open=S.jobs.filter(j=>!j.final);
  if(open.length<5)return;
  if(!chance(rng,rivalAhead()?0.5:0.38))return;
  const j=open.slice().sort((a,b)=>b.tier-a.tier||b.payout-a.payout)[0];
  S.jobs=S.jobs.filter(x=>x.id!==j.id);
  rv.standing=clamp(rv.standing+j.tier,0,999);rv.took++;
  logMsg(cap(rv.name)+" took the "+j.city+" job off the board — "+j.title.toLowerCase()+". Their standing "+rv.standing+".","warn");
}
function detWatch(rng){
  const d=detective();if(!d)return;
  const was=detFile();
  d.file=clamp(d.file+S.heat/22+(S.heat>=70?0.8:0),0,100);
  if(S.heat<25)d.file=Math.max(0,d.file-0.9);   // a quiet month is a cold case
  const now=detFile();
  if(was<50&&now>=50)logMsg(d.name+"'s file is thick enough to brief a squad. A raid will come at heat "+raidAt()+" now.","bad",true);
  else if(was<25&&now>=25)logMsg(d.name+" has opened a file on your alias.","warn",true);
}
function rivalPressure(){
  const rv=rival();if(!rv)return;
  const cost=Math.max(40000,rv.standing*3000);
  if(S.money<cost){note("Buying somebody inside "+rv.name+" costs "+money(cost)+".");return;}
  S.money-=cost;rv.standing=clamp(rv.standing-ri(freshRng(),8,14),0,999);
  logMsg("Bought a name inside "+rv.name+" for "+money(cost)+". Their standing "+rv.standing+".","good");
  save();render();
}
function rivalEnforce(){
  const rv=rival();if(!rv)return;

// Money with somewhere to go: people on a weekly retainer, a safe house bought outright,
// and a desk that can be paid to look the other way.
const RETAINERS=[
  {k:"lawyer",l:"A lawyer on retainer",cost:12000,d:"Anyone taken is out in half the weeks — a firm that answers the phone at four in the morning."},
  {k:"doctor",l:"A doctor on call",cost:9000,d:"A wound is a week instead of two, and no questions asked about how it happened."},
  {k:"fixer",l:"A fixer on retainer",cost:15000,d:"Two more postings on the board each week, and one of them written for the crew you actually have."},
];
const RET_BY_K={};RETAINERS.forEach(r=>RET_BY_K[r.k]=r);
const SAFEHOUSES=[
  {cost:80000,l:"A lock-up behind a laundry",d:"Heat falls 7 a week instead of 5."},
  {cost:200000,l:"A flat nobody rented to you",d:"Heat falls 9 a week."},
  {cost:450000,l:"A yard, a name on a lease, two ways out",d:"Heat falls 11 a week, and a raid takes less of the float."},
];
function hasRetainer(k){return !!(S.retainers&&S.retainers[k]);}
function retainerCost(){return RETAINERS.reduce((s,r)=>s+(hasRetainer(r.k)?r.cost:0),0);}
function safehouseLevel(){return S.safehouse||0;}
function heatDrop(){return 5+2*safehouseLevel();}
function bribeCost(){return Math.max(10000,Math.round(S.heat*3000/1000)*1000);}
function toggleRetainer(k){
  const r=RET_BY_K[k];if(!r)return;
  S.retainers=S.retainers||{};
  if(S.retainers[k]){S.retainers[k]=false;logMsg("Let "+r.l.toLowerCase()+" go. "+money(r.cost)+" a week back in the float.","");}
  else{
    if(S.money<r.cost){note("Not enough to open the account — the first week is "+money(r.cost)+".");return;}
    S.money-=r.cost;S.retainers[k]=true;sfx("coin");
    logMsg("Put "+r.l.toLowerCase()+" on the books — "+money(r.cost)+" a week. "+r.d,"good");
  }
  save();render();
}
function buySafehouse(){
  const lv=safehouseLevel();if(lv>=SAFEHOUSES.length)return;
  const h=SAFEHOUSES[lv];
  if(S.money<h.cost){note("Not enough — "+h.l.toLowerCase()+" costs "+money(h.cost)+".");return;}
  S.money-=h.cost;S.safehouse=lv+1;S.heat=clamp(S.heat-10,0,120);sfx("stamp");
  logMsg("Moved the operation: "+h.l.toLowerCase()+" ("+money(h.cost)+"). "+h.d+" Heat −10 tonight.","good",true);
  save();render();
}
function bribe(){
  const c=bribeCost();
  if(S.heat<20){note("Nothing to buy off yet — the heat is low.");return;}
  if(S.money<c){note("The desk wants "+money(c)+".");return;}
  S.money-=c;S.heat=clamp(S.heat-20,0,120);sfx("coin");
  if(detective())detective().file=Math.max(0,detective().file-12);
  logMsg("Paid a desk "+money(c)+" to lose a file. Heat −20"+(detective()?", and "+detective().name+"'s folder is thinner":"")+".","good");
  save();render();
}
function crews(){return S.crews||[];}
function crewMembers(cr){return cr.memberIds.map(byId).filter(Boolean);}
function crewOf(id){return crews().find(cr=>cr.memberIds.includes(id))||null;}
function crewById(id){return crews().find(cr=>cr.id===id)||null;}
function payroll(){let a=recruits();crews().forEach(cr=>{a=a.concat(crewMembers(cr));});return a;}   // everyone on the books
function leaveCrew(c){S.crewIds=S.crewIds.filter(id=>id!==c.id);crews().forEach(cr=>{cr.memberIds=cr.memberIds.filter(id=>id!==c.id);});}
// The commander the crew was founded under leads it while on the books and on their feet; otherwise the best commander-type left.
function crewLeader(cr){
  const named=cr.leadId?byId(cr.leadId):null;
  if(named&&cr.memberIds.includes(named.id)&&named.status==="crew"&&named.role==="commander")return named;
  return crewMembers(cr).filter(c=>c.status==="crew"&&c.role==="commander").sort((a,b)=>b.cmd-a.cmd)[0]||null;
}
// A bonus buys three weeks of a member working for it: sharper on the job, deaf to other crews, and not the one trouble picks on.
const PAID_WEEKS=3;
function paidUp(c){return !c.isPlayer&&c.paidUntil!=null&&c.paidUntil>=S.week;}
// Small money: a cut under two weeks of a member's own upkeep is a job done for you, not for them.
// Three in a row and they grumble; five and they may walk.
// A cut worth less than a week of what they cost you is a job they did for you, not for
// themselves. Tied to a week rather than two, because the cuts themselves were halved — the
// test has to move with them or every job on the board reads as an insult.
function smallMoney(c,job){return !c.isPlayer&&job.payout*c.cut<c.upkeep*(job.weeks||1);}
function restless(c){return !c.isPlayer&&(c.lowRun||0)>=3;}
function foundingRules(){
  const n=crews().length;
  const week=n<EXTRA_CREW_WEEKS.length?EXTRA_CREW_WEEKS[n]:null;
  const ready=recruits().filter(c=>c.status==="crew");
  return {n,more:week!==null,week,rep:EXTRA_CREW_REP,weekOk:week!==null&&S.week>=week,repOk:S.rep>=EXTRA_CREW_REP,
    full:recruits().length>=CREW_MAX_SEATS,cmdr:ready.some(c=>c.role==="commander"),ready:ready.length>=EXTRA_CREW_SIZE};
}
function canFound(){const r=foundingRules();return r.more&&r.weekOk&&r.repOk&&r.full&&r.cmdr&&r.ready;}
// Milestones are announced once, in a box in the middle of the screen: the places a name opens,
// each year mark when another crew is within reach, and the moment one can be founded.
function checkMilestones(){
  if(!S||S.over)return;
  S.milestones=S.milestones||{};S.notices=S.notices||[];
  const M=S.milestones;
  const push=(k,n)=>{if(M[k])return;M[k]=true;S.notices.push(n);logMsg(n.h+" — "+n.text,"good",true);};
  if(crewSeats()>=CREW_MAX_SEATS)push("seats6",{k:"Milestone · "+rankName(S.rep),h:"Two more seats",
    text:"The name is "+rankName(S.rep)+". Places six and seven are open: six soldiers, and you. Fill them from the roster — and from week 104, Feared, with all seven on the crew, you can found a second crew that works without you.",go:"roster",goText:"To the roster →"});
  const fr=foundingRules();
  if(fr.more){
    const n=fr.n+2,ord=["","","second","third","fourth"][n],years=fr.week/52;
    if(canFound()){
      M["year"+n]=true;
      push("found"+n,{k:"Milestone · week "+S.week+" · "+rankName(S.rep),h:"A "+ord+" crew",
        text:years+" years in, "+rankName(S.rep)+", seven on the crew. You can found a "+ord+" crew: a commander-type and four soldiers out of your seven, named after its commander, taking a job of its own each week without you. Its take, its heat and its ranking are yours — and so is its payroll.",go:"found",goText:"Found a crew →"});
    } else if(fr.weekOk){
      const need=[];
      if(!fr.repOk)need.push("a Feared name (ranking "+fr.rep+", now "+S.rep+")");
      if(!fr.full)need.push("seven on your crew (now "+(1+recruits().length)+")");
      if(!fr.cmdr)need.push("a commander-type among them");
      if(!fr.ready)need.push("five ready to go");
      push("year"+n,{k:"Milestone · week "+fr.week,h:years+" years in",
        text:"A "+ord+" crew is within reach: a commander and four soldiers out of your seven, working without you, from the same board. Still needed: "+need.join("; ")+". The Crew tab keeps the list.",go:"crew",goText:"To the crew →"});
    }
  }
}

/* ------------------------------ JOBS ---------------------------------- */
function makeJob(rng,tierBias){
  const co=pick(rng,COUNTRIES);
  const cat=CAT_BY_K[pick(rng,co.cats)];
  const r=rng();
  const rk=rankInfo(S.rep);
  // clients post to a name: a Nobody sees tier 1–2, a Known crew tier 3, Respected and up tier 4
  const tier=clamp((tierBias||0)+(r<0.34?1:r<0.64?2:r<0.87?3:4),1,rk.maxTier);
  const need=[0,ri(rng,2,3),ri(rng,3,4),ri(rng,4,5),5][tier];
  // No ceiling: the room is as hard as the name, the tier and the local temperature make it.
  const diff=Math.max(20,Math.round(BAL.diffBase+tier*BAL.diffPerTier+ri(rng,-BAL.diffJitter,BAL.diffJitter)
    +repPressure()+countryHeat(co.name)*BAL.countryPressure+(co.gate===2?5:0)+(co.auth?4:0)));
  const wks=BAL.jobWeeks[tier]||1;
  const payBase=BAL.payTier[tier]*[0,0.65,0.8,1][co.eco]*((1-BAL.payWeeks)+BAL.payWeeks*wks);
  const payout=Math.round(payBase*(0.7+rng()*0.8)*rk.pay/1000)*1000;
  const heat=Math.round(cat.heat*(0.8+tier*0.12)*(co.auth?1.2:1));
  const techs=[];const pool=cat.techs.slice();
  const nt=clamp(1+Math.floor(tier/2),1,3);
  for(let i=0;i<nt&&pool.length;i++)techs.push(pool.splice(Math.floor(rng()*pool.length),1)[0]);
  const know=[pick(rng,cat.know)];
  if(tier>=3&&cat.know.length>1){const k=pick(rng,cat.know);if(!know.includes(k))know.push(k);}
  const tags=[];
  for(const t in cat.tags){
    let p=cat.tags[t];
    if(t==="water"&&!co.terrain.some(x=>["coast","port","islands","fjords","canal","delta","river","lakes"].includes(x)))p*=0.3;
    if(t==="heights"&&co.terrain.some(x=>x==="mountains"||x==="megacity"))p+=0.2;
    if(chance(rng,p))tags.push(t);
  }
  S.jobSeq++;
  return {
    id:"J"+S.jobSeq,cat:cat.k,tier,country:co.name,city:pick(rng,co.cities),
    need,diff,payout,heat,techs,know,tags,
    client:pick(rng,openClients()),   // a client with a grudge does not post to you
    title:pick(rng,cat.v)+" "+pick(rng,cat.n),
    // a job is time as well as money: a big one holds the crew for weeks, and a posting that
    // sits on the board long enough to be cased is a posting somebody else may take first
    weeks:BAL.jobWeeks[tier]||1,
    expires:S.week+ri(rng,3,6),
  };
}

const BRIEF_TIER=["",
  "It is a small operation — one door, one shift, nobody expecting anybody.",
  "It is watched, but not closely: a routine, a couple of people, and gaps you can time.",
  "It is properly held — overlapping shifts, a schedule somebody thought about, and people paid to notice.",
  "Everything about it is difficult on purpose, and whoever set it up has seen crews like yours before."];
const BRIEF_TAG={water:"Part of it happens on the water.",air:"A leg of it is by air.",
  heights:"Some of it is well above the ground.",underground:"It goes below street level, where phones stop.",
  violence:"There will be people there who intend violence, whoever starts it.",night:"It happens after dark."};
const BRIEF_PAY=["{client} pays on delivery and nothing at all if it goes wrong.",
  "{client} is paying {fee}, and will not be answering questions afterwards.",
  "{client} wants it done and forgotten; the money moves the same night.",
  "{client} has paid for silence as much as for the work."];
// a client whose name carries a comma cannot be the subject of a sentence without reading badly
const BRIEF_PAY_ALT=["The money — {fee}, on delivery — comes from {client}.",
  "It is posted by {client}, and paid the same night it is done.",
  "The fee is {fee}, from {client}, and no questions come with it."];
function anA(w){return /^[aeiou]/i.test(w)?"an "+w:"a "+w;}
// Two points of the same attribute read as "+2 BRN", not "+1 BRN, +1 BRN".
function upList(up){const c={};up.forEach(a=>{c[a]=(c[a]||0)+1;});return Object.keys(c).map(a=>"+"+c[a]+" "+ATTR_ABBR[a]).join(", ");}
function listAnd(a){return a.length<2?(a[0]||""):a.slice(0,-1).join(", ")+" and "+a[a.length-1];}
function jobSeed(job){
  const s=(job.id||"")+"|"+(job.title||"")+"|"+(job.country||"");
  let h=2166136261;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
  return h>>>0;
}
function jobNoun(job){
  const t=job.title||"";
  const i=t.toLowerCase().indexOf(" the ");
  return i<0?t.toLowerCase():t.slice(i+5);
}
function jobBrief(job){
  if(job.brief)return job.brief;            // the three stages of the last score write their own
  if(job.final)return "Everything you have built, against the one room that has never been opened. There is no posting for this and no client to pay you — there is a name at the end of it, and the certainty that nobody gets a second run at it. Take the whole crew.";
  const rng=mulberry32(jobSeed(job));
  const v={noun:jobNoun(job),city:job.city,country:job.country,client:cap(job.client||"the client"),fee:money(job.payout)};
  const open=fill2(pick(rng,BRIEF_OPEN[job.cat]||BRIEF_OPEN.vault),v);
  const tier=BRIEF_TIER[clamp(job.tier,1,4)];
  const tags=(job.tags||[]).filter(t=>BRIEF_TAG[t]);
  const tag=tags.length?BRIEF_TAG[pick(rng,tags)]:"";
  const techs=(job.techs||[]).map(t=>TECH_BY_K[t]&&TECH_BY_K[t].l).filter(Boolean);
  const wants=techs.length
    ? "The client asked for "+(techs.length>1?techs.slice(0,-1).map(anA).join(", ")+" and "+anA(techs[techs.length-1]):anA(techs[0]))
      +((job.know||[]).length?", and somebody who knows "+job.know.join(" and ")+".":".")
    : "";
  const comma=/[,;]/.test(job.client||"");
  const pay=fill2(pick(rng,comma?BRIEF_PAY_ALT:BRIEF_PAY),comma?Object.assign({},v,{client:job.client}):v);
  return [open,tier,tag,wants,pay].filter(Boolean).join(" ");
}

function refreshJobs(fill){
  const rng=mulberry32((S.seed^(S.week*2654435761))>>>0);
  S.jobs=S.jobs.filter(j=>j.final||j.expires>=S.week);
  let guard=0;
  const want=7+(hasRetainer("fixer")?2:0);
  while(S.jobs.filter(j=>!j.final).length<want&&guard++<40)S.jobs.push(makeJob(rng,0));
  const top=Math.min(3,rankInfo(S.rep).maxTier);
  if(!S.jobs.some(j=>j.tier>=top)&&(fill||chance(rng,0.5)))S.jobs.push(makeJob(rng,2));
  // the fixer writes one posting a week for the crew you actually have
  if(hasRetainer("fixer")){
    const mine=field().map(c=>c.tech);
    if(mine.length&&!S.jobs.some(j=>j.fixed)){
      let best=null,bestN=-1;
      for(let i=0;i<14;i++){const j=makeJob(rng,chance(rng,0.4)?1:0);const n=j.techs.filter(t=>mine.includes(t)).length;if(n>bestN){bestN=n;best=j;}if(n===j.techs.length)break;}
      if(best){best.fixed=true;best.client="your fixer";S.jobs.unshift(best);}
    }
  }
  maybeUnlockFinal();
}

/* ------------------------------ CASING -------------------------------- */
// A room you have watched is not the room you were told about. Weeks spent on a posting before
// taking it buy margin — and cost the weeks, the money, and the risk that somebody else takes
// the posting or it expires while you are still sitting outside it in a car.
function casedWeeks(job){return (job&&S.cased&&S.cased[job.id])||0;}
function caseMax(job){return job.final?4:(BAL.caseMax[job.tier]||0);}
function caseCost(job){return Math.max(4000,Math.round(job.payout*BAL.caseCostPct/1000)*1000);}
function canCase(job){return !!job&&casedWeeks(job)<caseMax(job)&&assessJob(job,jobPool(job)).team.length>0;}
const CASE_LINES=[
  "Two days on the same bench, a different coat each day. The shift changes at ten past, not on the hour.",
  "The delivery door is propped open every Thursday for eleven minutes. Nobody has noticed in years.",
  "A drink with somebody who used to work the night desk. He talks about the old alarm, which is still the alarm.",
  "The plans cost money and are three years out of date, but the load-bearing walls have not moved.",
  "A dry run at four in the morning, with nothing in anybody's pockets that could not be explained.",
  "The guard with the limp does the basement round. The one who actually looks at the screens does not.",
  "Photographs of a door, from across a street, for six hours. The lock is older than the building's owner.",
  "Somebody's ex-wife, over coffee, on the subject of her ex-husband's routine.",
];
function caseJob(id){
  const j=S.jobs.find(x=>x.id===id);if(!j||!canCase(j))return;
  const c=caseCost(j);
  if(S.money<c){note("Casing it costs "+money(c)+" and the float won't carry it.");return;}
  S.money-=c;
  S.cased=S.cased||{};S.cased[j.id]=casedWeeks(j)+1;
  const rng=freshRng();
  S.heat=clamp(S.heat+BAL.caseHeat,0,120);
  countryHeatAdd(j.country,3);
  logMsg("Cased "+j.title+" ("+money(c)+", one week). "+pick(rng,CASE_LINES)+" The crew goes in knowing "+casedWeeks(j)+" week"+(casedWeeks(j)>1?"s":"")+" more than the client told them.","good");
  weekTick(rng);refreshJobs(false);
  // the board does not wait: a posting can expire while you are still watching it
  if(!S.jobs.some(x=>x.id===j.id)){logMsg("The posting for "+j.title+" is gone. Somebody else took it, or the client stopped waiting. The week and the "+money(c)+" are spent.","bad",true);S.jobOpen=null;}
  save();render();
}
function finalStage(){return S.finalStage||0;}
// What the last score asks for before it will appear at all.
function finalGate(){
  const st=stats();
  return [
    {k:"A name at the top of the board",have:S.rep,want:BAL.finalRep,ok:S.rep>=BAL.finalRep,fmt:v=>"ranking "+v},
    {k:"A career behind you",have:st.jobs,want:55,ok:st.jobs>=55,fmt:v=>v+" jobs run"},
    {k:"A crew, not a pair",have:field().length,want:5,ok:field().length>=5,fmt:v=>v+" in the field"},
    // nobody funds this one. Three operations against people who own banks, out of your float.
    {k:"A war chest",have:S.money,want:BAL.finalMoney,ok:S.money>=BAL.finalMoney,fmt:v=>money(v)+" on hand"},
  ];
}
function finalReady(){return finalGate().every(g=>g.ok);}
function maybeUnlockFinal(){
  if(S.finalDone||finalStage()>=FINAL_STAGES.length)return;
  if(S.finalBack&&S.week<S.finalBack)return;          // a failed stage takes weeks to set up again
  if(!finalReady()){if(S.jobs.some(j=>j.final))S.jobs=S.jobs.filter(j=>!j.final);return;}
  if(S.jobs.some(j=>j.final))return;
  const s=FINAL_STAGES[finalStage()];
  S.jobs.unshift(Object.assign({final:true,tier:5,client:"the Committee",expires:9999,stage:finalStage()},s));
  if(S.seenFinal!==finalStage()){
    S.seenFinal=finalStage();
    logMsg(finalStage()===0?"Your name has reached the right ears. The last score is on the board — three operations, in order."
      :"Stage "+(finalStage()+1)+" of the last score is ready: "+s.title+".","big",true);
  }
}

/* --------------------------- JOB RESOLUTION --------------------------- */
// Can this member work this job? Returns {ok, why}.
function entry(c,job,forgerAboard){
  const co=COUNTRY_BY_NAME[job.country];
  const nat=natOf(c);
  for(const k of c.limits){
    const l=LIMIT_BY_K[k];
    if(l.country&&l.country(co))return {ok:false,why:l.l};
    if(l.tag&&job.tags.includes(l.tag))return {ok:false,why:l.l+" — job is "+TAG_LABEL[l.tag]};
  }
  if(c.status!=="crew")return {ok:false,why:c.status==="injured"?"injured, back week "+c.out:"not available"};
  const local=nat.name===co.name;
  if(!local&&!forgerAboard){
    if(co.gate===2&&nat.tier>1)return {ok:false,why:"strict border, "+TIER_WORD[nat.tier]+" passport — needs a forger aboard"};
    if(co.gate===1&&nat.tier>2)return {ok:false,why:"needs a visa, "+TIER_WORD[nat.tier]+" passport — needs a forger aboard"};
    if(co.gate>=1&&c.jail>=(co.gate===2?3:5))return {ok:false,why:c.jail+" years inside — refused at the border without papers"};
  }
  return {ok:true,why:local?"local national":forgerAboard&&(co.gate>=1)?"papers from the forger":"clean entry"};
}
function memberEff(c,job){
  const cat=CAT_BY_K[job.cat];
  let ws=0,tw=0;
  for(const a in cat.w){ws+=cat.w[a]*c.attrs[a];tw+=cat.w[a];}
  let e=ws/tw;
  e*=(1+(c.exp-1)*0.11);
  if(job.techs.includes(c.tech))e+=14;
  if((cat.w.brains||0)>=3)e+=c.edu*1.2;
  return e;
}
function assessJob(job,members,leadId){
  const co=COUNTRY_BY_NAME[job.country];
  const cat=CAT_BY_K[job.cat];
  const all=members||crewAll();
  const forger=all.some(c=>c.status==="crew"&&c.tech==="forger"&&!c.limits.some(k=>{const l=LIMIT_BY_K[k];return l.country&&l.country(co);}));
  const checks=all.map(c=>Object.assign({c},entry(c,job,forger)));
  const team=checks.filter(x=>x.ok).map(x=>x.c);
  const factors=[];
  let power=0;
  if(team.length){team.forEach(c=>power+=memberEff(c,job));power/=team.length;}
  let adj=0;
  const add=(k,v,note,tip)=>{adj+=v;factors.push(tip?{k,v,note,tip}:{k,v,note});};
  if(team.length<job.need)add("Crew short",-22*(job.need-team.length),team.length+" of "+job.need+" can go");
  else add("Crew size",6+Math.min(9,(team.length-job.need)*3),team.length+" in the field");
  // You are the commander. A commander-type recruit chafes under you, but can lead when you can't get in.
  const youIn=team.some(c=>c.isPlayer);
  const cmdTypes=team.filter(c=>!c.isPlayer&&c.role==="commander");
  if(youIn){
    add("You command",S.player.cmd||5,"your crew, your call");
    if(cmdTypes.length)add("Commanders under you",-3*cmdTypes.length,cmdTypes.map(c=>c.first).join(", ")+" take orders badly");
  } else if(cmdTypes.length){
    const lead=(leadId&&cmdTypes.find(c=>c.id===leadId))||cmdTypes.slice().sort((a,b)=>b.cmd-a.cmd)[0];
    add("Stand-in leader",Math.max(1,lead.cmd-2),lead.first+" runs it while you stay out");
  } else add("Leaderless",-10,"you can't get in and nobody else can lead");
  const speaks=team.some(c=>c.langs.some(l=>co.langs.includes(l)));
  if(speaks)add("Language",6,co.langs[0]+" spoken");
  else add("No "+co.langs[0],cat.lang?-14:-8,"nobody speaks it"+(cat.lang?" — this job is all talk":""));
  if(team.some(c=>natOf(c).name===co.name))add("Local national",8,"knows the ground");
  const covered=job.know.filter(k=>team.some(c=>c.know.includes(k)));
  covered.forEach(k=>{const schooled=team.some(c=>c.know.includes(k)&&c.edu>=3);add("Knows "+k,schooled?10:5,schooled?"and studied it":"street knowledge");});
  job.know.filter(k=>!covered.includes(k)).forEach(k=>add("Nobody knows "+k,-6,"wanted for this job"));
  const hits=job.techs.filter(t=>team.some(c=>c.tech===t)).length;
  if(hits)add("Trades",hits*4,hits+" of "+job.techs.length+" wanted");
  const paid=team.filter(c=>paidUp(c));
  if(paid.length)add("Paid up",Math.min(6,2*paid.length),paid.map(c=>c.first).join(", ")+(paid.length>1?" are":" is")+" working for it");
  const tb=traitBonus(team);
  if(tb.v)add("Temperament",tb.v,tb.who.join(", "));
  const bs=bondScore(team);
  if(bs.v){
    const ids=bs.v>0?bs.goodIds:bs.badIds;
    const names=bs.v>0?bs.good:bs.bad;
    const shown=names.slice(0,3).join(", ")+(names.length>3?" and "+(names.length-3)+" more":"");
    add(bs.v>0?"They have worked together":"Bad blood",bs.v,shown,
      (bs.v>0?"What they have been through together. A pair gains a point for every job that comes off with both of them on it, and loses one for every botched or blown night."
             :"What happened between them. A pair loses a point for every botched or blown night they were both on, and gains one back for every job that comes off.")
      +"\n\n"+bondBackground(ids,3));
  }
  const grum=team.filter(c=>restless(c));
  if(grum.length)add("Restless",-2*grum.length,grum.map(c=>c.first).join(", ")+" grumbling about the money");
  const streets=team.reduce((m,c)=>Math.max(m,c.streets),0);
  const heatCut=Math.min(4,Math.floor(streets/5));
  const cased=casedWeeks(job);
  if(cased)add("Cased",cased*BAL.caseGain,cased+" week"+(cased>1?"s":"")+" watching it before anybody went in");
  if(S.heat>0)add("Heat",-Math.round(S.heat*0.24),"the world is watching");
  const eff=power+adj;
  const margin=eff-job.diff;
  const lo=margin-BAL.roll,hi=margin+BAL.roll;
  const pAbove=t=>clamp((hi-t)/(hi-lo),0,1);
  const pGood=pAbove(BAL.vClean),pWin=pAbove(BAL.vSuccess),pFailish=pAbove(BAL.vMessy),pDis=pAbove(BAL.vBotched);
  return {team,checks,factors,power:Math.round(power),eff:Math.round(eff),margin:Math.round(margin),heatCut,
    canRun:team.length>0&&team.length>=job.need,
    pClean:Math.round(pGood*100),pOk:Math.round((pFailish-pGood)*100),pFail:Math.round((pDis-pFailish)*100),pDis:Math.round((1-pDis)*100),
    pSuccess:Math.round((pWin-pGood)*100),pMessy:Math.round((pFailish-pWin)*100)};
}
// What the fee turns into. Everybody who goes takes their percentage off the top; the commander
// keeps whatever is left, which is what actually reaches the money in the top bar.
//
// The percentages are fixed. The money they are percentages of is not: finishJob pays 1.08× the
// fee for a clean night, the fee for a success, 0.6× for a messy one and nothing at all for a
// botch — so the split is quoted on the fee and the multiplier is stated beside it, rather than
// showing one number that is only true a third of the time.
function jobSplit(job,team){
  const rows=(team||[]).filter(c=>!c.isPlayer&&c.cut>0)
    .map(c=>({c,pct:c.cut,amt:Math.round(job.payout*c.cut)}))
    .sort((a,b)=>b.amt-a.amt);
  const crew=rows.reduce((n,r)=>n+r.amt,0);
  const crewPct=rows.reduce((n,r)=>n+r.pct,0);
  return {rows,crew,crewPct,you:Math.max(0,job.payout-crew),youPct:Math.max(0,1-crewPct)};
}
// The weeks on the ground are paid for. weekTick charges the whole payroll and every retainer
// once a week, for as many weeks as the job holds the crew — and it charges for everyone on the
// books, so somebody you benched still draws their wages. Benching saves their cut and nothing
// else, which is the single most misleading thing this screen could leave out.
function jobWeeks(job){return Math.max(1,job.final?BAL.finalWeeks:(job.weeks||BAL.jobWeeks[job.tier]||1));}
function jobUpkeep(job){
  const perWeek=retainerCost()+payroll().filter(c=>c.status==="crew").reduce((n,c)=>n+c.upkeep,0);
  return {perWeek,weeks:jobWeeks(job),total:perWeek*jobWeeks(job)};
}
// What the commander keeps on an ordinary night, over many of them: every verdict's takings
// weighted by its own odds, with the crew's percentage off each. A botched or blown job pays
// nothing, so it contributes nothing but still costs its share of the odds — which is the whole
// reason benching for a bigger share can leave you with less.
const VERDICT_PAY=[0,0,BAL.messyPay,1,1.08];   // disaster, botched, messy, success, clean
function outcome(n,strong){
  const s=n<0?moneyExact(-n)+" out of pocket":"about "+moneyExact(n);
  return strong?"<b>"+s+"</b>":s;
}
function expectedKeep(job,a){
  const sp=jobSplit(job,a.team);
  const p=[a.pDis,a.pFail,a.pMessy,a.pSuccess,a.pClean];
  let n=0;
  for(let t=0;t<5;t++)n+=(p[t]/100)*job.payout*VERDICT_PAY[t]*sp.youPct;
  return Math.round(n-jobUpkeep(job).total);   // the wages are paid whatever the night does
}

function rankInfo(rep){for(const r of RANKS)if(rep>=r[0])return Object.assign({name:r[1],min:r[0]},r[2]);const r=RANKS[RANKS.length-1];return Object.assign({name:r[1],min:r[0]},r[2]);}

// The report in two halves: "pre" is the arrival and the plan, "post" is the work and what it cost.
// A twist can sit between them. The clock carries over.
function narrate(job,a,tier,rng,x,mode,clock){
  mode=mode||"all";x=x||{};
  const co=COUNTRY_BY_NAME[job.country];
  const team=a.team;
  let h=clock?clock.h:(job.tags.includes("night")?ri(rng,20,23):ri(rng,7,15)),m=clock?clock.m:ri(rng,0,59);
  const lines=[];
  const stood=[];                                 // {id,k}: who learned a trade the crew hasn't got
  const push=(t,tone,at,who,act)=>{m+=ri(rng,4,26);if(m>=60){m-=60;h=(h+1)%24;}
    const L={t:String(h).padStart(2,"0")+":"+String(m).padStart(2,"0"),x:t,tone:tone||""};
    if(at)L.at=at;if(who)L.who=who;if(act)L.act=act;
    lines.push(L);};
  S.recent=S.recent||[];
  const key=p=>typeof p==="string"?p:p[0];
  const fresh=pool=>{let cand=pool.filter(p=>!S.recent.includes(key(p)));if(!cand.length)cand=pool;const pk=pick(rng,cand);S.recent.push(key(pk));if(S.recent.length>60)S.recent.shift();return pk;};
  const pair=(p,c)=>typeof p==="string"?p:(c&&c.isPlayer?p[1]:p[0]);
  const nm=c=>c.isPlayer?"You":c.first;
  const say=(pool,c,vars,tone,at,act)=>push(fill2(pair(fresh(pool),c),Object.assign({X:c?nm(c):"",P:cap(police(co))},vars||{})),tone,at||(c?techSite(c.tech):null),c?c.id:null,act);
  const someone=()=>team.length?pick(rng,team):null;
  // two missing trades are two people's weeks, not one person's — unless the crew is smaller
  // than the number of gaps, and then somebody covers two and still learns one thing.
  const someoneNew=()=>{if(!team.length)return null;const used=stood.map(s=>s.id);const free=team.filter(c=>used.indexOf(c.id)<0);return pick(rng,free.length?free:team);};
  if(mode!=="post"){
    const kind=co.terrain.some(t=>["islands","coast","port","fjords","canal"].includes(t))&&chance(rng,0.5)?"water":co.terrain.includes("megacity")?"city":co.terrain.includes("mountains")?"mountain":"road";
    const how=fresh(HOW[kind]);
    push(fill2(fresh(ARRIVE),{city:job.city,country:job.country,how,How:cap(how)}),"","road","*");
    if(chance(rng,0.5))push(fresh(WEATHER),"","road");
    a.checks.forEach(c=>{
      if(c.ok){
        if(c.why==="local national")say(LOCAL,c.c,null,"","road");
        else if(c.why.indexOf("papers")===0)say(PAPERS,c.c,null,"","road","paper");
      } else say(OUT,c.c,{why:c.why},"warn","road","down");
    });
    const speaker=team.find(c=>c.langs.some(l=>co.langs.includes(l)));
    if(speaker)say(SPEAKS,speaker,{L:co.langs.find(l=>speaker.langs.includes(l))},"","road","talk");
    else if(team.length)say(NOSPEAK,someone(),{L:co.langs[0]},"warn","road","talk");
    // you can't be across the street and at the door: if your own trade is wanted, you work it
    const you=team.find(c=>c.isPlayer);
    if(you&&job.techs.includes(you.tech))push(fresh(YOU_INSIDE),"",techSite(you.tech),you.id);
    else if(you)push(fill2(fresh(YOU_RUN),{place:fresh(PLACES)}),"","watch",you.id);
    else if(team.length){const lead=team.filter(c=>c.role==="commander").sort((p,q)=>q.cmd-p.cmd)[0];if(lead)say(STANDIN,lead,null,"","watch");else push(fresh(LEADERLESS),"warn","watch");}
    let tb=0;
    job.techs.forEach(t=>{const c=team.find(y=>y.tech===t);
      if(c){if(tb<2){push(nm(c)+" ("+TECH_BY_K[t].l+") "+pair(fresh(TECH_BEAT[t]),c)+".","",techSite(t),c.id);tb++;}}
      else{const st=someoneNew();if(st)stood.push({id:st.id,k:t});say(NOTECH,st,{T:TECH_BY_K[t].l,aT:anA(TECH_BY_K[t].l)},"warn",techSite(t));}});
    job.know.forEach(k=>{const c=team.find(y=>y.know.includes(k));
      if(c)say(KNOW_HAS,c,{k,y:KNOW_BEAT[k]},"","inside");
      else push(fill2(fresh(KNOW_NONE),{k,y:KNOW_BEAT[k],Y:cap(KNOW_BEAT[k])}),"warn","inside");});
    if(team.length&&chance(rng,0.7))say(TEXTURE,someone(),null,"","watch");
  }
  if(mode!=="pre"){
    const B=CAT_BEATS[job.cat]||CAT_BEATS.vault;
    const take=(arr,n,tone)=>{for(let i=0;i<n;i++)push(fresh(arr),tone,"inside","*");};
    if(tier===4)take(B.go,2,"good");
    else if(tier===3){take(B.go,1,"good");take(B.hitch,1,"warn");push(fresh(FIXED),"good");}
    else if(tier===2){take(B.hitch,2,"warn");take(B.go,1,"good");}
    else if(tier===1){take(B.hitch,1,"warn");take(B.blow,1,"bad");}
    else take(B.blow,2,"bad");
    if(team.length&&chance(rng,0.3))say(TEXTURE,someone(),null,"","watch");

    if(tier>=2){if(wheel)say(EXIT_OK,wheel,{W:nm(wheel)},"","exit");else push(fresh(EXIT_NOWHEEL),"","exit","*");}

      s+=" "+(wheel?fill2(pair(fresh(GAP_WHEEL),wheel),{W:nm(wheel)}):fresh(GAP_NONE));
      push(s,"bad","exit","*");
    }
    if(x.leaked)push("Someone talked. "+cap(police(co))+" were waiting two streets away.","bad","exit","*");
    (x.fallout||[]).forEach(e=>push(e,"bad","exit",null,"down"));
    if(x.heatGain>0)push(fill2(fresh(MORNING),{P:cap(police(co)),thing:fresh(THINGS),n:x.heatGain}),x.heatGain>=20?"warn":"");
    else if(chance(rng,0.5))push(fresh(QUIET));
    if(x.take>0)push(fill2(fresh(SPLIT),{g:money(x.take),c:money(x.cuts),n:money(x.net)}),"good");
    else push(fresh(NOPAY),"bad");
    (x.betrayals||[]).forEach(b=>push(b,"bad"));
  }
  return {lines,clock:{h,m},stood};
}

function reqMet(req,team){
  if(!req)return false;
  if(req.tech&&team.some(c=>req.tech.includes(c.tech)))return true;
  if(req.know&&team.some(c=>req.know.some(k=>c.know.includes(k))))return true;
  return false;
}
function reqWho(req,team){return team.find(c=>(req.tech&&req.tech.includes(c.tech))||(req.know&&req.know.some(k=>c.know.includes(k))))||null;}
function makeTwist(job,team,rng){
  const pool=TWISTS.filter(t=>t.cats.includes(job.cat));
  const T=pick(rng,pool.length?pool:TWISTS);
  const others=team.filter(c=>!c.isPlayer);
  const M=others.length?pick(rng,others):null;
  const sub={M:M?M.first:"one of the crew"};
  const opts=T.opts.map(o=>Object.assign({},o,{t:fill2(o.t,sub)}));
  for(let i=opts.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));const tmp=opts[i];opts[i]=opts[j];opts[j]=tmp;}
  return {k:T.k,h:fill2(T.h,sub),s:fill2(T.s,sub),opts,mId:M?M.id:null};
}
function twistCorrect(tw,team){
  let best=null;
  tw.opts.forEach((o,i)=>{if(o.req&&reqMet(o.req,team)&&(best===null||o.pri<tw.opts[best].pri))best=i;});
  if(best===null)best=tw.opts.findIndex(o=>o.fallback);
  return best;
}
function twistWhy(tw,team){
  const i=twistCorrect(tw,team);const o=tw.opts[i];
  if(o.fallback)return "nobody on the job could do better — the only clean move was to walk";
  const w=reqWho(o.req,team);
  if(!w)return "";
  if(o.req.tech&&o.req.tech.includes(w.tech))return (w.isPlayer?"you are":w.first+" is")+" a "+TECH_BY_K[w.tech].l;
  const k=o.req.know?o.req.know.find(x=>w.know.includes(x)):"";
  return (w.isPlayer?"you know":w.first+" knows")+" "+k;
}
function twistResolve(tw,idx,team){
  const correct=twistCorrect(tw,team);
  const o=tw.opts[idx];
  const w=o.req?reqWho(o.req,team):null;
  const M=tw.mId?byId(tw.mId):null;
  const v={X:w?(w.isPlayer?"You":w.first):"Someone",M:M?M.first:"one of the crew"};
  if(idx===correct)return {free:true,correct,dm:0,hurt:0,jail:0,heat:0,lose:o.fallback?(o.lose||0):0,text:fill2(o.ok,v),rank:o.fallback?["Walked away in one piece",1]:["Cool under pressure",3]};
  if(o.req&&reqMet(o.req,team))return {free:false,correct,dm:-8,hurt:0,jail:0,heat:6,lose:o.lose||0,text:fill2(o.slow||o.ok,v),rank:["The slow call",-2]};
  const wr=o.wrong||{dm:-16,hurt:1,heat:8};
  return {free:false,correct,dm:wr.dm,hurt:wr.hurt||0,jail:wr.jail||0,heat:wr.heat||0,lose:wr.lose||0,text:fill2(o.bad||"It goes wrong.",v),rank:["The wrong call",-4]};
}

// A job runs in two steps: start it (the arrival and the plan, and maybe a twist that waits
// for a decision), then finish it (the work, the verdict, and everything it cost).
function startJob(job,opts){
  opts=opts||{};

  const members=cr?crewMembers(cr):(opts.pool||null);
  const a=assessJob(job,members,cr?cr.leadId:null);
  const team=a.team;
  let roll=ri(rng,-BAL.roll,BAL.roll);
  team.forEach(c=>{if(hasTrait(c,"lucky"))roll+=4;if(hasTrait(c,"jinx"))roll-=0;});
  const hasMole=team.some(c=>c.mole);
  let leaked=false;
  if(hasMole&&chance(rng,0.55)){roll-=16;leaked=true;}
  const pre=narrate(job,a,0,rng,{},"pre",null);
  let twist=null;
  const pTw=(a.margin>=10?0.25:0.08)+(team.some(c=>hasTrait(c,"jinx"))?0.12:0);
  if(!opts.noTwist&&!cr&&!job.final&&team.length>=2&&chance(rng,pTw))twist=makeTwist(job,team,rng);
  const P={jobId:job.id,job:Object.assign({},job),roll,leaked,teamIds:team.map(c=>c.id),pre:pre.lines,clock:pre.clock,stood:pre.stood,prep:casedWeeks(job),postSeed:ri(rng,1,2000000000),twist,week:S.week,
    crewId:cr?cr.id:null,crewName:cr?cr.name:null,leadId:cr?cr.leadId||null:null,memberIds:members?members.map(c=>c.id):null};
  S.pendingJob=P;
  const d={id:job.id+"-w"+S.week+(cr?"-c"+cr.id:""),week:S.week,job:P.job,crew:P.crewName,narrative:pre.lines.slice(),revealed:0,done:false,twist:twist?{h:twist.h,s:twist.s,opts:twist.opts.map(o=>o.t)}:null,awaiting:false,resolved:false,teamIds:P.teamIds,events:[],growth:[],rk:[],marks:{}};
  if(twist)d.narrative.push({t:"— —",x:"Then it goes wrong.",tone:"bad",twist:true});
  else finishJob(P,null,d);

}
function finishJob(P,choiceIdx,d){

  const team=a.team;

    twLine={t:"— —",x:r.text,tone:r.free?"good":"bad"};
    twRec={h:P.twist.h,s:P.twist.s,chosen:P.twist.opts[choiceIdx].t,correct:P.twist.opts[r.correct].t,free:r.free,why:twistWhy(P.twist,team)};
  }
  // the casing is already in a.margin as a factor of its own — counting P.prep here too would
  // pay for those weeks twice
  const m=a.margin+P.roll+dm;
  let tier;
  if(m>BAL.vClean)tier=4;else if(m>BAL.vSuccess)tier=3;else if(m>BAL.vMessy)tier=2;else if(m>BAL.vBotched)tier=1;else tier=0;
  if(twLose>=1&&tier>2)tier=2;
  const verdictName=["DISASTER","BOTCHED","MESSY","SUCCESS","CLEAN"][tier];
  const base=job.final?100:[0,6,12,22,36][job.tier];
  let take=0,loyD=0,heatMul=0;
  if(tier===4){take=Math.round(job.payout*1.08);loyD=6;heatMul=0.5;}
  else if(tier===3){take=job.payout;loyD=3;heatMul=0.85;}
  else if(tier===2){take=Math.round(job.payout*BAL.messyPay);loyD=-3;heatMul=1.25;}
  else if(tier===1){loyD=-7;heatMul=1.5;}

  const rk0=rankInfo(S.rep);

  const heatGain=Math.max(0,Math.round(job.heat*heatMul*rk0.heatMul)-a.heatCut+traitHeat)+(P.leaked?12:0)+twHeat;

  if(tier<=1){const n=tier===0?ri(rng,2,3):1;for(let i=0;i<n;i++){if(tier===0&&chance(rng,0.5))nJail++;else nHurt++;}}

  for(let i=0;i<nHurt&&pi<hitPool.length;i++,pi++){const c=hitPool[pi];c.status="injured";
    c.out=S.week+(hasRetainer("doctor")?1:2);
    fallout.push(c.first+" is hurt — out for "+(hasRetainer("doctor")?"a week; the doctor came to the flat.":"two weeks."));}

    } else if(c.lowRun>=3){

  walkouts.forEach(w=>fallout.push(w));
  const marks={};
  team.forEach(c=>{if(c.status==="gone")marks[c.id]="gone";else if(c.status==="jailed")marks[c.id]="taken";else if(c.status==="injured")marks[c.id]="hurt";else if(quitIds.includes(c.id))marks[c.id]="quit";});

  // the way the first one did — and it is built by taking rooms worth taking. A Feared crew
  // doing corner work is not getting more feared; the board notices what you are seen doing.
  // Without this, grinding the easiest posting on the board was the fastest way up, which is
  // both the safest play and the dullest.
  // What it is worth, and what it costs, both scale with how far the job is beneath the name.
  // They have to move together: rewarding a corner job at 12% while charging full price for
  // botching one makes small work net-negative, and the ranking bleeds however well you play.
  const worth=tierWorth(job.tier);
  const damp=v=>Math.max(1,Math.round(v*Math.max(0.16,1-S.rep/BAL.repDamp)*worth));

  if(tier===4){addR("Clean — tier "+job.tier+" job",damp(base));if(!fallout.length)addR("Nobody hurt",1);}

function makeEvent(rng){
  const rc=recruits().filter(c=>c.status==="crew");
  const gone=S.roster.filter(c=>c.status==="gone");
  if(!S.twistBag||!S.twistBag.length){S.twistBag=WEEKLY.map(w=>w.k);for(let i=S.twistBag.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));const t=S.twistBag[i];S.twistBag[i]=S.twistBag[j];S.twistBag[j]=t;}}
  let k=null;
  for(let i=0;i<S.twistBag.length;i++){
    const W=WEEKLY.find(w=>w.k===S.twistBag[i]);
    const ok=W.rival?!!rival():(W.needsGone?gone.length>0:(W.k==="detective"||rc.length>=1));
    if(ok){k=S.twistBag.splice(i,1)[0];break;}
  }
  if(!k)return null;
  const W=WEEKLY.find(w=>w.k===k);
  let M=null;
  // trouble picks on the ones nobody has paid lately
  const pool=rc.filter(c=>!paidUp(c)).length?rc.filter(c=>!paidUp(c)):rc;
  if(W.needsGone)M=pick(rng,gone);
  else if(pool.length){M=W.lowest?pool.slice().sort((a,b)=>(b.lowRun||0)-(a.lowRun||0)||a.loyalty-b.loyalty)[0]:pick(rng,pool);}
  const L=rc.filter(c=>!M||c.id!==M.id).sort((a,b)=>a.loyalty-b.loyalty)[0]||null;
  const v={M:M?M.first:"one of the crew",G:M?M.first:"someone",L:L?L.first:"somebody",
    R:rival()?cap(rival().name):"another crew",B:rival()?rival().boss:"their boss",D:detective()?detective().name:"a detective"};
  return {k,h:fill2(W.h,v),text:fill2(W.text,v),mId:M?M.id:null,lId:L?L.id:null,opts:W.opts.map(o=>({t:fill2(o.t,v),req:o.req||null})),v,outcome:null,week:S.week};
}
// Who a choice needs on the crew. "quiet" is either of the two trades that can end something
// without it becoming a story — an enforcer to do it or a cleaner to make it read as nothing.
function eventCan(o){
  if(!o||!o.req)return true;
  const has=k=>recruits().some(c=>c.status==="crew"&&c.tech===k);
  if(o.req==="quiet")return has("enforcer")||has("cleaner");
  return has(o.req);
}
function eventNeedWord(o){
  if(!o||!o.req)return "";
  return o.req==="quiet"?"needs an Enforcer or a Cleaner":"needs a"+(/^[aeiou]/i.test(o.req)?"n ":" ")+cap(o.req);
}
function eventApply(ev,i){

  const rc=()=>recruits().filter(c=>c.status==="crew");
  let eff=o;let out=o.out||"";
  if(o.roll){let r=rng(),acc=0,ch=o.roll[o.roll.length-1];for(const c of o.roll){acc+=c.p;if(r<acc){ch=c;break;}}eff=Object.assign({},o,ch);out=ch.out;}
  const lines=[fill2(out,ev.v)];
  if(eff.money){S.money=Math.max(0,S.money+eff.money);}
  if(eff.moneyPer){const n=rc().length;S.money=Math.max(0,S.money+eff.moneyPer*n);lines.push(money(-eff.moneyPer*n)+" paid out.");}
  if(eff.heat){S.heat=clamp(S.heat+eff.heat,0,120);}
  if(eff.loyAll){rc().forEach(c=>{if(!M||c.id!==M.id)c.loyalty=clamp(c.loyalty+eff.loyAll,0,100);});lines.push("Crew loyalty "+(eff.loyAll>0?"+":"")+eff.loyAll+".");}
  if(M&&eff.loy!=null){M.loyalty=clamp(M.loyalty+eff.loy,0,100);}

  if(M&&eff.set==="gone"){M.status="gone";M._touched=true;leaveCrew(M);if(!eff.noLoose)looseAdd(M,"resign");}

  if(M&&W.kill){M.status="gone";M._touched=true;leaveCrew(M);}
  if(M&&W.gone&&M.status==="crew"){M.status="gone";M._touched=true;leaveCrew(M);looseAdd(M,"resign");}
  if(eff.lose==="lowest"&&L&&L.status==="crew"){L.status="gone";L._touched=true;leaveCrew(L);looseAdd(L,"poach");}
  if(eff.rehire&&M&&recruits().length<crewSeats()){M.status="crew";M.loyalty=30;M._touched=true;S.crewIds.push(M.id);}
  else if(eff.rehire&&M){lines.push("No place free; "+M.first+" stays outside, and quiet.");}
  const rvName=rival()?rival().name:null;

  else if(W.k==="poach"&&!S.poach)S.poach={name:rvName||(M?M.first:"the other crew"),weeks:3};
  if(eff.rivalDown&&rival())rival().standing=clamp(rival().standing-eff.rivalDown,0,999);
